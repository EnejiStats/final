<style>

<script>
(function(){

const CFG={
 API_BASE:(window.ENEJISTATS_API_BASE||"").replace(/\/$/,""),

 endpoints:{
  report:["/api/public/matches/{id}/report","/api/matches/{id}/report","/api/match-report/{id}"],

 }

const NAV=[
 ["h2h","H2H"],["standings","STANDINGS"],["summary","SUMMARY"],["stats","STATS"],["lineups","LINEUPS"],["players","PLAYER STATS"]
];

/* Report scope follows the unshaded match-report sections from the supplied reference. */
/* Only the clean score and match-report content is retained; annotated auxiliary portal areas are intentionally omitted. */
const STAT_SECTIONS=[
 {id:"attack",title:"ATTACK",fields:[
  ["passes","Passes"],["crosses","Crosses"],["goals","Goals"],["assists","Assists"],["shots","Shots"],["corners","Corner Kicks"]
 ]},

 ]}
];

// This report deliberately mirrors the supplied club widget metric registry:
// no extra club-stat fields are introduced here.  Compound actions are shown
// as a cumulative successful/total value where the widget records outcomes.
const CLUB_WIDGET_REPORT_METRICS={

 crosses:{outcomeMode:"success_total",success:["successful","success","completed"]},
 shots:{outcomeMode:"success_total",success:["on_target"]},
 tackles:{outcomeMode:"success_total",success:["won","successful","success"]},

 interceptions:{outcomeMode:"count"},
 saves:{outcomeMode:"count"},
 offsides:{outcomeMode:"count"},
 cards:{outcomeMode:"count"},
 fouls_committed:{outcomeMode:"count"}
};

const PLAYER_SCHEMA = [
  { id:'attack', title:'ATTACK', metrics:[
    {key:'goals',label:'Goals',icon:'fa-futbol',outfieldOnly:true,types:[['header','Header'],['shot','Shot'],['penalty','Penalty']]},
    {key:'shots',label:'Shots',icon:'fa-crosshairs',outfieldOnly:true,outcomes:[['on_target','On Target'],['off_target','Off Target'],['blocked','Blocked'],['woodwork','Woodwork']],types:[['foot','Foot'],['header','Header'],['set_piece','Set Piece']]},
    {key:'assists',label:'Assists',icon:'fa-hands-helping',outfieldOnly:true,types:[['open_play','Open Play'],['set_piece','Set Piece'],['transition','Transition']]},
    {key:'key_passes',label:'Key Passes',icon:'fa-lightbulb',outfieldOnly:true,types:[['open_play','Open Play'],['set_piece','Set Piece'],['penetrative','Penetrative / Delivery']]},
    {key:'crosses',label:'Crosses',icon:'fa-share',outfieldOnly:true,outcomes:[['successful','Successful'],['unsuccessful','Unsuccessful']],types:[['open_play','Open Play'],['cutback','Cutback'],['set_piece','Set Piece']]},
    {key:'passes',label:'Passes',icon:'fa-exchange-alt',outfieldOnly:true,goalkeeperAvailable:true,outcomes:[['successful','Successful'],['unsuccessful','Unsuccessful']],types:[['short_medium','Short / Medium'],['long','Long'],['through_ball','Through Ball']]},
    {key:'dribbles',label:'Dribbles',icon:'fa-running',outfieldOnly:true,goalkeeperAvailable:true,outcomes:[['successful','Successful'],['unsuccessful','Unsuccessful']],types:[['standard','Standard'],['progressive','Progressive'],['take_on','Take-On']]},
    {key:'carries',label:'Carries',icon:'fa-road',outfieldOnly:true,outcomes:[['successful','Successful'],['unsuccessful','Unsuccessful']],types:[['standard','Standard'],['progressive','Progressive'],['final_third','Final Third']]},
    {key:'big_chances',label:'Big Chances',icon:'fa-star',outfieldOnly:true,types:[['created','Created'],['missed','Missed']]}
  ]},
  { id:'defence', title:'DEFENCE', metrics:[
    {key:'tackles',label:'Tackles',icon:'fa-shield-alt',outfieldOnly:true,outcomes:[['won','Won'],['lost','Lost'],['foul','Foul']],types:[['standing','Standing'],['sliding','Sliding / Recovery'],['pressing','Pressing']]},
    {key:'duels',label:'Duels',icon:'fa-arrows-alt-v',outfieldOnly:true,goalkeeperAvailable:true,outcomes:[['won','Won'],['lost','Lost']],types:[['ground','Ground'],['aerial','Aerial'],['loose_ball','Loose Ball']]},
    {key:'recoveries',label:'Recoveries',icon:'fa-sync',outfieldOnly:true,types:[['defensive','Defensive Third'],['midfield','Midfield / Second Ball'],['attacking','Attacking Third']]},
    {key:'interceptions',label:'Interceptions',icon:'fa-hand-paper',outfieldOnly:true,goalkeeperAvailable:true,types:[['pass','Pass'],['cross','Cross'],['shot','Shot / Pass Block']]},
    {key:'clearances',label:'Clearances',icon:'fa-broom',outfieldOnly:true,goalkeeperAvailable:true,types:[['headed','Headed'],['kicked','Kicked'],['other','Other']]},
    {key:'blocks',label:'Blocks',icon:'fa-stop',outfieldOnly:true,types:[['shot','Shot'],['pass','Pass'],['cross','Cross']]},
    {key:'fouls_won',label:'Fouls Won',icon:'fa-balance-scale',outfieldOnly:true,goalkeeperAvailable:true,types:[['attacking','Attacking Third'],['midfield','Midfield'],['defensive','Defensive Third']]},
    {key:'fouls_committed',label:'Fouls Committed',icon:'fa-fist-raised',outfieldOnly:true,goalkeeperAvailable:true,types:[['tactical','Tactical / Challenge'],['handball','Handball'],['dangerous','Dangerous Area']]},
    {key:'defensive_errors',label:'Defensive Errors',icon:'fa-exclamation-triangle',outfieldOnly:true,types:[['led_to_shot','Led to Shot'],['led_to_goal','Led to Goal'],['possession_loss','Possession Loss']]}
  ]},
  { id:'discipline', title:'DISCIPLINE', metrics:[

    {key:'offsides',label:'Offsides',icon:'fa-flag',outfieldOnly:true,types:[['attacking','Attacking'],['set_piece','Set Piece'],['other','Other']]},
    {key:'substitutions',label:'Substitution',icon:'fa-exchange-alt',types:[['on','On'],['off','Off'],{key:'reason',label:'Reason',children:[['injury','Injury'],['tactical','Tactical'],['forced','Forced']]}]}
  ]},
  { id:'advanced', title:'ADVANCED', metrics:[
    {key:'pressure_actions',label:'Pressure Actions',icon:'fa-compress-arrows-alt',outfieldOnly:true,outcomes:[['successful','Successful'],['unsuccessful','Unsuccessful']],types:[['press','Press'],['counterpress','Counterpress'],['pressure_on_ball','Pressure on Ball']]},
    {key:'possession_losses',label:'Possession Losses',icon:'fa-exclamation',outfieldOnly:true,types:[['dispossessed','Dispossessed'],['bad_touch','Bad Touch'],['misplaced_pass','Misplaced Pass']]}
  ]},
  { id:'goalkeeping', title:'GOALKEEPING', goalkeeperOnly:true, metrics:[
    {key:'saves',label:'Saves',icon:'fa-hands',goalkeeperOnly:true,types:[['open_play','Open Play'],['close','Close-range / 1v1'],['set_piece','Set Piece / Penalty']]},
    {key:'shots_faced',label:'Shots Faced',icon:'fa-crosshairs',goalkeeperOnly:true,outcomes:[['saved','Saved'],['goal','Goal'],['off_target','Off Target / Missed']],types:[['open_play','Open Play'],['set_piece','Set Piece'],['penalty','Penalty']]},
    {key:'claims',label:'Claims',icon:'fa-hand-paper',goalkeeperOnly:true,outcomes:[['successful','Successful'],['unsuccessful','Unsuccessful']],types:[['high_low_cross','High / Low Cross'],['set_piece','Set Piece'],['aerial_other','Aerial / Other']]},
    {key:'punches',label:'Punches',icon:'fa-hand-paper',goalkeeperOnly:true,outcomes:[['successful','Successful'],['unsuccessful','Unsuccessful']],types:[['cross','Cross'],['under_pressure','Under Pressure'],['other','Other']]},
    {key:'distribution',label:'Distribution',icon:'fa-exchange-alt',goalkeeperOnly:true,outcomes:[['successful','Successful'],['unsuccessful','Unsuccessful']],types:[['short','Short'],['long','Long'],['restart','Restart']]}
  ]}

const FALLBACK={
 available:false,
 match:{competition:"",country:"",round:"",venue:"",referee:"",date:"",home:"",away:"",homeScore:"—",awayScore:"—",status:""},
 teamStats:{
  possession:{possession:[0,0]},
  attack:{},passing:{},defence:{},goalkeeping:{},discipline:{}
 },
 events:[],
 lineups:{
  homeFormation:"",awayFormation:"",
  home:[],
  away:[],subsHome:[],subsAway:[],coaches:[],missingHome:[],missingAway:[]
 },
 players:{home:[],away:[]},
 h2h:{summary:{homeWins:0,draws:0,awayWins:0},matches:[]},
 standings:{rows:[]},
 info:{referee:"",stadium:"",capacity:"",attendance:""}
};

function apiUrl(path){let url=CFG.API_BASE+path.replace("{id}",encodeURIComponent(CFG.MATCH_ID));const source=new URLSearchParams(location.search),query=new URLSearchParams();["home","away","date"].forEach(k=>{const v=source.get(k);if(v)query.set(k,v)});return url+(query.toString()?(url.includes("?")?"&":"?")+query.toString():"")}
async function fetchKind(kind,signal){if(!CFG.MATCH_ID)throw Error("A match id is required");let last;for(const p of CFG.endpoints[kind]||CFG.endpoints.report){try{const r=await fetch(apiUrl(p),{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json"},signal});if(!r.ok)throw Error("HTTP "+r.status);return await r.json()}catch(e){last=e}}throw last||Error("API unavailable")}
function numeric(v){const n=Number(v);return Number.isFinite(n)?n:0}
function valuePair(v){if(Array.isArray(v))return v.length>=2?[v[0],v[1]]:[v[0]??0,v[0]??0];if(v&&typeof v==="object")return [v.home??v.homeTeam??v[0]??0,v.away??v.awayTeam??v[1]??0];return [v??0,v??0]}
function ratioPair(success,total){const s=valuePair(success),t=valuePair(total);return [[s[0]??0,t[0]??0],[s[1]??0,t[1]??0]]}
function normalizeTeamStats(stats){
 const raw=stats||{},out={...raw};out.attack=out.attack||{};out.passing=out.passing||{};out.defence=out.defence||{};out.goalkeeping=out.goalkeeping||{};out.discipline=out.discipline||{};out.possession=out.possession||{};
 const A=out.attack,P=out.passing,D=out.defence,G=out.goalkeeping,DI=out.discipline,p=raw.passing||raw.passes||{};
