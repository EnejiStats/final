<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--dark3);color:var(--text);min-height:100vh;display:flex}
.sidebar{width:var(--sidebar);background:var(--dark);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;transition:transform .3s}

.nav-section{padding:.5rem 1rem .25rem;font-size:.65rem;font-weight:800;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}

.admin-name{font-size:.82rem;font-weight:700;color:var(--text)}

.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh}

.content{padding:1.5rem;flex:1}
.page{display:none}
.page.active{display:block}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s}

.receipt-img-wrap{border:2px solid var(--border);border-radius:10px;overflow:hidden;min-height:140px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);cursor:pointer}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.section-title{font-size:.95rem;font-weight:800;color:#fff}
.mono{font-family:monospace;font-size:.78rem}
.gap-sm{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.divider{height:1px;background:var(--border);margin:1rem 0}
.text-success{color:var(--success)}
.text-danger{color:var(--danger)}

.text-gold{color:var(--gold)}

.ucf-row{display:flex;flex-direction:column;gap:.1rem}

.ucf-val{color:var(--text);font-weight:600;word-break:break-all}
.act-item{display:flex;gap:.65rem;padding:.55rem 0;border-bottom:1px solid var(--border)}
.act-item:last-child{border-bottom:none}
.act-icon{width:28px;height:28px;border-radius:50%;background:rgba(0,74,173,.25);color:var(--primary-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.7rem;margin-top:.1rem}

.act-title{font-weight:700;font-size:.8rem;color:var(--text)}

.ops-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.25rem}

.ops-card{background:var(--dark);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem;border-top:3px solid var(--muted);transition:transform .18s}
.ops-card:hover{transform:translateY(-2px)}
.ops-card.s-warn{border-top-color:var(--warning)}
.ops-card.s-ok{border-top-color:var(--success)}
.ops-card.s-info{border-top-color:var(--info)}

.ops-val{font-size:1.6rem;font-weight:900;color:#fff;line-height:1}

.coll-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:.6rem 0;border-bottom:1px solid var(--border);margin-bottom:.75rem}

.coll-label{font-size:.85rem;font-weight:800;color:var(--text);display:flex;align-items:center;gap:.5rem}
.coll-label i{color:var(--gold)}

<style id="external-tab-layout">
/* External tab canvas: presentation-only layer. Original Preact logic and APIs remain intact. */
:root{--tab-gutter:clamp(.75rem,2vw,1.5rem);--tab-gap:clamp(.75rem,1.5vw,1rem)}
html,body{width:100%;min-width:0;overflow-x:hidden}body{display:block;overflow-y:auto}
#app-root{width:100%;min-height:100vh}#app-root>div{display:block!important;width:100%!important;min-width:0}
#app-root>div>.sidebar,#app-root>.sidebar{display:none!important}
#app-root>div>.main{display:flex!important;flex-direction:column;margin-left:0!important;width:100%!important;min-width:0;min-height:100vh}
#app-root>div>.main>.topbar{display:none!important}
#app-root>div>.main>.content{display:block;width:100%;max-width:none;min-width:0;padding:var(--tab-gutter)}
#app-root>div>.main>.content>.page{display:none!important;width:100%;max-width:none;min-width:0;margin:0}
#app-root>div>.main>.content>.page#page-receipts{display:block!important}

<body>
<div id="app-root"></div>
<div class="toast-container" id="toast-container"></div>

<script>
'use strict';
const { h, render } = preact;
const { useState, useEffect, useRef, useCallback, useMemo } = preactHooks;

// ═══════════════════════════════════════════════════════════
// GLOBAL STATE
// ═══════════════════════════════════════════════════════════
var _token = null;
var _authed = false;
var _currentPage = 'overview';
var _adminName = 'Admin';
var _adminRole = '';
var _badgeReceipts = 0;
var _badgePayments = 0;

var _usersPage=1, _subAdminPage=1, _rcPage=1, _subsPage=1, _trialsPage=1;
var _payoutsPage=1, _statsPage=1, _asgnPage=1, _bgcPage=1, _supPage=1;
var _tokPage=1, _accountingPage=1, _monPage=1;
var _pmtPage=1;
const PAGE_SIZE=15, PMT_PAGE_SIZE=12, ACCT_PAGE_SIZE=20;

var _allReceipts=[], _selectedReceipt=null, _receiptFilter='pending_review', _receiptAction=null;
var _allSupport=[], _selectedTicket=null;
var _allPayments=[], _pmtHidden=new Set(), _pmtTypeFilter='all';
var _pmtActionTxRef=null, _pmtActionType=null;
var _tokHistoryAll=[], _accountingAll=[], _accountingFiltered=[], _accountingPage=1;
var _statsAllReqs=[], _expandedStats=new Set();
var _statsTab='pending', _statsStateFilter='', _statsDateFrom='', _statsDateTo='', _statsSearchQuery='';
var _subActionUid=null, _subCancelUid=null, _subGrantUser=null;
var _payoutFilter='', _payoutActionId=null, _payoutActionType=null;
var _suspendUid=null, _suspendAction=null;
var _tokCreditUser=null, _tokDebitUser=null, _tokEntityData=null;
var _selectedAssignScout=null, _availableScoutsList=[];
var _sreqRejectRid=null;

var _setCurrentPage = function(){};
var _setAuthed = function(){};
var _setBadgeReceipts = function(){};
var _setBadgePayments = function(){};
var _setAdminName = function(){};
var _setAdminRole = function(){};

// ═══════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════
var _debounceTimers={};
function debounce(fn, delay){
  return function(){
    var key=fn.toString().slice(0,40);
    clearTimeout(_debounceTimers[key]);
    _debounceTimers[key]=setTimeout(fn, delay);
  };
}

function fmt(iso){
  if(!iso) return '—';
  try{ var d=new Date(iso); if(isNaN(d.getTime())) return iso; return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return iso; }
}
function fmtDt(iso){
  if(!iso) return '—';
  try{ var d=new Date(iso); if(isNaN(d.getTime())) return iso; return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; }
}
function fmtAmt(v){
  var n=parseFloat(v)||0;
  return '₦'+n.toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function toast(msg, type){
  type=type||'info';
  var el=document.createElement('div');
  el.className='toast t-'+(type==='error'?'error':type==='success'?'success':type==='warn'?'warn':'info');
  var icon=type==='success'?'fa-check-circle':type==='error'?'fa-times-circle':type==='warn'?'fa-exclamation-circle':'fa-info-circle';
  var color=type==='success'?'#4ade80':type==='error'?'#f87171':type==='warn'?'#fbbf24':'#7dd3fc';
  el.innerHTML='<i class="fas '+icon+'" style="color:'+color+'"></i><span>'+msg+'</span>';
  el.onclick=function(){el.remove();};
  var container=document.getElementById('toast-container');
  if(container){ container.appendChild(el); setTimeout(function(){ el.remove(); },4500); }
}

function openModal(id){ var el=document.getElementById(id); if(el) el.classList.add('open'); }
function closeModal(id){ var el=document.getElementById(id); if(el) el.classList.remove('open'); }
function openLightbox(src){
  if(!src){toast('No image available','warn');return;}
  var img=document.getElementById('lightbox-img'); if(img) img.src=src;
  var lb=document.getElementById('lightbox'); if(lb) lb.style.display='flex';
}
function closeLightbox(){ var lb=document.getElementById('lightbox'); if(lb) lb.style.display='none'; }

function toggleCollapsible(bodyId, chevId){
  var body=document.getElementById(bodyId); var chev=document.getElementById(chevId);
  if(!body) return;
  var isOpen=body.style.display!=='none';
  body.style.display=isOpen?'none':'';
  if(chev){ chev.classList.toggle('open',!isOpen); }
}

function renderPager(containerId, currentPage, totalPages, onPageChange){
  var el=document.getElementById(containerId); if(!el) return;
  if(totalPages<=1){el.innerHTML='';return;}
  var pages=[];
  if(currentPage>1) pages.push('<button class="pager-btn" onclick="('+onPageChange.toString()+')('+(currentPage-1)+')">&#8249;</button>');
  var start=Math.max(1,currentPage-2); var end=Math.min(totalPages,currentPage+2);
  for(var i=start;i<=end;i++){ pages.push('<button class="pager-btn'+(i===currentPage?' active':'')+'" onclick="('+onPageChange.toString()+')('+i+')">'+i+'</button>'); }
  if(currentPage<totalPages) pages.push('<button class="pager-btn" onclick="('+onPageChange.toString()+')('+(currentPage+1)+')">&#8250;</button>');
  el.innerHTML=pages.join('');
}

// ═══════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════
async function api(method, path, body, isForm){
  var opts={method:method,credentials:'include',headers:{}};
  if(_token) opts.headers['Authorization']='Bearer '+_token;
  if(body){
    if(isForm){ opts.body=body; }
    else{ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  }
  var res=await fetch(path,opts);
  if(res.status===401){ handleLogout(); throw new Error('Unauthorized'); }
  if(!res.ok){
    var errText=await res.text(); var errMsg=errText;
    try{ errMsg=JSON.parse(errText).message||errText; }catch(e){}
    throw new Error(errMsg||res.statusText);
  }
  var ct=res.headers.get('content-type')||'';
  if(!ct.includes('application/json')) return {};
  try{ return await res.json(); }catch(e){ return {}; }
}

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
async function doLogin(email, password){
  try{
    var d=await api('POST','/api/admin/login',{email,password});
    var tok=d.token||d.access_token||d.accessToken;
    if(!tok) throw new Error('No token in response');
    _token=tok; _authed=true;
    sessionStorage.setItem('adm_token',tok);
    _setAuthed(true);
    loadAdminProfile();
    navigateTo('overview');
    toast('Logged in successfully','success');
  }catch(e){ toast('Login failed: '+e.message,'error'); }
}

async function loadAdminProfile(){
  try{
    var d=await api('GET','/api/admin/me');
    var name=d.name||d.admin_name||d.email||'Admin';
    var role=d.role||d.type||'admin';
    _adminName=name; _adminRole=role;
    _setAdminName(name); _setAdminRole(role);
  }catch(e){}
}

async function handleLogout(){
  try{ await fetch('/api/auth/logout',{method:'POST',credentials:'include'}); }catch(e){}
  _token=null; _authed=false;
  try{ sessionStorage.clear(); }catch(e){}
  try{ localStorage.clear(); }catch(e){}
  window.location.replace('/login');
}

const PAGE_TITLES = {
  'overview':      'Overview',
  'users':         'Users & Players',
  'sub-admins':    'Sub-Admins',
  'receipts':      'Payment Receipts',
  'subscriptions': 'Subscriptions',
  'trials':        'Trial Management',
  'tokens':        'Token Management',
  'dco-tier':      'DCO Tiers',
  'messages':      'Broadcasts',
  'support':       'Support Tickets',
  'settings':      'Pricing & Settings',
};
const PAGE_SUBS = {
  'overview':      'Platform at a glance',
  'users':         'Manage all user accounts',
  'sub-admins':    'Manage admin access',
  'receipts':      'Review payment proofs',
  'subscriptions': 'Active and expired plans',
  'trials':        'Trial accounts and expirations',
  'tokens':        'Token credits and history',
  'dco-tier':      'Data scout tier management',
  'messages':      'Send platform-wide broadcasts',
  'support':       'Handle user support requests',
  'settings':      'Pricing configuration',
};
function navigateTo(page){ _currentPage=page; _setCurrentPage(page); loadPage(page); }

// ═══════════════════════════════════════════════════════════
// PAGE LOADER
// ═══════════════════════════════════════════════════════════
function loadPage(page){
  switch(page){
    case 'overview':      loadOverview(); break;
    case 'users':         loadUsers(); loadPlayerMonitoring(); loadPendingApprovals(); break;
    case 'sub-admins':    loadSubAdmins(); break;
    case 'receipts':      loadReceipts(); break;
    case 'subscriptions': loadSubscriptions(); break;
    case 'trials':        loadTrials(); break;
    case 'tokens':        loadTokens(); break;
    case 'dco-tier':      loadDcoTiers(); break;
    case 'messages':      loadMessages(); break;
    case 'support':       loadSupport(); break;
    case 'settings':      loadSettings(); break;
  }
}
function refreshCurrentPage(){ loadPage(_currentPage); }

// ═══════════════════════════════════════════════════════════
// OVERVIEW
// ═══════════════════════════════════════════════════════════
async function loadOverview(){
  try{
    const [users, tokOv, payouts, rcpts, support] = await Promise.allSettled([
      api('GET','/api/admin/users?limit=1'),
      api('GET','/api/admin/tokens/overview'),
      api('GET','/api/admin/payout-requests?status=pending&limit=1'),
      api('GET','/api/admin/payment-receipts?status=pending_review&limit=200'),
      api('GET','/api/admin/support/tickets?status=open&limit=1'),
    ]);
    if(users.status==='fulfilled') document.getElementById('ov-users').textContent=Number(users.value.total||0).toLocaleString();
    if(tokOv.status==='fulfilled') document.getElementById('ov-tokens').textContent=Number(tokOv.value.total_tokens_in_circulation||0).toLocaleString();
    const pendingRc=(rcpts.status==='fulfilled')?(rcpts.value.receipts||rcpts.value.intents||rcpts.value.results||[]).length:0;
    document.getElementById('ov-pending-receipts').textContent=pendingRc;
    var bdgR=document.getElementById('badge-receipts'); if(bdgR){ bdgR.textContent=pendingRc||''; _setBadgeReceipts(pendingRc); }
    if(support.status==='fulfilled') document.getElementById('ov-support').textContent=support.value.total||0;
    const activeSubs=await api('GET','/api/admin/subscriptions?status=active&limit=1').catch(()=>({total:0}));
    document.getElementById('ov-active-subs').textContent=activeSubs.total||0;
    const po=await api('GET','/api/admin/payout-requests?status=pending').catch(()=>({payouts:[]}));
    document.getElementById('ov-payout').textContent=(po.payouts||[]).length;
    const dcos=await api('GET','/api/admin/users?type=dco&limit=1').catch(()=>({total:0}));
    document.getElementById('ov-dco').textContent=dcos.total||0;
    const sr=await api('GET','/api/admin/stats-requests/all?limit=1').catch(()=>({total:0}));
    document.getElementById('ov-stats-req').textContent=sr.total||0;
    const [pendingReqs,availScouts,completedToday,pendingUsers]=await Promise.allSettled([
      api('GET','/api/admin/stats-requests/all?status=pending&limit=1'),
      api('GET','/api/admin/users?type=dco&status=active&limit=1'),
      api('GET','/api/admin/stats-requests/all?status=completed&limit=1'),
      api('GET','/api/admin/users?status=pending&limit=1'),
    ]);
    if(pendingReqs.status==='fulfilled') document.getElementById('ov-ops-pending').textContent=pendingReqs.value.total||0;
    if(availScouts.status==='fulfilled') document.getElementById('ov-ops-scouts').textContent=availScouts.value.total||0;
    if(completedToday.status==='fulfilled') document.getElementById('ov-ops-completed').textContent=completedToday.value.total||0;
    if(pendingUsers.status==='fulfilled') document.getElementById('ov-ops-pending-users').textContent=pendingUsers.value.total||0;
    const rrEl=document.getElementById('ov-receipts-list');
    if(rcpts.status==='fulfilled'){
      const list=(rcpts.value.receipts||rcpts.value.intents||rcpts.value.results||[]).slice(0,5);
      if(!list.length){ rrEl.innerHTML='<p class="text-sm text-muted">No pending receipts.</p>'; }
      else{ rrEl.innerHTML=list.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border)"><div><div class="fw700 text-sm">${r.user_name||r.user_id||'—'}</div><div class="text-muted" style="font-size:.7rem">${r.tx_ref||''}</div></div><div class="gap-sm"><span class="badge badge-${r.status==='pending_review'?'warning':'active'}">${r.status||'pending'}</span><span class="fw700 text-sm text-gold">${fmtAmt(r.amount)}</span></div></div>`).join(''); }
    }
    const bEl=document.getElementById('ov-broadcasts-list');
    const br=await api('GET','/api/admin/messages/history?limit=5').catch(()=>({messages:[]}));
    const blist=br.messages||[];
    if(!blist.length){ bEl.innerHTML='<p class="text-sm text-muted">No broadcasts yet.</p>'; }
    else{ bEl.innerHTML=blist.map(b=>`<div style="padding:.5rem 0;border-bottom:1px solid var(--border)"><div class="fw700 text-sm">${b.title||'—'}</div><div class="text-muted" style="font-size:.72rem">To: ${b.target||'all'} • ${fmt(b.sent_at)}</div></div>`).join(''); }
    loadOverviewActivities();
  }catch(e){ toast('Failed to load overview: '+e.message,'error'); }
}

async function loadOverviewActivities(){
  const el=document.getElementById('ov-activities-list'); if(!el) return;
  try{
    const [reqs,assigns]=await Promise.allSettled([
      api('GET','/api/admin/stats-requests/all?limit=8&sort=newest'),
      api('GET','/api/admin/assignments?limit=5'),
    ]);
    const activities=[];
    if(reqs.status==='fulfilled'){ (reqs.value.requests||[]).slice(0,5).forEach(r=>{ const ico=r.status==='completed'?'act-ok':r.status==='assigned'?'act-info':r.status==='rejected'?'act-danger':'act-warn'; const icn=r.status==='completed'?'fa-check':r.status==='assigned'?'fa-user-check':r.status==='rejected'?'fa-times':'fa-clock'; activities.push({icon:icn,cls:ico,title:'Stats Request — '+(r.status||'pending'),desc:(r.club_name||r.club_id||'Club')+' · '+(r.scope||'match stats'),time:r.created_at||r.updated_at}); }); }
    if(assigns.status==='fulfilled'){ (assigns.value.assignments||[]).slice(0,3).forEach(a=>{ activities.push({icon:'fa-tasks',cls:'act-info',title:'Assignment Created',desc:'Scout '+(a.assigned_dco_id||a.assigned_supervisor_id||'—')+' assigned',time:a.created_at}); }); }
    activities.sort((a,b)=>new Date(b.time||0)-new Date(a.time||0));
    if(!activities.length){ el.innerHTML='<p class="text-sm text-muted">No recent activities.</p>'; return; }
    el.innerHTML=activities.slice(0,7).map(a=>`<div class="act-item"><div class="act-icon ${a.cls}"><i class="fas ${a.icon}"></i></div><div><div class="act-title">${a.title}</div><div class="act-desc">${a.desc}</div><div class="act-time">${fmtDt(a.time)}</div></div></div>`).join('');
  }catch(e){ el.innerHTML='<p class="text-sm text-muted">Could not load activities.</p>'; }
}

// ═══════════════════════════════════════════════════════════
// USERS
// ═══════════════════════════════════════════════════════════
async function loadUsers(){
  const search=document.getElementById('users-search').value;
  const type=document.getElementById('users-type').value;
  const status=document.getElementById('users-status').value;
  const tbody=document.getElementById('users-tbody');
  tbody.innerHTML='<tr><td colspan="6" class="loading">Loading…</td></tr>';
  try{
    const qs=new URLSearchParams({page:_usersPage,limit:PAGE_SIZE});
    if(search) qs.set('search',search); if(type) qs.set('type',type); if(status) qs.set('status',status);
    const d=await api('GET',`/api/admin/users?${qs}`);
    const users=d.users||[];
    if(!users.length){tbody.innerHTML='<tr><td colspan="6" class="empty">No users found.</td></tr>';return;}
    tbody.innerHTML=users.map(u=>{ const name=u.name||u.club_name||`${u.firstName||''} ${u.lastName||''}`.trim()||u.email||'—'; const uid=u.player_id||u.club_id||u.user_id||u.dco_id||u._id||'—'; const role=u.type||u.role||'—'; const st=u.status||(u.is_active===false?'inactive':'active'); return `<tr><td><div class="fw700">${name}</div><div class="text-muted mono">${u.email||''}</div></td><td><span class="badge badge-info">${role}</span></td><td class="mono text-sm">${uid}</td><td><span class="badge badge-${st==='active'?'active':st==='suspended'?'danger':'muted'}">${st}</span>${(u.verified||u.is_verified||u.email_verified)?'<span class="badge badge-success" style="margin-left:.25rem;font-size:.55rem">✓ Verified</span>':''}</td><td class="text-sm text-muted">${fmt(u.created_at)}</td><td><div class="gap-sm"><button class="btn btn-sm btn-ghost" onclick="openUserAction('${uid}','${name.replace(/'/g,"\\'")}','${role}')"><i class="fas fa-ellipsis-v"></i> Actions</button></div></td></tr>`; }).join('');
    renderPager('users-pager',_usersPage,Math.ceil((d.total||users.length)/PAGE_SIZE),function(p){_usersPage=p;loadUsers();});
  }catch(e){ tbody.innerHTML=`<tr><td colspan="6" class="text-danger text-sm" style="padding:1rem">Error: ${e.message}</td></tr>`; }
}

function openUserAction(uid, name, role){
  document.getElementById('uam-title').textContent='Actions — '+name;
  document.getElementById('uam-body').innerHTML=`<p class="text-sm text-muted" style="margin-bottom:1rem"><span class="mono">${uid}</span> &nbsp;<span class="badge badge-info">${role||'user'}</span></p><div class="form-group"><label class="form-label">Token Credit / Debit</label><div class="gap-sm"><input class="form-control" id="ua-tok-amt" type="number" placeholder="Amount" style="width:110px;min-width:110px"/><input class="form-control" id="ua-tok-reason" placeholder="Reason" style="flex:1"/><button class="btn btn-success btn-sm" onclick="userTokenCredit('${uid}','${role}')">+ Credit</button><button class="btn btn-danger btn-sm" onclick="userTokenDebit('${uid}','${role}')">− Debit</button></div></div><div class="form-group"><label class="form-label">Send In-App Message</label><div class="gap-sm"><input class="form-control" id="ua-msg" placeholder="Message text…" style="flex:1"/><button class="btn btn-primary btn-sm" onclick="userMessage('${uid}')">Send</button></div></div><hr/><div class="gap-sm" style="flex-wrap:wrap"><button class="btn btn-success btn-sm" onclick="userAction('${uid}','activate')"><i class="fas fa-check"></i> Activate</button><button class="btn btn-warn btn-sm" onclick="openSuspendModal('${uid}','${name}','suspend')"><i class="fas fa-ban"></i> Suspend</button><button class="btn btn-ghost btn-sm" onclick="userAction('${uid}','unsuspend')"><i class="fas fa-unlock"></i> Unsuspend</button><button class="btn btn-ghost btn-sm" onclick="userAction('${uid}','verify')"><i class="fas fa-badge-check"></i> Verify Email</button><button class="btn btn-danger btn-sm" onclick="openSuspendModal('${uid}','${name}','delete')"><i class="fas fa-trash"></i> Delete</button></div>`;
  openModal('users-action-modal');
}

async function userAction(uid, action, body){

function setReceiptFilter(el, status){ document.querySelectorAll('#page-receipts .filter-tab').forEach(b=>b.classList.remove('active')); el.classList.add('active'); _receiptFilter=status; _rcPage=1; loadReceipts(); }

async function loadReceipts(){
  const listEl=document.getElementById('receipts-list'); listEl.innerHTML='<div class="loading">Loading…</div>';
  try{
    const status=_receiptFilter==='all'?'':_receiptFilter;
    const qs=new URLSearchParams({page:_rcPage,limit:PAGE_SIZE*2}); if(status) qs.set('status',status);
    const d=await api('GET',`/api/admin/payment-receipts?${qs}`);
    _allReceipts=d.receipts||d.intents||d.results||[];
    const pending=_allReceipts.filter(r=>r.status==='pending_review').length;
    const approved=_allReceipts.filter(r=>r.status==='active'||r.status==='approved').length;
    const rejected=_allReceipts.filter(r=>r.status==='rejected').length;
    const value=_allReceipts.filter(r=>r.status==='active'||r.status==='approved').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
    const se=function(id,v){ var e=document.getElementById(id); if(e) e.textContent=v; };
    se('rc-pending',pending); se('rc-approved',approved); se('rc-rejected',rejected); se('rc-value',fmtAmt(value));
    renderReceipts();
  }catch(e){ listEl.innerHTML=`<div class="empty text-danger"><i class="fas fa-exclamation-triangle"></i><p>Error: ${e.message}</p></div>`; }
}

function renderReceipts(){
  const listEl=document.getElementById('receipts-list');
  const search=((document.getElementById('receipts-search')||{}).value||'').toLowerCase();
  let list=_allReceipts;
  if(search) list=list.filter(r=>[r.user_id,r.user_name,r.tx_ref,r.user_ref].filter(Boolean).join(' ').toLowerCase().includes(search));
  if(!list.length){listEl.innerHTML='<div class="empty"><i class="fas fa-receipt"></i><p>No receipts found.</p></div>';return;}
  listEl.innerHTML=list.map(r=>{ const isSelected=_selectedReceipt&&_selectedReceipt.tx_ref===r.tx_ref; const stClr=r.status==='active'||r.status==='approved'?'var(--success)':r.status==='rejected'?'var(--danger)':'var(--warning)'; return `<div class="card" style="margin-bottom:.65rem;cursor:pointer;border-left:4px solid ${stClr};${isSelected?'background:rgba(255,215,0,.04)':''}" onclick="selectReceipt('${(r.tx_ref||'').replace(/'/g,"\\'")}')"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="fw700 text-sm">${r.user_name||r.user_id||'—'}</div><div class="text-muted mono" style="font-size:.7rem">${r.tx_ref||'—'}</div><div class="text-muted" style="font-size:.7rem;margin-top:.2rem">${fmt(r.created_at||r.receipt_uploaded_at)}</div></div><div style="text-align:right"><span class="badge badge-${r.status==='active'||r.status==='approved'?'active':r.status==='rejected'?'danger':'warning'}">${r.status||'pending'}</span><div class="fw700 text-gold" style="margin-top:.35rem">${fmtAmt(r.amount)}</div></div></div></div>`; }).join('');
}

async function selectReceipt(txRef){
  _selectedReceipt=_allReceipts.find(r=>r.tx_ref===txRef)||null;
  renderReceipts(); renderReceiptDetail();
  try{ const full=await api('GET',`/api/admin/payment-receipts/${txRef}`); if(full&&_selectedReceipt) Object.assign(_selectedReceipt,full); else if(full) _selectedReceipt=full; renderReceiptDetail(); }catch(e){}
}

function renderReceiptDetail(){
  const panel=document.getElementById('receipt-detail-panel');
  if(!_selectedReceipt){ panel.innerHTML='<div class="card"><div class="empty"><i class="fas fa-receipt"></i><p>Select a receipt to review</p></div></div>'; return; }
  const r=_selectedReceipt;
  const imgSrc=r.receipt_url||(r.receipt_data?'data:'+(r.receipt_data_type||'image/jpeg')+';base64,'+r.receipt_data:'');
  const txRef=(r.tx_ref||'').replace(/'/g,"\\'");
  panel.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem"><div class="fw700">${r.user_name||r.user_id||'—'}</div><span class="badge badge-${r.status==='active'||r.status==='approved'?'active':r.status==='rejected'?'danger':'warning'}">${r.status||'pending'}</span></div><div style="font-size:.8rem;margin-bottom:.75rem"><div style="display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid var(--border)"><span class="text-muted">Amount</span><span class="fw700 text-gold">${fmtAmt(r.amount)}</span></div><div style="display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid var(--border)"><span class="text-muted">Tx Ref</span><span class="mono" style="font-size:.7rem">${r.tx_ref||'—'}</span></div><div style="display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid var(--border)"><span class="text-muted">User Ref</span><span class="mono" style="font-size:.7rem">${r.user_ref||r.user_payment_ref||'—'}</span></div><div style="display:flex;justify-content:space-between;padding:.3rem 0"><span class="text-muted">Date</span><span>${fmtDt(r.created_at||r.receipt_uploaded_at)}</span></div></div><div class="receipt-img-wrap" onclick="openLightbox('${imgSrc}')" style="margin-bottom:.75rem">${imgSrc?`<img class="receipt-img" src="${imgSrc}" alt="Receipt"/>`:'<div class="text-muted text-sm"><i class="fas fa-image" style="font-size:2rem;display:block;margin-bottom:.5rem"></i>No image</div>'}</div><div class="gap-sm">${(r.status==='pending_review'||r.status==='pending')?`<button class="btn btn-success btn-sm" style="flex:1;justify-content:center" onclick="receiptAction('${txRef}','approve')"><i class="fas fa-check"></i> Approve</button><button class="btn btn-danger btn-sm" style="flex:1;justify-content:center" onclick="receiptAction('${txRef}','reject')"><i class="fas fa-times"></i> Reject</button>`:(r.status==='active'||r.status==='approved')?'<span class="text-success text-sm"><i class="fas fa-check-circle"></i> Approved</span>':'<span class="text-danger text-sm"><i class="fas fa-times-circle"></i> Rejected</span>'}</div></div>`;
}

function applyTokHistoryFilter(){
  const uid=((document.getElementById('tok-filter-uid')||{}).value||'').toLowerCase().trim();
  const type=(document.getElementById('tok-filter-type')||{}).value||'';
  const role=(document.getElementById('tok-filter-role')||{}).value||'';
  const dateFrom=(document.getElementById('tok-filter-date-from')||{}).value||'';
  const dateTo=(document.getElementById('tok-filter-date-to')||{}).value||'';
  const timeFrom=(document.getElementById('tok-filter-time-from')||{}).value||'';
  const timeTo=(document.getElementById('tok-filter-time-to')||{}).value||'';
  const sort=(document.getElementById('tok-filter-sort')||{}).value||'newest';
  let list=_tokHistoryAll.filter(t=>{
    if(type&&(t.type||'').toLowerCase()!==type) return false;
    if(role&&(t.user_role||t.role||'').toLowerCase()!==role) return false;
    if(uid){const hay=[(t.user_id||''),(t.user_name||''),(t.name||'')].join(' ').toLowerCase();if(!hay.includes(uid)) return false;}
    if(dateFrom||dateTo||timeFrom||timeTo){ const d=new Date(t.created_at||0); if(isNaN(d.getTime())) return false; if(dateFrom&&d<new Date(dateFrom+'T00:00:00')) return false; if(dateTo&&d>new Date(dateTo+'T23:59:59')) return false; if(timeFrom){const [h,m]=timeFrom.split(':').map(Number);if(d.getHours()<h||(d.getHours()===h&&d.getMinutes()<m)) return false;} if(timeTo){const [h,m]=timeTo.split(':').map(Number);if(d.getHours()>h||(d.getHours()===h&&d.getMinutes()>m)) return false;} }
    return true;
  });
  list=[...list];
  if(sort==='oldest') list.sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0));
  else if(sort==='amount_desc') list.sort((a,b)=>(b.amount||0)-(a.amount||0));
  else if(sort==='amount_asc') list.sort((a,b)=>(a.amount||0)-(b.amount||0));
  else list.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  const totalCredits=list.filter(t=>t.type==='credit').reduce((s,t)=>s+(t.amount||0),0);
  const totalDebits=list.filter(t=>t.type==='debit').reduce((s,t)=>s+(t.amount||0),0);
  const net=totalCredits-totalDebits;
  const sumEl=document.getElementById('tok-history-summary');
  if(sumEl){ sumEl.style.display=list.length?'flex':'none'; const s=function(id){return document.getElementById(id);}; if(s('th-sum-count')) s('th-sum-count').textContent=list.length.toLocaleString(); if(s('th-sum-credits')) s('th-sum-credits').textContent=Number(totalCredits).toLocaleString(); if(s('th-sum-debits')) s('th-sum-debits').textContent=Number(totalDebits).toLocaleString(); if(s('th-sum-net')) s('th-sum-net').textContent=(net>=0?'+':'')+Number(net).toLocaleString(); }
  const totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  if(_tokPage>totalPages) _tokPage=1;
  const paged=list.slice((_tokPage-1)*PAGE_SIZE,_tokPage*PAGE_SIZE);
  const tbody=document.getElementById('tok-history-tbody'); if(!tbody) return;
  if(!list.length){ tbody.innerHTML='<tr><td colspan="7" class="empty"><i class="fas fa-search"></i> No transactions match the current filters.</td></tr>'; document.getElementById('tok-history-pager').innerHTML=''; return; }
  tbody.innerHTML=paged.map(t=>{ const isCredit=(t.type||'').toLowerCase()==='credit'; const amt=Number(t.amount||0); const role=_roleLabel(t.user_role||t.role||''); const uid=t.user_id||'—'; const balAfter=t.balance_after!=null?Number(t.balance_after).toLocaleString():'—'; return `<tr><td>${_fmtDateCell(t.created_at)}</td><td><span class="uid-badge">${uid}</span></td><td><span class="badge badge-info" style="font-size:.63rem">${role}</span></td><td><span class="badge badge-${isCredit?'active':'danger'}" style="display:inline-flex;align-items:center;gap:.25rem"><i class="fas fa-${isCredit?'plus':'minus'}"></i> ${isCredit?'Credit':'Debit'}</span></td><td class="fw700 ${isCredit?'text-success':'text-danger'}" style="font-size:.9rem;text-align:right">${isCredit?'+':'−'}${amt.toLocaleString()}</td><td style="max-width:200px;white-space:normal;font-size:.78rem;color:var(--text2)">${t.reason||t.description||'—'}</td><td class="mono text-sm" style="color:var(--gold)">${balAfter}</td></tr>`; }).join('');
  renderPager('tok-history-pager',_tokPage,totalPages,function(p){_tokPage=p;applyTokHistoryFilter();});
}

function _classifyActivity(t){ const r=((t.reason||t.description||t.activity_type||t.action||'').toLowerCase()); if(/stats.*(track|request)|stat_request|stats_req|scouting.report/.test(r)) return 'stats_tracking'; if(/heatmap|heat.map/.test(r)) return 'heatmap_tracking'; if(/match.request|match_req/.test(r)) return 'match_request'; if(/bio|registr|dco.reg|on.?board|profile.creat/.test(r)) return 'bio_registration'; if(/subscri|sub_|plan.activ|plan.grant|renewal/.test(r)) return 'subscription'; if(/token.purch|purchase|bought|top.?up|recharge/.test(r)) return 'token_purchase'; if(/admin.credit|admin.grant|manual.credit/.test(r)) return 'admin_credit'; if(/admin.debit|admin.remov|manual.debit/.test(r)) return 'admin_debit'; if(/background|bg.check|verification/.test(r)) return 'background_check'; if(/assign|payout|earni|disburs|commission/.test(r)) return 'assignment'; if((t.type||'').toLowerCase()==='credit'&&!r) return 'admin_credit'; if((t.type||'').toLowerCase()==='debit'&&!r) return 'admin_debit'; return 'other'; }
const _activityMeta={ stats_tracking:{label:'Stats Tracking',cls:'acct-tag-stats',icon:'fa-chart-bar'}, heatmap_tracking:{label:'Heatmap Tracking',cls:'acct-tag-heatmap',icon:'fa-fire'}, match_request:{label:'Match Request',cls:'acct-tag-match',icon:'fa-futbol'}, bio_registration:{label:'Bio & Registration',cls:'acct-tag-bio',icon:'fa-id-badge'}, subscription:{label:'Subscription',cls:'acct-tag-sub',icon:'fa-crown'}, token_purchase:{label:'Token Purchase',cls:'acct-tag-purchase',icon:'fa-coins'}, admin_credit:{label:'Admin Credit',cls:'acct-tag-admin',icon:'fa-plus-circle'}, admin_debit:{label:'Admin Debit',cls:'acct-tag-admin',icon:'fa-minus-circle'}, background_check:{label:'Background Check',cls:'acct-tag-bgcheck',icon:'fa-search'}, assignment:{label:'Assignment / Payout',cls:'acct-tag-assignment',icon:'fa-tasks'}, other:{label:'Other',cls:'acct-tag-other',icon:'fa-circle'} };
function _fmtUserId(uid, role){ if(!uid||uid==='—') return '—'; if(/^(ES|DCO|SCT|CLB|AGT|SUP|ADM)-/i.test(uid)) return uid; const r=(role||'').toLowerCase(); const prefix=r==='dco'?'DCO':r==='supervisor'?'SUP':r==='scout'?'SCT':r==='club'?'CLB':r==='agent'?'AGT':r==='admin'?'ADM':'ES'; const suffix=uid.replace(/[^a-zA-Z0-9]/g,'').slice(-6).toUpperCase(); return `${prefix}-${suffix}`; }

async function loadAccounting(){
  const tbody=document.getElementById('acct-tbody'); if(!tbody) return;
  tbody.innerHTML='<tr><td colspan="8" class="loading"><span class="spinner"></span> Loading full accounting ledger…</td></tr>';
  try{
    const [histMain,histCredit,histDebit]=await Promise.allSettled([
      api('GET','/api/admin/tokens/history?limit=1000&sort=desc'),
      api('GET','/api/admin/tokens/history?type=credit&limit=500'),
      api('GET','/api/admin/tokens/history?type=debit&limit=500'),
    ]);
    const seen=new Set(); const rows=[];
    const addTxns=arr=>{ (arr||[]).forEach(t=>{ const key=t._id||t.id||t.transaction_id||(t.user_id+'|'+t.created_at+'|'+t.amount); if(seen.has(key)) return; seen.add(key); rows.push(t); }); };

function renderAcctTable(list){
  const totalPages=Math.max(1,Math.ceil(list.length/ACCT_PAGE_SIZE));

  const totalCredits=list.filter(t=>(t.type||'').toLowerCase()==='credit').reduce((s,t)=>s+(t.amount||0),0);
  const totalDebits=list.filter(t=>(t.type||'').toLowerCase()==='debit').reduce((s,t)=>s+(t.amount||0),0);

  renderPager('acct-pager',_accountingPage,totalPages,function(p){_accountingPage=p;renderAcctTable(_accountingFiltered.length?_accountingFiltered:_accountingAll);});
}

// ─── REPLACE renderSupportList ENTIRELY ──────────────────────────────────
function renderSupportList(searchTerm) {
  const listEl = document.getElementById('sup-list');
  const search = (searchTerm || '').toLowerCase();
  const filtered = _allSupport.filter(t => {
    if (!search) return true;
    return (
      (t.subject      || '').toLowerCase().includes(search) ||
      (t.user_id      || '').toLowerCase().includes(search) ||
      (t.ticket_id    || '').toLowerCase().includes(search) ||
      (t.user_role    || t.role || '').toLowerCase().includes(search)
    );
  });

  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty"><i class="fas fa-headset"></i>No tickets found.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(t => {
    const st      = t.status || 'open';
    const stClr   = st === 'open' ? 'var(--danger)' : st === 'in_progress' ? 'var(--warning)' : 'var(--success)';
    const stBadge = st === 'open' ? 'danger' : st === 'in_progress' ? 'warning' : 'active';
    const isSelected = _selectedTicket && _selectedTicket.ticket_id === t.ticket_id;
    const role = t.user_role || t.role || '';
    const roleBadge = role
      ? `<span class="badge badge-info" style="font-size:.6rem;padding:.12rem .38rem;text-transform:capitalize">${role}</span>`
      : '';
    return `
      <div class="card" onclick="selectTicket('${t.ticket_id}')"
           style="margin-bottom:.65rem;cursor:pointer;border-left:4px solid ${stClr};${isSelected ? 'border-color:var(--gold);background:rgba(255,215,0,.04)' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.35rem">
          <div style="flex:1;min-width:0">
            <div class="fw700 text-sm" style="margin-bottom:.2rem">${t.subject || t.reason || 'Support Request'}</div>
            <div style="display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;font-size:.7rem">
              <span class="text-muted mono">${t.ticket_id || '—'}</span>
              <span class="text-muted">•</span>
              <span class="mono" style="color:var(--text)">${t.user_id || t.email || '—'}</span>
              ${roleBadge}
            </div>
          </div>
          <span class="badge badge-${stBadge}" style="flex-shrink:0;margin-left:.5rem">${st.replace(/_/g, ' ')}</span>
        </div>
        <div class="text-muted" style="font-size:.72rem"><i class="fas fa-clock"></i> ${fmtDt(t.created_at)}</div>
      </div>`;
  }).join('');
}

e="display:inline-block;max-width:85%;background:${isAdmin?'rgba(0,74,173,.25)':'rgba(255,255,255,.06)'};border-radius:8px;padding:.45rem .7rem;text-align:left"><div class="text-muted" style="font-size:.65rem;margin-bottom:.2rem">${isAdmin?'Admin ('+(m.sender_name||'Admin')+')':m.sender_id||'User'} • ${fmtDt(m.created_at)}</div><div style="font-size:.82rem">${m.message||''}</div></div></div>`;}).join('')}</div>`:'<p class="text-sm text-muted" style="margin-bottom:.75rem">No messages yet.</p>'}<div><div class="text-muted" style="font-size:.68rem;font-weight:700;text-transform:uppercase;margin-bottom:.4rem">Reply</div><textarea class="form-control" id="sup-reply-text" rows="3" placeholder="Type your reply…" style="margin-bottom:.5rem"></textarea><button class="btn btn-primary btn-sm" onclick="adminSupportReply('${t.ticket_id}')"><i class="fas fa-paper-plane"></i> Send Reply</button></div></div>`;

async function adminSupportReply(ticketId){ const textarea=document.getElementById('sup-reply-text'); const msg=textarea?textarea.value:''; if(!msg.trim()){toast('Enter a reply message','warn');return;} try{ await api('POST',`/api/admin/support/tickets/${ticketId}/reply`,{message:msg.trim()}); toast('Reply sent','success'); selectTicket(ticketId); }catch(e){ toast('Error: '+e.message,'error'); } }

let _pricingConfig = null; // cached after first load

async function loadPricingConfig(force) {
  try {

      _pricingConfig = await api('GET', '/api/admin/pricing/config');
    }
    return _pricingConfig;
  } catch (e) {
    toast('Could not load pricing config: ' + (e.message || e), 'error');
    return null;
  }
}

async function savePricingConfig(patch) {
  try {
    const res = await api('PATCH', '/api/admin/pricing/config', patch);
    _pricingConfig = null; // invalidate cache
    toast('Pricing saved', 'success');
    return res;
  } catch (e) {
    toast('Save failed: ' + (e.message || e), 'error');
    return null;

}

    function loadSettings() {
    loadPricingConfig(true).then(function(d) {
      if (!d) return;
      var giv = function(id, val) { var el = document.getElementById(id); if (el) el.value = val || ''; };
      var tok = d.token_packages || {};
      giv('set-t10',  tok.t10  || 500);
      giv('set-t50',  tok.t50  || 2000);
      giv('set-t100', tok.t100 || 3500);
      giv('set-t500', tok.t500 || 15000);
      var sub = d.subscription_pricing || {};
      ['player','club','scout','agent','dco','supervisor'].forEach(function(role) {
        giv('set-' + role + '-monthly', sub[role + '_monthly']  || '');
        giv('set-' + role + '-6month',  sub[role + '_6month']   || '');
        giv('set-' + role + '-annual',  sub[role + '_annual']   || '');
      });
      var dco = d.dco_rates || {};
      ['tier1','tier2','tier3'].forEach(function(t) {
        ['professional','semi_professional','academy','university','local','club'].forEach(function(lvl) {
          giv('dco-' + t + '-' + lvl, (dco[t] || {})[lvl] || '');
        });
      });
      var sup = d.supervisor_rates || {};
      ['tier1','tier2','tier3'].forEach(function(t) {
        ['professional','semi_professional','academy','university','local','club'].forEach(function(lvl) {
          giv('sup-' + t + '-' + lvl, (sup[t] || {})[lvl] || '');
        });
      });
    });
    }

    function saveSettings() {
    var iv  = function(id, def) { var el = document.getElementById(id); return parseInt((el ? el.value : '') || def) || def; };
    var tierObj = function(prefix) {
      var obj = {};
      ['tier1','tier2','tier3'].forEach(function(t) {
        obj[t] = {};
        ['professional','semi_professional','academy','university','local','club'].forEach(function(lvl) {
          obj[t][lvl] = iv(prefix + '-' + t + '-' + lvl, 0);
        });
      });
      return obj;
    };
    var payload = {
      token_packages: { t10: iv('set-t10',500), t50: iv('set-t50',2000), t100: iv('set-t100',3500), t500: iv('set-t500',15000) },
      subscription_pricing: {},
      dco_rates: tierObj('dco'),
      supervisor_rates: tierObj('sup'),
    };
    ['player','club','scout','agent','dco','supervisor'].forEach(function(r) {
      payload.subscription_pricing[r + '_monthly'] = iv('set-' + r + '-monthly', 0);
      payload.subscription_pricing[r + '_6month']  = iv('set-' + r + '-6month',  0);
      payload.subscription_pricing[r + '_annual']  = iv('set-' + r + '-annual',  0);
    });
    savePricingConfig(payload);
    }

    async function applyBulkMultiplier() {
    var roleEl = document.getElementById('bulk-role');
    var el     = document.getElementById('bulk-multiplier');
    var role   = roleEl ? roleEl.value : '';
    if (!role) { toast('Select a role first', 'error'); return; }
    var multiplier = parseFloat(el ? el.value : 1);
    if (!multiplier || multiplier <= 0 || multiplier > 20) {
      toast('Enter a valid multiplier (0.01 – 20)', 'error'); return;
    }
    try {
      var preview = await api('POST', '/api/admin/pricing/bulk-preview', { role: role, multiplier: multiplier });
      if (!preview || !preview.changes) { toast('Preview failed — no changes returned', 'error'); return; }
      var count = Object.keys(preview.changes).length;
      var confirmed = confirm('Apply ×' + multiplier + ' to all ' + role + ' prices (' + count + ' price points)? This cannot be undone automatically.');
      if (!confirmed) return;
      await api('POST', '/api/admin/pricing/bulk-apply', { role: role, multiplier: multiplier });
      _pricingConfig = null;
      toast('Bulk ×' + multiplier + ' applied to ' + role + ' prices', 'success');
      loadSettings();
    } catch (e) {
      toast('Bulk apply failed: ' + (e.message || e), 'error');
    }
    }

    async function onCountrySelect(code) {
    if (!code) return;
    try {
      var data = await api('GET', '/api/admin/pricing/countries');
      var countries = data.countries || [];
      var c = countries.find(function(x) { return x.code === code; });
      if (!c) return;
      var mEl = document.getElementById('country-multiplier');
      var rEl = document.getElementById('country-region');
      if (mEl) mEl.value = c.multiplier || 1.0;
      // c.regions is an array of region names this country belongs to
      var regionText = (c.regions && c.regions.length) ? c.regions.join(', ') : 'No region';
      var overrideText = c.is_overridden ? ' • custom override' : ' • default (×' + (c.default || 1) + ')';
      if (rEl) rEl.textContent = regionText + overrideText;
      // Show adjusted sample prices computed client-side from subscription config
      var sample = document.getElementById('country-sample-prices');
      if (sample) {
        var mult = c.multiplier || 1.0;
        loadPricingConfig().then(function(cfg) {
          if (!cfg) { sample.innerHTML = '<span style="color:var(--muted)">Could not load base prices.</span>'; return; }
          var sub = cfg.subscription_pricing || {};
          var rows = ['player', 'club', 'scout', 'agent', 'dco', 'supervisor'].map(function(role) {
            var monthly = Math.round((sub[role + '_monthly'] || 0) * mult / 50) * 50;
            var annual  = Math.round((sub[role + '_annual']  || 0) * mult / 50) * 50;
            return '<tr><td style="text-transform:capitalize">' + role + '</td>' +
                   '<td>₦' + monthly.toLocaleString() + '</td>' +
                   '<td>₦' + annual.toLocaleString()  + '</td></tr>';
          }).join('');
          sample.innerHTML = '<table style="width:100%;font-size:.78rem;border-collapse:collapse">' +
            '<thead><tr><th style="text-align:left;padding:.25rem .4rem;background:rgba(255,255,255,.04)">Role</th>' +
            '<th style="padding:.25rem .4rem;background:rgba(255,255,255,.04)">Monthly (₦)</th>' +
            '<th style="padding:.25rem .4rem;background:rgba(255,255,255,.04)">Annual (₦)</th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table>';
        });
      }
    } catch (e) {
      toast('Could not load country data', 'error');
    }
    }

// Read optional ?page=X from URL so cross-file deep-links land on the right tab
var _VALID_PAGES_D1 = ['overview','users','sub-admins','subscriptions','trials','receipts','tokens','dco-tier','messages','support','settings'];
var _urlPageD1 = new URLSearchParams(window.location.search).get('page')||'receipts';
var _initPage = _VALID_PAGES_D1.indexOf(_urlPageD1)>=0 ? _urlPageD1 : 'overview';

function App() {
  const [authed, setAuthed] = useState(false);
  const [currentPage, setCurrentPage] = useState(_initPage);
  const [adminName, setAdminName] = useState('Admin');
  const [adminRole, setAdminRole] = useState('');
  const [badgeReceipts, setBadgeReceipts] = useState(0);

  useEffect(() => {
    _setAuthed = setAuthed;
    _setCurrentPage = setCurrentPage;
    _setAdminName = setAdminName;
    _setAdminRole = setAdminRole;
    _setBadgeReceipts = setBadgeReceipts;
    _setBadgePayments = function(){};
  const saved = sessionStorage.getItem('adm_token');
    if (saved) {
      _token = saved; _authed = true;
      setAuthed(true);
      loadAdminProfile();
      setTimeout(() => { navigateTo(_initPage); }, 50);
    } else {
      fetch('/api/admin/me', {credentials: 'include'}).then(function(res) {
        if (!res.ok) throw new Error('not authed');
        return res.json();
      }).then(function(d) {
        _authed = true; setAuthed(true);
        var name = d.name || d.admin_name || d.email || 'Admin';
        var role = d.role || d.type || 'admin';
        _adminName = name; _adminRole = role;
        _setAdminName(name); _setAdminRole(role);
        setTimeout(function() { navigateTo(_initPage); }, 50);
      }).catch(function() {});
    }
  }, []);
  return h(Dashboard, { currentPage, adminName, adminRole, badgeReceipts });
}
