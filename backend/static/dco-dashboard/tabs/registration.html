                      <div class="form-group"><label>Achievement icon</label><div class="icon-picker">${ACHIEVEMENT_ICON_OPTIONS.map(([icon, label]) => html`<button type="button" key=${icon} class=${'icon-choice' + (achievement.icon === icon ? ' active' : '')} onClick=${() => updateAchievement(index, 'icon', icon)} title=${label} aria-label=${label}><i class=${'fas ' + icon}></i><span>${label}</span></button>`)}</div></div>
                      <div class="form-row"><div class="form-group"><label>Date / year</label><input type="date" class="form-control" value=${achievement.date} onInput=${e => updateAchievement(index, 'date', e.target.value)}/></div><div class="form-group"><label>Organizer</label><input class="form-control" value=${achievement.organizer} onInput=${e => updateAchievement(index, 'organizer', e.target.value)} placeholder="League, club or organisation"/></div></div>
                      <div class="form-group" style="margin-bottom:0"><label>Description</label><textarea class="form-control" rows="2" value=${achievement.description} onInput=${e => updateAchievement(index, 'description', e.target.value)} placeholder="What did the player achieve?"></textarea></div>
                    </div>
                  `) : html`<div class="search-empty"><i class="fas fa-medal"></i> No achievements yet. Use “Add achievement” to create the first card.</div>`}
                </div>
              </div>
              <div class="bio-update-actions"><button type="submit" class="bio-save-btn" disabled=${saving || isLoading}>${saving ? html`<i class="fas fa-spinner fa-spin"></i> Saving…` : html`<i class="fas fa-save"></i> Save bio &amp; achievements`}</button></div>
              ${message ? html`<div class=${'registration-message ' + messageType} role="status">${message}</div>` : ''}
            ` : html`<div class="search-empty" style="min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px"><i class="fas fa-hand-pointer" style="font-size:1.6rem;color:var(--primary)"></i><strong>Select a player card to load the editable details.</strong><span>The editor will expand to fit the full biography and achievement list.</span></div>`}
          </form>
        </div>
      </div>
    </div>`;
}

 function PlayerRegistration({ metrics, setMetrics, isLoading, setIsLoading, countries, currentUser }) {
  const [playerLevels, setPlayerLevels] = useState([]);
  const [levelsError,  setLevelsError]  = useState(false);
  useEffect(() => {
    apiFetch(API.playerLevels)
      .then(d => setPlayerLevels(d.levels || d.data || d || []))
      .catch(() => setLevelsError(true));
  }, []);

  const EMPTY = {
    email: '', password: '', confirmPassword: '',
    phone: '', whatsapp: '', samePhone: false,
    firstName: '', middleName: '', lastName: '',
    dob: '', dobVisible: false,
    gender: '',
    country: 'NG', nationality: '',
    state: '', lga: '',
    detailedAddress: '',
    gps: null,
    profilePhoto: null,
    playerLevel: '',
    height: '', weight: '',
    dominantFoot: '',
    positionCategory: '', preferredPosition: '',
    secondaryPositions: [],
    currentClub: '', clubId: '',
    privacyAccepted: false, termsAccepted: false, legalAcceptance: null
  };

  const [f, setF] = useState(EMPTY);
  const set = useCallback((k, v) => setF(prev => ({ ...prev, [k]: v })), []);

  const [showPw,      setShowPw]      = useState(false);
  const [showCp,      setShowCp]      = useState(false);
  const [emailExists, setEmailExists] = useState(false);
  const [formMessage, setFormMessage] = useState('');
  const [msgType,     setMsgType]     = useState('');
  const [showConfirm, setShowConfirm] = useState(false);

  // Location cascades
  const [states, statesLoading, regionLabel]  = useStates(f.country);
  const [lgas,   lgasLoading,   subregionLabel] = useLGAs(f.country, f.state);

  useEffect(() => { set('state', ''); set('lga', ''); }, [f.country]);
  useEffect(() => { set('lga', ''); }, [f.state]);

  const pwStatus  = f.confirmPassword.length > 0 ? (f.password === f.confirmPassword) : null;
   const tokenCost = f.playerLevel ? getPlayerTokenCost(f.playerLevel, metrics.tokenCosts?.player) : null;
  const positions = f.positionCategory ? (POSITION_CATEGORIES[f.positionCategory] || []) : [];
  const allPositions = useMemo(() => Object.values(POSITION_CATEGORIES).flat(), []);

  const handleReview = e => {
    e.preventDefault();
    if (!f.playerLevel)              { setFormMessage('Please select player level'); setMsgType('error'); return; }
    if (tokenCost !== null && metrics.tokenBalance < tokenCost) {
      setFormMessage(`Insufficient tokens. Required: ${tokenCost}, Available: ${metrics.tokenBalance}`);
      setMsgType('error'); return;
    }
    if (!f.firstName.trim() || !f.lastName.trim()) { setFormMessage('First name and last name are required'); setMsgType('error'); return; }
    if (!f.dob)                      { setFormMessage('Date of birth is required'); setMsgType('error'); return; }
    if (!f.gender)                   { setFormMessage('Gender is required'); setMsgType('error'); return; }
    if (!f.country)                  { setFormMessage('Country is required'); setMsgType('error'); return; }
    if (!f.state)                    { setFormMessage('State / Region is required'); setMsgType('error'); return; }
    if (!f.detailedAddress.trim())   { setFormMessage('Street / detailed address is required'); setMsgType('error'); return; }
    if (!f.gps)                      { setFormMessage('GPS location is required — click "Get GPS Location"'); setMsgType('error'); return; }
    if (!f.dominantFoot)             { setFormMessage('Dominant foot is required'); setMsgType('error'); return; }
    if (!f.positionCategory)         { setFormMessage('Position category is required'); setMsgType('error'); return; }
    if (!f.preferredPosition)        { setFormMessage('Preferred position is required'); setMsgType('error'); return; }
    if (!f.email)                    { setFormMessage('Email address is required'); setMsgType('error'); return; }
    if (emailExists)                 { setFormMessage('This email is already registered'); setMsgType('error'); return; }
    if (!f.phone.trim())             { setFormMessage('Phone number is required'); setMsgType('error'); return; }
    if (!f.password)                 { setFormMessage('Password is required'); setMsgType('error'); return; }
    if (pwStatus === false)          { setFormMessage('Passwords do not match'); setMsgType('error'); return; }
    if (!f.privacyAccepted || !f.termsAccepted) {
      setFormMessage('You must accept both Privacy Policy and Terms of Service'); setMsgType('error'); return;
    }
    setShowConfirm(true);
  };

  const handleConfirm = async () => {
    setShowConfirm(false); setIsLoading(true); setFormMessage('');
    try {
      const fd = new FormData();
      fd.append('role', 'player');
      fd.append('registered_by', 'dco');
      fd.append('player_level', f.playerLevel);
      fd.append('first_name', toTitleCase(f.firstName));
      if (f.middleName) fd.append('middle_name', toTitleCase(f.middleName));
      fd.append('last_name', toTitleCase(f.lastName));
      fd.append('dob', f.dob);
      fd.append('dob_visible', f.dobVisible ? 'true' : 'false');
      fd.append('gender', f.gender);
      if (f.height) fd.append('height', parseInt(f.height));
      if (f.weight) fd.append('weight', parseInt(f.weight));
      fd.append('nationality', f.nationality || f.country);
      fd.append('dominant_foot', f.dominantFoot);
      fd.append('position_category', f.positionCategory);
      fd.append('preferred_position', POSITION_SHORT_TO_FULL[f.preferredPosition] || f.preferredPosition);
      fd.append('secondary_positions', JSON.stringify(f.secondaryPositions.map(p => POSITION_SHORT_TO_FULL[p] || p)));
      fd.append('current_club', f.currentClub);
      if (f.clubId) fd.append('club_id', f.clubId);
      fd.append('country', f.country);
      fd.append('state', f.state);
      fd.append('lga', f.lga);
      fd.append('detailed_address', f.detailedAddress);
      if (f.gps) { fd.append('gps_lat', f.gps.lat); fd.append('gps_lng', f.gps.lng); fd.append('gps_acc', f.gps.acc); }
      fd.append('email', f.email);
      fd.append('phone', f.phone);
      fd.append('whatsapp', f.samePhone ? f.phone : (f.whatsapp || f.phone));
      fd.append('password', f.password);
      fd.append('confirm_password', f.confirmPassword);
       fd.append('privacy_accepted', 'true');
       fd.append('terms_accepted',   'true');
       if (f.legalAcceptance) fd.append('legal_acceptance', JSON.stringify(f.legalAcceptance));
      if (f.profilePhoto) fd.append('photo', f.profilePhoto);
      if (currentUser?.id)   fd.append('registered_by_dco_id',   currentUser.id);
      if (currentUser?.name) fd.append('registered_by_dco_name', currentUser.name);

       const res = await apiFetchFormData(API.registerPlayer, fd);
      showNotification(res.message || 'Player registered successfully!', 'success');
      loadMetrics().then(setMetrics).catch(() => {});
      setF(EMPTY);
      setEmailExists(false); setShowPw(false); setShowCp(false);
    } catch (err) {
      setFormMessage(err.message); setMsgType('error');
      showNotification(`Registration failed: ${err.message}`, 'error');
    } finally { setIsLoading(false); }
  };

  const cname = code => (countries || []).find(c => c.code === code)?.name || code || '—';

  return html`
    <form class="registration-section" onSubmit=${handleReview}>
      <h2><i class="fas fa-user"></i> Player Registration</h2>

      <!-- 1. Account Credentials -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-lock"></i> Account Credentials</div>
        <${EmailField} value=${f.email} onChange=${v => set('email', v)} existsCb=${taken => setEmailExists(taken)}/>
        <div class="form-row">
          <div class="form-group">
            <label>Password <span class="req">*</span></label>
            <div class="input-group">
              <input type=${showPw ? 'text' : 'password'} class="form-control"
                value=${f.password} onInput=${e => set('password', e.target.value)}
                placeholder="Create password" autocomplete="new-password"/>
              <span class="input-icon clickable" style="cursor:pointer;pointer-events:all"
                onClick=${() => setShowPw(s => !s)}>
                <i class=${'fas fa-eye' + (showPw ? '-slash' : '')}></i>
              </span>
            </div>
            <${PasswordStrength} pw=${f.password}/>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Confirm Password <span class="req">*</span></label>
            <div class="input-group">
              <input type=${showCp ? 'text' : 'password'} class="form-control"
                value=${f.confirmPassword} onInput=${e => set('confirmPassword', e.target.value)}
                placeholder="Repeat password" autocomplete="new-password"/>
              <span class="input-icon clickable" style="cursor:pointer;pointer-events:all"
                onClick=${() => setShowCp(s => !s)}>
                <i class=${'fas fa-eye' + (showCp ? '-slash' : '')}></i>
              </span>
            </div>
            ${pwStatus === true  ? html`<p class="success-text"><i class="fas fa-check-circle"></i> Passwords match</p>` : ''}
            ${pwStatus === false ? html`<p class="error-text"><i class="fas fa-times-circle"></i> Passwords do not match</p>` : ''}
          </div>
        </div>
      </div>

      <!-- 2. Contact -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-phone"></i> Contact</div>
        <div class="form-row">
          <div class="form-group" style="margin-bottom:0">
            <label>Phone Number <span class="req">*</span></label>
            <input type="tel" class="form-control" value=${f.phone}
              onInput=${e => set('phone', e.target.value)} placeholder="+234 800 000 0000" autocomplete="tel"/>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>WhatsApp</label>
            <input type="tel" class="form-control"
              value=${f.samePhone ? f.phone : f.whatsapp}
              onInput=${e => set('whatsapp', e.target.value)}
              placeholder="+234 800 000 0000"
              disabled=${!!f.samePhone}/>
            <div class="same-phone-row">
              <input type="checkbox" id="sameph-player" checked=${!!f.samePhone}
                onChange=${e => set('samePhone', e.target.checked)} style="accent-color:var(--primary)"/>
              <label for="sameph-player">Same as phone</label>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. Personal Details -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-user"></i> Personal Details</div>
        <div class="form-row">
          <div class="form-group">
            <label>First Name <span class="req">*</span></label>
            <input class="form-control" required value=${f.firstName}
              onInput=${e => set('firstName', toTitleCase(e.target.value))}
              placeholder="First name" autocomplete="given-name"/>
          </div>
          <div class="form-group">
            <label>Middle Name</label>
            <input class="form-control" value=${f.middleName}
              onInput=${e => set('middleName', toTitleCase(e.target.value))}
              placeholder="Optional"/>
          </div>
        </div>
        <div class="form-group">
          <label>Last Name <span class="req">*</span></label>
          <input class="form-control" required value=${f.lastName}
            onInput=${e => set('lastName', toTitleCase(e.target.value))}
            placeholder="Last name / Surname" autocomplete="family-name"/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Date of Birth <span class="req">*</span></label>
            <input type="date" class="form-control" required value=${f.dob}
              onChange=${e => set('dob', e.target.value)} autocomplete="bday"/>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Gender <span class="req">*</span></label>
            <select class="form-control" required value=${f.gender}
              onChange=${e => set('gender', e.target.value)}>
              <option value="">Select</option>
              <option>Male</option><option>Female</option>
            </select>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem;margin-top:.25rem">
          <input type="checkbox" id="dobvis-player" checked=${!!f.dobVisible}
            onChange=${e => set('dobVisible', e.target.checked)}
            style="accent-color:var(--primary);width:15px;height:15px"/>
          <label for="dobvis-player" style="font-size:.83rem;color:var(--dark);cursor:pointer;font-weight:400;margin-bottom:0">
            Show my age / DOB publicly on my profile
          </label>
        </div>
        <div class="form-row">
          <${CountrySelect} label="Country / Nationality" value=${f.country || ''}
            onChange=${v => { set('country', v); set('nationality', v); set('state', ''); set('lga', ''); }}
            countries=${countries} required=${true}/>
          <div class="form-group" style="margin-bottom:0">
            <label>${regionLabel} <span class="req">*</span></label>
            <${StateSelect} states=${states} loading=${statesLoading} regionLabel=${regionLabel}
              value=${f.state || ''}
              onChange=${v => { set('state', v); set('lga', ''); }}/>
          </div>
        </div>
        <div class="form-group">
          <label>${subregionLabel}</label>
          <${LGASelect} lgas=${lgas} loading=${lgasLoading} subregionLabel=${subregionLabel}
            value=${f.lga || ''} onChange=${v => set('lga', v)}/>
        </div>
        <div class="form-group">
          <label>Street / Detailed Address <span class="req">*</span></label>
          <textarea class="form-control" rows="2" value=${f.detailedAddress}
            onInput=${e => set('detailedAddress', e.target.value)}
            placeholder="House number, street, area, town…"></textarea>
        </div>
        <${GPSCapture} value=${f.gps} onChange=${v => set('gps', v)} label="Current GPS Location" required=${true}/>
        <div style="margin-top:1rem">
          <${FileUpload} id="player-photo" label="Profile Photo" accept="image/*" maxMB=${0.5}
            value=${f.profilePhoto} onChange=${file => set('profilePhoto', file)} hint="Max 500 KB"/>
        </div>
      </div>

      <!-- 4. Football Profile -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-futbol"></i> Football Profile</div>
        <div class="form-group">
          <label>Player Level <span class="req">*</span></label>
          <select class="form-control" required value=${f.playerLevel}
            onChange=${e => set('playerLevel', e.target.value)}
            disabled=${levelsError || playerLevels.length === 0}>
            <option value="">${levelsError ? '⚠ Failed to load levels — refresh to retry' : playerLevels.length === 0 ? 'Loading…' : 'Select Player Level'}</option>
            ${playerLevels.map(l => html`<option key=${l}>${l}</option>`)}
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Height (cm) <span class="req">*</span></label>
            <input type="number" class="form-control" value=${f.height}
              onInput=${e => set('height', e.target.value)}
              placeholder="e.g. 178" min="140" max="220"/>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Weight (kg) <span class="req">*</span></label>
            <input type="number" class="form-control" value=${f.weight}
              onInput=${e => set('weight', e.target.value)}
              placeholder="e.g. 72" min="30" max="180"/>
          </div>
        </div>
        <div class="form-group">
          <label>Dominant Foot <span class="req">*</span></label>
          <select class="form-control" required value=${f.dominantFoot}
            onChange=${e => set('dominantFoot', e.target.value)}>
            <option value="">Select</option>
            <option>Right</option><option>Left</option><option>Both</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Position Category <span class="req">*</span></label>
            <select class="form-control" required value=${f.positionCategory}
              onChange=${e => { set('positionCategory', e.target.value); set('preferredPosition', ''); }}>
              <option value="">Select category</option>
              ${Object.keys(POSITION_CATEGORIES).map(k => html`<option key=${k}>${k}</option>`)}
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Preferred Position <span class="req">*</span></label>
            <select class="form-control" required value=${f.preferredPosition}
              onChange=${e => set('preferredPosition', e.target.value)}
              disabled=${!f.positionCategory}>
              <option value="">${f.positionCategory ? 'Select position' : 'Select category first'}</option>
              ${positions.map(p => html`<option key=${p}>${p}</option>`)}
            </select>
          </div>
        </div>
        <${ChipGroup} label="Secondary Positions"
          options=${allPositions.filter(p => p !== f.preferredPosition)}
          value=${f.secondaryPositions}
          onChange=${v => set('secondaryPositions', v)}/>
        <${ClubSearch}
          value=${f.currentClub} clubId=${f.clubId} level=${f.playerLevel}
          country=${f.country} state=${f.state} lga=${f.lga}
          required=${true}
          onSelect=${(name, id) => { set('currentClub', name); set('clubId', id); }}/>
      </div>

      ${tokenCost !== null ? html`
        <div class="token-cost-info">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:5px">
            <i class="fas fa-coins" style="color:var(--gold)"></i>
            <strong>Token Cost:</strong> <span>${tokenCost} tokens</span>
          </div>
          <div style="font-size:.85rem;color:var(--gray)">Your balance: <strong>${metrics.tokenBalance}</strong></div>
        </div>` : ''}

      <${LegalConsent}
        id="player"
        accepted=${!!f.privacyAccepted && !!f.termsAccepted}
        formData=${f}
        role="player"
        onAccepted=${record => setF(prev => ({...prev, privacyAccepted:true, termsAccepted:true, legalAcceptance:record}))}
        onDeclined=${() => setF(prev => ({...prev, privacyAccepted:false, termsAccepted:false, legalAcceptance:null}))}/>

      <button class="registration-button" type="submit"
        disabled=${isLoading || emailExists || pwStatus === false || !f.privacyAccepted || !f.termsAccepted}>
        ${isLoading ? html`<div class="loading-spinner"></div>` : html`<i class="fas fa-user-plus"></i>`}
        Review & Confirm
      </button>
      ${formMessage && html`<div class=${'registration-message ' + msgType}>${formMessage}</div>`}
    </form>

    ${showConfirm && html`
      <div class="modal-overlay active">
        <div class="modal">
          <div class="modal-header">
            <h3><i class="fas fa-check-circle"></i> Confirm Player Registration</h3>
            <button class="modal-close" onClick=${() => setShowConfirm(false)}>&times;</button>
          </div>
          <div class="modal-body">
            <p style="margin-bottom:12px;font-size:.88rem">Please review before submitting:</p>
            <div style="background:#f8fafc;padding:.9rem;border-radius:8px;font-size:.84rem">
              ${[
                ['Player Level',   f.playerLevel],
                ['Name',           [f.firstName, f.middleName, f.lastName].filter(Boolean).join(' ')],
                ['DOB',            f.dob],
                ['Gender',         f.gender],
                ['Country',        cname(f.country)],
                ['State',          f.state || '—'],
                ['LGA',            f.lga   || '—'],
                ['Height / Weight',(f.height || '—') + 'cm / ' + (f.weight || '—') + 'kg'],
                ['Dominant Foot',  f.dominantFoot],
                ['Position',       f.positionCategory && f.preferredPosition ? f.positionCategory + ' → ' + f.preferredPosition : '—'],
                ['Secondary',      f.secondaryPositions.length ? f.secondaryPositions.join(', ') : 'None'],
                ['Club',           f.currentClub || '—'],
                ['Email',          f.email],
                ['Phone',          f.phone],
                ['Token Cost',     (tokenCost || 0) + ' tokens'],
                ['Registered Via', 'DCO — ' + (currentUser?.name || '')],
              ].map(([k, v]) => html`
                <div style="display:flex;justify-content:space-between;padding:.25rem 0;border-bottom:1px solid #e9ecef;gap:1rem">
                  <strong style="flex-shrink:0">${k}:</strong>
                  <span style="text-align:right">${v || '—'}</span>
                </div>`)}
            </div>
            <p style="color:var(--danger);margin-top:10px;font-size:.84rem">
              <i class="fas fa-exclamation-triangle"></i> Tokens will be deducted upon confirmation.
            </p>
          </div>
          <div class="modal-footer">
            <button class="modal-btn secondary" onClick=${() => setShowConfirm(false)}>Edit</button>
            <button class="modal-btn primary" onClick=${handleConfirm} disabled=${isLoading}>
            ${isLoading ? html`<div class="loading-spinner"></div>` : 'Confirm & Submit'}
            </button>
          </div>
        </div>
      </div>`}
  `;
}

/* ══════════════════════════════════════════════════════════
   CLUB REGISTRATION
   Section order (mirrors standalone ClubFields + CommonFields):
   1. Club Level
   2. Club Location  (country → state → LGA → city + GPS for office)
   3. Club Details   (name, nickname, founded, contact email/phone, website)
   4. Registration Status (CAC radio cards)
   5. Primary Ground  (VenueGroundSearch, required)
   6. Secondary Ground (VenueGroundSearch, optional)
   7. Club Logo (required)
   8. Admin Account Credentials (contact name, email with live check, password+confirm show/hide)
   9. Contact (phone, WhatsApp)
   10. Token cost / consent / submit
══════════════════════════════════════════════════════════ */
function ClubRegistration({ metrics, setMetrics, isLoading, setIsLoading, countries, currentUser }) {
  const [clubLevels, setClubLevels] = useState([]);
  const [levelsError, setLevelsError] = useState(false);
  useEffect(() => {
    apiFetch(API.clubLevels)
      .then(d => setClubLevels(d.levels || d.data || d || []))
      .catch(() => setLevelsError(true));
  }, []);

  const EMPTY_CLUB = {
    clubLevel: '',
    country: 'NG', state: '', lga: '', city: '',
    clubOfficeGps: null,
    clubName: '', clubNickname: '', founded: '',
    clubEmail: '', clubPhone: '', website: '',
    isRegistered: '', cacNumber: '',
    primaryGround: null, secondaryGround: null,
    logo: null,
    fullName: '',
    email: '', password: '', confirmPassword: '',
    phone: '', whatsapp: '', samePhone: false,
    privacyAccepted: false, termsAccepted: false, legalAcceptance: null
  };

  const [f, setF] = useState(EMPTY_CLUB);
  const set = useCallback((k, v) => setF(prev => ({ ...prev, [k]: v })), []);

  const [showPw,      setShowPw]      = useState(false);
  const [showCp,      setShowCp]      = useState(false);
  const [emailExists, setEmailExists] = useState(false);
  const [formMessage, setFormMessage] = useState('');
  const [msgType,     setMsgType]     = useState('');
  const [showConfirm, setShowConfirm] = useState(false);

  // Location cascades
  const [states, statesLoading, regionLabel]  = useStates(f.country);
  const [lgas,   lgasLoading,   subregionLabel] = useLGAs(f.country, f.state);

  useEffect(() => { set('state', ''); set('lga', ''); }, [f.country]);
  useEffect(() => { set('lga', ''); }, [f.state]);

  const pwStatus  = f.confirmPassword.length > 0 ? (f.password === f.confirmPassword) : null;
   const tokenCost = f.clubLevel ? getClubTokenCost(f.clubLevel, metrics.tokenCosts?.club) : null;

  const handleReview = e => {
    e.preventDefault();
    if (!f.clubLevel)            { setFormMessage('Please select club level'); setMsgType('error'); return; }
    if (tokenCost !== null && metrics.tokenBalance < tokenCost) {
      setFormMessage(`Insufficient tokens. Required: ${tokenCost}, Available: ${metrics.tokenBalance}`);
      setMsgType('error'); return;
    }
    if (!f.country)              { setFormMessage('Country is required'); setMsgType('error'); return; }
    if (!f.state)                { setFormMessage('State / Region is required'); setMsgType('error'); return; }
    if (!f.city.trim())          { setFormMessage('City / District is required'); setMsgType('error'); return; }
    if (!f.clubOfficeGps)        { setFormMessage('Club Office GPS is required — capture your GPS coordinates'); setMsgType('error'); return; }
    if (!f.clubName.trim())      { setFormMessage('Club name is required'); setMsgType('error'); return; }
    if (!f.primaryGround)        { setFormMessage('Primary Ground is required — register the venue first in the Venues tab, then select it here'); setMsgType('error'); return; }
    if (!f.logo)                 { setFormMessage('Club logo is required'); setMsgType('error'); return; }
    if (!f.fullName.trim())      { setFormMessage('Contact person name is required'); setMsgType('error'); return; }
    if (!f.email)                { setFormMessage('Admin email is required'); setMsgType('error'); return; }
    if (emailExists)             { setFormMessage('This email is already registered'); setMsgType('error'); return; }
    if (!f.phone.trim())         { setFormMessage('Phone number is required'); setMsgType('error'); return; }
    if (!f.password)             { setFormMessage('Password is required'); setMsgType('error'); return; }
    if (pwStatus === false)      { setFormMessage('Passwords do not match'); setMsgType('error'); return; }
    if (!f.privacyAccepted || !f.termsAccepted) {
      setFormMessage('You must accept both Privacy Policy and Terms of Service'); setMsgType('error'); return;
    }
    setShowConfirm(true);
  };

  const handleConfirm = async () => {
    setShowConfirm(false); setIsLoading(true); setFormMessage('');
    try {
      const fd = new FormData();
      fd.append('role', 'club');
      fd.append('registered_by', 'dco');
      fd.append('club_level',  f.clubLevel);
      fd.append('club_name',   toTitleCase(f.clubName));
      if (f.clubNickname) fd.append('club_nickname', toTitleCase(f.clubNickname));
      if (f.founded)      fd.append('founded',       f.founded);
      if (f.clubEmail)    fd.append('club_email',    f.clubEmail);
      if (f.clubPhone)    fd.append('club_phone',    f.clubPhone);
      if (f.website)      fd.append('website',       f.website);
      fd.append('country', f.country);
      fd.append('state',   f.state);
      fd.append('lga',     f.lga);
      fd.append('city',    f.city);
      // Club office GPS
      if (f.clubOfficeGps) {
        fd.append('club_office_gps_lat', f.clubOfficeGps.lat);
        fd.append('club_office_gps_lng', f.clubOfficeGps.lng);
        fd.append('gps_lat', f.clubOfficeGps.lat);
        fd.append('gps_lng', f.clubOfficeGps.lng);
      }
      // Primary ground
      if (f.primaryGround) {
        const pgId = f.primaryGround._id || f.primaryGround.venue_id || f.primaryGround.id;
        if (pgId) fd.append('primary_ground_id', pgId);
        fd.append('stadium', f.primaryGround.venue_name || f.primaryGround.name || '');
        if (f.primaryGround.full_address || f.primaryGround.address)
          fd.append('stadium_address', f.primaryGround.full_address || f.primaryGround.address);
        if (f.primaryGround.gps?.lat) {
          fd.append('stadium_gps_lat', f.primaryGround.gps.lat);
          fd.append('stadium_gps_lng', f.primaryGround.gps.lng);
        }
      }
      // Secondary ground (optional)
      if (f.secondaryGround) {
        const sgId = f.secondaryGround._id || f.secondaryGround.venue_id || f.secondaryGround.id;
        if (sgId) fd.append('secondary_ground_id', sgId);
        fd.append('stadium2', f.secondaryGround.venue_name || f.secondaryGround.name || '');
        if (f.secondaryGround.full_address || f.secondaryGround.address)
          fd.append('stadium2_address', f.secondaryGround.full_address || f.secondaryGround.address);
        fd.append('has_secondary_stadium', '1');
      } else {
        fd.append('has_secondary_stadium', '0');
      }
      fd.append('is_registered', f.isRegistered);
      if (f.isRegistered === 'registered' && f.cacNumber) fd.append('cac_number', f.cacNumber);
      if (f.logo) fd.append('logo', f.logo);
      fd.append('full_name', toTitleCase(f.fullName));
      fd.append('email',           f.email);
      fd.append('phone',           f.phone);
      fd.append('whatsapp',        f.samePhone ? f.phone : (f.whatsapp || f.phone));
      fd.append('password',        f.password);
      fd.append('confirm_password', f.confirmPassword);
       fd.append('privacy_accepted', 'true');
       fd.append('terms_accepted',   'true');
       if (f.legalAcceptance) fd.append('legal_acceptance', JSON.stringify(f.legalAcceptance));
      if (currentUser?.id)   fd.append('registered_by_dco_id',   currentUser.id);
      if (currentUser?.name) fd.append('registered_by_dco_name', currentUser.name);

      const res = await apiFetchFormData(API.registerClub, fd);
      showNotification(res.message || 'Club registered successfully!', 'success');
      loadMetrics().then(setMetrics).catch(() => {});
      setF(EMPTY_CLUB);
      setEmailExists(false); setShowPw(false); setShowCp(false);
    } catch (err) {
      setFormMessage(err.message); setMsgType('error');
      showNotification(`Registration failed: ${err.message}`, 'error');
    } finally { setIsLoading(false); }
  };

  const cname = code => (countries || []).find(c => c.code === code)?.name || code || '—';

  return html`
    <form class="registration-section" onSubmit=${handleReview}>
      <h2><i class="fas fa-users"></i> Club Registration</h2>

      <!-- 1. Club Level -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-layer-group"></i> Club Level <span class="req">*</span></div>
        <div class="form-group" style="margin-bottom:0">
          <select class="form-control" required value=${f.clubLevel}
            onChange=${e => set('clubLevel', e.target.value)}
            disabled=${levelsError || clubLevels.length === 0}>
            <option value="">${levelsError ? '⚠ Failed to load levels — refresh to retry' : clubLevels.length === 0 ? 'Loading…' : 'Select Club Level'}</option>
            ${clubLevels.map(l => html`<option key=${l}>${l}</option>`)}
          </select>
          ${tokenCost !== null ? html`
            <div class="token-cost-info" style="margin-top:.75rem;margin-bottom:0">
              <div style="display:flex;align-items:center;gap:9px;margin-bottom:3px">
                <i class="fas fa-coins" style="color:var(--gold)"></i>
                <strong>Token Cost:</strong> <span>${tokenCost} tokens</span>
              </div>
              <div style="font-size:.82rem;color:var(--gray)">Your balance: <strong>${metrics.tokenBalance}</strong></div>
            </div>` : ''}
        </div>
      </div>

      <!-- 2. Club Location -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-map-marker-alt"></i> Club Location</div>
        <div class="form-row">
          <${CountrySelect} label="Country" value=${f.country || ''}
            onChange=${v => { set('country', v); set('state', ''); set('lga', ''); }}
            countries=${countries} required=${true}/>
          <div class="form-group" style="margin-bottom:0">
            <label>${regionLabel} <span class="req">*</span></label>
            <${StateSelect} states=${states} loading=${statesLoading} regionLabel=${regionLabel}
              value=${f.state || ''}
              onChange=${v => { set('state', v); set('lga', ''); }}/>
          </div>
        </div>
        <div class="form-group">
          <label>${subregionLabel}</label>
          <${LGASelect} lgas=${lgas} loading=${lgasLoading} subregionLabel=${subregionLabel}
            value=${f.lga || ''} onChange=${v => set('lga', v)}/>
        </div>
        <div class="form-group">
          <label>City / District <span class="req">*</span></label>
          <input class="form-control" required value=${f.city}
            onInput=${e => set('city', toTitleCase(e.target.value))}
            placeholder="City, town or district name"/>
        </div>
        <${GPSCapture} label="Club Office / Location GPS" required=${true}
          value=${f.clubOfficeGps} onChange=${v => set('clubOfficeGps', v)}/>
      </div>

      <!-- 3. Club Details -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-building"></i> Club Details</div>
        <div class="form-group">
          <label>Club Name <span class="req">*</span></label>
          <input class="form-control" required value=${f.clubName}
            onInput=${e => set('clubName', toTitleCase(e.target.value))}
            placeholder="Official club name"/>
        </div>
        <div class="form-group">
          <label>Club Nickname <span style="font-weight:400;font-size:.72rem">(optional)</span></label>
          <input class="form-control" value=${f.clubNickname}
            onInput=${e => set('clubNickname', toTitleCase(e.target.value))}
            placeholder="e.g. The Lions, Eagles…"/>
        </div>
        <div class="form-group">
          <label>Year Founded <span style="font-weight:400;font-size:.72rem">(optional)</span></label>
          <input type="number" class="form-control" value=${f.founded}
            onInput=${e => set('founded', e.target.value)}
            placeholder="e.g. 1998" min="1800" max=${YEAR_NOW}/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Club Email <span style="font-weight:400;font-size:.72rem">(optional)</span></label>
            <input type="email" class="form-control" value=${f.clubEmail}
              onInput=${e => set('clubEmail', e.target.value)} placeholder="club@example.com"/>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Club Phone <span style="font-weight:400;font-size:.72rem">(optional)</span></label>
            <input type="tel" class="form-control" value=${f.clubPhone}
              onInput=${e => set('clubPhone', e.target.value)} placeholder="+234…"/>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Website <span style="font-weight:400;font-size:.72rem">(optional)</span></label>
          <input type="url" class="form-control" value=${f.website}
            onInput=${e => set('website', e.target.value)} placeholder="https://…"/>
        </div>
      </div>

      <!-- 4. Registration Status -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-certificate"></i> Club Registration Status</div>
        <div class="radio-group">
          ${[
            {v:'registered',   l:'Officially Registered (CAC)', d:'Has Corporate Affairs Commission number'},
            {v:'unregistered', l:'Not Yet Registered',           d:'Operating without formal registration'},
            {v:'pending',      l:'Registration Pending',          d:'Applied but not yet confirmed'},
          ].map(t => html`
            <div key=${t.v} class=${'radio-card' + (f.isRegistered === t.v ? ' active' : '')}
              onClick=${() => set('isRegistered', t.v)}>
              <h5>${t.l}</h5><p>${t.d}</p>
            </div>`)}
        </div>
        ${f.isRegistered === 'registered' ? html`
          <div class="form-group" style="margin-top:.75rem;margin-bottom:0">
            <label>CAC Registration Number <span class="req">*</span></label>
            <input class="form-control" value=${f.cacNumber}
              onInput=${e => set('cacNumber', e.target.value)} placeholder="RC000000"/>
          </div>` : ''}
      </div>

      <!-- 5. Primary Ground -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-futbol"></i> Primary Ground <span class="req">*</span></div>
        <p class="helper-text" style="margin-bottom:.75rem">
          Select the club's home ground from registered venues.
          If not listed, register it in the <strong>Venues</strong> tab first.
        </p>
        <${VenueGroundSearch}
          value=${f.primaryGround ? (f.primaryGround.venue_name || f.primaryGround.name || '') : ''}
          venueData=${f.primaryGround}
          onSelect=${v => { set('primaryGround', v); if (v) set('stadiumAddress', v.full_address || v.address || ''); }}
          country=${f.country} state=${f.state} lga=${f.lga}
          label="Primary Ground / Home Venue"
          required=${true}
          placeholder="Type venue name to search…"/>
        ${f.primaryGround && (f.primaryGround.full_address || f.primaryGround.address) ? html`
          <p class="helper-text" style="margin-top:8px;color:var(--success)">
            <i class="fas fa-map-marker-alt" style="margin-right:4px"></i>
            <strong>Address on record:</strong> ${f.primaryGround.full_address || f.primaryGround.address}
          </p>` : ''}
      </div>

      <!-- 6. Secondary / Alternate Ground -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-map-pin"></i> Secondary / Alternate Ground
          <span style="font-weight:400;font-size:.75rem">(optional)</span>
        </div>
        <p class="helper-text" style="margin-bottom:.75rem">
          Does this club play at a second ground? Select it below (also from registered venues).
        </p>
        <${VenueGroundSearch}
          value=${f.secondaryGround ? (f.secondaryGround.venue_name || f.secondaryGround.name || '') : ''}
          venueData=${f.secondaryGround}
          onSelect=${v => set('secondaryGround', v)}
          country=${f.country} state=${f.state} lga=${f.lga}
          label="Secondary / Alternate Ground"
          required=${false}
          placeholder="Type venue name to search…"/>
      </div>

      <!-- 7. Club Logo -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-image"></i> Club Logo <span class="req">*</span></div>
        <${FileUpload} id="club-logo" label="Club Logo / Crest" accept="image/*" maxMB=${1}
          required=${true} value=${f.logo}
          onChange=${file => set('logo', file)}
          hint="Required — Max 1 MB · PNG or JPEG recommended"/>
        ${!f.logo ? html`<p class="error-text" style="margin-top:5px"><i class="fas fa-exclamation-circle"></i> Club logo is required.</p>` : ''}
      </div>

      <!-- 8. Admin Account Credentials -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-lock"></i> Admin Account Credentials</div>
        <div class="form-group">
          <label>Contact Person Name <span class="req">*</span></label>
          <input class="form-control" required value=${f.fullName}
            onInput=${e => set('fullName', toTitleCase(e.target.value))}
            placeholder="Full name of contact person"/>
        </div>
        <${EmailField} value=${f.email} onChange=${v => set('email', v)} existsCb=${taken => setEmailExists(taken)}/>
        <div class="form-row">
          <div class="form-group">
            <label>Password <span class="req">*</span></label>
            <div class="input-group">
              <input type=${showPw ? 'text' : 'password'} class="form-control"
                value=${f.password} onInput=${e => set('password', e.target.value)}
                placeholder="Create password" autocomplete="new-password"/>
              <span class="input-icon clickable" style="cursor:pointer;pointer-events:all"
                onClick=${() => setShowPw(s => !s)}>
                <i class=${'fas fa-eye' + (showPw ? '-slash' : '')}></i>
              </span>
            </div>
            <${PasswordStrength} pw=${f.password}/>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Confirm Password <span class="req">*</span></label>
            <div class="input-group">
              <input type=${showCp ? 'text' : 'password'} class="form-control"
                value=${f.confirmPassword} onInput=${e => set('confirmPassword', e.target.value)}
                placeholder="Repeat password" autocomplete="new-password"/>
              <span class="input-icon clickable" style="cursor:pointer;pointer-events:all"
                onClick=${() => setShowCp(s => !s)}>
                <i class=${'fas fa-eye' + (showCp ? '-slash' : '')}></i>
              </span>
            </div>
            ${pwStatus === true  ? html`<p class="success-text"><i class="fas fa-check-circle"></i> Passwords match</p>` : ''}
            ${pwStatus === false ? html`<p class="error-text"><i class="fas fa-times-circle"></i> Passwords do not match</p>` : ''}
          </div>
        </div>
      </div>

      <!-- 9. Contact -->
      <div class="section-block">
        <div class="section-block-title"><i class="fas fa-phone"></i> Contact</div>
        <div class="form-row">
          <div class="form-group" style="margin-bottom:0">
            <label>Phone Number <span class="req">*</span></label>
            <input type="tel" class="form-control" value=${f.phone}
              onInput=${e => set('phone', e.target.value)}
              placeholder="+234 800 000 0000" autocomplete="tel"/>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>WhatsApp</label>
            <input type="tel" class="form-control"
              value=${f.samePhone ? f.phone : f.whatsapp}
              onInput=${e => set('whatsapp', e.target.value)}
              placeholder="+234 800 000 0000"
              disabled=${!!f.samePhone}/>
            <div class="same-phone-row">
              <input type="checkbox" id="sameph-club" checked=${!!f.samePhone}
                onChange=${e => set('samePhone', e.target.checked)} style="accent-color:var(--primary)"/>
              <label for="sameph-club">Same as phone</label>
            </div>
          </div>
        </div>
      </div>

      <${LegalConsent}
        id="club"
        accepted=${!!f.privacyAccepted && !!f.termsAccepted}
        formData=${f}
        role="club"
        onAccepted=${record => setF(prev => ({...prev, privacyAccepted:true, termsAccepted:true, legalAcceptance:record}))}
        onDeclined=${() => setF(prev => ({...prev, privacyAccepted:false, termsAccepted:false, legalAcceptance:null}))}/>

      <button class="registration-button" type="submit"
        disabled=${isLoading || emailExists || pwStatus === false || !f.privacyAccepted || !f.termsAccepted}>
        ${isLoading ? html`<div class="loading-spinner"></div>` : html`<i class="fas fa-users"></i>`}
        Review & Confirm
      </button>
      ${formMessage && html`<div class=${'registration-message ' + msgType}>${formMessage}</div>`}
    </form>

    ${showConfirm && html`
      <div class="modal-overlay active">
        <div class="modal">
          <div class="modal-header">
            <h3><i class="fas fa-check-circle"></i> Confirm Club Registration</h3>
            <button class="modal-close" onClick=${() => setShowConfirm(false)}>&times;</button>
          </div>
          <div class="modal-body">
            <p style="margin-bottom:12px;font-size:.88rem">Please review before submitting:</p>
            <div style="background:#f8fafc;padding:.9rem;border-radius:8px;font-size:.84rem">
              ${[
                ['Club Level',        f.clubLevel],
                ['Club Name',         f.clubName],
                ['Country',           cname(f.country)],
                ['State',             f.state  || '—'],
                ['LGA',               f.lga    || '—'],
                ['City',              f.city   || '—'],
                ['Office GPS',        f.clubOfficeGps ? f.clubOfficeGps.lat.toFixed(5) + ', ' + f.clubOfficeGps.lng.toFixed(5) : '—'],
                ['Primary Ground',    f.primaryGround ? (f.primaryGround.venue_name || f.primaryGround.name) : '—'],
                ['Secondary Ground',  f.secondaryGround ? (f.secondaryGround.venue_name || f.secondaryGround.name) : 'None'],
                ['Registration',      f.isRegistered  || '—'],
                ['Contact Person',    f.fullName || '—'],
                ['Admin Email',       f.email],
                ['Phone',             f.phone],
                ['Token Cost',        (tokenCost || 0) + ' tokens'],
                ['Registered Via',    'DCO — ' + (currentUser?.name || '')],
              ].map(([k, v]) => html`
                <div style="display:flex;justify-content:space-between;padding:.25rem 0;border-bottom:1px solid #e9ecef;gap:1rem">
                  <strong style="flex-shrink:0">${k}:</strong>
                  <span style="text-align:right">${v || '—'}</span>
                </div>`)}
            </div>
            <p style="color:var(--danger);margin-top:10px;font-size:.84rem">
              <i class="fas fa-exclamation-triangle"></i> Tokens will be deducted upon confirmation.
            </p>
          </div>
          <div class="modal-footer">
            <button class="modal-btn secondary" onClick=${() => setShowConfirm(false)}>Edit</button>
            <button class="modal-btn primary" onClick=${handleConfirm} disabled=${isLoading}>
            ${isLoading ? html`<div class="loading-spinner"></div>` : 'Confirm & Submit'}
            </button>
          </div>
        </div>
      </div>`}
  `;
}

function RegisterApp() {
  const [primaryTab, setPrimaryTab] = useState('registration');
  const [registrationSubtab, setRegistrationSubtab] = useState('player');
  const [updateSubtab, setUpdateSubtab] = useState('bio');

  const [isLoading, setIsLoading] = useState(false);
  const [countries, setCountries] = useState([]);
  const [currentUser, setCurrentUser] = useState({ name:'DCO', id:'', dco_id:'', photo:'' });
  const [metrics, setMetrics] = useState({ tokenBalance:0 });

  useEffect(() => {
    Promise.resolve(DCOChild.getUser()).then(user => setCurrentUser({
      ...user,
      name: user.name || user.fullName || 'DCO',
      id: user._id || user.id || user.dco_id || '',
      dco_id: user.dco_id || user.id || '',
      photo: user.photo || user.profileImage || ''
    })).catch(() => {});

    apiFetch(API.countries).then(data => {
      const list = Array.isArray(data) ? data : (data.countries || data.data || []);
      setCountries(list.map(c => ({
        code: c.code || c.v || c.value || c.id,
        name: c.name || c.l || c.label || c.code || '',
        regionLabel: c.region_label || 'State / Region',
        subregionLabel: c.subregion_label || 'LGA / Local Area',
      })).filter(c => c.code && c.name));
    }).catch(() => {});

    loadMetrics().then(setMetrics).catch(() => {});
  }, []);

  useEffect(() => DCOChild.onContext(ctx => {
    if (!ctx.user) return;
    const user = ctx.user;
    setCurrentUser({
      ...user,
      name: user.name || user.fullName || 'DCO',
      id: user._id || user.id || user.dco_id || '',
      dco_id: user.dco_id || user.id || '',
      photo: user.photo || user.profileImage || ''
    });
  }), []);

  const renderRegistration = () => html`
    <div class="integrated-subtabs" role="tablist" aria-label="Registration type">
      <button type="button"
        class=${'integrated-subtab' + (registrationSubtab === 'player' ? ' active' : '')}
        onClick=${() => setRegistrationSubtab('player')}
        role="tab" aria-selected=${registrationSubtab === 'player'}>
        <i class="fas fa-user"></i> Register Player
      </button>
      <button type="button"
        class=${'integrated-subtab' + (registrationSubtab === 'club' ? ' active' : '')}
        onClick=${() => setRegistrationSubtab('club')}
        role="tab" aria-selected=${registrationSubtab === 'club'}>
        <i class="fas fa-users"></i> Register Club
      </button>
      <button type="button"
        class=${'integrated-subtab' + (registrationSubtab === 'venue' ? ' active' : '')}
        onClick=${() => setRegistrationSubtab('venue')}
        role="tab" aria-selected=${registrationSubtab === 'venue'}>
        <i class="fas fa-map-marker-alt"></i> Register Venue
      </button>
    </div>

    <div class="integrated-panel" role="tabpanel">
      ${registrationSubtab === 'player'
        ? html`<${PlayerRegistration} key="player" metrics=${metrics} setMetrics=${setMetrics}
            isLoading=${isLoading} setIsLoading=${setIsLoading} countries=${countries} currentUser=${currentUser}/>`
        : registrationSubtab === 'club'
        ? html`<${ClubRegistration} key="club" metrics=${metrics} setMetrics=${setMetrics}
            isLoading=${isLoading} setIsLoading=${setIsLoading} countries=${countries} currentUser=${currentUser}/>`
        : html`<${VenueRegistration} key="venue" metrics=${metrics} setMetrics=${setMetrics}
            isLoading=${isLoading} setIsLoading=${setIsLoading} countries=${countries} currentUser=${currentUser}/>`}
    </div>`;

  const renderUpdates = () => html`
    <div class="integrated-subtabs" role="tablist" aria-label="Profile updates">
      <button type="button"
        class=${'integrated-subtab' + (updateSubtab === 'bio' ? ' active' : '')}
        onClick=${() => setUpdateSubtab('bio')}
        role="tab" aria-selected=${updateSubtab === 'bio'}>
        <i class="fas fa-id-card"></i> Bio &amp; Achievements
      </button>
    </div>

    <div class="integrated-panel" role="tabpanel">
      ${updateSubtab === 'bio'
        ? html`<${PlayerBioUpdate} key="bio" metrics=${metrics} setMetrics=${setMetrics}
            isLoading=${isLoading} setIsLoading=${setIsLoading} currentUser=${currentUser}/>`
        : ''}
    </div>`;

  return html`
    <main>
      <div class="integrated-primary-tabs" role="tablist" aria-label="DCO registration and profile updates">
        <button type="button"
          class=${'integrated-primary-tab' + (primaryTab === 'registration' ? ' active' : '')}
          onClick=${() => setPrimaryTab('registration')}
          role="tab" aria-selected=${primaryTab === 'registration'}>
          <i class="fas fa-user-plus"></i> Registration
        </button>
        <button type="button"
          class=${'integrated-primary-tab' + (primaryTab === 'updates' ? ' active' : '')}
          onClick=${() => setPrimaryTab('updates')}
          role="tab" aria-selected=${primaryTab === 'updates'}>
          <i class="fas fa-user-edit"></i> Profile Updates
        </button>
      </div>

      <div class="integrated-content">
        ${primaryTab === 'registration' ? renderRegistration() : renderUpdates()}
      </div>
    </main>`;
}

render(html`<${RegisterApp}/>`, document.getElementById('app'));

/* Let the DCO shell expand this iframe to the real registration height instead
   of trapping the registration form inside a shortened scrolling frame. */
(function reportFrameHeight() {
  if (window.parent === window) return;
  const send = () => {
    const body = document.body;
    const root = document.documentElement;
    const height = Math.max(body ? body.scrollHeight : 0, root ? root.scrollHeight : 0);
    window.parent.postMessage({ type: 'eneji:iframe-height', height }, '*');
  };
  window.addEventListener('load', send);
  window.addEventListener('resize', send);
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);
  setTimeout(send, 250);
  setTimeout(send, 900);
})();
  </script>
</body>
