let toastTimer;
function notify(message,type='info'){clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast '+type;el.innerHTML='<i class="fas fa-'+(type==='success'?'check-circle':type==='error'?'exclamation-circle':type==='warning'?'exclamation-triangle':'info-circle')+'"></i><span></span>';el.querySelector('span').textContent=message;document.body.appendChild(el);toastTimer=setTimeout(()=>el.remove(),5000)}
async function api(endpoint,options={}){
 const res=await DCOChild.fetch(endpoint,{credentials:'include',...options,authRedirectStatuses:[401,403]});
 if(!res.ok){let msg='HTTP '+res.status;try{const t=await res.text();if(t)msg+=': '+t.slice(0,220)}catch{}const e=new Error(msg);e.status=res.status;throw e}
 const ct=res.headers.get('content-type')||'';return ct.includes('application/json')?res.json():{};
}

function asArray(v){return Array.isArray(v)?v:(v?.items||v?.data||v?.results||v?.transactions||v?.activities||v?.requests||v?.submissions||[])}
function money(v){return '₦'+Number(v||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function date(v,withTime=false){if(!v)return '—';const d=new Date(v);if(isNaN(d))return '—';return d.toLocaleString([],withTime?{dateStyle:'medium',timeStyle:'short'}:{dateStyle:'medium'})}
function maskAccount(v){const s=String(v||'');return s.length>4?'•••• •••• '+s.slice(-4):s?'•••• '+s:'Not configured'}
function statusClass(s){s=String(s||'').toLowerCase();if(['approved','paid','completed','success','verified'].includes(s))return's-success';if(['rejected','failed','cancelled','error'].includes(s))return's-danger';if(['pending','processing','submitted','resubmit_required','needs_action','draft'].includes(s))return's-warning';if(['saved','saved_directly'].includes(s))return's-info';return's-gray'}

function Skeletons({count=4}){return html`<div class="grid summary-grid">${Array.from({length:count},(_,i)=>html`<div class="card sk-card" key=${i}><div class="skeleton" style="width:36px;height:36px;margin-bottom:12px"></div><div class="skeleton sk-line" style="width:55%"></div><div class="skeleton" style="width:35%"></div></div>`)}</div>`}
function Pagination({page,totalPages,onChange}){if(totalPages<=1)return null;return html`<div class="pagination"><span>Page ${page} of ${totalPages}</span><div class="page-btns"><button class="page-btn" disabled=${page<=1} onClick=${()=>onChange(page-1)}>‹</button>${Array.from({length:Math.min(totalPages,5)},(_,i)=>{let n=Math.max(1,Math.min(totalPages-4,page-2))+i;return n>0&&n<=totalPages?html`<button key=${n} class=${'page-btn '+(n===page?'active':'')} onClick=${()=>onChange(n)}>${n}</button>`:null})}<button class="page-btn" disabled=${page>=totalPages} onClick=${()=>onChange(page+1)}>›</button></div></div>`}
function CopyButton({value}){return html`<button class="copy" onClick=${async()=>{try{await navigator.clipboard.writeText(String(value||''));notify('Copied','success')}catch{notify('Copy failed','error')}}}>Copy</button>`}

 const event=(name,payload)=>{if(name==='TOKEN_BALANCE_UPDATED')setMetrics(m=>({...m,balance:Number(payload)||0}));if(name==='REFRESH_DASHBOARD_METRICS')loadHeader();if(name==='SUBMISSION_RESUBMIT'){window.parent.postMessage({type:'DCO_FINANCE_EVENT',event:name,submission:payload},location.origin);return}window.parent.postMessage({type:'DCO_FINANCE_EVENT',event:name,...(typeof payload==='object'?payload:{})},location.origin)};
 const loadHeader=async()=>{if(!ctx.id)return;const [ti,e,s]=await Promise.allSettled([api(API.tokenInfo),api(API.earningsSummary(ctx.id)),api(API.submissionSummary(ctx.id))]);setMetrics({balance:ti.status==='fulfilled'?Number(ti.value?.balance??ti.value?.token_balance??0):0,earnings:e.status==='fulfilled'?Number(e.value?.available_amount??e.value?.total_earnings??0):0,pending:s.status==='fulfilled'?Number(s.value?.pending??0):0,action:s.status==='fulfilled'?Number(s.value?.needs_action??s.value?.resubmit_required??0):0})};
 useEffect(()=>{const receive=e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==='DCO_CONTEXT'){const u=d.user||{};const next={id:d.userId||d.dcoId||u.id||u._id||'',dco_id:d.dcoId||u.dco_id||'',user:u};window.__DCO_CTX__=next;setCtx(next);setReady(true);if(d.requestedTab)setActive(d.requestedTab)}if(d.type==='DCO_OPEN_SUBTAB'&&['tokens','earnings','submissions'].includes(d.subtab))setActive(d.subtab)};window.addEventListener('message',receive);window.parent.postMessage({type:'DCO_FINANCE_READY'},location.origin);if(ctx.id)loadHeader();return()=>window.removeEventListener('message',receive)},[]);
 useEffect(()=>{if(ctx.id)loadHeader()},[ctx.id]);
 if(!ready)return html`<div class="workspace"><div class="content"><div class="card"><${Empty} icon="fa-sync-alt" title="Connecting to DCO Dashboard">Loading your finance and activity workspace…</${Empty}></div></div></div>`;
 return html`<div class="workspace"><header class="workspace-head"><div class="head-row"><div><div class="eyebrow">DCO Workspace</div><h1 class="workspace-title">Finance &amp; Activity</h1><div class="workspace-subtitle">${ctx.user?.name||'DCO'} · ${ctx.dco_id||ctx.id||'Account'}</div></div><button class="btn" style="background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)" onClick=${loadHeader}><i class="fas fa-sync"></i> Refresh</button></div><div class="head-stats"><div class="head-stat"><div class="head-stat-label">Wallet</div><div class="head-stat-value">${Number(metrics.balance||0).toLocaleString()} Tokens</div></div><div class="head-stat"><div class="head-stat-label">Available Earnings</div><div class="head-stat-value">${money(metrics.earnings)}</div></div><div class="head-stat"><div class="head-stat-label">Pending Actions</div><div class="head-stat-value">${Number(metrics.action||0).toLocaleString()}</div></div></div></header>
 <nav class="subtabs" role="tablist"><button class=${'subtab '+(tab==='tokens'?'active':'')} onClick=${()=>setActive('tokens')} role="tab" aria-selected=${tab==='tokens'}><i class="fas fa-coins"></i> Tokens <span class="badge">${Number(metrics.balance||0).toLocaleString()}</span></button><button class=${'subtab '+(tab==='earnings'?'active':'')} onClick=${()=>setActive('earnings')} role="tab" aria-selected=${tab==='earnings'}><i class="fas fa-wallet"></i> Earnings &amp; Payouts <span class="badge">${money(metrics.earnings)}</span></button><button class=${'subtab '+(tab==='submissions'?'active':'')} onClick=${()=>setActive('submissions')} role="tab" aria-selected=${tab==='submissions'}><i class="fas fa-file-alt"></i> Submissions ${metrics.action?html`<span class="badge">${metrics.action}</span>`:null}</button></nav>
 <main class="content">${tab==='tokens'&&html`<${TokensTab} ctx=${ctx} onEvent=${event}/>`}${tab==='earnings'&&html`<${EarningsTab} ctx=${ctx} onEvent=${event}/>`}${tab==='submissions'&&html`<${SubmissionsTab} ctx=${ctx} onEvent=${event}/>`}</main></div>`
}
render(html`<${App}/>`,document.getElementById('app'));
</script>
</body></html>
