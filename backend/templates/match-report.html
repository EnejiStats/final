        const r = await fetch(apiUrl(p, id, opts.apiBase), { credentials: opts.credentials || "same-origin", cache: "no-store", headers: { Accept: "application/json", ...(opts.headers || {}) }, signal: opts.signal });
        if (!r.ok) throw new Error("HTTP " + r.status);
        return await r.json();
      } catch (e) { if (e && e.name === "AbortError") throw e; last = e; }
    }
    throw last || new Error("API unavailable");
  }
  const loadReport = (id, opts) => loadSection("report", id, opts);

  function pickSection(tab, payload) {
    const u = isObj(payload) && isObj(payload.data) ? payload.data : payload;
    if (tab === "h2h") return { h2h: first(u && (u.h2h || u.head_to_head || u.headToHead), Array.isArray(u) ? u : undefined, isObj(u) && (u.matches || u.summary) ? u : undefined) };
    if (tab === "standings") return { standings: first(u && (u.standings || u.table), Array.isArray(u) ? u : undefined, isObj(u) && u.rows ? u : undefined) };
    if (tab === "lineups") return { lineups: first(u && (u.lineups || u.lineup), u) };
    return { players: first(u && (u.players || u.player_stats || u.playerStats), u) };
  }
  function sectionEmpty(view, tab) {
    if (tab === "h2h") return !view.h2h.matches.length;
    if (tab === "standings") return !view.standings.length;
    if (tab === "lineups") return !view.lineups.home.players.length && !view.lineups.away.players.length;
    if (tab === "players") return !view.squad.length;
    return false;
  }

  // ══════════════════════════════════════════════════════════════════════
  //  COMPONENTS
  // ══════════════════════════════════════════════════════════════════════
  const Subnav = ({ items, value, onChange, center }) => html`
    <div class=${`mr-subnav${center ? " center" : ""}`} role="group">
      ${items.map(([id, label]) => html`<button type="button" key=${id} class=${value === id ? "active" : ""} aria-pressed=${value === id} onClick=${() => onChange(id)}>${label}</button>`)}
    </div>`;
  const Empty = ({ text }) => html`<div class="mr-empty">${text}</div>`;
  const FormPills = ({ form }) => form ? html`<span class="mr-form">${form.slice(-5).split("").map((c, i) => html`<span key=${i} class=${`mr-fb ${c}`}>${c}</span>`)}</span>` : "—";

  // ── H2H ──
  function H2H({ view }) {
    const [sub, setSub] = useState("summary");
    const { h2h, match } = view;
    const rows = sub === "last5" ? h2h.matches.slice(0, 5) : h2h.matches;
    const score = m => m.score ? `${m.score.home}–${m.score.away}` : "—";
    return html`
      <div>
        <${Subnav} items=${[["summary", "SUMMARY"], ["last5", "LAST 5"], ["all", "ALL MEETINGS"]]} value=${sub} onChange=${setSub} />
        ${sub === "summary" ? html`
          <section class="mr-card">
            <div class="mr-card-head"><div class="mr-card-title">Head-to-head summary</div><span class="mr-pill">H2H</span></div>
            ${h2h.matches.length || h2h.summary.homeWins + h2h.summary.awayWins + h2h.summary.draws > 0 ? html`
              <div class="mr-kpis">
                ${[[match.home || "Home", "Wins", h2h.summary.homeWins], ["Draws", "Draws", h2h.summary.draws], [match.away || "Away", "Wins", h2h.summary.awayWins], ["Meetings", "Total", h2h.matches.length || h2h.summary.homeWins + h2h.summary.draws + h2h.summary.awayWins]]
                  .map((k, i) => html`<div class="mr-kpi" key=${i}><strong>${k[2]}</strong><span>${k[0]} · ${k[1]}</span></div>`)}
              </div>` : html`<${Empty} text="No head-to-head meetings are available." />`}
          </section>` : html`
          <section class="mr-card">
            <div class="mr-card-head"><div class="mr-card-title">${sub === "last5" ? "Last 5 meetings" : "All meetings"}</div><span class="mr-pill">${rows.length} MATCHES</span></div>
            ${rows.length ? html`
              <div class="mr-tablewrap"><table class="mr-table">
                <thead><tr><th>Date</th><th>Home</th><th>Score</th><th>Away</th><th>Competition</th></tr></thead>
                <tbody>${rows.map(m => html`<tr key=${m.id}><td>${fmtDate(m.date) || "—"}</td><td>${m.home || "—"}</td><td class="num">${score(m)}</td><td>${m.away || "—"}</td><td>${m.competition || "—"}</td></tr>`)}</tbody>
              </table></div>` : html`<${Empty} text="No head-to-head meetings are available." />`}
          </section>`}
      </div>`;
  }

  // ── Standings ──
  function Standings({ view }) {
    const [sub, setSub] = useState("overall");
    const rows = view.standings;
    const me = r => [lc(view.match.home), lc(view.match.away)].includes(lc(r.team));
    const val = v => v === null || v === undefined ? "—" : v;
    const pts = f => f.split("").reduce((n, c) => n + (c === "W" ? 3 : c === "D" ? 1 : 0), 0);
    let body;
    if (!rows.length) body = html`<${Empty} text="No standings data are available." />`;
    else if (sub === "form") {
      const sorted = rows.slice().sort((a, b) => pts(b.form.slice(-5)) - pts(a.form.slice(-5)) || a.rank - b.rank);
      body = html`<div class="mr-tablewrap"><table class="mr-table"><thead><tr><th>#</th><th>Team</th><th>Last 5</th><th class="num">Form pts</th></tr></thead>
        <tbody>${sorted.map((r, i) => html`<tr key=${r.team + i} class=${me(r) ? "me" : ""}><td>${i + 1}</td><td>${r.team || "—"}</td><td><${FormPills} form=${r.form} /></td><td class="num">${r.form ? pts(r.form.slice(-5)) : "—"}</td></tr>`)}</tbody></table></div>`;
    } else {
      const pick = r => sub === "overall" ? r : (r[sub] ? { ...r, ...r[sub], gd: r[sub].gf !== null && r[sub].ga !== null ? r[sub].gf - r[sub].ga : null } : { ...r, mp: null, w: null, d: null, l: null, gf: null, ga: null, gd: null, pts: null });
      const data = rows.map(pick);
      if (sub !== "overall") data.sort((a, b) => (b.pts ?? -1) - (a.pts ?? -1) || (b.gd ?? -99) - (a.gd ?? -99));
      body = html`<div class="mr-tablewrap"><table class="mr-table"><thead><tr><th>#</th><th>Team</th><th class="num">MP</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">Pts</th><th>Form</th></tr></thead>
        <tbody>${data.map((r, i) => html`<tr key=${r.team + i} class=${me(r) ? "me" : ""}><td>${sub === "overall" ? r.rank : i + 1}</td><td>${r.team || "—"}</td><td class="num">${val(r.mp)}</td><td class="num">${val(r.w)}</td><td class="num">${val(r.d)}</td><td class="num">${val(r.l)}</td><td class="num">${val(r.gf)}</td><td class="num">${val(r.ga)}</td><td class="num">${val(r.gd ?? (r.gf !== null && r.ga !== null ? r.gf - r.ga : null))}</td><td class="num"><b>${val(r.pts)}</b></td><td><${FormPills} form=${r.form} /></td></tr>`)}</tbody></table></div>`;
    }
    return html`
      <div>
        <${Subnav} items=${[["overall", "OVERALL"], ["home", "HOME"], ["away", "AWAY"], ["form", "FORM"]]} value=${sub} onChange=${setSub} />
        <section class="mr-card">
          <div class="mr-card-head"><div class="mr-card-title">Standings · ${sub.toUpperCase()}</div><span class="mr-pill">${rows.length} TEAMS</span></div>
          ${body}
        </section>
      </div>`;
  }

  // ── Summary ──
  const SUMMARY_KINDS = new Set(["goal", "owngoal", "penaltygoal", "yellow", "secondyellow", "red", "sub"]);
  function EventIcon({ kind }) {
    if (GOAL_KINDS.has(kind) || kind === "assist") return html`<span class="mr-ico" aria-label=${kind === "assist" ? "Assist" : "Goal"}>${kind === "assist" ? "🅰" : "⚽"}</span>`;
    if (kind === "yellow" || kind === "secondyellow") return html`<span class="mr-ico" aria-label="Yellow card"><i class="mr-sq y"></i></span>`;
    if (kind === "red") return html`<span class="mr-ico" aria-label="Red card"><i class="mr-sq r"></i></span>`;
    if (kind === "sub") return html`<span class="mr-ico" aria-label="Substitution" style="color:#64748b">⇅</span>`;
    return html`<span class="mr-ico">•</span>`;
  }
  function Summary({ view }) {
    const [filter, setFilter] = useState("all");
    const { match, events, hints, hasExtraTime } = view;
    const finalHome = match.homeScore, finalAway = match.awayScore, finalKnown = finalHome !== null && finalAway !== null;
    const goalEvents = events.filter(e => GOAL_KINDS.has(e.kind) && e.period !== "penalty_shootout");
    const counts = {};
    PERIODS.forEach(p => { counts[p] = { home: 0, away: 0 }; });
    const total = { home: 0, away: 0 };
    let assigned = true;
    goalEvents.forEach(e => {
      if (!PERIODS.includes(e.period) || !e.scoringSide) { assigned = false; return; }
      counts[e.period][e.scoringSide] += 1; total[e.scoringSide] += 1;
    });
    const complete = view.hasEventLog && assigned && (
      (finalKnown && total.home === finalHome && total.away === finalAway) ||
      (goalEvents.length === 0 && finalHome === 0 && finalAway === 0) ||
      (!finalKnown && goalEvents.length > 0));
    const statGoals = (side, period) => {
      for (const src of [view.stats[side][period], view.stats[side].periods && view.stats[side].periods[period], view.stats[side].halves && view.stats[side].halves[period]]) {
        if (!isObj(src)) continue;
        const g = toScore(first(src.goals, src.goals_scored, src.goals_for));
        if (g !== null) return g;
      }
      return null;
    };
    const periodScore = period => {
      if (complete) return counts[period];
      const sh = statGoals("home", period), sa = statGoals("away", period);
      if (sh !== null && sa !== null) return { home: sh, away: sa };
      if (hints[period]) return hints[period];
      if (period === "first_half") {
        if (hints.halfTime) return hints.halfTime;
        const lastGoal = events.filter(e => e.period === "first_half" && GOAL_KINDS.has(e.kind)).pop();
        const sp = lastGoal ? parsePair(lastGoal.score) : null;
        if (sp) return sp;
      }
      if (period === "second_half" && !hasExtraTime && hints.halfTime && finalKnown && finalHome >= hints.halfTime.home && finalAway >= hints.halfTime.away)
        return { home: finalHome - hints.halfTime.home, away: finalAway - hints.halfTime.away };
      if (finalHome === 0 && finalAway === 0) return { home: 0, away: 0 };
      return null;
    };
    const base = events.filter(e => SUMMARY_KINDS.has(e.kind) && e.period && e.period !== "penalty_shootout");
    const assistRows = base.filter(e => (e.kind === "goal" || e.kind === "penaltygoal") && e.assist).map(e => ({ ...e, kind: "assist", player: e.assist, detail: `Goal: ${e.player}`, id: e.id + ":a" }))
      .concat(events.filter(e => e.metric === "assists" && e.period && e.period !== "penalty_shootout" && !base.some(b => b.id === e.id)).map(e => ({ ...e, kind: "assist" })));
    const shown = filter === "all" ? base : filter === "goals" ? base.filter(e => GOAL_KINDS.has(e.kind)) : filter === "cards" ? base.filter(e => CARD_KINDS.has(e.kind)) : filter === "subs" ? base.filter(e => e.kind === "sub") : assistRows;
    const sideFor = e => GOAL_KINDS.has(e.kind) || e.kind === "assist" ? e.scoringSide || e.side : e.side;
    const minuteText = e => e.minuteLabel ? `${e.minuteLabel}'` : Number.isFinite(e.minute) ? `${e.minute}'` : "—";
    const label = e => e.kind === "sub" ? `${e.playerOut || "—"} → ${e.playerIn || "—"}` : e.player || "";
    const extras = e => [e.kind === "owngoal" ? "OG" : e.kind === "penaltygoal" ? "P" : "", (e.kind === "goal" || e.kind === "penaltygoal") && e.assist ? `A: ${e.assist}` : "", e.kind === "assist" ? e.detail : "", e.kind === "secondyellow" ? "2nd yellow" : ""].filter(Boolean).join(" · ");
    const row = (e, side) => html`
      <div key=${e.id} class="mr-ev" style=${`justify-content:${side === "home" ? "flex-end" : "flex-start"}`}>
        ${side === "home" ? html`<span><b>${label(e)}</b> ${extras(e) && html`<small>${extras(e)}</small>`}</span><${EventIcon} kind=${e.kind} /><span class="mr-ev-min">${minuteText(e)}</span>`
          : html`<span class="mr-ev-min">${minuteText(e)}</span><${EventIcon} kind=${e.kind} /><span><b>${label(e)}</b> ${extras(e) && html`<small>${extras(e)}</small>`}</span>`}
      </div>`;
    const specs = [{ key: "first_half", label: PERIOD_LABEL.first_half }, { key: "second_half", label: PERIOD_LABEL.second_half }].concat(hasExtraTime ? [{ key: "extra_time_first_half", label: PERIOD_LABEL.extra_time_first_half }, { key: "extra_time_second_half", label: PERIOD_LABEL.extra_time_second_half }] : [])
      .filter(spec => events.some(event => event.period === spec.key) || hints[spec.key]);
    const filters = [["all", "ALL"], ["goals", "GOALS"], ["assists", "ASSISTS"], ["cards", "CARDS"], ["subs", "SUBSTITUTIONS"]].filter(([key]) => key === "all" || (key === "goals" ? base.some(e => GOAL_KINDS.has(e.kind)) : key === "cards" ? base.some(e => CARD_KINDS.has(e.kind)) : key === "subs" ? base.some(e => e.kind === "sub") : assistRows.length > 0));
    const fmtScore = s => s ? `${s.home} - ${s.away}` : "—";
    const infoItems = [["Date", match.date ? fmtDate(match.date) : ""], ["Referee", match.referee], ["Venue", match.venue], ["Capacity", match.capacity != null ? Number(match.capacity).toLocaleString() : ""], ["Attendance", match.attendance != null ? (num(match.attendance) !== null ? num(match.attendance).toLocaleString() : String(match.attendance)) : ""], ["TV", match.tv]].filter(i => i[1]);
    return html`
      <div>
        ${infoItems.length ? html`<section class="mr-card"><div class="mr-card-head"><div class="mr-card-title">Match info</div></div><div class="mr-info">${infoItems.map(i => html`<div key=${i[0]}><span>${i[0]}</span><b>${i[1]}</b></div>`)}</div></section>` : ""}
        ${filters.length > 1 ? html`<${Subnav} items=${filters} value=${filters.some(f => f[0] === filter) ? filter : "all"} onChange=${setFilter} />` : ""}
        <section class="mr-card">
          ${specs.map(spec => {
            const evs = shown.filter(e => e.period === spec.key);
            const homeEv = evs.filter(e => sideFor(e) === "home"), awayEv = evs.filter(e => sideFor(e) === "away");
            return html`
              <div key=${spec.key} aria-label=${spec.label}>
                <div class="mr-period"><span>${spec.label}</span><span class="mr-period-score"><small>PERIOD SCORE</small><strong>${fmtScore(periodScore(spec.key))}</strong></span></div>
                <div class="mr-ev-cols">
                  <div class="mr-ev-col home">${homeEv.length ? homeEv.map(e => row(e, "home")) : html`<div class="mr-ev-none">—</div>`}</div>
                  <div class="mr-ev-col">${awayEv.length ? awayEv.map(e => row(e, "away")) : html`<div class="mr-ev-none">—</div>`}</div>
                </div>
              </div>`;
          })}
          ${!shown.length && html`<${Empty} text=${`No ${filter === "all" ? "match events" : filter} events are available.`} />`}
        </section>
      </div>`;
  }

  // ── Stats ──
  function StatRow({ label, home, away, homeNum, awayNum, homeNote, awayNote }) {
    const hv = Math.abs(homeNum || 0), av = Math.abs(awayNum || 0), t = hv + av;
    return html`
      <div class="mr-stat-row">
        <div class="mr-stat-vals">
          <span class="mr-sv home">${home}${homeNote && html`<small class="mr-ss">${homeNote}</small>`}</span>
          <span class="mr-sl">${label}</span>
          <span class="mr-sv away">${away}${awayNote && html`<small class="mr-ss">${awayNote}</small>`}</span>
        </div>
        <div class="mr-meter" aria-hidden="true"><i class="h" style=${`width:${t ? hv / t * 100 : 0}%`}></i><i class="a" style=${`width:${t ? av / t * 100 : 0}%`}></i></div>
      </div>`;
  }
  const TeamHeader = ({ view, center }) => html`<div class="mr-teamhdr"><span>${view.match.home}</span><span>${center}</span><span>${view.match.away}</span></div>`;

  function PeriodStats({ view, period }) {
    const model = useMemo(() => buildStats(view, period), [view, period]);
    const periodLabel = period === "overview" ? "MATCH OVERVIEW" : PERIOD_LABEL[period];
    const visibleGroups = model.groups.map(g => ({ ...g, rows: g.rows.filter(r => r.home.value != null || r.away.value != null) })).filter(g => g.rows.length);
    return html`
      <div>
        <${TeamHeader} view=${view} center=${periodLabel} />
        <div class="mr-coverage">
          ${period === "overview"
            ? `The overview uses reported match totals. When an additive total is absent it is summed only if every ${view.hasExtraTime ? "regulation and extra-time period" : "regulation half"} is available; rates are calculated from underlying counts when needed.`
            : `${PERIOD_LABEL[period]} fields available: ${model.homeAvail}/${model.metricCount} for ${view.match.home} and ${model.awayAvail}/${model.metricCount} for ${view.match.away}. A dash means the period was not supplied and could not be safely derived; match totals are never copied into a period.`}
        </div>
        ${!visibleGroups.length && html`<${Empty} text="No statistics are available for this period yet." />`}
        ${visibleGroups.map(g => html`
          <section class="mr-card" key=${g.key} aria-label=${g.title}>
            <div class="mr-stat-title">${g.title}</div>
            ${g.rows.map(({ metric, home, away }) => html`
              <${StatRow} key=${metric.key} label=${metric.label} home=${formatStat(metric, home)} away=${formatStat(metric, away)}
                homeNum=${num(home.value)} awayNum=${num(away.value)} homeNote=${SOURCE_LABEL[home.source] || ""} awayNote=${SOURCE_LABEL[away.source] || ""} />`)}
          </section>`)}
        ${model.checks && html`
          <details class="mr-recon">
            <summary>Reconciliation checks · ${model.checks.ok} matched · ${model.checks.bad} mismatch${model.checks.bad === 1 ? "" : "es"} · ${model.checks.na} not verifiable</summary>
            <div class="mr-muted" style="margin:.3rem 0 .5rem">Not verifiable means the required period or component fields were not supplied.</div>
            <div class="mr-check" style="border-top:0;font-weight:900"><span>Check</span><span class="s">${view.match.home}</span><span class="s">${view.match.away}</span></div>
            ${model.checks.rows.map(r => html`<div class="mr-check" key=${r.label}><span>${r.label}</span>
              <span class=${`s ${r.home}`}>${r.home === "ok" ? "Matches" : r.home === "mismatch" ? "Mismatch" : "Not verifiable"}</span>
              <span class=${`s ${r.away}`}>${r.away === "ok" ? "Matches" : r.away === "mismatch" ? "Mismatch" : "Not verifiable"}</span></div>`)}
          </details>`}
      </div>`;
  }

  function Timeline({ view }) {
    // Empty selectedBands means full-match view (no time filtering).
    const [selectedBands, setSelectedBands] = useState([]);
    const regulationEnd = view.hasExtraTime ? 120 : 90;
    const bands = [];
    for (let start = 0; start < regulationEnd; start += 5) {
      const end = Math.min(start + 5, regulationEnd);
      bands.push({ start, end, label: `${fmtClock(start * 60)}–${fmtClock(end * 60 - 1)}`, half: start < 45 ? "1ST HALF" : start < 90 ? "2ND HALF" : "EXTRA TIME" });
    }
    const tracker = view.events.filter(e => e.tracker);
    const selected = tracker.filter(e => eventInSelectedBands(e, selectedBands)).sort((a, b) => a.sec - b.sec);
    const intervals = selectedBands.length
      ? selectedBands.map(start => ({ start: start * 60, end: (start + 5) * 60 }))
      : [{ start: 0, end: regulationEnd * 60 }];
    const poss = possessionFromEvents(tracker, intervals);
    const visibleSections = TIMELINE_SECTIONS.map(sec => ({
      ...sec,
      fields: sec.fields.filter(([key]) => tracker.some(e => e.metric === key || (key === "goals" && GOAL_KINDS.has(e.kind)) || (key === "cards" && CARD_KINDS.has(e.kind))))
    })).filter(sec => sec.fields.length);
    const fmtPair = v => Array.isArray(v) ? `${v[0]}/${v[1]}` : String(v);
    const numOf = v => Array.isArray(v) ? v[0] : v;
    const toggleBand = start => setSelectedBands(current =>
      current.includes(start) ? current.filter(x => x !== start) : [...current, start].sort((a, b) => a - b)
    );
    const toggleGroup = (from, to) => {
      const group = bands.filter(b => b.start >= from && b.start < to).map(b => b.start);
      setSelectedBands(current => group.every(v => current.includes(v))
        ? current.filter(v => !group.includes(v))
        : [...new Set([...current, ...group])].sort((a, b) => a - b));
    };
    const selectionLabel = selectedBands.length
      ? `${selectedBands.length} selected 5-minute band${selectedBands.length === 1 ? "" : "s"}`
      : "Full match · no time filter";
    return html`
      <div>
        <div class="mr-timebox">
          <div class="mr-timerow">
            <strong>Match time bands</strong>
            <span class="mr-timesum">${selectionLabel}</span>
            <button type="button" class="mr-time-action" onClick=${() => setSelectedBands([])}>Full match</button>
            <button type="button" class="mr-time-action" onClick=${() => setSelectedBands(bands.map(b => b.start))}>Select all</button>
          </div>
          <div class="mr-time-groups">
            <div class="mr-time-group">
              <div class="mr-time-group-head"><b>1st half</b><button type="button" class="mr-time-action" onClick=${() => toggleGroup(0, 45)}>Toggle half</button></div>
              <div class="mr-band-grid">${bands.filter(b => b.start < 45).map(b => html`
                <label class=${`mr-band-option ${selectedBands.includes(b.start) ? "selected" : ""}`} key=${b.start}>
                  <input type="checkbox" checked=${selectedBands.includes(b.start)} onChange=${() => toggleBand(b.start)} />
                  <span>${b.label}</span>
                </label>`)}
              </div>
            </div>
            <div class="mr-time-group">
              <div class="mr-time-group-head"><b>2nd half</b><button type="button" class="mr-time-action" onClick=${() => toggleGroup(45, 90)}>Toggle half</button></div>
              <div class="mr-band-grid">${bands.filter(b => b.start >= 45 && b.start < 90).map(b => html`
                <label class=${`mr-band-option ${selectedBands.includes(b.start) ? "selected" : ""}`} key=${b.start}>
                  <input type="checkbox" checked=${selectedBands.includes(b.start)} onChange=${() => toggleBand(b.start)} />
                  <span>${b.label}</span>
                </label>`)}
              </div>
            </div>
            ${view.hasExtraTime ? html`<div class="mr-time-group">
              <div class="mr-time-group-head"><b>Extra time</b><button type="button" class="mr-time-action" onClick=${() => toggleGroup(90, 120)}>Toggle extra time</button></div>
              <div class="mr-band-grid">${bands.filter(b => b.start >= 90).map(b => html`
                <label class=${`mr-band-option ${selectedBands.includes(b.start) ? "selected" : ""}`} key=${b.start}>
                  <input type="checkbox" checked=${selectedBands.includes(b.start)} onChange=${() => toggleBand(b.start)} />
                  <span>${b.label}</span>
                </label>`)}
              </div>
            </div>` : ""}
          </div>
          <div class="mr-timesum">By default, all available timestamped tracker actions across the match are included. Select one or more 5-minute bands to filter every metric and the event list to the combined selected periods. Clear the selection with “Full match”.</div>
        </div>
        ${poss && html`<section class="mr-card">
          <div class="mr-card-head"><div class="mr-card-title">Possession</div><span class="mr-pill">${selectionLabel}</span></div>
          <${StatRow} label="Ball possession" home=${poss[0] + "%"} away=${poss[1] + "%"} homeNum=${poss[0]} awayNum=${poss[1]} />
        </section>`}
        ${visibleSections.length ? html`<div class="mr-grid">
          ${visibleSections.map(sec => html`
            <section class="mr-card" key=${sec.id}>
              <div class="mr-card-head"><div class="mr-card-title">${sec.title}</div><span class="mr-pill">TRACKER</span></div>
              ${sec.fields.map(([k, label]) => {
                const hv = timelineValue(selected, "home", k), av = timelineValue(selected, "away", k);
                return html`<${StatRow} key=${k} label=${label} home=${fmtPair(hv)} away=${fmtPair(av)} homeNum=${numOf(hv)} awayNum=${numOf(av)} />`;
              })}
            </section>`)}
        </div>` : html`<${Empty} text="No tracker metric fields are available for this match." />`}
        ${selected.length ? html`<section class="mr-card" style="margin-top:12px">
          <div class="mr-card-head"><div class="mr-card-title">Timestamped tracker events</div><span class="mr-pill">${selected.length} EVENTS</span></div>
          ${selected.map(e => html`
            <div class="mr-event" key=${e.id}>
              <div class="mr-minute">${fmtClock(e.sec)}</div>
              <div><div class="mr-event-main">${e.metric || e.kind}</div><div class="mr-event-sub">${[e.player, e.detail].filter(Boolean).join(" · ")}</div></div>
              <div class="mr-event-side">${e.side === "home" ? view.match.home : e.side === "away" ? view.match.away : ""}</div>
            </div>`)}
        </section>` : html`<section class="mr-card" style="margin-top:12px"><${Empty} text="No timestamped tracker events are available in this selection." /></section>`}
      </div>`;
  }

  function StatsView({ view }) {
    const hasPeriodStats = period => buildStats(view, period).groups.some(group => group.rows.some(row => row.home.value != null || row.away.value != null));
    const subs = [["overview", "MATCH OVERVIEW"], ["first_half", "1ST HALF"], ["second_half", "2ND HALF"]]
      .filter(([period]) => hasPeriodStats(period))
      .concat(view.hasExtraTime ? [["extra_time_first_half", "ET · 1ST HALF"], ["extra_time_second_half", "ET · 2ND HALF"]].filter(([period]) => hasPeriodStats(period)) : [])
      .concat(view.hasTracker ? [["timeline", "TIMELINE"]] : []);
    const [sub, setSub] = useState(view.hasTracker ? "timeline" : "overview");
    const active = subs.some(s => s[0] === sub) ? sub : (subs[0]?.[0] || "overview");
    if (!subs.length) return html`<${Empty} text="No saved statistics are available for this match." />`;
    return html`
      <div>
        ${subs.length > 1 ? html`<${Subnav} items=${subs} value=${active} onChange=${setSub} />` : ""}
        ${active === "timeline" ? html`<${Timeline} view=${view} />` : html`<${PeriodStats} key=${active} view=${view} period=${active} />`}
      </div>`;
  }

  // ── Lineups ──
  function PlayerRow({ p, side, mode, onPlayer }) {
    const extra = mode === "height" ? (p.height != null ? `${p.height}cm` : "—") : mode === "age" ? (p.age != null ? `${p.age}y` : "—") : mode === "rating" ? (p.rating != null ? `★ ${p.rating.toFixed(1)}` : "—") : (p.rating != null ? p.rating.toFixed(1) : "");
    return html`
      <button type="button" class="mr-prow" onClick=${() => onPlayer(p)}>
        <span class=${`mr-num ${side}`}>${p.number ?? "•"}</span>
        <span><div class="mr-pname">${p.name || "Unnamed player"}</div><div class="mr-pmeta">${p.position || (p.status === "Substitute" ? "Substitute" : "—")}</div></span>
        <span class="mr-prow-r">${extra}
          ${p.minuteIn != null && p.status === "Substitute" ? html`<span class="mr-in">▲ ${p.minuteIn}'</span>` : ""}
          ${p.minuteOut != null ? html`<span class="mr-out">▼ ${p.minuteOut}'</span>` : ""}</span>
      </button>`;
  }
  function Lineups({ view, onPlayer, homeBadge, awayBadge }) {
    const [mode, setMode] = useState("overview");
    const { lineups, match } = view;
    const has = ["home", "away"].some(s => lineups[s].players.length || lineups[s].substitutes.length);
    if (!has) return html`<${Empty} text="Lineups have not been provided for this match." />`;
    const teams = [["home", match.home, homeBadge], ["away", match.away, awayBadge]];
    return html`
      <div>
        <${Subnav} center=${true} items=${[["overview", "OVERVIEW"], ["age", "AGE"], ["height", "HEIGHT"], ["rating", "AVG. RATING"]]} value=${mode} onChange=${setMode} />
        <section class="mr-card">
          <div class="mr-card-head"><div class="mr-card-title">Line-up pitch</div><span class="mr-pill">TAP A PLAYER FOR STATS</span></div>
          <div style="padding:12px">
            <div class="mr-lu-head">
              <div class="h">${homeBadge && html`<img src=${homeBadge} alt="" />`}${match.home} <small>(${lineups.home.formation || "—"})</small></div>
              <div class="a"><small>(${lineups.away.formation || "—"})</small> ${match.away}${awayBadge && html`<img src=${awayBadge} alt="" />`}</div>
            </div>
            <${Pitch} lineups=${lineups} mode=${mode} onPlayer=${onPlayer} />
          </div>
        </section>
        <div class="mr-lists">
          ${teams.map(([side, name]) => html`
            <section class="mr-card" key=${side}>
              <div class="mr-card-head"><div class="mr-card-title">${name || side} · Starting XI</div><span class="mr-pill">${lineups[side].players.length} PLAYERS</span></div>
              <div class="mr-plist">${lineups[side].players.length ? lineups[side].players.map(p => html`<${PlayerRow} key=${p.key} p=${p} side=${side} mode=${mode} onPlayer=${onPlayer} />`) : html`<${Empty} text="No starting XI recorded." />`}</div>
            </section>`)}
        </div>
        <div class="mr-lists">
          ${teams.map(([side, name]) => html`
            <section class="mr-card" key=${side}>
              <div class="mr-card-head"><div class="mr-card-title">${name || side} · Substitutes</div><span class="mr-pill">${lineups[side].substitutes.length} PLAYERS</span></div>
              <div class="mr-plist">${lineups[side].substitutes.length ? lineups[side].substitutes.map(p => html`<${PlayerRow} key=${p.key} p=${p} side=${side} mode=${mode} onPlayer=${onPlayer} />`) : html`<${Empty} text="No substitutions recorded." />`}</div>
            </section>`)}
        </div>
        ${(lineups.coaches.length || lineups.missingHome.length || lineups.missingAway.length) ? html`
          <section class="mr-card" style="margin-top:12px">
            <div class="mr-card-head"><div class="mr-card-title">Coaches / unavailable</div></div>
            <div class="mr-plist">
              ${lineups.coaches.map((c, i) => html`<div class="mr-prow" key=${"c" + i} style="cursor:default"><span class="mr-num">C</span><span><div class="mr-pname">${c.name}</div><div class="mr-pmeta">${c.team}</div></span><span class="mr-prow-r">Coach</span></div>`)}
              ${[["missingHome", match.home, "home"], ["missingAway", match.away, "away"]].flatMap(([k, team, side]) => lineups[k].map((p, i) => html`<div class="mr-prow" key=${k + i} style="cursor:default"><span class=${`mr-num ${side}`}>!</span><span><div class="mr-pname">${nameOf(p)}</div><div class="mr-pmeta">${team}</div></span><span class="mr-prow-r">${isObj(p) && p.reason ? p.reason : "Missing"}</span></div>`))}
            </div>
          </section>` : ""}
      </div>`;
  }

  // ── Player stats table + popup ──
  function PlayersTable({ view, onPlayer }) {
    const [side, setSide] = useState("all");
    const rows = view.squad.filter(p => side === "all" || p.side === side);
    const cell = v => v === null || v === undefined ? "—" : v;
    if (!view.squad.length) return html`<${Empty} text="No player statistics are available." />`;
    return html`
      <div>
        <${Subnav} items=${[["all", "ALL"], ["home", (view.match.home || "HOME").toUpperCase()], ["away", (view.match.away || "AWAY").toUpperCase()]]} value=${side} onChange=${setSide} />
        <section class="mr-card">
          <div class="mr-card-head"><div class="mr-card-title">Player statistics</div><span class="mr-pill">${rows.length} PLAYERS</span></div>
          <div class="mr-tablewrap" role="region" tabindex="0" aria-label="Player statistics table. Scroll horizontally to view all columns.">
            <table class="mr-table sticky">
              <thead><tr><th>Player</th><th>Team</th><th>Status</th><th>Pos</th><th>Cat.</th><th class="num">Height</th><th class="num">Age</th><th class="num">Rating</th><th class="num">Min</th><th class="num">G</th><th class="num">A</th><th class="num">Shots</th><th class="num">Passes</th></tr></thead>
              <tbody>
                ${rows.map(p => html`
                  <tr key=${p.key} class="click" tabindex="0" onClick=${() => onPlayer(p)} onKeyDown=${e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPlayer(p); } }}>
                    <td><b>${p.name || "—"}</b></td>
                    <td style=${`color:${p.side === "home" ? "var(--mr-home)" : "var(--mr-away)"}`}>${p.side === "home" ? view.match.home : view.match.away}</td>
                    <td class="mr-muted">${p.status}</td>
                    <td>${p.position ? html`<span class="mr-pos">${p.position}</span>` : "—"}</td>
                    <td class="mr-muted" style="text-transform:capitalize">${playerProfile(p).category.replace(/-/g, " ")}</td>
                    <td class="num">${p.height != null ? `${p.height}cm` : "—"}</td><td class="num">${cell(p.age)}</td>
                    <td class="num">${p.rating != null ? html`<span class=${`mr-rate ${ratingClass(p.rating)}`}>${p.rating.toFixed(1)}</span>` : "—"}</td>
                    <td class="num">${cell(p.minutes)}</td><td class="num">${cell(p.goals)}</td><td class="num">${cell(p.assists)}</td><td class="num">${cell(p.shots)}</td><td class="num">${cell(p.passes)}</td>
                  </tr>`)}
              </tbody>
            </table>
          </div>
        </section>
        <div class="mr-hint">Swipe horizontally to see all columns →</div>
      </div>`;
  }

  function PlayerPopup({ player, view, onClose }) {
    useEffect(() => {
      const onKey = e => { if (e.key === "Escape") onClose(); };
      document.addEventListener("keydown", onKey);
      return () => document.removeEventListener("keydown", onKey);
    }, []);
    const profile = playerProfile(player), sections = applicableSections(player);
    const evs = eventsForPlayer(player, view.events).slice().sort((a, b) => (a.sec || 0) - (b.sec || 0));
    const teamName = player.side === "home" ? view.match.home : view.match.away;
    const details = [["Position", player.position || "—"], ["Jersey", player.number ?? "—"], ["Category", profile.category.replace(/-/g, " ")], ["Level", profile.level || "—"], ["Rating", player.rating != null ? player.rating.toFixed(1) : "—"], ["Minutes", player.minutes != null ? `${player.minutes} min` : "—"], ["Age", player.age ?? "—"], ["Height", player.height != null ? `${player.height}cm` : "—"], ["Status", player.status]];
    return html`
      <div class="mr-overlay" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
        <div class="mr-popup" role="dialog" aria-modal="true" aria-label=${`${player.name} statistics`}>
          <div class="mr-popup-head">
            <div><div class="mr-popup-title">${player.name || "Player"}</div><div class="mr-muted">${teamName} · ${player.position || "—"}</div></div>
            <button type="button" class="mr-close" onClick=${onClose} aria-label="Close">×</button>
          </div>
          <div class="mr-profile"><div class="mr-avatar">${player.number ?? "—"}</div>
            <div class="mr-detailgrid">${details.map(d => html`<div class="mr-detail" key=${d[0]}><span>${d[0]}</span><b>${d[1]}</b></div>`)}</div></div>
          ${sections.map(s => html`
            <section class="mr-msec" key=${s.id}><h4>${s.title}</h4>
              <div class="mr-mgrid">${s.metrics.map(m => { const chips = typeChips(player, m, view.events); return html`<div class="mr-mbox" key=${m.key}><strong>${m.label}</strong><b>${metricDisplay(player, m, view.events, view.hasEventLog)}</b>${chips.length ? html`<small>${chips.join(" · ")}</small>` : ""}</div>`; })}</div>
            </section>`)}
          <section class="mr-msec"><h4>MATCH ACTIONS</h4>
            ${evs.length ? evs.map(e => html`<div class="mr-event" key=${e.id}><div class="mr-minute">${Number.isFinite(e.sec) && e.tracker ? fmtClock(e.sec) : Number.isFinite(e.minute) ? `${e.minute}'` : "—"}</div>
              <div><div class="mr-event-main">${e.kind === "sub" ? `${e.playerOut || "—"} → ${e.playerIn || "—"}` : e.metric || e.kind}</div><div class="mr-event-sub">${[e.detail, e.assist && (e.kind === "goal" || e.kind === "penaltygoal") ? `Assist: ${e.assist}` : ""].filter(Boolean).join(" · ")}</div></div>
              <div class="mr-event-side">${teamName}</div></div>`) : html`<${Empty} text="No player-specific actions are available." />`}
          </section>
        </div>
      </div>`;
  }

  // ══════════════════════════════════════════════════════════════════════
  //  MAIN COMPONENT
  // ══════════════════════════════════════════════════════════════════════
  const NAV = [["h2h", "H2H"], ["standings", "STANDINGS"], ["summary", "SUMMARY"], ["stats", "STATS"], ["lineups", "LINEUPS"], ["players", "PLAYER STATS"]];

  function MatchReport({ data, matchId, remote = false, apiBase = "", headers, showHeader = true, initialTab = "summary", homeBadge, awayBadge, onPlayerOpen }) {
    const [tab, setTab] = useState(initialTab);
    const [extra, setExtra] = useState({});
    const [errors, setErrors] = useState({});
    const [selected, setSelected] = useState(null);
    const base = useMemo(() => normalizeReport(data), [data]);
    const view = useMemo(() => {
      let merged = null;
      for (const t of Object.keys(extra)) {
        if (!sectionEmpty(base, t)) continue;
        merged = merged || { ...(isObj(data) ? data : {}) };
        Object.assign(merged, pickSection(t, extra[t]));
      }
      return merged ? normalizeReport(merged) : base;
    }, [data, base, extra]);

    useEffect(() => {
      if (!remote || !matchId || !["h2h", "standings", "lineups", "players"].includes(tab) || extra[tab] || !sectionEmpty(base, tab)) return;
      const controller = new AbortController();
      loadSection(tab, matchId, { apiBase, headers, signal: controller.signal })
        .then(p => { setExtra(c => ({ ...c, [tab]: p })); setErrors(c => ({ ...c, [tab]: "" })); })
        .catch(e => { if (e && e.name !== "AbortError") setErrors(c => ({ ...c, [tab]: `Live ${tab === "players" ? "player stats" : tab} data is unavailable.` })); });
      return () => controller.abort();
    }, [tab, matchId, remote, base]);

    const visibleNav = NAV.filter(([id]) => {
      if (id === "h2h") return view.h2h.matches.length > 0;
      if (id === "standings") return view.standings.length > 0;
      if (id === "summary") return view.events.length > 0;
      if (id === "stats") return view.hasStats;
      if (id === "lineups") return ["home", "away"].some(side => view.lineups[side].players.length || view.lineups[side].substitutes.length);
      if (id === "players") return view.squad.length > 0;
      return false;
    });
    useEffect(() => {
      if (visibleNav.length && !visibleNav.some(([id]) => id === tab)) setTab(visibleNav[0][0]);
    }, [visibleNav.map(([id]) => id).join("|")]);
    const openPlayer = p => { setSelected(p); if (onPlayerOpen) onPlayerOpen(p); };
    const { match } = view;
    const scoreText = `${match.homeScore ?? "—"}–${match.awayScore ?? "—"}`;
    const onTabKey = e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      e.preventDefault();
      const tabs = Array.from(e.currentTarget.parentElement.querySelectorAll('[role="tab"]'));
      const next = (tabs.indexOf(e.currentTarget) + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
      tabs[next].focus(); tabs[next].click();
    };
    const tabs = visibleNav.length ? html`
      <nav class=${`mr-tabs${showHeader ? "" : " standalone"}`} role="tablist" aria-label="Match report sections">
        ${visibleNav.map(([id, label]) => html`<button type="button" key=${id} role="tab" id=${`mr-tab-${id}`} aria-selected=${tab === id} aria-controls="mr-panel" tabIndex=${tab === id ? 0 : -1}
          class=${`mr-tab ${tab === id ? "active" : ""}`} onKeyDown=${onTabKey} onClick=${() => { setTab(id); setSelected(null); }}>${label}</button>`)}
      </nav>` : null;
    const body = tab === "h2h" ? html`<${H2H} view=${view} />`
      : tab === "standings" ? html`<${Standings} view=${view} />`
      : tab === "summary" ? html`<${Summary} view=${view} />`
      : tab === "stats" ? html`<${StatsView} view=${view} />`
      : tab === "lineups" ? html`<${Lineups} view=${view} onPlayer=${openPlayer} homeBadge=${homeBadge} awayBadge=${awayBadge} />`
      : tab === "players" ? html`<${PlayersTable} view=${view} onPlayer=${openPlayer} />`
      : html`<${Empty} text="No saved match-report sections are available for this match." />`;
    return html`
      <div class="mr-root">
        ${showHeader ? html`
          <section class="mr-head">
            ${(match.country || match.round || match.venue || match.referee) ? html`<div class="mr-ctx">
              <div>${match.country && html`<span class="mr-ctx-pill">${match.country}</span>`}${match.round && html`<span class="mr-ctx-pill">${match.round}</span>`}</div>
              <div>${match.venue && html`<span class="mr-ctx-pill">${match.venue}</span>`}${match.referee && html`<span class="mr-ctx-pill">${match.referee}</span>`}</div>
            </div>` : ""}
            ${match.competition && html`<div class="mr-comp">${match.competition}</div>`}
            <div class="mr-teams">
              ${match.home && html`<div class="mr-team home"><div class="mr-badge">${homeBadge ? html`<img src=${homeBadge} alt="" />` : initials(match.home)}</div><div class="mr-team-name">${match.home}</div></div>`}
              ${(match.homeScore !== null || match.awayScore !== null || match.status || match.date) && html`<div class="mr-score">${(match.homeScore !== null || match.awayScore !== null) && html`<div class="mr-score-main">${scoreText}</div>`}${(match.status || match.clock) && html`<div class="mr-status">${match.status}${match.clock ? ` · ${match.clock}` : ""}</div>`}${match.date && html`<div class="mr-date">${fmtDate(match.date)}</div>`}</div>`}
              ${match.away && html`<div class="mr-team away"><div class="mr-badge">${awayBadge ? html`<img src=${awayBadge} alt="" />` : initials(match.away)}</div><div class="mr-team-name">${match.away}</div></div>`}
            </div>
            ${tabs}
          </section>` : tabs}
        <div class="mr-content" id="mr-panel" role="tabpanel" aria-labelledby=${`mr-tab-${tab}`}>
          ${errors[tab] && html`<div class="mr-alert">${errors[tab]}</div>`}
          ${view.source === "live_draft" || (data && data.available === false) ? html`<div class="mr-alert">${data && data.available === false ? "No public club-tracker snapshot is available for this match yet. It will appear after the tracker saves a draft or submission." : "Live tracker data — figures update automatically."}</div>` : ""}
          ${body}
        </div>
        ${selected && html`<${PlayerPopup} player=${selected} view=${view} onClose=${() => setSelected(null)} />`}
      </div>`;
  }

  return { MatchReport, normalizeReport, loadReport, loadSection, FORMATIONS, version: "2.0.0" };
});

</script>
<style>
:root{--bg:#f3f6fa;--ink:#162033;--muted:#687386;--blue:#0758c9}
*{box-sizing:border-box}
html,body,#app{margin:0;min-height:100%;font-family:Inter,'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg)}
.shell{max-width:1320px;margin:auto;padding:16px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-weight:900;font-size:20px}.brand b{color:var(--blue)}
.api{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#aeb7c5}.dot.live{background:#13a35e;box-shadow:0 0 0 4px rgba(19,163,94,.1)}
.page-alert{margin:0 0 10px;padding:9px 11px;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412;border-radius:8px;font-size:11px}
@media(max-width:820px){.shell{padding:10px}}

  .mr-timebox{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .mr-timerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
  .mr-timerow strong{font-size:12px;font-weight:900}
  .mr-time-action{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;font-size:10px;font-weight:800;color:var(--ink)}
  .mr-time-action:hover{border-color:var(--blue);color:var(--blue)}
  .mr-timesum{font-size:10px;color:var(--muted)}
  .mr-time-groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mr-time-group{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px}
  .mr-time-group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:10px;text-transform:uppercase}
  .mr-band-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .mr-band-option{display:flex;align-items:center;gap:5px;border:1px solid #e5eaf0;border-radius:6px;padding:6px 5px;font-size:9px;font-weight:750;color:var(--muted);cursor:pointer}
  .mr-band-option.selected{background:#eaf2ff;border-color:#a9c7f5;color:var(--blue)}
  .mr-band-option input{margin:0;accent-color:var(--blue)}
  @media(max-width:700px){.mr-time-groups{grid-template-columns:1fr}.mr-band-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

</style>

<body>
<div id="app"></div>
<script>
(function(){
"use strict";
const {h,render}=preact;
const {useState,useEffect,useMemo}=preactHooks;
const MR=window.EnejiMatchReport;

const params=new URLSearchParams(location.search);
const API_BASE=(window.ENEJISTATS_API_BASE||"").replace(/\/$/,"");
const MATCH_ID=params.get("match_id")||params.get("matchId")||params.get("id")||window.MATCH_ID||"";

function App(){
  const [raw,setRaw]=useState(null),[live,setLive]=useState(false),[loading,setLoading]=useState(true),[err,setErr]=useState("");
  const view=useMemo(()=>MR.normalizeReport(raw),[raw]);
  useEffect(()=>{
    if(!MATCH_ID){setErr("Open this report from a match link that includes a match id.");setLoading(false);return}
    let active=true,inFlight=false,controller=null,timer=null;
    const load=async()=>{
      if(inFlight)return;
      inFlight=true;controller=new AbortController();
      let next=5000;
      try{
        const r=await MR.loadReport(MATCH_ID,{apiBase:API_BASE,signal:controller.signal});
        if(active){setRaw(r);setLive(true);setErr("");const n=MR.normalizeReport(r);if(n.source!=="live_draft")next=60000}
      }catch(e){if(active&&e?.name!=="AbortError")setErr("Live match report API is unavailable. No demo match data is being shown.")}
      finally{inFlight=false;if(active){setLoading(false);timer=setTimeout(load,next)}}
    };
    load();
    return()=>{active=false;clearTimeout(timer);controller?.abort()};
  },[]);
  const status=live?(view.source==="live_draft"?"LIVE TRACKER":view.available?"SAVED REPORT":"WAITING FOR TRACKER"):"API OFFLINE";
  return h("div",{class:"shell"},
    h("div",{class:"topbar"},
      h("div",{class:"brand"},h("b",null,"Eneji"),"Stats Match Report"),
      h("div",{class:"api"},h("i",{class:"dot "+(live&&view.available?"live":"")}),status)),
    err&&h("div",{class:"page-alert"},err),
    loading&&!raw&&h("div",{class:"page-alert"},"Loading live match data…"),
    h(MR.MatchReport,{data:raw,matchId:MATCH_ID,remote:Boolean(MATCH_ID),apiBase:API_BASE,showHeader:true})
  );
}
render(h(App),document.getElementById("app"));
})();
</script>
</body>
</html>
