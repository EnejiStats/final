<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Competitions & Trials — EnejiStats</title>
  <meta name="description" content="Find active and upcoming football trials, tournaments, and local competitions tracked or hosted via EnejiStats."/>
  <script src="https://unpkg.com/preact@10.19.3/dist/preact.umd.js"></script>
  <script src="https://unpkg.com/preact@10.19.3/hooks/dist/hooks.umd.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --primary:#004aad;--primary-light:#0066cc;--gold:#f5b800;--header-bg:#162060;--dark-bg:#1e1e2f;--page-bg:#0f172a;
      --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--muted:#94a3b8;
      --line:rgba(255,255,255,0.08);--radius:12px;--shadow:0 4px 24px rgba(0,0,0,0.4);
      --font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--font);background:var(--page-bg);color:#e2e8f0;line-height:1.6;overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    ul{list-style:none}
    .container{max-width:1200px;margin:0 auto;padding:0 1rem}

    /* HEADER */
    .site-header{position:sticky;top:0;z-index:1000;background:var(--header-bg)}
    .header-stripe{height:4px;background:var(--gold)}
    .header-inner{display:flex;align-items:center;justify-content:space-between;height:82px;padding:0 1rem;max-width:1200px;margin:0 auto;overflow:visible}
    .nav-desktop{display:none;gap:0.25rem;align-items:center}
    @media(min-width:769px){.nav-desktop{display:flex}}
    .nav-desktop a{color:rgba(255,255,255,0.8);font-size:0.88rem;font-weight:500;padding:0.4rem 0.6rem;border-radius:6px;transition:color 0.2s}
    .nav-desktop a:hover,.nav-desktop a.active{color:#fff;background:rgba(255,255,255,0.1)}
    .btn-nav{background:var(--gold);color:#0f172a!important;padding:0.45rem 1rem!important;border-radius:8px;font-weight:700!important}
    .hamburger{display:flex;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px}
    @media(min-width:769px){.hamburger{display:none}}
    .hamburger span{display:block;width:22px;height:2px;background:#fff;border-radius:2px}
    .mobile-nav{display:none;position:fixed;inset:0;background:var(--header-bg);z-index:2000;flex-direction:column;padding:1.5rem;gap:0.25rem}
    .mobile-nav.open{display:flex}
    .mobile-nav-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
    .mobile-nav a{color:rgba(255,255,255,0.85);font-size:1.05rem;font-weight:500;padding:0.8rem;border-radius:8px;display:block}
    .mobile-nav a:hover{background:rgba(255,255,255,0.1);color:#fff}
    .close-btn{background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer}
    .dropdown{position:relative}
    .dropdown-menu{display:none;position:absolute;top:calc(100%+6px);left:0;background:#1e1e2f;border:1px solid var(--line);border-radius:10px;min-width:160px;overflow:hidden;z-index:200}
    .dropdown:hover .dropdown-menu{display:block}
    .dropdown-menu a{display:block;padding:0.65rem 1rem;color:rgba(255,255,255,0.8);font-size:0.88rem}
    .dropdown-menu a:hover{background:rgba(255,255,255,0.08);color:#fff}

    /* HERO */
    .hero{background:linear-gradient(135deg,var(--header-bg),#0d1b3e);color:#fff;padding:4rem 1rem;text-align:center;border-bottom:4px solid var(--gold)}
    .hero h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin-bottom:0.75rem}
    .hero p{color:rgba(255,255,255,0.75);font-size:1rem;max-width:500px;margin:0 auto}

    /* FILTER BAR */
    .filter-bar{background:var(--dark-bg);position:sticky;top:68px;z-index:900;padding:1rem;border-bottom:1px solid var(--line)}
    .filters-grid{max-width:1200px;margin:0 auto;display:grid;gap:0.75rem;grid-template-columns:1fr}
    @media(min-width:600px){.filters-grid{grid-template-columns:1fr 1fr}}
    @media(min-width:992px){.filters-grid{grid-template-columns:2fr repeat(3,1fr)}}
    .filter-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--line);border-radius:8px;padding:0.6rem 0.85rem;color:#e2e8f0;font-size:0.9rem;outline:none}
    .filter-input:focus{border-color:var(--gold)}
    .filter-input option{background:var(--dark-bg)}
    .type-tabs{max-width:1200px;margin:0.75rem auto 0;display:flex;gap:0.5rem;overflow-x:auto;padding-bottom:0.25rem}
    .type-tab{padding:0.4rem 1rem;background:rgba(255,255,255,0.06);border:1px solid var(--line);border-radius:20px;font-size:0.82rem;font-weight:500;white-space:nowrap;cursor:pointer;transition:all 0.2s;color:#e2e8f0}
    .type-tab.active{background:var(--gold);color:#0f172a;border-color:var(--gold)}

    /* CARDS GRID */
    .content-area{max-width:1200px;margin:0 auto;padding:2rem 1rem}
    .cards-grid{display:grid;gap:1.5rem;grid-template-columns:1fr}
    @media(min-width:600px){.cards-grid{grid-template-columns:1fr 1fr}}
    @media(min-width:992px){.cards-grid{grid-template-columns:repeat(3,1fr)}}

    /* EVENT CARD — enlarged, structured and status-aware */
    .cards-grid{max-width:1380px}
    @media(min-width:992px){.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.75rem}}
    @media(min-width:1500px){.cards-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    .ev-card{min-height:540px;background:linear-gradient(180deg,rgba(30,30,47,.98),rgba(15,23,42,.98));border:1px solid rgba(255,255,255,.10);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative;isolation:isolate;box-shadow:0 10px 32px rgba(0,0,0,.28);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
    .ev-card-open{border-color:rgba(34,197,94,.48);box-shadow:0 0 0 1px rgba(34,197,94,.12),0 0 26px rgba(34,197,94,.20),0 16px 42px rgba(0,0,0,.34);animation:openCompetitionGlow 3s ease-in-out infinite}
    .ev-card-closed{box-shadow:0 10px 32px rgba(0,0,0,.28)}
    .ev-card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 16px 42px rgba(0,0,0,.38)}
    .ev-card-open:hover{box-shadow:0 0 0 1px rgba(34,197,94,.18),0 0 34px rgba(34,197,94,.28),0 18px 48px rgba(0,0,0,.4)}
    @keyframes openCompetitionGlow{0%,100%{box-shadow:0 0 0 1px rgba(34,197,94,.10),0 0 18px rgba(34,197,94,.14),0 12px 34px rgba(0,0,0,.28)}50%{box-shadow:0 0 0 1px rgba(34,197,94,.20),0 0 34px rgba(34,197,94,.26),0 16px 42px rgba(0,0,0,.34)}}
    @media(prefers-reduced-motion:reduce){.ev-card-open{animation:none}}
    .ev-image{height:220px;background:linear-gradient(135deg,var(--header-bg),#0d1b3e);position:relative;display:flex;align-items:center;justify-content:center;font-size:4rem;overflow:hidden}
    .ev-image img{width:100%;height:100%;object-fit:cover;display:block}
    .ev-image img+.image-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.62))}
    .ev-body{padding:1.45rem 1.5rem 1.2rem;flex:1;min-width:0}
    .ev-title{font-size:1.25rem;font-weight:800;line-height:1.3;margin-bottom:.7rem;color:#fff;overflow-wrap:anywhere}
    .ev-meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem .9rem;margin:.85rem 0}
    .ev-meta{font-size:.82rem;color:var(--muted);margin:0;display:flex;align-items:flex-start;gap:.5rem;min-width:0}
    .ev-meta i{width:16px;flex:0 0 16px;color:#93c5fd;margin-top:.18rem}
    .ev-meta span{min-width:0;overflow-wrap:anywhere}
    .ev-desc{font-size:.88rem;color:rgba(255,255,255,.70);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:1rem 0 0;line-height:1.6}
    .ev-footer{padding:1rem 1.5rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:.85rem;background:rgba(0,0,0,.14);margin-top:auto}
    .ev-actions{display:flex;gap:.55rem;flex-wrap:wrap;justify-content:flex-end}
    .btn-sm{padding:.55rem .9rem;min-height:40px;background:var(--gold);color:#0f172a;border-radius:8px;font-size:.8rem;font-weight:800;border:none;cursor:pointer;transition:transform .2s,opacity .2s,box-shadow .2s}
    .btn-sm:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 5px 16px rgba(245,184,0,.22)}
    .btn-sm.btn-secondary{background:rgba(255,255,255,.08);color:#e2e8f0;border:1px solid var(--line)}
    @media(max-width:640px){.overlay-backdrop{padding:.5rem}.overlay-card{width:100%;max-height:calc(100dvh - 1rem);height:calc(100dvh - 1rem);border-radius:14px}.overlay-content{padding:1rem}.overlay-footer{padding:.8rem 1rem;flex-wrap:wrap}.overlay-footer .btn,.overlay-footer .btn-gold{min-height:42px}.ev-card{min-height:0}.ev-image{height:190px}.ev-body{padding:1.1rem}.ev-meta-grid{grid-template-columns:1fr}.ev-footer{padding:.85rem 1.1rem;align-items:flex-end}.ev-actions{width:100%}.ev-actions .btn-sm{flex:1}}

    /* MODALS — fixed to the viewport so content can never flow into the footer */
    .overlay-backdrop{position:fixed;inset:0;z-index:5000;background:rgba(2,6,23,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:clamp(.75rem,3vw,2rem);overflow:hidden;animation:modalFadeIn .18s ease-out}
    .overlay-card{width:min(940px,100%);max-height:min(900px,calc(100dvh - 1.5rem));height:min(900px,calc(100dvh - 1.5rem));background:#111827;border:1px solid rgba(255,255,255,.13);border-radius:18px;box-shadow:0 28px 90px rgba(0,0,0,.62),0 0 0 1px rgba(245,184,0,.05);display:flex;flex-direction:column;overflow:hidden;min-height:0;animation:modalRise .2s ease-out}
    .overlay-header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.35rem;background:linear-gradient(135deg,#18245f,#111827);border-bottom:1px solid var(--line)}
    .overlay-header h3{font-size:1.08rem;color:#fff;line-height:1.35;overflow-wrap:anywhere}
    .overlay-header .close-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff;font-size:1.25rem;cursor:pointer;flex:0 0 auto}
    .overlay-header .close-btn:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.4)}
    .overlay-content{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:1.25rem 1.35rem;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable}
    .overlay-content::-webkit-scrollbar{width:9px}.overlay-content::-webkit-scrollbar-thumb{background:rgba(148,163,184,.35);border-radius:20px}.overlay-content::-webkit-scrollbar-track{background:rgba(255,255,255,.03)}
    .overlay-card>form{display:flex;flex:1 1 auto;flex-direction:column;min-height:0;overflow:hidden}
    .overlay-card>form>.overlay-content{flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto;overflow-x:hidden}
    .overlay-footer{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;gap:.7rem;padding:.9rem 1.35rem;background:#0d1422;border-top:1px solid var(--line);position:relative;z-index:2}
    .overlay-footer .btn{flex:0 0 auto}
    .overlay-tabs{display:flex;gap:.45rem;overflow-x:auto;padding-bottom:.65rem;margin-bottom:1rem;border-bottom:1px solid var(--line);scrollbar-width:thin}
    .overlay-tab-btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#cbd5e1;border-radius:8px;padding:.55rem .85rem;font-weight:700;font-size:.78rem;white-space:nowrap;cursor:pointer}.overlay-tab-btn.active{background:var(--gold);color:#0f172a;border-color:var(--gold)}
    .overlay-doc{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;color:#cbd5e1;line-height:1.7;overflow-wrap:anywhere}
    .overlay-doc h4{color:#fff;margin:1.1rem 0 .5rem;font-size:.92rem}.overlay-doc h4:first-child{margin-top:0}.overlay-doc p{margin:.45rem 0}.overlay-doc strong{color:#fff}
    .section-block{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem}.section-block-title{font-weight:800;color:#fff;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem}
    .form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.form-group{margin-bottom:.8rem}.form-group label{display:block;font-size:.78rem;color:#cbd5e1;font-weight:700;margin-bottom:.35rem}.form-control{width:100%;background:#0b1220;color:#e2e8f0;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:.65rem .75rem;outline:none;min-height:40px}.form-control:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.10)}
    @keyframes modalFadeIn{from{opacity:0}to{opacity:1}}@keyframes modalRise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
    @media(max-width:640px){.overlay-backdrop{padding:.5rem}.overlay-card{max-height:calc(100dvh - 1rem);border-radius:14px}.overlay-header{padding:.85rem 1rem}.overlay-content{padding:1rem}.overlay-footer{padding:.8rem 1rem}.form-row{grid-template-columns:1fr}.overlay-footer .btn,.overlay-footer .btn-gold{flex:1;min-height:42px}}


    /* PAGINATION */
    .pagination{display:flex;justify-content:center;gap:0.4rem;margin:2rem 0;flex-wrap:wrap}
    .page-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--dark-bg);cursor:pointer;font-weight:600;color:#e2e8f0;font-size:0.85rem;transition:all 0.2s}
    .page-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
    .page-btn.active{background:var(--gold);color:#0f172a;border-color:var(--gold)}
    .page-btn:disabled{opacity:0.4;cursor:not-allowed}

    /* CTA */
    .cta-banner{background:linear-gradient(135deg,var(--header-bg),#0d1b3e);border:1px solid var(--line);border-radius:var(--radius);padding:2.5rem 1.5rem;text-align:center;margin-bottom:3rem;border-top:4px solid var(--gold)}
    .cta-banner h2{font-size:1.4rem;margin-bottom:0.75rem}
    .cta-banner p{color:var(--muted);margin-bottom:1.5rem;font-size:0.9rem}
    .btn-gold{display:inline-flex;align-items:center;gap:0.5rem;background:var(--gold);color:#0f172a;padding:0.75rem 1.75rem;border-radius:8px;font-weight:700;transition:opacity 0.2s}
    .btn-gold:hover{opacity:0.9}

    /* EMPTY / SKELETON */
    .empty-state{text-align:center;padding:4rem 1rem;background:var(--dark-bg);border:1px solid var(--line);border-radius:var(--radius)}
    .empty-state i{font-size:3rem;color:var(--muted);margin-bottom:1rem;display:block}
    .skeleton{background:linear-gradient(90deg,#1e1e2f 25%,#2a2a40 50%,#1e1e2f 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* FOOTER */
    .site-footer{background:#0a0a14;border-top:1px solid var(--line);padding:3.5rem 1rem 1.5rem}
    .footer-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:2.5rem}
    @media(min-width:600px){.footer-grid{grid-template-columns:1fr 1fr}}
    @media(min-width:992px){.footer-grid{grid-template-columns:1.6fr 1fr 1fr 1fr}}
    .footer-col h4{color:#fff;font-size:0.85rem;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:1rem}
    .footer-col p,.footer-col ul a{font-size:0.85rem;color:var(--muted)}
    .footer-col ul li{margin-bottom:0.6rem}
    .footer-col ul a:hover{color:var(--gold)}
    .footer-bottom{max-width:1200px;margin:2rem auto 0;padding-top:1.25rem;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:space-between;font-size:0.78rem;color:var(--muted)}
    .footer-bottom a{color:var(--muted)}.footer-bottom a:hover{color:var(--gold)}
  
    @media(max-width:480px){
      .container{padding:0 0.75rem}
      .header-inner{height:66px;padding:0 0.75rem}
      .hero h1{font-size:clamp(1.4rem,7vw,2.2rem)}
      .section,.section-alt{padding:2.5rem 0}
      .btn,.btn-nav,.btn-gold{min-height:44px}
      .mobile-nav a{min-height:44px;display:flex;align-items:center}
      .footer-grid{gap:1.5rem}
      .footer-bottom{flex-direction:column;gap:0.4rem}
    }
    @media(max-width:360px){
      .container{padding:0 0.5rem}
      .header-inner{padding:0 0.5rem}
    }

    .workflow-note{background:rgba(37,99,235,.12);border:1px solid rgba(96,165,250,.25);padding:.75rem .9rem;border-radius:9px;font-size:.78rem;line-height:1.55;color:#bfdbfe;margin-bottom:1rem}
    .workflow-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin-bottom:1rem}
    @media(max-width:640px){.workflow-grid{grid-template-columns:1fr}}
    .workflow-card{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;padding:1rem}
    .workflow-card h4{color:#fff;margin-bottom:.35rem}.workflow-card p{font-size:.76rem;color:var(--muted);line-height:1.5}
    .workflow-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.25rem;letter-spacing:2px;font-weight:900;color:var(--gold);background:rgba(245,184,0,.08);border:1px dashed rgba(245,184,0,.5);padding:.75rem;text-align:center;border-radius:9px;margin:.75rem 0}
    .pw-stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin-bottom:1rem}.pw-step{padding:.45rem .25rem;text-align:center;font-size:.67rem;color:var(--muted);border-bottom:2px solid var(--line)}.pw-step.active{color:#fff;border-color:var(--gold);font-weight:800}.pw-step.done{color:var(--success);border-color:var(--success)}
    .bank-details{background:#0b1220;border:1px solid var(--line);border-radius:9px;padding:.85rem;margin:.8rem 0}.bank-row{display:flex;justify-content:space-between;gap:1rem;padding:.42rem 0;border-bottom:1px solid var(--line);font-size:.8rem}.bank-row:last-child{border-bottom:0}.bank-label{color:var(--muted)}.bank-value{font-weight:800;text-align:right;word-break:break-word}.copy-mini{border:0;background:var(--primary);color:#fff;border-radius:5px;padding:.2rem .45rem;font-size:.68rem;cursor:pointer;margin-left:.35rem}
    .receipt-drop{border:1.5px dashed #64748b;border-radius:10px;padding:1.5rem;text-align:center;cursor:pointer;background:rgba(255,255,255,.02)}.receipt-drop:hover{border-color:var(--gold)}
    .global-booking{display:flex;justify-content:center;gap:.65rem;flex-wrap:wrap;margin-top:1.25rem}.global-booking .btn-gold{padding:.55rem 1rem;font-size:.82rem}
  </style>
  <link rel="stylesheet" href="/static/css/eneji-branding.css"/>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const {h,render}=preact;
const {useState,useEffect,useMemo}=preactHooks;
const html=htm.bind(h);
const year=new Date().getFullYear();
const fmtMoney=n=>'₦'+Number(n||0).toLocaleString('en-NG',{maximumFractionDigits:0});
const escText=v=>String(v??'').trim();
const first=(o,...keys)=>{for(const k of keys){const v=o?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v;}return '';};

function Logo(){return html`<a href="/" style=${{textDecoration:'none',display:'inline-block',verticalAlign:'middle'}}><img src="/static/images/eneji-stats-branding.png" alt="EnejiStats" class="eneji-logo-img"/></a>`}
function Header(){
 const [open,setOpen]=useState(false);
 return html`<header class="site-header"><div class="header-stripe"></div><div class="header-inner"><${Logo}/>
 <nav class="nav-desktop"><a href="/">Home</a><a href="/about.html">About</a><div class="dropdown"><a href="#">Stats Area <i class="fas fa-chevron-down" style="font-size:.65rem"/></a><div class="dropdown-menu"><a href="/browse.html">Browse</a></div></div><a href="/leaderboard.html">Leaderboard</a><a href="/competitions.html" class="active">Competitions & Trials</a><a href="/pricing.html">Pricing</a><a href="/contact.html">Contact</a><a href="/register.html" class="btn-nav">Register / Sign In</a></nav>
 <button class="hamburger" onClick=${()=>setOpen(true)}><span/><span/><span/></button></div>
 <div class=${'mobile-nav'+(open?' open':'')}><div class="mobile-nav-top"><${Logo}/><button class="close-btn" onClick=${()=>setOpen(false)}><i class="fas fa-times"/></button></div>${[['/','Home'],['/about.html','About'],['/browse.html','Browse'],['/leaderboard.html','Leaderboard'],['/competitions.html','Competitions & Trials'],['/pricing.html','Pricing'],['/contact.html','Contact'],['/register.html','Register / Sign In']].map(([u,t])=>html`<a href=${u} class=${u==='/competitions.html'?'active':''} onClick=${()=>setOpen(false)}>${t}</a>`)}</div></header>`;

/* ENEJISTATS REGISTER GEO CONTRACT — exact endpoint/reset semantics mirrored from register(5).html. */
function useRegisterGeoCountries(){const [countries,setCountries]=useState([]);useEffect(()=>{let cancelled=false;const c=new AbortController();fetch('/api/public/countries',{credentials:'include',signal:c.signal}).then(r=>r.ok?r.json():Promise.reject(new Error('countries request failed'))).then(d=>{if(cancelled)return;const list=Array.isArray(d)?d:(d.countries||d.data||[]);setCountries(list.map(c=>({code:c.code||c.v||c.value||c.id,name:c.name||c.l||c.label||c.code||c.v||c.value||c.id,regionLabel:c.region_label||'State / Region',subregionLabel:c.subregion_label||'LGA / Local Area'})).filter(c=>c.code&&c.name));}).catch(e=>{if(e.name!=='AbortError')setCountries([])});return()=>{cancelled=true;c.abort()};},[]);return countries}
function useRegisterGeoRegions(countryCode){const [items,setItems]=useState([]),[loading,setLoading]=useState(false),[label,setLabel]=useState('State / Region');useEffect(()=>{if(!countryCode){setItems([]);setLabel('State / Region');return}const c=new AbortController();setLoading(true);fetch('/api/public/countries/'+encodeURIComponent(String(countryCode).toUpperCase())+'/regions',{credentials:'include',signal:c.signal}).then(r=>r.ok?r.json():Promise.reject(new Error('regions request failed'))).then(d=>{const a=Array.isArray(d)?d:(d.regions||[]);setItems(a.map(x=>typeof x==='string'?x:(x?.name||x?.state||x?.region||'')).filter(Boolean));setLabel(d.region_label||'State / Region')}).catch(e=>{if(e.name!=='AbortError')setItems([])}).finally(()=>{if(!c.signal.aborted)setLoading(false)});return()=>c.abort()},[countryCode]);return [items,loading,label]}
function useRegisterGeoSubregions(countryCode,region){const [items,setItems]=useState([]),[loading,setLoading]=useState(false),[label,setLabel]=useState('LGA / Local Area');useEffect(()=>{if(!countryCode||!region){setItems([]);setLabel('LGA / Local Area');return}const c=new AbortController();setLoading(true);fetch('/api/public/countries/'+encodeURIComponent(String(countryCode).toUpperCase())+'/regions/'+encodeURIComponent(region)+'/subregions',{credentials:'include',signal:c.signal}).then(r=>r.ok?r.json():Promise.reject(new Error('subregions request failed'))).then(d=>{const a=Array.isArray(d)?d:(d.subregions||[]);setItems(a.map(x=>typeof x==='string'?x:(x?.name||x?.lga||x?.subregion||'')).filter(Boolean));setLabel(d.subregion_label||'LGA / Local Area')}).catch(e=>{if(e.name!=='AbortError')setItems([])}).finally(()=>{if(!c.signal.aborted)setLoading(false)});return()=>c.abort()},[countryCode,region]);return [items,loading,label]}

function App(){
 const [events,setEvents]=useState([]),[loading,setLoading]=useState(true),[pageContent,setPageContent]=useState({hero_title:'Competitions & Trials',intro:'Find active and upcoming football trials, tournaments, leagues, and cups across Nigeria.',cta_title:'Want to list your competition on EnejiStats?',cta_text:'We partner with clubs, associations, and academies to list verified competitions and trials.',cta_button_text:'Contact Us to List'});
 const [search,setSearch]=useState(''),[statusFilter,setStatusFilter]=useState('All'),[typeFilter,setTypeFilter]=useState('All'),[page,setPage]=useState(1),[totalPages,setTotalPages]=useState(1),[detail,setDetail]=useState(null),[register,setRegister]=useState(null),[continueBooking,setContinueBooking]=useState(false),[countries,setCountries]=useState([]);
 const geoCountries=useRegisterGeoCountries(); const [geoCountry,setGeoCountry]=useState(''); const [geoRegions,geoRegionsLoading,geoRegionLabel]=useRegisterGeoRegions(geoCountry); const [geoState,setGeoState]=useState('All'); const [geoSubregions,geoSubregionsLoading,geoSubregionLabel]=useRegisterGeoSubregions(geoCountry,geoState==='All'?'':geoState); const [geoLga,setGeoLga]=useState('All');
 const PAGE_SIZE=9;
 useEffect(()=>{const locked=!!(detail||register||continueBooking);document.body.style.overflow=locked?'hidden':'';return()=>{document.body.style.overflow=''}},[detail,register,continueBooking]);
 useEffect(()=>{fetch('/api/public/pages/competitions').then(r=>r.ok?r.json():Promise.reject()).then(r=>setPageContent(c=>({...c,...(r.content||{})}))).catch(()=>{});fetch('/api/public/countries').then(r=>r.ok?r.json():Promise.reject()).then(r=>{const a=Array.isArray(r)?r:r.countries||r.data||[];setCountries(a.map(c=>({code:c.code||c.v||c.value||c.id,name:c.name||c.label||c.code||c.v||c.value||c.id})).filter(c=>c.code&&c.name));}).catch(()=>{});},[]);
 useEffect(()=>{
  let cancelled=false;
  const controller=new AbortController();
  const load=async()=>{
    setLoading(true);
    try{
      const params=new URLSearchParams({limit:String(PAGE_SIZE),page:String(page),...(search.trim()?{q:search.trim()}:{}),...(statusFilter!=='All'?{status:statusFilter.toLowerCase()}:{}),...(geoCountry?{country:geoCountry}:{}),...(geoState!=='All'?{state:geoState}:{}),...(geoLga!=='All'?{lga:geoLga}:{}),...(typeFilter!=='All'?{type:typeFilter.toLowerCase()}:{}),});
      const r=await fetch('/api/public/competitions?'+params.toString(),{method:'GET',headers:{Accept:'application/json','Cache-Control':'no-cache'},cache:'no-store',signal:controller.signal});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j?.detail||j?.message||`Competition request failed (${r.status})`);
      if(cancelled)return;
      const rows=Array.isArray(j)?j:(Array.isArray(j?.data)?j.data:(Array.isArray(j?.events)?j.events:[]));
      setEvents(rows.map(normaliseEvent));
      const total=Number(j?.total)||0;
      const serverPages=Number(j?.pages)||(total?Math.ceil(total/PAGE_SIZE):1);
      const safePages=Math.max(1,serverPages);
      setTotalPages(safePages);
      if(page>safePages){setPage(safePages);return;}
    }catch(err){
      if(err?.name==='AbortError')return;
      if(!cancelled){setEvents([]);setTotalPages(1);}
    }finally{if(!cancelled)setLoading(false);}
  };

},[search,statusFilter,typeFilter,page,geoCountry,geoState,geoLga]);
 const filtered=useMemo(()=>events.filter(e=>(!search||JSON.stringify([e.title,e.description,e.location,e.venue]).toLowerCase().includes(search.toLowerCase()))&&(statusFilter==='All'||e.status===statusFilter.toLowerCase())&&(geoState==='All'||e.state===geoState||e.location===geoState)&&(geoLga==='All'||e.lga===geoLga)&&(typeFilter==='All'||String(e.event_type).toLowerCase()===typeFilter.toLowerCase())),[events,search,statusFilter,typeFilter,geoState,geoLga]);
 return html`<div><${Header}/><section class="hero"><h1><i class="fas fa-trophy"/> ${pageContent.hero_title}</h1><p>${pageContent.intro}</p><div class="global-booking"><button type="button" class="btn-gold" onClick=${()=>setContinueBooking(true)}><i class="fas fa-ticket-alt"/> Reload / Continue Reservation</button></div></section>
 <div class="filter-bar"><div class="filters-grid"><input class="filter-input" type="search" placeholder="Search competitions, venues or teams…" value=${search} onInput=${e=>{setPage(1);setSearch(e.target.value)}}/><select class="filter-input" value=${geoCountry} onChange=${e=>{setPage(1);setGeoCountry(e.target.value);setGeoState('All');setGeoLga('All')}}><option value="">All Countries</option>${geoCountries.map(c=>html`<option key=${c.code} value=${String(c.code).toUpperCase()}>${c.name}</option>`)}</select><select class="filter-input" value=${geoState} disabled=${!geoCountry||geoRegionsLoading} onChange=${e=>{setPage(1);setGeoState(e.target.value);setGeoLga('All')}}>${['All',...geoRegions].map(x=>html`<option key=${x} value=${x}>${x==='All'?'All '+geoRegionLabel+'s':x}</option>`)}</select><select class="filter-input" value=${geoLga} disabled=${!geoState||geoState==='All'||geoSubregionsLoading} onChange=${e=>{setPage(1);setGeoLga(e.target.value)}}>${['All',...geoSubregions].map(x=>html`<option key=${x} value=${x}>${x==='All'?'All '+geoSubregionLabel+'s':x}</option>`)}</select><select class="filter-input" value=${statusFilter} onChange=${e=>{setPage(1);setStatusFilter(e.target.value)}}>${['All','Active','Upcoming','Completed'].map(s=>html`<option value=${s}>${s}</option>`)}</select></div><div class="type-tabs">${EVENT_TYPES.map(t=>html`<button class=${'type-tab'+(typeFilter===t?' active':'')} onClick=${()=>{setPage(1);setTypeFilter(t)}}>${t}</button>`)}</div></div>
 <main class="content-area">${loading?html`<div class="cards-grid">${Array(6).fill(0).map((_,i)=>html`<div key=${i} class="skeleton" style="height:360px;border-radius:var(--radius)"/>`)}</div>`:filtered.length===0?html`<div class="empty-state"><i class="fas fa-calendar-xmark"/><h3>No competitions found</h3><p>Try adjusting your filters or check back soon for new listings.</p></div>`:html`<div class="cards-grid">${filtered.map(ev=>html`<${EventCard} key=${ev.id||ev._id||`${ev.title}-${ev.start_at}`} event=${ev} onDetails=${setDetail} onRegister=${setRegister}/>` )}</div>`}
 ${!loading&&totalPages>1?html`<div class="pagination"><button class="page-btn" disabled=${page===1} onClick=${()=>setPage(p=>Math.max(1,p-1))}><i class="fas fa-chevron-left"/></button>${Array.from({length:totalPages},(_,i)=>html`<button class=${'page-btn'+(page===i+1?' active':'')} onClick=${()=>setPage(i+1)}>${i+1}</button>`)}<button class="page-btn" disabled=${page===totalPages} onClick=${()=>setPage(p=>Math.min(totalPages,p+1))}><i class="fas fa-chevron-right"/></button></div>`:''}
 <div class="cta-banner"><h2>${pageContent.cta_title}</h2><p>${pageContent.cta_text}</p><a href="/contact.html?subject=event-listing" class="btn-gold"><i class="fas fa-envelope"/> ${pageContent.cta_button_text}</a></div></main>
 ${detail&&html`<${DetailsModal} event=${detail} onClose=${()=>setDetail(null)} onRegister=${setRegister}/>`}${register&&html`<${RegisterModal} event=${register} onClose=${()=>setRegister(null)} countries=${countries}/>`}${continueBooking&&html`<${ContinueBookingModal} onClose=${()=>setContinueBooking(false)} countries=${countries}/>`}<${Footer}/></div>`;
}
