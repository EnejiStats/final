  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* ═══════════════ DESIGN TOKENS ═══════════════ */
    :root {
      --primary: #004aad; --primary-light: #0066cc; --primary-dark: #003380; --primary-soft: rgba(0,74,173,.08);
      --accent: #ffd700; --danger: #dc2626; --success: #16a34a; --warning: #d97706;
      --bg: #f0f4f8; --card-bg: #fff; --border: #e2e8f0;
      --text: #1e293b; --text-light: #64748b; --muted: #94a3b8;
      --sidebar-w: 248px; --header-h: 56px;
      --radius: 12px; --radius-sm: 8px;
      --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(0,74,173,.07);
      --shadow-lg: 0 20px 60px rgba(15,23,42,.3);
      --mono: 'SFMono-Regular', ui-monospace, 'Courier New', monospace;
      --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --ease: cubic-bezier(.4,0,.2,1);
    }

    /* ═══════════════ RESET & BASE ═══════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: clamp(13px, 1.05vw, 16px); -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    img { max-width: 100%; }
    :focus-visible { outline: 2px solid var(--primary-light); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }

    /* ═══════════════ HEADER ═══════════════ */
    .dashboard-header {
      position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
      background: linear-gradient(90deg, var(--primary-dark), var(--primary)); color: #fff;
      display: flex; align-items: center; padding: 0 clamp(.75rem, 2vw, 1.5rem); gap: .75rem;
      z-index: 1000; box-shadow: 0 2px 10px rgba(0,0,0,.22);
    }
    .header-logo { flex: 1; display: flex; align-items: center; min-width: 0; }
    .brand-mark-word { display: flex; align-items: baseline; }
    .brand-mark-word > span { font-weight: 900; font-size: 26px; letter-spacing: 3px; line-height: 1; color: #fff; }
    .brand-mark-word > span:last-child { color: #f5b800; }
    .header-label { font-size: .72rem; font-weight: 500; opacity: .75; margin-left: .5rem; white-space: nowrap; }
    .nav-toggle { background: none; border: none; color: #fff; font-size: 1.2rem; padding: 8px; border-radius: 8px; transition: background .2s; }
    .nav-toggle:hover { background: rgba(255,255,255,.12); }
    .header-right { display: flex; align-items: center; gap: .6rem; flex-shrink: 0; }
    .header-logout { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 8px; padding: 6px 12px; font-size: .75rem; font-weight: 600; transition: background .2s; }
    .header-logout:hover { background: rgba(255,255,255,.22); }

    /* ═══════════════ SIDEBAR ═══════════════ */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
      background: linear-gradient(170deg, #001a4d 0%, var(--primary) 100%);
      color: #fff; z-index: 1100; display: flex; flex-direction: column;
      transition: transform .28s var(--ease); overflow-y: auto; scrollbar-width: thin;
    }
    .sidebar-header { padding: 1rem 1rem .6rem; border-bottom: 1px solid rgba(255,255,255,.12); }
    .sidebar-tagline { font-size: .65rem; color: rgba(255,255,255,.55); margin-top: 3px; }
    .sidebar-club { padding: .9rem 1rem; border-bottom: 1px solid rgba(255,255,255,.1); text-align: center; }
    .sidebar-club-badge { width: 64px; height: 64px; border-radius: 12px; border: 3px solid rgba(255,255,255,.3); object-fit: contain; background: rgba(255,255,255,.08); margin-bottom: .4rem; }
    .sidebar-club-name { font-size: .9rem; font-weight: 800; line-height: 1.2; }
    .sidebar-club-cat { font-size: .7rem; color: rgba(255,255,255,.6); margin-top: 2px; }
    .sidebar-verified { background: #1877f2; font-size: .65rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; display: inline-block; margin-top: 4px; }
    .sidebar-token-widget {
      margin: .65rem 1rem; padding: .65rem .85rem; border-radius: 10px;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
      cursor: pointer; text-align: center; transition: background .2s, transform .2s;
    }
    .sidebar-token-widget:hover { background: rgba(255,255,255,.18); transform: translateY(-1px); }
    .sidebar-token-widget.low { border-color: #f59e0b; }
    .sidebar-token-widget.empty { border-color: #ef4444; }
    .sidebar-token-balance { font-size: 1.4rem; font-weight: 900; color: var(--accent); font-family: var(--mono); }
    .sidebar-token-label { font-size: .65rem; color: rgba(255,255,255,.6); text-transform: uppercase; letter-spacing: .5px; }
    .sidebar-token-locked { font-size: .68rem; color: rgba(255,200,100,.85); margin-top: 2px; }
    .sidebar-token-topup { font-size: .72rem; color: var(--accent); font-weight: 700; display: block; margin-top: 3px; }
    .sidebar-nav { flex: 1; padding: .5rem 0; }
    .sidebar-nav-item {
      display: flex; align-items: center; gap: .65rem; padding: clamp(.55rem, .9vw, .7rem) clamp(.85rem, 1.5vw, 1.2rem);
      color: rgba(255,255,255,.78); font-size: clamp(.78rem, .9vw, .86rem); font-weight: 600;
      cursor: pointer; transition: background .18s, color .18s; border-left: 3px solid transparent; user-select: none;
    }
    .sidebar-nav-item:hover { background: rgba(255,255,255,.1); color: #fff; }
    .sidebar-nav-item.active { background: rgba(255,255,255,.15); color: #fff; border-left-color: var(--accent); }
    .sidebar-nav-item i { width: 16px; text-align: center; font-size: .88rem; }
    .notif-badge { background: #ef4444; color: #fff; border-radius: 999px; font-size: .62rem; font-weight: 800; padding: 0 6px; margin-left: auto; min-width: 18px; text-align: center; line-height: 18px; }
    .sidebar-footer { padding: .75rem 1rem; font-size: .65rem; color: rgba(255,255,255,.35); border-top: 1px solid rgba(255,255,255,.08); }
    .nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1050; backdrop-filter: blur(2px); }
    .nav-overlay.active { display: block; }

    /* ═══════════════ LAYOUT ═══════════════ */
    .main-content { margin-left: 0; padding-top: var(--header-h); min-height: 100vh; }
    .tab-bar {
      background: #fff; border-bottom: 1px solid var(--border); padding: 0 clamp(.5rem, 1.5vw, 1rem);
      display: flex; overflow-x: auto; scrollbar-width: none; position: sticky; top: var(--header-h); z-index: 100;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: clamp(.65rem, 1.1vw, .85rem) clamp(.7rem, 1.4vw, 1rem); font-size: clamp(.72rem, .9vw, .83rem); font-weight: 700;
      color: var(--text-light); background: none; border: none; border-bottom: 3px solid transparent;
      white-space: nowrap; display: flex; align-items: center; gap: .4rem; transition: color .18s, border-color .18s;
    }
    .tab-btn:hover { color: var(--primary); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-count { background: #ef4444; color: #fff; border-radius: 999px; font-size: .6rem; padding: 0 6px; line-height: 16px; }
    .page-inner { max-width: 1200px; margin: 0 auto; width: 100%; padding: clamp(.85rem, 2vw, 1.5rem); position: relative; animation: fadeUp .25s var(--ease); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    @media (min-width: 769px) {
      .sidebar { transform: none; }
      .dashboard-header { left: var(--sidebar-w); }
      .main-content { margin-left: var(--sidebar-w); }
      .nav-toggle, .nav-overlay { display: none !important; }
      .header-logo .brand-mark-word { display: none; }
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); box-shadow: none; }
      .sidebar.open { transform: translateX(0); box-shadow: 8px 0 40px rgba(0,0,0,.35); }
    }

    /* ═══════════════ CARDS & SHARED ═══════════════ */
    .card {
      background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: clamp(.8rem, 1.5vw, 1.25rem) clamp(.9rem, 1.7vw, 1.35rem); margin-bottom: clamp(.65rem, 1.2vw, 1rem); border: 1px solid var(--border);
    }
    .card-title {
      font-size: clamp(.78rem, .92vw, .9rem); font-weight: 800; color: var(--primary); margin-bottom: .8rem;
      display: flex; align-items: center; gap: .45rem; text-transform: uppercase; letter-spacing: .4px;
    }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .68rem; font-weight: 800; letter-spacing: .3px; text-transform: uppercase; }
    .badge-blue { background: #dbeafe; color: #1d4ed8; }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .empty-state { text-align: center; padding: 2rem 1rem; color: var(--text-light); }
    .empty-state i { font-size: 2rem; margin-bottom: .5rem; opacity: .4; display: block; }
    .empty-state div { font-size: .88rem; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
      padding: clamp(.42rem, .8vw, .55rem) clamp(.75rem, 1.4vw, 1.05rem); border-radius: 8px;
      font-size: clamp(.75rem, .88vw, .85rem); font-weight: 700; border: none; transition: all .18s var(--ease);
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(0,74,173,.25); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
    .btn-outline:hover { background: #f0f4ff; }
    .btn-warn-outline { background: #fff; color: #d97706; border: 1.5px solid #f59e0b; }
    .btn-warn-outline:hover { background: #fffbeb; }
    .btn-white { background: #fff; color: var(--primary); }
    .btn-ghost { background: #fff; border: 1.5px solid var(--border); color: var(--text-light); }
    .btn-sm { padding: .32rem .7rem; font-size: .75rem; }
    .btn-block { width: 100%; }
    .form-group { margin-bottom: .8rem; }
    .form-group label { display: block; font-size: .75rem; font-weight: 700; color: var(--text-light); margin-bottom: .3rem; text-transform: uppercase; letter-spacing: .3px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: .55rem .8rem; border: 1.5px solid var(--border); border-radius: 8px; font-size: .86rem; outline: none; background: #fff; transition: border-color .18s, box-shadow .18s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .btn-row { display: flex; gap: .5rem; flex-wrap: wrap; }

    /* ═══════════════ PROFILE ═══════════════ */
    .profile-section { display: grid; grid-template-columns: 1fr; gap: clamp(.85rem, 2vw, 1.5rem); align-items: start; }
    @media (min-width: 600px) { .profile-section { grid-template-columns: 200px 1fr; } }
    .club-badge-wrap { width: 145px; height: 145px; background: #f8fafc; border-radius: 14px; border: 3px solid var(--primary); display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0 auto; box-shadow: 0 6px 20px rgba(0,74,173,.15); }
    .club-badge-img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .profile-badge-meta { text-align: center; margin-top: .6rem; }
    .profile-id-on-badge { font-family: var(--mono); font-size: .65rem; color: var(--text-light); font-weight: 700; letter-spacing: .5px; }
    .profile-complete-bar { height: 5px; background: #e2e8f0; border-radius: 3px; margin: .35rem 0; overflow: hidden; }
    .profile-complete-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--success)); border-radius: 3px; transition: width .6s var(--ease); }
    .profile-completion-pct { font-size: .68rem; color: var(--text-light); }
    .club-name { font-size: clamp(1.15rem, 2.2vw, 1.55rem); font-weight: 900; color: var(--primary); line-height: 1.1; }
    .club-nick { font-size: .85rem; color: var(--text-light); font-style: italic; margin-top: 2px; }
    .verified-tick { background: #1877f2; color: #fff; border-radius: 999px; font-size: .65rem; font-weight: 800; padding: 2px 8px; display: inline-flex; align-items: center; gap: 3px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem 1.25rem; margin-top: .8rem; }
    @media (max-width: 600px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-row { display: grid; grid-template-columns: 130px 1fr; gap: .35rem; align-items: baseline; padding: .3rem 0; border-bottom: 1px solid #f1f5f9; font-size: clamp(.78rem, .95vw, .88rem); }
    .detail-label { font-weight: 700; color: var(--text-light); font-size: .72rem; text-transform: uppercase; letter-spacing: .3px; }
    .detail-value { font-weight: 600; word-break: break-word; }
    .detail-value a { color: var(--primary); text-decoration: none; }
    .detail-value a:hover { text-decoration: underline; }
    .flag-img { width: 20px; height: 15px; object-fit: cover; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
    .sub-label { font-size: .75rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: .3px; }
    .contact-icons-row { display: flex; gap: .65rem; flex-wrap: wrap; margin-top: .5rem; }
    .contact-icon-btn { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem 1rem; border-radius: 8px; font-size: .82rem; font-weight: 700; text-decoration: none; border: 1.5px solid transparent; transition: transform .18s, box-shadow .18s; }
    .contact-icon-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .contact-icon-phone { background: #dcfce7; color: #166534; border-color: #86efac; }
    .contact-icon-whatsapp { background: #dcfce7; color: #166534; border-color: #25d366; }
    .contact-icon-email { background: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }
    .mgmt-section { margin-top: .9rem; }
    .mgmt-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .4rem; }
    .mgmt-role-group { margin-bottom: .75rem; }
    .mgmt-role-title { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--text-light); margin-bottom: .3rem; padding-bottom: .2rem; border-bottom: 1px solid #f0f4f8; }
    .mgmt-person-row { display: flex; align-items: center; gap: .5rem; padding: .35rem 0; }
    .mgmt-pos-chip { background: var(--primary-soft); color: var(--primary); border-radius: 4px; font-size: .68rem; font-weight: 800; padding: 2px 6px; flex-shrink: 0; }
    .mgmt-name { flex: 1; font-size: .82rem; font-weight: 600; }
    .mgmt-edit-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-light); font-size: .7rem; padding: 3px 8px; display: flex; align-items: center; gap: 3px; transition: all .18s; }
    .mgmt-edit-btn:hover { color: var(--primary); border-color: var(--primary); }
    .bio-card { background: #f8fafc; border-radius: 8px; padding: .9rem; border-left: 4px solid var(--primary); }
    .bio-text { font-size: .86rem; color: #374151; line-height: 1.75; }
    .achievement-item { display: flex; align-items: center; gap: .6rem; padding: .45rem 0; border-bottom: 1px solid #f0f4f8; font-size: .82rem; }
    .achievement-icon { color: var(--accent); font-size: 1rem; flex-shrink: 0; }
    .achievement-year { font-size: .7rem; font-weight: 700; color: var(--text-light); background: #f0f4f8; border-radius: 4px; padding: 1px 6px; flex-shrink: 0; }
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .65rem; }
    @media (min-width: 900px) { .metrics-grid { grid-template-columns: repeat(6, 1fr); } }
    .metric-card { background: #fff; border-radius: 10px; padding: .75rem .5rem; text-align: center; border: 1px solid var(--border); border-top: 3px solid var(--primary); transition: transform .18s, box-shadow .18s; }
    .metric-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .metric-val { font-size: 1.6rem; font-weight: 900; color: var(--primary); line-height: 1; font-family: var(--mono); }
    .metric-lbl { font-size: .65rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: .4px; margin-top: 4px; }
    .fixture-card { border: 1px solid var(--border); border-radius: 10px; padding: .8rem; margin-bottom: .65rem; background: #fafbfc; transition: border-color .18s; }
    .fixture-card:hover { border-color: var(--primary); }
    .fixture-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; margin-bottom: .4rem; }
    .fixture-title { font-size: .88rem; font-weight: 800; }
    .fixture-meta { display: flex; flex-wrap: wrap; gap: .4rem .75rem; font-size: .75rem; color: var(--text-light); }

    /* ═══════════════ SQUAD ═══════════════ */
    .squad-banner { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; border: none; }
    .squad-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; }
    @media (min-width: 640px) { .squad-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 960px) { .squad-grid { grid-template-columns: repeat(4, 1fr); } }
    .sq-card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: .85rem .6rem .75rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: border-color .18s, box-shadow .18s, transform .18s; position: relative; overflow: hidden; content-visibility: auto; contain-intrinsic-size: 150px; }
    .sq-card:hover { border-color: var(--primary); box-shadow: 0 6px 20px rgba(0,74,173,.15); transform: translateY(-2px); }
    .sq-avatar-wrap { position: relative; margin-bottom: .45rem; }
    .sq-jersey-badge { position: absolute; bottom: -4px; right: -4px; background: var(--primary); color: #fff; border-radius: 50%; width: 19px; height: 19px; font-size: .58rem; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; line-height: 1; }
    .sq-name { font-size: .76rem; font-weight: 800; text-align: center; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; margin-bottom: .22rem; padding: 0 2px; }
    .sq-pos-pill { font-size: .62rem; font-weight: 900; border-radius: 5px; padding: .1rem .45rem; margin-bottom: .28rem; letter-spacing: .2px; text-transform: uppercase; }
    .sq-meta-row { display: flex; align-items: center; justify-content: center; gap: .3rem; margin-bottom: .3rem; }
    .sq-flag { width: 15px; height: 11px; object-fit: cover; border-radius: 2px; vertical-align: middle; }
    .sq-age { font-size: .62rem; color: var(--muted); font-weight: 700; }
    .sq-status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .sq-stats-row { display: flex; gap: .22rem; flex-wrap: wrap; justify-content: center; margin-top: .2rem; }

      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
      return html`
        <div class="toast-container" aria-live="polite">
          ${toasts.map(t => html`
            <div key=${t.id} class=${'toast toast-' + t.type} role="status" onClick=${() => removeToast(t.id)}>
              <i class=${'fas ' + (icons[t.type] || icons.info)}></i>${t.msg}
            </div>`)}
        </div>`;
    }

    function BrandMark() {
      return html`<div class="brand-mark-word"><span>Ene</span><span>ȷı</span><span>Stats</span></div>`;
    }

    function MgmtEditModal({ person, onSave, onDelete, onClose }) {
      const [pos, setPos] = useState(person ? person.position : MGMT_POSITIONS[0]);
      const [name, setName] = useState(person ? person.name : '');
      const submit = () => { if (name.trim()) onSave({ position: pos, name: name.trim() }); };
      return html`
        <div class="modal-overlay" onClick=${e => e.target === e.currentTarget && onClose()}>
          <div class="modal-box" style="max-width:400px;" role="dialog" aria-modal="true">
            <div class="modal-header">
              <h3><i class="fas fa-user-edit"></i> ${person ? 'Edit' : 'Add'} Personnel</h3>
              <button class="modal-close" aria-label="Close" onClick=${onClose}><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label>Position / Role</label>
                <select value=${pos} onChange=${e => setPos(e.target.value)}>
                  ${MGMT_POSITIONS.map(p => html`<option key=${p} value=${p}>${p}</option>`)}
                </select>
              </div>
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" value=${name} onInput=${e => setName(e.target.value)} onKeyDown=${e => e.key === 'Enter' && submit()} placeholder="Enter full name..." />
              </div>
              <div class="btn-row">
                <button class="btn btn-primary" style="flex:1;" onClick=${submit} disabled=${!name.trim()}>
                  <i class="fas fa-check"></i> ${person ? 'Save' : 'Add'}
                </button>
                ${person && html`<button class="btn btn-danger" aria-label="Delete" onClick=${onDelete}><i class="fas fa-trash"></i></button>`}
                <button class="btn btn-outline" onClick=${onClose}>Cancel</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    /* ═══════════════ PROFILE TAB ═══════════════ */
    function ProfileTab({ club, summaryStats, matchData, achievements, managementTeam, onAddMgmt, onEditMgmt, onViewMatchCentre, clubId, badgeUrl }) {
      const completeness = useMemo(() => {
        if (!club) return 0;
        const fields = [club.club_name, club.founded_year || club.founded, club.country, club.home_ground || club.stadium, club.phone || club.club_phone, club.email || club.club_email, club.bio, club.photo_url || club.badge_url || club.logo || club.photo, club.club_category || club.category || club.club_level];
        return Math.round((fields.filter(Boolean).length / fields.length) * 100);
      }, [club]);

      const groups = useMemo(() => {
        const isCoach = p => COACH_POSITIONS.includes(p.position);
        return {
          directors: managementTeam.filter(m => m.position === 'Director'),
          gms: managementTeam.filter(m => m.position === 'General Manager'),
          tms: managementTeam.filter(m => m.position === 'Team Manager'),
          coaches: managementTeam.filter(isCoach),
          others: managementTeam.filter(m => !['Director', 'General Manager', 'Team Manager'].includes(m.position) && !isCoach(m)),
        };
      }, [managementTeam]);

      const renderMgmt = (list, chipFn) => list.map((p, i) => html`
        <div key=${i} class="mgmt-person-row">
          <span class="mgmt-pos-chip">${chipFn(p)}</span>
          <span class="mgmt-name">${p.name}</span>
          <button class="mgmt-edit-btn" aria-label=${'Edit ' + p.name} onClick=${() => onEditMgmt(managementTeam.indexOf(p))}><i class="fas fa-pen"></i></button>
        </div>`);

      const founded = club?.founded_year || club?.founded || club?.year_established;
      const flag = getFlagUrl(club?.country);
      const s = summaryStats || {};
      const metrics = [
        ['Matches', s.matchesPlayed || s.matches_played || 0],
        ['Wins', s.wins || 0],
        ['Draws', s.draws || 0],
        ['Losses', s.losses || 0],
        ['Goals For', s.goalsFor || s.goals_for || 0],
        ['Clean Sheets', s.cleanSheets || s.clean_sheets || 0],
      ];
      const Row = (label, value) => html`<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-value">${value}</span></div>`;

      return html`
        <div>
          <div class="card">
            <div class="card-title"><i class="fas fa-shield-halved"></i> Club Profile</div>
            <div class="profile-section">
              <div>
                <div class="club-badge-wrap"><img class="club-badge-img" src=${badgeUrl || BADGE_FALLBACK} alt=${club?.club_name || 'Club'} decoding="async" onError=${onImgFallback} /></div>
                <div class="profile-badge-meta">
                  <div class="profile-id-on-badge">${clubId}</div>
                  <div class="profile-complete-bar"><div class="profile-complete-fill" style=${'width:' + completeness + '%;'}></div></div>
                  <div class="profile-completion-pct">${completeness}% complete</div>
                  <div style="margin-top:.4rem;">
                    <span class="badge badge-blue">${club?.club_category || '—'}</span>
                    ${club?.is_verified ? html`<span class="verified-tick" style="margin-left:4px;"><i class="fas fa-check"></i> Verified</span>` : ''}
                  </div>
                </div>
              </div>
              <div>
                <div class="club-name">${club?.club_name || club?.name || 'Club'}</div>
                ${club?.nickname ? html`<div class="club-nick">"${club.nickname}"</div>` : ''}
                <div class="detail-grid">
                  ${Row('Club ID', html`<span style="font-family:var(--mono);font-size:.78rem;">${clubId}</span>`)}
                  ${founded ? Row('Founded', founded) : ''}
                  ${club?.country ? Row('Country', html`${flag ? html`<img src=${flag} class="flag-img" alt="" onError=${hideOnError} />` : ''}${club.country}`) : ''}
                  ${(club?.home_ground || club?.stadium) ? Row('Home Ground', club.home_ground || club.stadium) : ''}
                  ${(club?.league || club?.division) ? Row('League / Division', club.league || club.division) : ''}
                  ${(club?.is_registered && club?.cac_number) ? Row('CAC Number', club.cac_number) : ''}
                  ${club?.state ? Row('State', club.state) : ''}
                  ${club?.city ? Row('City / District', club.city) : ''}
                  ${club?.lga ? Row('LGA / Local Area', club.lga) : ''}
                  ${club?.website ? Row('Website', html`<a href=${club.website} target="_blank" rel="noopener noreferrer">${club.website}</a>`) : ''}
                  ${club?.club_email ? Row('Club Email', club.club_email) : ''}
                </div>

                <div style="margin-top:.9rem;">
                  <div class="sub-label" style="margin-bottom:.4rem;">Contact</div>
                  <div class="contact-icons-row">
                    ${club?.phone ? html`<a href=${'tel:' + club.phone} class="contact-icon-btn contact-icon-phone"><i class="fas fa-phone"></i> ${club.phone}</a>` : ''}
                    ${(club?.whatsapp || club?.phone) ? html`<a href=${'https://wa.me/' + (club.whatsapp || club.phone).replace(/[^0-9]/g, '')} target="_blank" rel="noopener noreferrer" class="contact-icon-btn contact-icon-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>` : ''}
                    ${club?.email ? html`<a href=${'mailto:' + club.email} class="contact-icon-btn contact-icon-email"><i class="fas fa-envelope"></i> ${club.email}</a>` : ''}
                  </div>
                </div>

                <div class="mgmt-section">
                  <div class="mgmt-head">
                    <div class="sub-label">Management Team</div>
                    <button class="btn btn-sm btn-outline" onClick=${onAddMgmt}><i class="fas fa-plus"></i> Add</button>
                  </div>
                  ${managementTeam.length === 0
                    ? html`<div style="font-size:.82rem;color:var(--text-light);padding:.5rem 0;">No management personnel added yet</div>`
                    : html`
                      ${groups.directors.length > 0 && html`<div class="mgmt-role-group"><div class="mgmt-role-title">Directors</div>${renderMgmt(groups.directors, p => p.position)}</div>`}
                      ${groups.gms.length > 0 && html`<div class="mgmt-role-group"><div class="mgmt-role-title">General Manager</div>${renderMgmt(groups.gms, () => 'GM')}</div>`}
                      ${groups.tms.length > 0 && html`<div class="mgmt-role-group"><div class="mgmt-role-title">Team Manager</div>${renderMgmt(groups.tms, () => 'TM')}</div>`}
                      ${groups.coaches.length > 0 && html`<div class="mgmt-role-group"><div class="mgmt-role-title">Coaching Staff</div>${renderMgmt(groups.coaches, p => p.position.split(' ')[0])}</div>`}
                      ${groups.others.length > 0 && html`<div class="mgmt-role-group"><div class="mgmt-role-title">Other Staff</div>${renderMgmt(groups.others, p => p.position)}</div>`}
                    `}
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><i class="fas fa-chart-bar"></i> Club Performance Metrics</div>
            <div class="metrics-grid">
              ${metrics.map(([label, val]) => html`<div key=${label} class="metric-card"><div class="metric-val">${val}</div><div class="metric-lbl">${label}</div></div>`)}
            </div>
          </div>

          <div class="card">
            <div class="card-title" style="justify-content:space-between;">
              <span><i class="fas fa-history"></i> Recent Match Results</span>
              <button class="btn btn-sm btn-outline" onClick=${onViewMatchCentre}>View All</button>
            </div>
            ${matchData.length === 0
              ? html`<div class="empty-state"><i class="fas fa-futbol"></i><div>No results yet</div></div>`
              : matchData.slice(0, 5).map(m => html`
                <div class="fixture-card" key=${m._id || m.id || (m.date + m.home_team)}>
                  <div class="fixture-top">
                    <span class="fixture-title">${m.home_team || 'Home'} ${m.home_score ?? '—'} – ${m.away_score ?? '—'} ${m.away_team || 'Away'}</span>
                    <span class=${'badge ' + (m.result === 'W' ? 'badge-green' : m.result === 'L' ? 'badge-red' : 'badge-yellow')}>${m.result || 'D'}</span>
                  </div>
                  <div class="fixture-meta">
                    ${(m.date || m.match_date) ? html`<span><i class="fas fa-calendar"></i> ${fmtDate(m.date || m.match_date)}</span>` : ''}
                    ${m.competition ? html`<span><i class="fas fa-trophy"></i> ${m.competition}</span>` : ''}
                  </div>
                </div>`)}
          </div>

          <div class="card">
            <div class="card-title"><i class="fas fa-book-open"></i> Club History & Bio</div>
            ${club?.bio
              ? html`<div class="bio-card"><p class="bio-text">${club.bio}</p></div>`
              : html`<div class="empty-state" style="padding:1rem;"><i class="fas fa-book"></i><div>No club bio added yet</div></div>`}
          </div>

          <div class="card">
            <div class="card-title"><i class="fas fa-trophy"></i> Trophies & Achievements</div>
            ${achievements.length === 0
              ? html`<div class="empty-state" style="padding:1rem;"><i class="fas fa-medal"></i><div>No achievements recorded yet</div></div>`
              : achievements.map((a, i) => html`
                <div key=${i} class="achievement-item">
                  <span class="achievement-icon"><i class="fas fa-trophy"></i></span>
                  <span style="flex:1;font-weight:600;">${a.title || a.name || a}</span>
                  ${a.year ? html`<span class="achievement-year">${a.year}</span>` : ''}
                </div>`)}
          </div>
        </div>`;
    }

    /* ═══════════════ SQUAD TAB ═══════════════ */
    function resolvePhoto(pl) {
      return pl.photo || pl.photo_url || pl.profile_photo || pl.profile_image || pl.avatar || pl.image || pl.image_url || pl.badge_url || pl.cloudinary_url || pl.headshot || pl.picture || '';
    }
    function playerSVG(name, size) {
      const init = (name || 'P').trim().charAt(0).toUpperCase();
      const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><circle cx='" + size / 2 + "' cy='" + size / 2 + "' r='" + size / 2 + "' fill='#1a3de4'/><text x='" + size / 2 + "' y='" + size * 0.63 + "' text-anchor='middle' font-size='" + size * 0.37 + "' font-weight='bold' fill='white' font-family='Arial,sans-serif'>" + init + '</text></svg>';
      return 'data:image/svg+xml,' + encodeURIComponent(svg);
    }
    function SquadAvatar({ pl, size }) {
      const name = playerName(pl);
      const fb = playerSVG(name, size);
      const border = size >= 56 ? '2px solid rgba(255,255,255,.35)' : '1.5px solid #e2e8f0';
      return html`<img src=${resolvePhoto(pl) || fb} alt=${name} loading="lazy" decoding="async"
        style=${'width:' + size + 'px;height:' + size + 'px;border-radius:50%;object-fit:cover;border:' + border + ';background:#eef2ff;flex-shrink:0;'}
        onError=${e => { const t = e.currentTarget; if (t.src !== fb) { t.onerror = null; t.src = fb; } }} />`;
    }

    function getStatsConfig(pos) {
      if (pos === 'GK') return [{ k: 'saves', l: 'Saves' }, { k: 'goals_conceded', l: 'Goals Conceded' }, { k: 'clean_sheets', l: 'Clean Sheets' }, { k: 'penalty_saves', l: 'Pen. Saves' }];
      if (DEFENDER_POS.includes(pos)) return [{ k: 'tackles_won', l: 'Tackles Won' }, { k: 'interceptions', l: 'Interceptions' }, { k: 'clearances', l: 'Clearances' }, { k: 'aerial_duels_won', l: 'Aerial Duels Won' }];
      if (MIDFIELD_POS.includes(pos)) return [{ k: 'successful_short_passes', l: 'Passes' }, { k: 'assists', l: 'Assists' }, { k: 'successful_dribbles', l: 'Dribbles' }, { k: 'key_passes', l: 'Key Passes' }];
      return [{ k: 'goals', l: 'Goals' }, { k: 'assists', l: 'Assists' }, { k: 'shots_on_target', l: 'Shots OT' }, { k: 'successful_dribbles', l: 'Dribbles' }];
    }

    function PlayerDetailModal({ player, onClose }) {
      if (!player) return null;
      const sp = player;
      const dobAge = sp.dob_visible !== false ? calcAge(sp.dob || sp.date_of_birth) : null;
      const ageStr = dobAge != null ? dobAge + 'y' : '—';
      const natFlag = getFlagUrl(sp.nationality);
      const statusActive = (sp.status || 'active').toLowerCase() === 'active';
      const pos = (sp.position || '—').toUpperCase();
      const posCol = POS_COLORS[pos] || '#64748b';
      const st = sp.stats || sp.season_stats || {};
      const statsToShow = getStatsConfig(pos);
      const hasStats = statsToShow.some(s => st[s.k] != null);
      const rating = sp.rating || sp.overall_rating;
      const cells = [
        { label: 'Level/Category', val: sp.category || sp.player_level || sp.level || '—' },
        { label: 'Nationality', val: html`${natFlag ? html`<img src=${natFlag} class="sq-flag" alt="" onError=${hideOnError} />` : ''}${sp.nationality || '—'}` },
        { label: 'Age', val: ageStr },
        { label: 'Status', val: html`<span style=${'width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;background:' + (statusActive ? '#22c55e' : '#ef4444') + ';'}></span> ${cap(sp.status || 'Active')}` },
        { label: 'Playing Category', val: sp.playing_category || sp.club_category || sp.club_level || '—' },
        { label: 'Contract', val: sp.contract_status || sp.contract || sp.current_contract || '—' },
        { label: 'Height', val: sp.height ? sp.height + 'cm' : '—' },
        { label: 'Preferred Foot', val: sp.preferred_foot || sp.foot || '—' },
      ];
      const ratingBg = rating >= 7 ? '#22c55e' : rating >= 5 ? '#f59e0b' : '#ef4444';

      return html`
        <div class="modal-overlay" onClick=${onClose}>
          <div class="modal-box" style="max-width:380px;padding:0;overflow:hidden;border-radius:16px;" role="dialog" aria-modal="true" onClick=${e => e.stopPropagation()}>
            <div class="sq-modal-header-band">
              <${SquadAvatar} pl=${sp} size=${56} />
              <div style="flex:1;min-width:0;">
                <div style="font-size:1.05rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${playerName(sp)}</div>
                <div style="display:flex;align-items:center;gap:.4rem;margin-top:.3rem;flex-wrap:wrap;">
                  <span style=${'background:' + posCol + ';color:#fff;border-radius:5px;font-size:.7rem;font-weight:900;padding:.15rem .5rem;'}>${sp.position || '—'}</span>
                  ${sp.jersey_number != null ? html`<span style="background:rgba(255,255,255,.2);border-radius:5px;font-size:.7rem;font-weight:800;padding:.15rem .45rem;">#${sp.jersey_number}</span>` : ''}
                </div>
                ${rating ? html`<div style=${'display:inline-flex;align-items:center;gap:.3rem;margin-top:.35rem;color:#fff;border-radius:5px;padding:.15rem .5rem;font-size:.72rem;font-weight:900;background:' + ratingBg + ';'}><i class="fas fa-star" style="font-size:.6rem;"></i> ${rating}</div>` : ''}
              </div>
              <button class="modal-close" style="color:#fff;opacity:.8;align-self:flex-start;" aria-label="Close" onClick=${onClose}><i class="fas fa-times"></i></button>
            </div>
            <div class="sq-modal-info-grid">
              ${cells.map(({ label, val }) => html`<div key=${label} class="sq-info-cell"><div class="sq-info-label">${label}</div><div class="sq-info-value">${val}</div></div>`)}
            </div>
            ${hasStats && html`
              <div class="sq-modal-stats-section">
                <div class="sq-modal-stats-title"><i class="fas fa-chart-bar"></i> Season Stats</div>
                <div class="sq-modal-stat-grid">
                  ${statsToShow.map(s => html`<div key=${s.k} class="sq-modal-stat-item"><div class="sq-modal-stat-val">${st[s.k] ?? '—'}</div><div class="sq-modal-stat-lbl">${s.l}</div></div>`)}
                </div>
              </div>`}
          </div>
        </div>`;
    }

    function SquadPlayerCard({ pl, onClick }) {
      const pos = (pl.position || '').toUpperCase();
      const posCol = POS_COLORS[pos] || '#64748b';
      const flagUrl = getFlagUrl(pl.nationality);
      const age = pl.dob_visible !== false ? calcAge(pl.dob || pl.date_of_birth) : null;
      const st = pl.stats || pl.season_stats || {};
      let pills;
      if (pos === 'GK') pills = [{ l: 'Saves', v: st.saves ?? '—' }, { l: 'Conceded', v: st.goals_conceded ?? '—' }];
      else if (DEFENDER_POS.includes(pos)) pills = [{ l: 'Tackles', v: st.tackles_won ?? '—' }, { l: 'Clearances', v: st.clearances ?? '—' }];
      else if (MIDFIELD_POS.includes(pos)) pills = [{ l: 'Passes', v: st.successful_short_passes ?? '—' }, { l: 'Assists', v: st.assists ?? '—' }];
      else pills = [{ l: 'Goals', v: st.goals ?? '—' }, { l: 'Assists', v: st.assists ?? '—' }];
      const visiblePills = pills.filter(s => s.v !== '—');
      const isActive = (pl.status || 'active').toLowerCase() === 'active';

      return html`
        <div class="sq-card" onClick=${onClick} role="button" tabindex="0" onKeyDown=${e => (e.key === 'Enter' || e.key === ' ') && onClick()}>
          <div class="sq-avatar-wrap">
            <${SquadAvatar} pl=${pl} size=${36} />
            ${pl.jersey_number != null ? html`<div class="sq-jersey-badge">${pl.jersey_number}</div>` : ''}
          </div>
          <div class="sq-name">${playerName(pl)}</div>
          <div class="sq-pos-pill" style=${'background:' + posCol + '18;color:' + posCol + ';'}>${pl.position || '—'}</div>
          <div class="sq-meta-row">
            ${flagUrl ? html`<img src=${flagUrl} class="sq-flag" alt=${pl.nationality || ''} title=${pl.nationality || ''} loading="lazy" onError=${hideOnError} />` : ''}
            ${age != null ? html`<span class="sq-age">${age}y</span>` : ''}
            <span class="sq-status-dot" style=${'background:' + (isActive ? '#22c55e' : '#94a3b8') + ';'} title=${isActive ? 'Active' : 'Inactive'}></span>
          </div>
          ${visiblePills.length ? html`<div class="sq-stats-row">${visiblePills.map(s => html`<span key=${s.l} class="sq-stat-pill">${s.l}: ${s.v}</span>`)}</div>` : ''}
        </div>`;
    }

    function SquadTab({ squadPlayers, clubId, onGoStats, onGoMatchRequests }) {
      const [selected, setSelected] = useState(null);
      const others = useMemo(() => squadPlayers.filter(p => !KNOWN_POSITIONS.includes((p.position || '').toUpperCase().trim())), [squadPlayers]);
      const keyOf = (p) => p._id || p.player_id || p.name;

      const Group = (key, label, icon, color, players) => html`
        <div key=${key} class="card">
          <div class="sq-group-title">
            <span class="sq-group-icon" style=${'background:' + color + '18;'}><i class=${'fas ' + icon} style=${'color:' + color + ';'}></i></span>
            <span style="font-weight:800;font-size:.92rem;">${label}</span>
            <span class="sq-group-count">${players.length}</span>
          </div>
          <div class="squad-grid">${players.map(pl => html`<${SquadPlayerCard} key=${keyOf(pl)} pl=${pl} onClick=${() => setSelected(pl)} />`)}</div>
        </div>`;

      return html`
        <div>
          ${selected && html`<${PlayerDetailModal} player=${selected} onClose=${() => setSelected(null)} />`}
          <div class="card squad-banner">
            <div style="font-size:1rem;font-weight:900;margin-bottom:.25rem;"><i class="fas fa-users"></i> Squad — ${squadPlayers.length} Player${squadPlayers.length !== 1 ? 's' : ''}</div>
            <div style="font-size:.82rem;opacity:.9;">Club ID: ${clubId}. All registered, affiliated and contracted players appear below.</div>
          </div>
          ${squadPlayers.length === 0 && html`
            <div class="card empty-state">
              <i class="fas fa-users"></i>
              <div style="font-weight:700;margin-bottom:.4rem;color:#374151;">No squad members found</div>
              <div style="font-size:.8rem;">Players registered or affiliated with your club will automatically appear here.</div>
            </div>`}
          ${SQUAD_GROUPS.map(g => {
            const gp = squadPlayers.filter(p => g.positions.includes((p.position || '').toUpperCase().trim()));
            return gp.length ? Group(g.label, g.label, g.icon, g.color, gp) : null;
          })}
          ${others.length > 0 && Group('other', 'Other', 'fa-user-circle', '#6b7280', others)}
          <div class="btn-row" style="margin-top:.5rem;">
            <button class="btn btn-primary" onClick=${onGoStats}><i class="fas fa-satellite-dish"></i> Stats Tracking</button>
            <button class="btn btn-outline" onClick=${onGoMatchRequests}><i class="fas fa-handshake"></i> Match Requests</button>
          </div>
        </div>`;
    }

    /* ═══════════════ TOKENS TAB ═══════════════ */
    function TokensTab({ tokens, tokenPackages, transactions, onBuy, onFlutterwave, selectedTokenPkg, setSelectedTokenPkg }) {
      return html`
        <div>
          <div class="pw-sub-card">
            <div class="pw-sub-card-title"><i class="fas fa-crown"></i> Club Subscription Plans</div>
            <div class="pw-sub-card-desc">Get a club subscription for premium features, verified badge, and priority placement.</div>
            <button class="btn btn-white" onClick=${() => onBuy('SUBSCRIPTION')}><i class="fas fa-crown"></i> View Subscription Plans</button>

    function NotificationsTab({ notifications, onMarkRead, onMarkAllRead, onDelete }) {
      const [filter, setFilter] = useState('all');
      const [expanded, setExpanded] = useState(null);
      const unread = useMemo(() => notifications.filter(n => !n.read).length, [notifications]);

      return html`
        <div class="card">
          <div class="card-title" style="justify-content:space-between;">
            <span><i class="fas fa-bell"></i> Notifications ${unread > 0 ? html`<span class="unread-pill">${unread}</span>` : ''}</span>

          </div>
          <div class="filter-bar">
            ${NOTIF_FILTERS.map(f => html`
              <button key=${f} class=${'filter-btn' + (filter === f ? ' active' : '')} onClick=${() => setFilter(f)}>
                ${f === 'all' ? 'All' : f.split('_').map(cap).join(' ')}
              </button>`)}
          </div>
          ${filtered.length === 0
            ? html`<div class="empty-state"><i class="fas fa-bell-slash"></i><div>No notifications</div></div>`

              const nid = n._id || n.id;

              return html`
                <div key=${nid} class=${'notif-item' + (!n.read ? ' unread' : '')} onClick=${() => { setExpanded(isEx ? null : nid); if (!n.read) onMarkRead(nid); }}>

                </div>`;
            })}

    }

        try {

            apiCall('/club/' + uid + '/profile'),
            apiCall('/club/' + uid + '/stats/summary'),
            apiCall('/club/' + uid + '/matches'),
            apiCall('/club/' + uid + '/upcoming-fixtures'),
            apiCall('/club/' + uid + '/tokens'),

            apiCall('/club/' + uid + '/achievements'),

            apiCall('/competitions'),
            apiCall('/token/costs'),

            apiCall('/club/' + uid + '/match-requests/sent'),
            apiCall('/club/' + uid + '/match-requests/received'),
            apiCall('/club/' + uid + '/squad'),
            apiCall('/public/countries'),
          ]);
          const v = (i) => results[i].status === 'fulfilled' ? results[i].value : null;
          const profile = v(0), stats = v(1), matches = v(2), fx = v(3), tk = v(4), notif = v(5), ach = v(6), tx = v(7), comp = v(8), costs = v(9), stReq = v(10), mrSent = v(11), mrRecv = v(12), squad = v(13), ctry = v(14);

          if (profile) {
            setClub(profile);
            setManagementTeam(Array.isArray(profile.management) ? profile.management : []);
            if (profile.youtube_videos) setYtVideos(profile.youtube_videos);
          }
          if (stats) {
            setSeasonStats(stats.season_stats || stats.stats || {});
            setSummaryStats(stats.summary_stats || stats.summary || {});
          }
          if (matches) setMatchData(asArray(matches, 'matches'));
          if (fx) setFixtures(asArray(fx, 'fixtures'));
          if (tk) setTokens(tk);
          if (notif) setNotifications(Array.isArray(notif) ? notif : []);
          if (ach) setAchievements(Array.isArray(ach) ? ach : []);
          if (tx) setTransactions(asArray(tx, 'transactions'));
          if (comp) setCompetitions(asArray(comp, 'competitions'));
          if (costs && costs.packages) setTokenPackages(costs.packages);
          if (costs) setTokenCosts(costs.costs || costs);
          if (ctry) setCountries(asArray(ctry, 'countries'));
          if (stReq) setStatsRequests(asArray(stReq, 'requests'));
          if (mrSent) setMatchRequests(p => ({ ...p, sent: asArray(mrSent, 'requests') }));
          if (mrRecv) setMatchRequests(p => ({ ...p, received: asArray(mrRecv, 'requests') }));
          if (squad) setSquadPlayers(asArray(squad, 'squad'));
          try { const stored = localStorage.getItem(MEDIA_PHOTOS_KEY); if (stored) setMediaPhotos(JSON.parse(stored)); } catch (_) {}
        } catch (_) { addToast('Failed to load some dashboard data', 'warning'); }
        finally { setLoading(false); }
      }

      /* ── Auth check ── */
      useEffect(() => {
        (async () => {
          try {
            const me = await apiCall('/auth/me');
            if (me && (me.club_id || me.user_id || me._id) && (me.role === 'club' || me.role === 'Club')) {
              await loadDashboard(me.club_id || me.user_id || me._id);
              setAuthState('authenticated');
            } else {
              window.location.replace('/login');
            }
          } catch (err) {
            if (err.status === 401 || err.status === 403) {
              localStorage.clear(); sessionStorage.clear();
              window.location.replace('/login');
            } else {
              setAuthState('error');
              setLoading(false);
              addToast('Could not connect to server. Please check your connection.', 'error', 8000);
            }
          }
        })();
      }, []);

      /* ── Notification polling (paused while tab hidden) ── */
      useEffect(() => {
        if (authState !== 'authenticated' || !club) return;
        const interval = setInterval(async () => {
          if (document.hidden) return;
          try {
            const d = await apiCall('/club/' + apiId + '/notifications');
            if (d) setNotifications(Array.isArray(d) ? d : []);
          } catch (_) {}
        }, NOTIF_POLL_MS);
        return () => clearInterval(interval);
      }, [authState, club]);

      /* ── Inactivity logout ── */
      useEffect(() => {
        if (authState !== 'authenticated') return;
        let timer;
        const reset = () => { clearTimeout(timer); timer = setTimeout(handleLogout, INACTIVITY_MS); };
        const events = ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'];
        events.forEach(e => window.addEventListener(e, reset, { passive: true }));
        reset();
        activityRef.current = reset;
        return () => { activityRef.current = null; clearTimeout(timer); events.forEach(e => window.removeEventListener(e, reset)); };
      }, [authState, handleLogout]);

      /* ── Pre-warm child iframes once the dashboard is ready ── */
      useEffect(() => {
        if (authState !== 'authenticated') return;
        const warm = () => setWarmIframes(true);
        if ('requestIdleCallback' in window) { const id = requestIdleCallback(warm, { timeout: 1200 }); return () => cancelIdleCallback(id); }
        const t = setTimeout(warm, 400);
        return () => clearTimeout(t);
      }, [authState]);

      /* ── Track visited iframe tabs so they stay mounted ── */
      useEffect(() => {
        if (IFRAME_TABS.some(t => t.id === activeTab)) setVisitedIframes(p => p[activeTab] ? p : { ...p, [activeTab]: true });
      }, [activeTab]);

      /* ── iframe bridge: shared data, viewport, auto-height, activity, refresh ── */
      activeTabRef.current = activeTab;
      const goTab = (tab) => { setActiveTab(tab); setSidebarOpen(false); window.scrollTo({ top: 0 }); };
      const openMatchCentre = (view, sub) => {
        setMcRoute(r => ({ tab: view || 'results', sub: sub || null, nonce: r.nonce + 1 }));
        goTab('match-centre');
      };

      // Single source of truth: both child tabs receive the same payload; they never fetch shared data themselves.
      const initPayload = useMemo(() => ({
        type: 'INIT', clubId, apiId, clubName, club, tokens, tokenCosts, squadPlayers,
        matches: matchData, fixtures, competitions, statsRequests, matchRequests, countries,
        summaryStats, seasonStats, route: mcRoute,
      }), [clubId, apiId, clubName, club, tokens, tokenCosts, squadPlayers, matchData, fixtures, competitions, statsRequests, matchRequests, countries, summaryStats, seasonStats, mcRoute]);

      const postToFrame = useCallback((tabId, msg) => {
        const frame = iframeRefs.current[tabId];
        if (!frame || !frame.contentWindow) return;
        try { frame.contentWindow.postMessage(msg, targetOrigin()); } catch (_) {}
      }, []);
      const postInit = useCallback((tabId) => postToFrame(tabId, initPayload), [postToFrame, initPayload]);

      // Tells the child which slice of its (full-height) frame is on screen, so its overlays can be placed in view.
      const sendViewport = useCallback((tabId, force) => {
        const frame = iframeRefs.current[tabId];
        if (!frame) return;
        const bar = document.querySelector('.tab-bar');
        const headerBottom = HEADER_H + (bar ? bar.offsetHeight : 0);
        const r = frame.getBoundingClientRect();
        const visTop = Math.max(r.top, headerBottom);
        const vp = { type: 'VIEWPORT', top: Math.round(Math.max(0, visTop - r.top)), height: Math.max(240, Math.round(window.innerHeight - visTop)) };
        const key = vp.top + ':' + vp.height;
        if (!force && lastViewportRef.current[tabId] === key) return;
        lastViewportRef.current[tabId] = key;
        postToFrame(tabId, vp);
      }, [postToFrame]);

      const refreshScopes = useCallback(async (scopes) => {
        if (!apiId) return;
        const want = new Set(scopes || []);
        const base = '/club/' + apiId;
        const jobs = [];
        const job = (cond, path, apply) => { if (cond) jobs.push(apiCall(base + path).then(apply).catch(() => null)); };
        job(want.has('tokens'), '/tokens', d => { if (d) setTokens(d); });
        job(want.has('transactions'), '/transactions', d => setTransactions(asArray(d, 'transactions')));
        job(want.has('matches'), '/matches', d => setMatchData(asArray(d, 'matches')));
        job(want.has('summary') || want.has('matches'), '/stats/summary', d => { if (d) { setSeasonStats(d.season_stats || d.stats || {}); setSummaryStats(d.summary_stats || d.summary || {}); } });
        job(want.has('fixtures'), '/upcoming-fixtures', d => setFixtures(asArray(d, 'fixtures')));
        job(want.has('statsRequests'), '/stats-requests', d => setStatsRequests(asArray(d, 'requests')));
        job(want.has('matchRequests'), '/match-requests/sent', d => setMatchRequests(p => ({ ...p, sent: asArray(d, 'requests') })));
        job(want.has('matchRequests'), '/match-requests/received', d => setMatchRequests(p => ({ ...p, received: asArray(d, 'requests') })));
        job(want.has('notifications'), '/notifications', d => setNotifications(Array.isArray(d) ? d : []));
        await Promise.all(jobs);
        IFRAME_TABS.forEach(t => postToFrame(t.id, { type: 'REFRESHED', scopes: Array.from(want) }));
      }, [apiId, postToFrame]);

      // Keep every mounted child tab in sync whenever shared data changes
      useEffect(() => { IFRAME_TABS.forEach(t => iframeRefs.current[t.id] && postInit(t.id)); }, [postInit]);

      // Tab activation: visibility flag, viewport, gentle stale-data refresh, release any child scroll lock
      useEffect(() => {
        if (authState !== 'authenticated') return;
        document.body.style.overflow = '';
        IFRAME_TABS.forEach(t => postToFrame(t.id, { type: 'VISIBILITY', visible: t.id === activeTab }));
        if (IFRAME_TABS.some(t => t.id === activeTab)) {
          sendViewport(activeTab, true);
          if (Date.now() - lastRefreshRef.current > 30000) {
            lastRefreshRef.current = Date.now();
            refreshScopes(['tokens', 'matches', 'fixtures', 'statsRequests', 'matchRequests']);
          }
        }
      }, [activeTab, authState, postToFrame, sendViewport, refreshScopes]);

      // Page scroll / resize drive the child's visible-slice metrics (rAF-throttled)
      useEffect(() => {
        if (authState !== 'authenticated') return;
        let raf = 0;
        const tick = () => { raf = 0; if (IFRAME_TABS.some(t => t.id === activeTab)) sendViewport(activeTab); };
        const on = () => { if (!raf) raf = requestAnimationFrame(tick); };
        window.addEventListener('scroll', on, { passive: true });
        window.addEventListener('resize', on);
        on();
        return () => { if (raf) cancelAnimationFrame(raf); window.removeEventListener('scroll', on); window.removeEventListener('resize', on); };
      }, [authState, activeTab, sendViewport, frameHeights]);
      useEffect(() => () => { document.body.style.overflow = ''; }, []);

      /* ── postMessage bridge from child iframes (same-origin, known frames only) ── */
      useEffect(() => {
        const handler = (e) => {
          if (e.origin !== location.origin) return;
          const d = e.data;
          if (!d || typeof d.type !== 'string') return;
          const ft = IFRAME_TABS.find(t => iframeRefs.current[t.id] && iframeRefs.current[t.id].contentWindow === e.source);
          if (!ft) return;
          const frame = iframeRefs.current[ft.id];
          switch (d.type) {
            case 'REQUEST_INIT':
              postInit(ft.id); sendViewport(ft.id, true);
              postToFrame(ft.id, { type: 'VISIBILITY', visible: ft.id === activeTabRef.current });
              break;
            case 'RESIZE': {
              const hgt = Math.ceil(Number(d.height));
              if (isFinite(hgt) && hgt >= 40) setFrameHeights(p => (p[ft.id] === hgt ? p : { ...p, [ft.id]: hgt }));
              break;
            }
            case 'ACTIVITY': if (activityRef.current) activityRef.current(); break;
            case 'AUTH_EXPIRED': handleLogout(); break;
            case 'TOAST': addToast(String(d.msg || ''), d.level || 'info'); break;
            case 'OPEN_TOKEN_WIZARD':
            case 'TOP_UP_TOKENS': goTab('tokens'); break;
            case 'NAVIGATE':
              if (d.tab === 'match-centre' && (d.view || d.sub)) openMatchCentre(d.view, d.sub);
              else if (d.tab) goTab(d.tab);
              break;
            case 'REFRESH': refreshScopes(Array.isArray(d.scopes) ? d.scopes : []); break;
            case 'MODAL_STATE': document.body.style.overflow = d.open ? 'hidden' : ''; break;
            case 'SCROLL_TOP':
            case 'SCROLL_TO': {
              const bar = document.querySelector('.tab-bar');
              const hb = HEADER_H + (bar ? bar.offsetHeight : 0);
              const r = frame.getBoundingClientRect();
              if (d.type === 'SCROLL_TOP' && r.top >= hb) break;
              const y = d.type === 'SCROLL_TO' ? (Number(d.y) || 0) : 0;
              window.scrollTo({ top: Math.max(0, window.scrollY + r.top + y - hb - 12), behavior: 'smooth' });
              break;
            }
            default: break;
          }
        };
        window.addEventListener('message', handler);
        return () => window.removeEventListener('message', handler);
      }, [addToast, postInit, postToFrame, sendViewport, refreshScopes, handleLogout]);

      /* ── Handlers ── */
      const showTab = (tab) => { setActiveTab(tab); setSidebarOpen(false); window.scrollTo({ top: 0 }); };

      const markNotifRead = async (id) => {
        try { await apiCall('/club/' + apiId + '/notifications/' + id + '/read', { method: 'PATCH' }); } catch (_) {}
        setNotifications(p => p.map(n => (n._id === id || n.id === id) ? { ...n, read: true } : n));
      };
      const markAllRead = async () => {
        try { await apiCall('/club/' + apiId + '/notifications/read-all', { method: 'PATCH' }); } catch (_) {}
        setNotifications(p => p.map(n => ({ ...n, read: true })));
      };
      const deleteNotif = (id) => {
        setNotifications(p => p.filter(n => (n._id || n.id) !== id));
        apiCall('/club/' + apiId + '/notifications/' + id, { method: 'DELETE' }).catch(() => {});
      };

      const handleSaveBadge = async (file, preview) => {
        try {
          const fd = new FormData(); fd.append('photo', file);
          await apiCall('/club/' + apiId + '/logo', { method: 'POST', headers: {}, body: fd });
          setClub(p => ({ ...p, photo_url: preview }));
          addToast('Club badge updated!', 'success');
        } catch (_) { addToast('Failed to upload badge', 'error'); }
      };

      const persistMgmt = async (updated, okMsg, localMsg) => {
        setManagementTeam(updated);
        setMgmtModal({ open: false, target: null });
        try { await apiCall('/club/' + apiId + '/management', { method: 'PUT', body: JSON.stringify({ management: updated }) }); addToast(okMsg, 'success'); }
        catch (_) { addToast(localMsg, 'info'); }
      };
      const handleSaveMgmt = (data) => persistMgmt(
        mgmtModal.target === -1 ? [...managementTeam, data] : managementTeam.map((m, i) => i === mgmtModal.target ? data : m),
        'Management team updated', 'Saved locally');
      const handleDeleteMgmt = () => persistMgmt(managementTeam.filter((_, i) => i !== mgmtModal.target), 'Personnel removed', 'Removed locally');

      const handlePasswordChange = async () => {
        if (!pwForm.current || !pwForm.newpw) { addToast('Fill in all fields', 'warning'); return; }
        if (pwForm.newpw !== pwForm.confirm) { addToast('Passwords do not match', 'error'); return; }
        try {
          await apiCall('/club/' + apiId + '/change-password', { method: 'POST', body: JSON.stringify({ old_password: pwForm.current, new_password: pwForm.newpw }) });
          addToast('Password changed!', 'success');
          setPwForm({ current: '', newpw: '', confirm: '' });
        } catch (e) { addToast((e && e.message) || 'Failed', 'error'); }
      };

      const handleFlutterwavePayment = async (pkg) => {
        try {
          if (typeof window.FlutterwaveCheckout !== 'function') { addToast('Payment module is still loading. Please try again in a moment.', 'warning'); return; }
          const r = await apiCall('/club/' + apiId + '/tokens/topup', { method: 'POST', body: JSON.stringify({ amount: pkg.price, tokens: pkg.tokens, description: pkg.tokens + ' Token purchase', entity: 'club', entity_id: apiId }) });
          if (r && r.public_key) {
            window.FlutterwaveCheckout({
              public_key: r.public_key, tx_ref: r.tx_ref, amount: pkg.price, currency: 'NGN',
              payment_options: 'card,mobilemoney,ussd,banktransfer',
              customer: { email: club?.email || '', phone_number: club?.phone || '', name: clubName },
              customizations: { title: 'EnejiStats Payment', description: pkg.tokens + ' Token purchase', logo: '/static/images/logo.png' },
              callback: async (data) => {
                if (data.status === 'successful') {
                  try {
                    const vr = await apiCall('/club/' + apiId + '/tokens/verify', { method: 'POST', body: JSON.stringify({ transaction_id: data.transaction_id, tx_ref: data.tx_ref }) });
                    if (vr && vr.tokens_credited) { setTokens(p => ({ ...p, balance: (p.balance || 0) + vr.tokens_credited })); addToast(vr.tokens_credited + ' tokens credited!', 'success'); }
                  } catch (_) {}
                }
              },
              onclose: () => {},
            });
          } else addToast('Payment initialization failed', 'error');
        } catch (e) { addToast((e && e.message) || 'Payment failed', 'error'); }
      };

      const handleAddYouTubeVideo = (v) => {
        setYtVideos(p => [...p, v]);
        apiCall('/club/' + apiId + '/media/youtube', { method: 'POST', body: JSON.stringify({ url: v.url, title: v.title }) }).catch(() => {});
        addToast('Video added!', 'success');
      };
      const handleDeleteYtVideo = (ytId) => {
        setYtVideos(p => p.filter(v => (v.youtube_id || v.id) !== ytId));
        apiCall('/club/' + apiId + '/media/youtube/' + ytId, { method: 'DELETE' }).catch(() => {});
      };
      const handleMediaPhotoUpload = (files) => {
        Array.from(files || []).forEach(file => {
          if (!file.type.startsWith('image/')) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            setMediaPhotos(prev => {
              const newTotal = prev.reduce((acc, p) => acc + (p.size || 0), 0) + file.size;
              if (newTotal > MAX_PHOTOS_BYTES) { addToast('10MB photo limit reached', 'error'); return prev; }
              const updated = [...prev, { id: Date.now() + Math.random(), dataUrl: ev.target.result, size: file.size, name: file.name }];
              try { localStorage.setItem(MEDIA_PHOTOS_KEY, JSON.stringify(updated)); } catch (_) {}
              return updated;
            });
          };
          reader.readAsDataURL(file);
        });
      };
      const handleMediaPhotoDelete = (id) => {
        setMediaPhotos(prev => { const u = prev.filter(p => p.id !== id); try { localStorage.setItem(MEDIA_PHOTOS_KEY, JSON.stringify(u)); } catch (_) {} return u; });
      };

      /* ── Render states ── */
      if (authState === 'loading' || loading) return html`
        <div class="screen-center" role="status" aria-live="polite">
          <div class="skeleton-wrap">
            <div class="skeleton" style="height:56px;"></div>
            <div class="skeleton" style="height:140px;"></div>
            <div class="skeleton" style="height:90px;"></div>
          </div>
          <div style="color:var(--text-light);font-weight:600;font-size:.9rem;">Loading Club Dashboard…</div>
        </div>`;

      if (authState === 'error') return html`
        <div class="screen-center">
          <i class="fas fa-exclamation-triangle" style="font-size:2.5rem;color:var(--danger);"></i>
          <div style="font-weight:800;font-size:1.1rem;">Connection Error</div>
          <div style="font-size:.85rem;color:var(--text-light);">Could not connect to the server. Please check your internet connection.</div>
          <button class="btn btn-primary" onClick=${() => window.location.reload()}><i class="fas fa-rotate-right"></i> Retry</button>
        </div>`;

      const mountedIframeTabs = IFRAME_TABS.filter(t => warmIframes || visitedIframes[t.id] || activeTab === t.id);
      const mgmtPerson = mgmtModal.target !== null && mgmtModal.target >= 0 ? managementTeam[mgmtModal.target] : null;

      return html`
        <${ToastContainer} toasts=${toasts} removeToast=${removeToast} />

        ${mgmtModal.open && html`
          <${MgmtEditModal}
            key=${String(mgmtModal.target)}
            person=${mgmtPerson}
            onSave=${handleSaveMgmt}
            onDelete=${handleDeleteMgmt}
            onClose=${() => setMgmtModal({ open: false, target: null })} />`}

        <header class="dashboard-header">
          <button class="nav-toggle" aria-label="Toggle navigation" onClick=${() => setSidebarOpen(p => !p)}><i class="fas fa-bars"></i></button>
          <div class="header-logo"><${BrandMark} /><span class="header-label">Club Dashboard</span></div>
          <div class="header-right">
            <button class="header-logout" onClick=${handleLogout}><i class="fas fa-sign-out-alt"></i> Logout</button>
          </div>
        </header>

        <div class=${'nav-overlay' + (sidebarOpen ? ' active' : '')} onClick=${() => setSidebarOpen(false)}></div>

        <aside class=${'sidebar' + (sidebarOpen ? ' open' : '')}>
          <div class="sidebar-header">
            <${BrandMark} />
            <div class="sidebar-tagline">Africa's Football Intelligence Platform</div>
          </div>
          <div class="sidebar-club">
            <img class="sidebar-club-badge" src=${badgeUrl || BADGE_FALLBACK} alt=${clubName} decoding="async" onError=${onImgFallback} />
            <div class="sidebar-club-name">${clubName}</div>
            <div class="sidebar-club-cat">${club?.club_category || '—'}</div>
            ${club?.is_verified && html`<span class="sidebar-verified"><i class="fas fa-check"></i> Verified</span>`}
          </div>
          <div class=${'sidebar-token-widget' + (availableTokens <= 0 ? ' empty' : availableTokens < 5 ? ' low' : '')} role="button" tabindex="0" onClick=${() => showTab('tokens')} onKeyDown=${e => e.key === 'Enter' && showTab('tokens')}>
            <div class="sidebar-token-balance">${tokenBalance}</div>
            <div class="sidebar-token-label">Tokens</div>
            ${tokenLocked > 0 && html`<div class="sidebar-token-locked"><i class="fas fa-lock"></i> ${tokenLocked} locked</div>`}
            <span class="sidebar-token-topup"><i class="fas fa-plus"></i> Top Up</span>
          </div>
          <nav class="sidebar-nav" aria-label="Main navigation">
            ${TABS.map(tab => html`
              <div key=${tab.id} class=${'sidebar-nav-item' + (activeTab === tab.id ? ' active' : '')} role="button" tabindex="0"
                onClick=${() => showTab(tab.id)} onKeyDown=${e => e.key === 'Enter' && showTab(tab.id)}>
                <i class=${'fas ' + tab.icon}></i>
                <span>${tab.label}</span>
                ${tab.id === 'notifications' && unreadCount > 0 ? html`<span class="notif-badge">${unreadCount}</span>` : ''}
              </div>`)}
            <div class="sidebar-nav-item" role="button" tabindex="0" onClick=${handleLogout}><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
          </nav>
          <div class="sidebar-footer">© 2025 EnejiStats | Club v3.0</div>
        </aside>

        <main class="main-content">
          <div class="tab-bar" role="tablist">
            ${TABS.map(tab => html`
              <button key=${tab.id} role="tab" aria-selected=${activeTab === tab.id} class=${'tab-btn' + (activeTab === tab.id ? ' active' : '')} onClick=${() => setActiveTab(tab.id)}>
                <i class=${'fas ' + tab.icon}></i> ${tab.label}
                ${tab.id === 'notifications' && unreadCount > 0 ? html`<span class="tab-count">${unreadCount}</span>` : ''}
              </button>`)}
          </div>

          <div class="page-inner" key=${activeTab} style=${IFRAME_TABS.some(t => t.id === activeTab) ? 'display:none;' : null}>
            ${activeTab === 'profile' && html`
              <${ProfileTab}
                club=${club} summaryStats=${summaryStats} matchData=${matchData} achievements=${achievements}
                managementTeam=${managementTeam} clubId=${clubId} badgeUrl=${badgeUrl}
                onAddMgmt=${() => setMgmtModal({ open: true, target: -1 })}
                onEditMgmt=${(i) => setMgmtModal({ open: true, target: i })}
                onViewMatchCentre=${() => openMatchCentre('results')} />`}

            ${activeTab === 'squad' && html`
              <${SquadTab}
                squadPlayers=${squadPlayers} clubId=${clubId}
                onGoStats=${() => openMatchCentre('operations', 'stats-tracking')}
                onGoMatchRequests=${() => openMatchCentre('operations', 'match-requests')} />`}

            ${activeTab === 'tokens' && html`
              <${TokensTab}
                tokens=${tokens} tokenPackages=${tokenPackages} transactions=${transactions}
                selectedTokenPkg=${selectedTokenPkg} setSelectedTokenPkg=${setSelectedTokenPkg}
                onBuy=${(type) => addToast((type === 'SUBSCRIPTION' ? 'Subscription' : 'Token purchase') + ' wizard — integrate PaymentWizard here.', 'info')}
                onFlutterwave=${handleFlutterwavePayment} />`}

            ${activeTab === 'media' && html`
              <${MediaTab}
                mediaPhotos=${mediaPhotos} onAddPhoto=${handleMediaPhotoUpload} onDeletePhoto=${handleMediaPhotoDelete}
                ytVideos=${ytVideos} onAddVideo=${handleAddYouTubeVideo} onDeleteVideo=${handleDeleteYtVideo}
                onPlayVideo=${(v) => window.open('https://www.youtube.com/watch?v=' + (v.youtube_id || v.id), '_blank', 'noopener')} />`}

            ${activeTab === 'notifications' && html`
              <${NotificationsTab}
                notifications=${notifications} onMarkRead=${markNotifRead} onMarkAllRead=${markAllRead} onDelete=${deleteNotif} />`}

            ${activeTab === 'account' && html`
              <${AccountTab}
                club=${club} clubId=${clubId} clubName=${clubName} tokens=${tokens} managementTeam=${managementTeam} badgeUrl=${badgeUrl}
                pwForm=${pwForm} setPwForm=${setPwForm}
                onSaveBadge=${handleSaveBadge}
                onSaveMgmt=${(i) => setMgmtModal({ open: true, target: i })}
                onAddMgmt=${() => setMgmtModal({ open: true, target: -1 })}
                onChangePassword=${handlePasswordChange}
                onLogout=${handleLogout} />`}
          </div>

          <div class=${'frames-host' + (IFRAME_TABS.some(t => t.id === activeTab) ? ' active' : '')}>
            ${mountedIframeTabs.map(tab => html`
              <iframe
                key=${tab.id}
                ref=${el => { iframeRefs.current[tab.id] = el; }}
                class=${'iframe-tab-frame' + (activeTab === tab.id ? '' : ' is-hidden')}
                style=${frameHeights[tab.id] ? 'height:' + frameHeights[tab.id] + 'px;' : null}
                src=${tab.iframe}
                title=${tab.label}
                scrolling="no"
                aria-hidden=${activeTab !== tab.id}
                tabindex=${activeTab === tab.id ? 0 : -1}
                onLoad=${() => { postInit(tab.id); sendViewport(tab.id, true); }} />`)}
          </div>
        </main>

        <button class="support-fab" aria-label="Support" title="Support" onClick=${() => showTab('account')}><i class="fas fa-headset"></i></button>
      `;
    }

    render(h(App, null), document.getElementById('root'));
  })();
  </script>
</body>
</html>
