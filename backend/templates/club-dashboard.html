      // ═══════════════ MAIN APP ═══════════════
      function App() {
        // ═══ AUTH & DATA ═══
        const [authState, setAuthState] = useState('loading');
        const [club, setClub] = useState(null);
        const [seasonStats, setSeasonStats] = useState({});
        const [summaryStats, setSummaryStats] = useState({});
        const [matchData, setMatchData] = useState([]);
        const [fixtures, setFixtures] = useState([]);
        const [tokens, setTokens] = useState({ balance: 0, locked: 0 });
        const [tokenPackages, setTokenPackages] = useState([
          { tokens: 5, price: 500, bonus: 'Starter' },
          { tokens: 10, price: 950, bonus: 'Save ₦50' },
          { tokens: 25, price: 2200, bonus: 'Save ₦300' },
          { tokens: 50, price: 4000, bonus: 'Save ₦1000' },
          { tokens: 100, price: 7500, bonus: 'Best Value' },
          { tokens: 200, price: 14000, bonus: 'Pro Pack' },
        ]);
        const [notifications, setNotifications] = useState([]);
        const [achievements, setAchievements] = useState([]);
        const [competitions, setCompetitions] = useState([]);
        const [ytVideos, setYtVideos] = useState([]);
        const [mediaPhotos, setMediaPhotos] = useState([]);
        const [managementTeam, setManagementTeam] = useState([]);
        const [statsRequests, setStatsRequests] = useState([]);
        const [transactions, setTransactions] = useState([]);
        const [matchRequests, setMatchRequests] = useState({ sent: [], received: [] });
        const [squadPlayers, setSquadPlayers] = useState([]);
        const [selectedSquadPlayer, setSelectedSquadPlayer] = useState(null);

        // ═══ UI STATE ═══
        const [activeTab, setActiveTab] = useState('profile');
        const [sidebarOpen, setSidebarOpen] = useState(false);
        const [loading, setLoading] = useState(true);
        const [toasts, setToasts] = useState([]);
        const [selectedTokenPkg, setSelectedTokenPkg] = useState(null);
        const [pwForm, setPwForm] = useState({ current: '', newpw: '', confirm: '' });
        const [mgmtModal, setMgmtModal] = useState({ open: false, target: null });
        const matchCentreIframeRef = useRef(null);
        const statsIframeRef = useRef(null);

        // ═══ HELPERS ═══
        const addToast = (msg, type = 'info', dur = 3500) => {
          const id = Date.now() + Math.random();
          setToasts(p => [...p, { id, msg, type }]);
          setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), dur);
        };
        const removeToast = (id) => setToasts(p => p.filter(t => t.id !== id));

        const clubId = club?.club_id || club?._id || '—';
        const clubName = club?.club_name || club?.name || 'Club';
        const badgeUrl = club?.photo_url || club?.badge_url || club?.logo || club?.photo;
        const tokenBalance = tokens?.balance ?? 0;
        const tokenLocked = tokens?.locked ?? 0;
        const availableTokens = tokenBalance - tokenLocked;
        const unreadCount = notifications.filter(n => !n.read).length;

        // ═══ AUTH ═══
        useEffect(() => {
          async function checkAuth() {
            try {
              const me = await apiCall('/auth/me');
              if (me && (me.club_id || me.user_id || me._id) && (me.role === 'club' || me.role === 'Club')) {
                await loadDashboard(me.club_id || me.user_id || me._id);
                setAuthState('authenticated');
              } else {
                window.location.replace('/login');
              }
            } catch (err) {
              if (err.status === 401 || err.status === 403) {
                localStorage.clear(); sessionStorage.clear();
                window.location.replace('/login');
              } else {
                setAuthState('error');
                setLoading(false);
                addToast('Could not connect to server. Please check your connection.', 'error', 8000);
              }
            }
          }
          checkAuth();
        }, []);

        // ═══ NOTIFICATIONS POLLING ═══
        useEffect(() => {
          if (authState !== 'authenticated' || !club) return;
          const interval = setInterval(async () => {
            try {
              const d = await apiCall(`/club/${club.club_id || club.user_id}/notifications`);
              if (d) setNotifications(Array.isArray(d) ? d : []);
            } catch {}
          }, 60000);
          return () => clearInterval(interval);
        }, [authState, club]);

        // ═══ INACTIVITY LOGOUT ═══
        useEffect(() => {
          if (authState !== 'authenticated') return;
          let timer;
          const INACTIVITY_MS = 15 * 60 * 1000;
          const reset = () => { clearTimeout(timer); timer = setTimeout(() => handleLogout(), INACTIVITY_MS); };
          const events = ['mousemove', 'keydown', 'click', 'scroll'];
          events.forEach(e => window.addEventListener(e, reset));
          reset();
          return () => { clearTimeout(timer); events.forEach(e => window.removeEventListener(e, reset)); };
        }, [authState]);

        // ═══ POSTMESSAGE BRIDGE (from child iframes) ═══
        useEffect(() => {
          const handler = (e) => {
            if (!e.data || !e.data.type) return;
            switch (e.data.type) {
              case 'OPEN_TOKEN_WIZARD':
                addToast('Token purchase wizard opened from child tab.', 'info');
                // In production, wire to a PaymentWizard modal. For now, navigate to tokens tab.
                setActiveTab('tokens');
                break;
              case 'TOP_UP_TOKENS':
                setActiveTab('tokens');
                break;
              case 'NAVIGATE':
                if (e.data.tab) setActiveTab(e.data.tab);
                break;
              case 'TOAST':
                addToast(e.data.msg, e.data.level || 'info');
                break;
              default:
                break;
            }
          };
          window.addEventListener('message', handler);
          return () => window.removeEventListener('message', handler);
        }, []);

        async function loadDashboard(uid) {
          try {
            const [profileData, statsData, matchHistoryData, fixturesData, tokenData, notifData, achieveData, txData, compData, costsData, stReqData, mrSentData, mrRecvData, squadData] = await Promise.allSettled([
              apiCall(`/club/${uid}/profile`),
              apiCall(`/club/${uid}/stats/summary`),
              apiCall(`/club/${uid}/matches`),
              apiCall(`/club/${uid}/upcoming-fixtures`),
              apiCall(`/club/${uid}/tokens`),
              apiCall(`/club/${uid}/notifications`),
              apiCall(`/club/${uid}/achievements`),
              apiCall(`/club/${uid}/transactions`),
              apiCall('/competitions'),
              apiCall('/token/costs'),
              apiCall(`/club/${uid}/stats-requests`),
              apiCall(`/club/${uid}/match-requests/sent`),
              apiCall(`/club/${uid}/match-requests/received`),
              apiCall(`/club/${uid}/squad`),
            ]);
            const v = (r) => r.status === 'fulfilled' ? r.value : null;
            if (v(profileData)) {
              const p = v(profileData);
              setClub(p);
              setManagementTeam(Array.isArray(p.management) ? p.management : []);
              if (p.youtube_videos) setYtVideos(p.youtube_videos);
            }
            if (v(statsData)) {
              setSeasonStats(v(statsData).season_stats || v(statsData).stats || {});
              setSummaryStats(v(statsData).summary_stats || v(statsData).summary || {});
            }
            if (v(matchHistoryData)) { const arr = Array.isArray(v(matchHistoryData)) ? v(matchHistoryData) : v(matchHistoryData).matches || []; setMatchData(arr); }
            if (v(fixturesData)) setFixtures(Array.isArray(v(fixturesData)) ? v(fixturesData) : v(fixturesData).fixtures || []);
            if (v(tokenData)) setTokens(v(tokenData));
            if (v(notifData)) setNotifications(Array.isArray(v(notifData)) ? v(notifData) : []);
            if (v(achieveData)) setAchievements(Array.isArray(v(achieveData)) ? v(achieveData) : []);
            if (v(txData)) setTransactions(Array.isArray(v(txData)) ? v(txData) : v(txData).transactions || []);
            if (v(compData)) setCompetitions(Array.isArray(v(compData)) ? v(compData) : v(compData).competitions || []);
            if (v(costsData)) { const cd = v(costsData); if (cd?.packages) setTokenPackages(cd.packages); }
            if (v(stReqData)) setStatsRequests(Array.isArray(v(stReqData)) ? v(stReqData) : v(stReqData).requests || []);
            if (v(mrSentData)) setMatchRequests(p => ({ ...p, sent: Array.isArray(v(mrSentData)) ? v(mrSentData) : v(mrSentData).requests || [] }));
            if (v(mrRecvData)) setMatchRequests(p => ({ ...p, received: Array.isArray(v(mrRecvData)) ? v(mrRecvData) : v(mrRecvData).requests || [] }));
            if (v(squadData)) setSquadPlayers(Array.isArray(v(squadData)) ? v(squadData) : v(squadData).squad || []);
            try { const stored = localStorage.getItem(MEDIA_PHOTOS_KEY); if (stored) setMediaPhotos(JSON.parse(stored)); } catch {}
          } catch (e) { addToast('Failed to load some dashboard data', 'warning'); }
          finally { setLoading(false); }
        }

        async function handleLogout() {
          try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
          localStorage.clear(); sessionStorage.clear();
          window.location.replace('/login');
        }

        // ═══ HANDLERS ═══
        const showTab = (tab) => { setActiveTab(tab); setSidebarOpen(false); };

        const markNotifRead = async (id) => {
          try { await apiCall(`/club/${(club?.club_id || club?.user_id)}/notifications/${id}/read`, { method: 'PATCH' }); } catch {}
          setNotifications(p => p.map(n => (n._id === id || n.id === id) ? { ...n, read: true } : n));
        };
        const markAllRead = async () => {
          try { await apiCall(`/club/${(club?.club_id || club?.user_id)}/notifications/read-all`, { method: 'PATCH' }); } catch {}
          setNotifications(p => p.map(n => ({ ...n, read: true })));
        };
        const deleteNotif = (id) => {
          setNotifications(p => p.filter(n => (n._id || n.id) !== id));
          try { apiCall(`/club/${(club?.club_id || club?.user_id)}/notifications/${id}`, { method: 'DELETE' }); } catch {}
        };

        const handleSaveBadge = async (file, preview) => {
          try {
            const fd = new FormData(); fd.append('photo', file);
            await apiCall(`/club/${(club?.club_id || club?.user_id)}/logo`, { method: 'POST', headers: {}, body: fd });
            setClub(p => ({ ...p, photo_url: preview }));
            addToast('Club badge updated!', 'success');
          } catch { addToast('Failed to upload badge', 'error'); }
        };

        const handleSaveMgmt = async (data) => {
          const updated = mgmtModal.target === -1
            ? [...managementTeam, data]
            : managementTeam.map((m, i) => i === mgmtModal.target ? data : m);
          setManagementTeam(updated);
          setMgmtModal({ open: false, target: null });
          try { await apiCall(`/club/${(club?.club_id || club?.user_id)}/management`, { method: 'PUT', body: JSON.stringify({ management: updated }) }); addToast('Management team updated', 'success'); }
          catch { addToast('Saved locally', 'info'); }
        };
        const handleDeleteMgmt = async () => {
          const updated = managementTeam.filter((_, i) => i !== mgmtModal.target);
          setManagementTeam(updated);
          setMgmtModal({ open: false, target: null });
          try { await apiCall(`/club/${(club?.club_id || club?.user_id)}/management`, { method: 'PUT', body: JSON.stringify({ management: updated }) }); addToast('Personnel removed', 'success'); }
          catch { addToast('Removed locally', 'info'); }
        };

        const handlePasswordChange = async () => {
          if (!pwForm.current || !pwForm.newpw) { addToast('Fill in all fields', 'warning'); return; }
          if (pwForm.newpw !== pwForm.confirm) { addToast('Passwords do not match', 'error'); return; }
          try {
            await apiCall(`/club/${(club?.club_id || club?.user_id)}/change-password`, { method: 'POST', body: JSON.stringify({ old_password: pwForm.current, new_password: pwForm.newpw }) });
            addToast('Password changed!', 'success'); setPwForm({ current: '', newpw: '', confirm: '' });
          } catch (e) { addToast(e?.message || 'Failed', 'error'); }
        };

        const handleFlutterwavePayment = async (pkg) => {
          try {
            const r = await apiCall(`/club/${(club?.club_id || club?.user_id)}/tokens/topup`, { method: 'POST', body: JSON.stringify({ amount: pkg.price, tokens: pkg.tokens, description: pkg.tokens + ' Token purchase', entity: 'club', entity_id: (club?.club_id || club?.user_id) }) });
            if (r?.public_key) {
              window.FlutterwaveCheckout({
                public_key: r.public_key, tx_ref: r.tx_ref, amount: pkg.price, currency: 'NGN',
                payment_options: 'card,mobilemoney,ussd,banktransfer',
                customer: { email: club?.email || '', phone_number: club?.phone || '', name: clubName },
                customizations: { title: 'EnejiStats Payment', description: pkg.tokens + ' Token purchase', logo: '/static/images/logo.png' },
                callback: async (data) => {
                  if (data.status === 'successful') {
                    try {
                      const v = await apiCall(`/club/${(club?.club_id || club?.user_id)}/tokens/verify`, { method: 'POST', body: JSON.stringify({ transaction_id: data.transaction_id, tx_ref: data.tx_ref }) });
                      if (v?.tokens_credited) { setTokens(p => ({ ...p, balance: (p.balance || 0) + v.tokens_credited })); addToast(`${v.tokens_credited} tokens credited!`, 'success'); }
                    } catch {}
                  }
                },
                onclose: () => {}
              });
            } else addToast('Payment initialization failed', 'error');
          } catch (e) { addToast(e?.message || 'Payment failed', 'error'); }
        };

        const handleAddYouTubeVideo = (v) => {
          setYtVideos(p => [...p, v]);
          try { apiCall(`/club/${(club?.club_id || club?.user_id)}/media/youtube`, { method: 'POST', body: JSON.stringify({ url: v.url, title: v.title }) }); } catch {}
          addToast('Video added!', 'success');
        };
        const handleDeleteYtVideo = (ytId) => {
          setYtVideos(p => p.filter(v => (v.youtube_id || v.id) !== ytId));
          try { apiCall(`/club/${(club?.club_id || club?.user_id)}/media/youtube/${ytId}`, { method: 'DELETE' }); } catch {}
        };
        const handleMediaPhotoUpload = (files) => {
          Array.from(files || []).forEach(file => {
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              setMediaPhotos(prev => {
                const newTotal = prev.reduce((acc, p) => acc + (p.size || 0), 0) + file.size;
                if (newTotal > MAX_PHOTOS_BYTES) { addToast('10MB photo limit reached', 'error'); return prev; }
                const updated = [...prev, { id: Date.now() + Math.random(), dataUrl: ev.target.result, size: file.size, name: file.name }];
                try { localStorage.setItem(MEDIA_PHOTOS_KEY, JSON.stringify(updated)); } catch {}
                return updated;
              });
            };
            reader.readAsDataURL(file);
          });
        };
        const handleMediaPhotoDelete = (id) => {
          setMediaPhotos(prev => { const u = prev.filter(p => p.id !== id); try { localStorage.setItem(MEDIA_PHOTOS_KEY, JSON.stringify(u)); } catch {} return u; });
        };

        // ═══ IFRAME POSTMESSAGE ═══
        const handleIframeLoad = (ref) => {
          if (!ref.current) return;
          try {
            ref.current.contentWindow.postMessage({
              type: 'INIT',
              clubId,
              clubName,
              tokens,
              tokenCosts: {},
              squadPlayers,
            }, '*');
          } catch {}
        };

        // ═══ RENDER ═══
        if (authState === 'loading' || loading) return html`
          <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:1rem;">
            <i class="fas fa-spinner fa-spin" style="font-size:2.5rem;color:var(--primary);"></i>
            <div style="color:#64748b;font-weight:600;">Loading Club Dashboard...</div>
          </div>
        `;

        if (authState === 'error') return html`
          <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:1rem;">
            <i class="fas fa-exclamation-triangle" style="font-size:2.5rem;color:#dc2626;"></i>
            <div style="font-weight:700;color:#1e293b;">Connection Error</div>
            <div style="font-size:0.85rem;color:#64748b;">Could not connect to the server. Please check your internet connection.</div>
            <button class="btn btn-primary" onClick=${() => window.location.reload()}>Retry</button>
          </div>
        `;

        const activeIframe = TABS.find(t => t.id === activeTab && t.iframe);

        return html`
          <${ToastContainer} toasts=${toasts} removeToast=${removeToast} />

          ${mgmtModal.open && html`
            <${MgmtEditModal}
              person=${mgmtModal.target !== null && mgmtModal.target >= 0 ? managementTeam[mgmtModal.target] : null}
              onSave=${handleSaveMgmt}
              onDelete=${handleDeleteMgmt}
              onClose=${() => setMgmtModal({ open: false, target: null })}
            />
          `}

          <header class="dashboard-header">
            <button class="nav-toggle" onClick=${() => setSidebarOpen(p => !p)}><i class="fas fa-bars"></i></button>
            <div class="header-logo"><${BrandMark} /> <span class="header-label">Club Dashboard</span></div>
            <div class="header-right">
              <button class="header-logout" onClick=${handleLogout}><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
          </header>

          <div class=${`nav-overlay ${sidebarOpen ? 'active' : ''}`} onClick=${() => setSidebarOpen(false)}></div>

          <nav class=${`sidebar ${sidebarOpen ? 'open' : ''}`}>
            <div class="sidebar-header">
              <div><${BrandMark} /></div>
              <div class="sidebar-tagline">Africa's Football Intelligence Platform</div>
            </div>
            <div class="sidebar-club">
              <img class="sidebar-club-badge" src=${badgeUrl || badgeFallback} alt=${clubName} onerror=${`this.src='${badgeFallback}'`} />
              <div class="sidebar-club-name">${clubName}</div>
              <div class="sidebar-club-cat">${club?.club_category || '—'}</div>
              ${club?.is_verified && html`<span style="background:#1877f2;color:white;font-size:0.65rem;font-weight:800;padding:2px 8px;border-radius:999px;display:inline-block;margin-top:4px;"><i class="fas fa-check"></i> Verified</span>`}
            </div>
            <div class=${`sidebar-token-widget ${availableTokens <= 0 ? 'empty' : availableTokens < 5 ? 'low' : ''}`} onClick=${() => showTab('tokens')}>
              <div class="sidebar-token-balance">${tokenBalance}</div>
              <div class="sidebar-token-label">Tokens</div>
              ${tokenLocked > 0 && html`<div class="sidebar-token-locked"><i class="fas fa-lock"></i> ${tokenLocked} locked</div>`}
              <span class="sidebar-token-topup"><i class="fas fa-plus"></i> Top Up</span>
            </div>
            <nav class="sidebar-nav">
              ${TABS.map(tab => html`
                <div key=${tab.id} class=${`sidebar-nav-item ${activeTab === tab.id ? 'active' : ''}`} onClick=${() => showTab(tab.id)}>
                  <i class=${`fas ${tab.icon}`}></i>
                  <span>${tab.label}</span>
                  ${tab.id === 'notifications' && unreadCount > 0 ? html`<span class="notif-badge">${unreadCount}</span>` : ''}
                </div>
              `)}
              <div class="sidebar-nav-item" onClick=${handleLogout}><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
            </nav>
            <div class="sidebar-footer">© 2025 EnejiStats | Club v3.0</div>
          </nav>

          <main class="main-content">
            <div class="tab-bar">
              ${TABS.map(tab => html`
                <button key=${tab.id} class=${`tab-btn ${activeTab === tab.id ? 'active' : ''}`} onClick=${() => setActiveTab(tab.id)}>
                  <i class=${`fas ${tab.icon}`}></i> ${tab.label}
                  ${tab.id === 'notifications' && unreadCount > 0 ? html`<span style="background:#ef4444;color:white;border-radius:999px;font-size:0.6rem;padding:0 5px;">${unreadCount}</span>` : ''}
                </button>
              `)}
            </div>

            <div class="page-inner">
              ${activeTab === 'profile' && html`
                <${ProfileTab}
                  club=${club}
                  summaryStats=${summaryStats}
                  seasonStats=${seasonStats}
                  achievements=${achievements}
                  matchData=${matchData}
                  managementTeam=${managementTeam}
                  clubId=${clubId}
                  badgeUrl=${badgeUrl}
                  onAddMgmt=${() => setMgmtModal({ open: true, target: -1 })}
                  onEditMgmt=${(i) => setMgmtModal({ open: true, target: i })}
                  onDeleteMgmt=${handleDeleteMgmt}
                  onViewMatchCentre=${() => setActiveTab('match-centre')}
                />
              `}

              ${activeTab === 'squad' && html`
                <${SquadTab}
                  squadPlayers=${squadPlayers}
                  clubId=${clubId}
                  onGoStats=${() => setActiveTab('stats')}
                  onGoMatchRequests=${() => setActiveTab('match-centre')}
                />
              `}

              ${activeTab === 'tokens' && html`
                <${TokensTab}
                  tokens=${tokens}
                  tokenPackages=${tokenPackages}
                  transactions=${transactions}
                  selectedTokenPkg=${selectedTokenPkg}
                  setSelectedTokenPkg=${setSelectedTokenPkg}
                  onBuy=${(type) => addToast(`${type === 'SUBSCRIPTION' ? 'Subscription' : 'Token purchase'} wizard — integrate PaymentWizard here.`, 'info')}
                  onFlutterwave=${handleFlutterwavePayment}
                />
              `}

              ${activeTab === 'media' && html`
                <${MediaTab}
                  mediaPhotos=${mediaPhotos}
                  onAddPhoto=${handleMediaPhotoUpload}
                  onDeletePhoto=${handleMediaPhotoDelete}
                  ytVideos=${ytVideos}
                  onAddVideo=${handleAddYouTubeVideo}
                  onDeleteVideo=${handleDeleteYtVideo}
                  onPlayVideo=${(v) => window.open(`https://www.youtube.com/watch?v=${v.youtube_id || v.id}`, '_blank')}
                />
              `}

              ${activeTab === 'notifications' && html`
                <${NotificationsTab}
                  notifications=${notifications}
                  onMarkRead=${markNotifRead}
                  onMarkAllRead=${markAllRead}
                  onDelete=${deleteNotif}
                />
              `}

              ${activeTab === 'account' && html`
                <${AccountTab}
                  club=${club}
                  clubId=${clubId}
                  clubName=${clubName}
                  tokens=${tokens}
                  managementTeam=${managementTeam}
                  badgeUrl=${badgeUrl}
                  pwForm=${pwForm}
                  setPwForm=${setPwForm}
                  onSaveBadge=${handleSaveBadge}
                  onSaveMgmt=${(i) => setMgmtModal({ open: true, target: i })}
                  onDeleteMgmt=${handleDeleteMgmt}
                  onAddMgmt=${() => setMgmtModal({ open: true, target: -1 })}
                  onChangePassword=${handlePasswordChange}
                  onLogout=${handleLogout}
                />
              `}

              ${activeIframe && html`
                <iframe
                  ref=${activeTab === 'match-centre' ? matchCentreIframeRef : statsIframeRef}
                  class="iframe-tab-frame"
                  src=${activeIframe.iframe}
                  title=${activeIframe.label}
                  onLoad=${() => handleIframeLoad(activeTab === 'match-centre' ? matchCentreIframeRef : statsIframeRef)}
                  style="min-height:80vh;"
                />
              `}
            </div>
          </main>

          <button class="support-fab" onClick=${() => setActiveTab('account')} title="Support"><i class="fas fa-headset"></i></button>
        `;
      }

      render(h(App, null), document.getElementById('root'));
    })();
  </script>
</body>
</html>
