/* EnejiStats matchday tactical workspace */
.matchday-shell{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:.85rem;align-items:start;margin-bottom:1rem}
.matchday-board{background:#fff;border:1px solid var(--border);border-radius:12px;padding:.8rem;box-shadow:var(--shadow);min-width:0}
.matchday-toolbar{display:flex;gap:.55rem;align-items:end;flex-wrap:wrap;margin-bottom:.65rem}
.matchday-toolbar .form-group{margin:0;min-width:150px;flex:1}
.matchday-toolbar select{width:100%;padding:.5rem;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);font:inherit}
.matchday-pitch{display:block;width:100%;height:auto;border-radius:9px;background:#126b43;touch-action:manipulation}
.matchday-pitch .pitch-line{fill:none;stroke:rgba(255,255,255,.8);stroke-width:2}
.matchday-player{cursor:pointer;outline:none}
.matchday-player circle{stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.matchday-player.selected circle{stroke:#ffd700;stroke-width:5}
.matchday-player text{font-family:Arial,sans-serif;pointer-events:none}
.matchday-player:focus circle{stroke:#ffd700;stroke-width:5}
.matchday-help{font-size:.72rem;color:var(--text-light);line-height:1.45;margin:.45rem 0 .65rem}
.matchday-squad-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.4rem;max-height:300px;overflow:auto;padding:2px}
.matchday-pick{display:flex;align-items:center;gap:.45rem;padding:.45rem .5rem;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;min-width:0}
.matchday-pick:has(input:checked){border-color:var(--primary);background:#eff6ff}
.matchday-pick input{accent-color:var(--primary);flex-shrink:0}
.matchday-pick-name{font-size:.74rem;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.matchday-pick-pos{font-size:.62rem;color:var(--text-light);font-weight:800;flex-shrink:0}
.matchday-insights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
.matchday-insight{border:1px solid var(--border);border-radius:8px;padding:.65rem;background:#f8fafc;min-width:0}
.matchday-insight strong{display:block;font-size:1.15rem;color:var(--primary);font-family:var(--mono)}
.matchday-insight span{display:block;font-size:.65rem;color:var(--text-light);font-weight:800;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.matchday-alert{border-left:3px solid #d97706;background:#fffbeb;color:#92400e;border-radius:5px;padding:.55rem .65rem;font-size:.75rem;line-height:1.45;margin-top:.45rem}
.matchday-positive{border-left-color:#16a34a;background:#f0fdf4;color:#166534}
.matchday-bench{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.55rem}
.matchday-bench-chip{font-size:.68rem;font-weight:800;border:1px solid var(--border);border-radius:999px;padding:.25rem .55rem;background:#f8fafc}
.matchday-actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.65rem}
.matchday-actions .btn{font-size:.72rem}
@media(max-width:850px){.matchday-shell{grid-template-columns:1fr}.matchday-pitch{max-height:64vh}}
@media(max-width:480px){.matchday-squad-pool{grid-template-columns:1fr 1fr}.matchday-board{padding:.55rem}.matchday-insight{padding:.5rem}}
.club-summary-note{margin:-.15rem 0 .8rem;color:#64748b;font-size:.75rem;line-height:1.5}
.club-match-detail-list{display:grid;gap:.75rem}
.club-detail-match{overflow:hidden;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.045)}
.club-detail-match-head{padding:.85rem 1rem;background:linear-gradient(135deg,#f8fbff,#eef5ff);border-bottom:1px solid var(--border)}
.club-detail-match-teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:.65rem}
.club-detail-team{font-size:.95rem;font-weight:850;color:#1e293b;overflow-wrap:anywhere}
.club-detail-team:last-child{text-align:right}
.club-detail-score{padding:.35rem .7rem;border-radius:8px;background:var(--primary);color:#fff;font-family:var(--mono);font-size:1.05rem;font-weight:900;white-space:nowrap}
.club-detail-match-meta{display:flex;flex-wrap:wrap;gap:.35rem .9rem;margin-top:.55rem;color:#64748b;font-size:.72rem}
.club-detail-match-meta span{display:inline-flex;align-items:center;gap:.28rem}
.club-match-breakdown{padding:.75rem}
.club-match-breakdown-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;margin-bottom:.6rem}
.club-match-breakdown-head>span{font-size:.78rem;font-weight:850;color:var(--primary);text-transform:uppercase;letter-spacing:.35px}
.club-match-breakdown-head small{max-width:430px;color:#64748b;font-size:.68rem;line-height:1.45;text-align:right}
.club-match-side-head,.club-match-metric{display:grid;grid-template-columns:minmax(58px,.8fr) minmax(130px,2fr) minmax(58px,.8fr);align-items:center;gap:.65rem}

.club-match-side-head .home-side,.club-match-side-head .away-side{color:var(--primary)}

  const SUCCESS_TOTAL = { passes: ["successful", "success", "completed"], crosses: ["successful", "success", "completed"], shots: ["on_target"], tackles: ["won", "successful", "success"], duels: ["won", "successful", "success"] };
  function eventInSelectedBands(e, selectedBands) {

  function possessionFromEvents(events, intervals) {
    const all = events.filter(e => e.period !== "penalty_shootout" && Number.isFinite(e.sec)).sort((a, b) => a.sec - b.sec);

    for (const interval of intervals) {

    return total > 0 ? [+(out.home / total * 100).toFixed(1), +(out.away / total * 100).toFixed(1)] : null;

  const CATEGORY_MAP = { professional: "professional", pro: "professional", professionals: "professional", "semi professional": "semi-professional", "semi pro": "semi-professional", "semi-professional": "semi-professional", academy: "academy", academies: "academy", youth: "academy", university: "university", universities: "university", varsity: "university", other: "others", others: "others", local: "others" };

                ${[[match.home || "Home", "Wins", h2h.summary.homeWins], ["Draws", "Draws", h2h.summary.draws], [match.away || "Away", "Wins", h2h.summary.awayWins], ["Meetings", "Total", h2h.matches.length || h2h.summary.homeWins + h2h.summary.draws + h2h.summary.awayWins]]
                  .map((k, i) => html`<div class="mr-kpi" key=${i}><strong>${k[2]}</strong><span>${k[0]} · ${k[1]}</span></div>`)}

          <section class="mr-card">
            <div class="mr-card-head"><div class="mr-card-title">${sub === "last5" ? "Last 5 meetings" : "All meetings"}</div><span class="mr-pill">${rows.length} MATCHES</span></div>
            ${rows.length ? html`
              <div class="mr-tablewrap"><table class="mr-table">
                <thead><tr><th>Date</th><th>Home</th><th>Score</th><th>Away</th><th>Competition</th></tr></thead>
                <tbody>${rows.map(m => html`<tr key=${m.id}><td>${fmtDate(m.date) || "—"}</td><td>${m.home || "—"}</td><td class="num">${score(m)}</td><td>${m.away || "—"}</td><td>${m.competition || "—"}</td></tr>`)}</tbody>
              </table></div>` : html`<${Empty} text="No head-to-head meetings are available." />`}
          </section>`}
      </div>`;
  }

  // ── Standings ──
  function Standings({ view }) {
    const [sub, setSub] = useState("overall");
    const rows = view.standings;
    const me = r => [lc(view.match.home), lc(view.match.away)].includes(lc(r.team));
    const val = v => v === null || v === undefined ? "—" : v;
    const pts = f => f.split("").reduce((n, c) => n + (c === "W" ? 3 : c === "D" ? 1 : 0), 0);
    let body;
    if (!rows.length) body = html`<${Empty} text="No standings data are available." />`;
    else if (sub === "form") {
      const sorted = rows.slice().sort((a, b) => pts(b.form.slice(-5)) - pts(a.form.slice(-5)) || a.rank - b.rank);
      body = html`<div class="mr-tablewrap"><table class="mr-table"><thead><tr><th>#</th><th>Team</th><th>Last 5</th><th class="num">Form pts</th></tr></thead>
        <tbody>${sorted.map((r, i) => html`<tr key=${r.team + i} class=${me(r) ? "me" : ""}><td>${i + 1}</td><td>${r.team || "—"}</td><td><${FormPills} form=${r.form} /></td><td class="num">${r.form ? pts(r.form.slice(-5)) : "—"}</td></tr>`)}</tbody></table></div>`;
    } else {
      const pick = r => sub === "overall" ? r : (r[sub] ? { ...r, ...r[sub], gd: r[sub].gf !== null && r[sub].ga !== null ? r[sub].gf - r[sub].ga : null } : { ...r, mp: null, w: null, d: null, l: null, gf: null, ga: null, gd: null, pts: null });
      const data = rows.map(pick);
      if (sub !== "overall") data.sort((a, b) => (b.pts ?? -1) - (a.pts ?? -1) || (b.gd ?? -99) - (a.gd ?? -99));
      body = html`<div class="mr-tablewrap"><table class="mr-table"><thead><tr><th>#</th><th>Team</th><th class="num">MP</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">Pts</th><th>Form</th></tr></thead>
        <tbody>${data.map((r, i) => html`<tr key=${r.team + i} class=${me(r) ? "me" : ""}><td>${sub === "overall" ? r.rank : i + 1}</td><td>${r.team || "—"}</td><td class="num">${val(r.mp)}</td><td class="num">${val(r.w)}</td><td class="num">${val(r.d)}</td><td class="num">${val(r.l)}</td><td class="num">${val(r.gf)}</td><td class="num">${val(r.ga)}</td><td class="num">${val(r.gd ?? (r.gf !== null && r.ga !== null ? r.gf - r.ga : null))}</td><td class="num"><b>${val(r.pts)}</b></td><td><${FormPills} form=${r.form} /></td></tr>`)}</tbody></table></div>`;

    return html`
      <div>
        <${Subnav} items=${[["overall", "OVERALL"], ["home", "HOME"], ["away", "AWAY"], ["form", "FORM"]]} value=${sub} onChange=${setSub} />
        <section class="mr-card">
          <div class="mr-card-head"><div class="mr-card-title">Standings · ${sub.toUpperCase()}</div><span class="mr-pill">${rows.length} TEAMS</span></div>
          ${body}
        </section>
      </div>`;
  }

  // ── Summary ──
  const SUMMARY_KINDS = new Set(["goal", "owngoal", "penaltygoal", "yellow", "secondyellow", "red", "sub"]);
  function EventIcon({ kind }) {
    if (GOAL_KINDS.has(kind) || kind === "assist") return html`<span class="mr-ico" aria-label=${kind === "assist" ? "Assist" : "Goal"}>${kind === "assist" ? "🅰" : "⚽"}</span>`;
    if (kind === "yellow" || kind === "secondyellow") return html`<span class="mr-ico" aria-label="Yellow card"><i class="mr-sq y"></i></span>`;
    if (kind === "red") return html`<span class="mr-ico" aria-label="Red card"><i class="mr-sq r"></i></span>`;
    if (kind === "sub") return html`<span class="mr-ico" aria-label="Substitution" style="color:#64748b">⇅</span>`;
    return html`<span class="mr-ico">•</span>`;
  }
  function Summary({ view }) {
    const [filter, setFilter] = useState("all");
    const { match, events, hints, hasExtraTime } = view;
    const finalHome = match.homeScore, finalAway = match.awayScore, finalKnown = finalHome !== null && finalAway !== null;
    const goalEvents = events.filter(e => GOAL_KINDS.has(e.kind) && e.period !== "penalty_shootout");
    const counts = {};
    PERIODS.forEach(p => { counts[p] = { home: 0, away: 0 }; });
    const total = { home: 0, away: 0 };
    let assigned = true;
    goalEvents.forEach(e => {
      if (!PERIODS.includes(e.period) || !e.scoringSide) { assigned = false; return; }
      counts[e.period][e.scoringSide] += 1; total[e.scoringSide] += 1;
    });
    const complete = view.hasEventLog && assigned && (
      (finalKnown && total.home === finalHome && total.away === finalAway) ||
      (goalEvents.length === 0 && finalHome === 0 && finalAway === 0) ||
      (!finalKnown && goalEvents.length > 0));
    const statGoals = (side, period) => {
      for (const src of [view.stats[side][period], view.stats[side].periods && view.stats[side].periods[period], view.stats[side].halves && view.stats[side].halves[period]]) {
        if (!isObj(src)) continue;
        const g = toScore(first(src.goals, src.goals_scored, src.goals_for));
        if (g !== null) return g;
      }
      return null;
    };
    const periodScore = period => {
      if (complete) return counts[period];
      const sh = statGoals("home", period), sa = statGoals("away", period);
      if (sh !== null && sa !== null) return { home: sh, away: sa };
      if (hints[period]) return hints[period];
      if (period === "first_half") {
        if (hints.halfTime) return hints.halfTime;
        const lastGoal = events.filter(e => e.period === "first_half" && GOAL_KINDS.has(e.kind)).pop();
        const sp = lastGoal ? parsePair(lastGoal.score) : null;
        if (sp) return sp;
      }
      if (period === "second_half" && !hasExtraTime && hints.halfTime && finalKnown && finalHome >= hints.halfTime.home && finalAway >= hints.halfTime.away)
        return { home: finalHome - hints.halfTime.home, away: finalAway - hints.halfTime.away };
      if (finalHome === 0 && finalAway === 0) return { home: 0, away: 0 };
      return null;
    };
    const base = events.filter(e => SUMMARY_KINDS.has(e.kind) && e.period && e.period !== "penalty_shootout");
    const assistRows = base.filter(e => (e.kind === "goal" || e.kind === "penaltygoal") && e.assist).map(e => ({ ...e, kind: "assist", player: e.assist, detail: `Goal: ${e.player}`, id: e.id + ":a" }))
      .concat(events.filter(e => e.metric === "assists" && e.period && e.period !== "penalty_shootout" && !base.some(b => b.id === e.id)).map(e => ({ ...e, kind: "assist" })));
    const shown = filter === "all" ? base : filter === "goals" ? base.filter(e => GOAL_KINDS.has(e.kind)) : filter === "cards" ? base.filter(e => CARD_KINDS.has(e.kind)) : filter === "subs" ? base.filter(e => e.kind === "sub") : assistRows;
    const sideFor = e => GOAL_KINDS.has(e.kind) || e.kind === "assist" ? e.scoringSide || e.side : e.side;
    const minuteText = e => e.minuteLabel ? `${e.minuteLabel}'` : Number.isFinite(e.minute) ? `${e.minute}'` : "—";
    const label = e => e.kind === "sub" ? `${e.playerOut || "—"} → ${e.playerIn || "—"}` : e.player || "";
    const extras = e => [e.kind === "owngoal" ? "OG" : e.kind === "penaltygoal" ? "P" : "", (e.kind === "goal" || e.kind === "penaltygoal") && e.assist ? `A: ${e.assist}` : "", e.kind === "assist" ? e.detail : "", e.kind === "secondyellow" ? "2nd yellow" : ""].filter(Boolean).join(" · ");
    const row = (e, side) => html`
      <div key=${e.id} class="mr-ev" style=${`justify-content:${side === "home" ? "flex-end" : "flex-start"}`}>
        ${side === "home" ? html`<span><b>${label(e)}</b> ${extras(e) && html`<small>${extras(e)}</small>`}</span><${EventIcon} kind=${e.kind} /><span class="mr-ev-min">${minuteText(e)}</span>`
          : html`<span class="mr-ev-min">${minuteText(e)}</span><${EventIcon} kind=${e.kind} /><span><b>${label(e)}</b> ${extras(e) && html`<small>${extras(e)}</small>`}</span>`}
      </div>`;
    const specs = [{ key: "first_half", label: PERIOD_LABEL.first_half }, { key: "second_half", label: PERIOD_LABEL.second_half }].concat(hasExtraTime ? [{ key: "extra_time_first_half", label: PERIOD_LABEL.extra_time_first_half }, { key: "extra_time_second_half", label: PERIOD_LABEL.extra_time_second_half }] : []);
    const fmtScore = s => s ? `${s.home} - ${s.away}` : "—";
    const infoItems = [["Date", fmtDate(match.date)], ["Referee", match.referee], ["Venue", match.venue], ["Capacity", match.capacity != null ? Number(match.capacity).toLocaleString() : ""], ["Attendance", match.attendance != null ? (num(match.attendance) !== null ? num(match.attendance).toLocaleString() : String(match.attendance)) : ""], ["TV", match.tv]].filter(i => i[1]);
    return html`
      <div>
        ${infoItems.length ? html`<section class="mr-card"><div class="mr-card-head"><div class="mr-card-title">Match info</div></div><div class="mr-info">${infoItems.map(i => html`<div key=${i[0]}><span>${i[0]}</span><b>${i[1]}</b></div>`)}</div></section>` : ""}
        <${Subnav} items=${[["all", "ALL"], ["goals", "GOALS"], ["assists", "ASSISTS"], ["cards", "CARDS"], ["subs", "SUBSTITUTIONS"]]} value=${filter} onChange=${setFilter} />
        <section class="mr-card">
          ${specs.map(spec => {
            const evs = shown.filter(e => e.period === spec.key);
            const homeEv = evs.filter(e => sideFor(e) === "home"), awayEv = evs.filter(e => sideFor(e) === "away");
            return html`
              <div key=${spec.key} aria-label=${spec.label}>
                <div class="mr-period"><span>${spec.label}</span><span class="mr-period-score"><small>PERIOD SCORE</small><strong>${fmtScore(periodScore(spec.key))}</strong></span></div>
                <div class="mr-ev-cols">
                  <div class="mr-ev-col home">${homeEv.length ? homeEv.map(e => row(e, "home")) : html`<div class="mr-ev-none">—</div>`}</div>
                  <div class="mr-ev-col">${awayEv.length ? awayEv.map(e => row(e, "away")) : html`<div class="mr-ev-none">—</div>`}</div>
                </div>
              </div>`;
          })}
          ${!shown.length && html`<${Empty} text=${`No ${filter === "all" ? "match events" : filter} events are available.`} />`}
        </section>
      </div>`;
  }

  // ── Stats ──
  function StatRow({ label, home, away, homeNum, awayNum, homeNote, awayNote }) {
    const hv = Math.abs(homeNum || 0), av = Math.abs(awayNum || 0), t = hv + av;
    return html`
      <div class="mr-stat-row">
        <div class="mr-stat-vals">
          <span class="mr-sv home">${home}${homeNote && html`<small class="mr-ss">${homeNote}</small>`}</span>
          <span class="mr-sl">${label}</span>
          <span class="mr-sv away">${away}${awayNote && html`<small class="mr-ss">${awayNote}</small>`}</span>
        </div>
        <div class="mr-meter" aria-hidden="true"><i class="h" style=${`width:${t ? hv / t * 100 : 0}%`}></i><i class="a" style=${`width:${t ? av / t * 100 : 0}%`}></i></div>
      </div>`;
  }
  const TeamHeader = ({ view, center }) => html`<div class="mr-teamhdr"><span>${view.match.home}</span><span>${center}</span><span>${view.match.away}</span></div>`;

  function PeriodStats({ view, period }) {
    const [showAll, setShowAll] = useState(false);
    const model = useMemo(() => buildStats(view, period), [view, period]);
    const periodLabel = period === "overview" ? "MATCH OVERVIEW" : PERIOD_LABEL[period];
    const visibleGroups = model.groups.map(g => ({ ...g, rows: g.rows.filter(r => showAll || r.home.value != null || r.away.value != null) })).filter(g => g.rows.length);
    const hidden = model.groups.reduce((n, g) => n + g.rows.length, 0) - visibleGroups.reduce((n, g) => n + g.rows.length, 0);
    return html`
      <div>
        <${TeamHeader} view=${view} center=${periodLabel} />
        <div class="mr-coverage">
          ${period === "overview"
            ? `The overview uses reported match totals. When an additive total is absent it is summed only if every ${view.hasExtraTime ? "regulation and extra-time period" : "regulation half"} is available; rates are calculated from underlying counts when needed.`
            : `${PERIOD_LABEL[period]} fields available: ${model.homeAvail}/${model.metricCount} for ${view.match.home} and ${model.awayAvail}/${model.metricCount} for ${view.match.away}. A dash means the period was not supplied and could not be safely derived; match totals are never copied into a period.`}
        </div>
        ${(hidden > 0 || showAll) && html`<div class="mr-toggle"><button type="button" aria-pressed=${showAll} onClick=${() => setShowAll(v => !v)}>${showAll ? "Hide unavailable metrics" : `Show ${hidden} unavailable metrics`}</button></div>`}
        ${!visibleGroups.length && html`<${Empty} text="No statistics are available for this period yet." />`}
        ${visibleGroups.map(g => html`
          <section class="mr-card" key=${g.key} aria-label=${g.title}>
            <div class="mr-stat-title">${g.title}</div>
            ${g.rows.map(({ metric, home, away }) => html`
              <${StatRow} key=${metric.key} label=${metric.label} home=${formatStat(metric, home)} away=${formatStat(metric, away)}
                homeNum=${num(home.value)} awayNum=${num(away.value)} homeNote=${SOURCE_LABEL[home.source] || ""} awayNote=${SOURCE_LABEL[away.source] || ""} />`)}
          </section>`)}
        ${model.checks && html`
          <details class="mr-recon">
            <summary>Reconciliation checks · ${model.checks.ok} matched · ${model.checks.bad} mismatch${model.checks.bad === 1 ? "" : "es"} · ${model.checks.na} not verifiable</summary>
            <div class="mr-muted" style="margin:.3rem 0 .5rem">Not verifiable means the required period or component fields were not supplied.</div>
            <div class="mr-check" style="border-top:0;font-weight:900"><span>Check</span><span class="s">${view.match.home}</span><span class="s">${view.match.away}</span></div>
            ${model.checks.rows.map(r => html`<div class="mr-check" key=${r.label}><span>${r.label}</span>
              <span class=${`s ${r.home}`}>${r.home === "ok" ? "Matches" : r.home === "mismatch" ? "Mismatch" : "Not verifiable"}</span>
              <span class=${`s ${r.away}`}>${r.away === "ok" ? "Matches" : r.away === "mismatch" ? "Mismatch" : "Not verifiable"}</span></div>`)}
          </details>`}
      </div>`;
  }

  function Timeline({ view }) {
    const [selectedBands, setSelectedBands] = useState([]);
    const matchEnd = view.hasExtraTime ? 120 : 90;
    const bands = [];
    for (let start = 0; start < matchEnd; start += 5) {
      const end = Math.min(start + 5, matchEnd);
      bands.push({ start, end, label: `${fmtClock(start * 60)}–${fmtClock(end * 60 - 1)}` });
    }
    const tracker = view.events.filter(e => e.tracker);
    const selected = tracker.filter(e => eventInSelectedBands(e, selectedBands)).sort((a, b) => a.sec - b.sec);
    const intervals = selectedBands.length
      ? selectedBands.map(start => ({ start: start * 60, end: (start + 5) * 60 }))
      : [{ start: 0, end: matchEnd * 60 }];
    const poss = possessionFromEvents(tracker, intervals);
    const toggleBand = start => setSelectedBands(current =>
      current.includes(start) ? current.filter(x => x !== start) : [...current, start].sort((a, b) => a - b)
    );
    const toggleGroup = (from, to) => {
      const group = bands.filter(b => b.start >= from && b.start < to).map(b => b.start);
      setSelectedBands(current => group.every(v => current.includes(v))
        ? current.filter(v => !group.includes(v))
        : [...new Set([...current, ...group])].sort((a, b) => a - b));
    };
    const selectionLabel = selectedBands.length
      ? `${selectedBands.length} selected 5-minute band${selectedBands.length === 1 ? "" : "s"}`
      : "Full match · no time filter";
    const eventOutcome = (event, metric) => {
      const raw = String(event.outcome || '').toLowerCase();
      const allowed = (metric.outcomes || []).map(o => String(o[0]));
      if (allowed.includes(raw)) return raw;
      if (['success','successful','completed'].includes(raw)) return 'successful';
      if (['failure','fail','unsuccessful'].includes(raw)) return 'unsuccessful';
      return raw;
    };
    const eventSubtype = (event, metric) => {
      let raw = String(event.subtype || '').toLowerCase();
      const aliases = {pass_build_up:'short_medium',pass_long:'long',pass_through_ball:'through_ball',short:'short_medium',short_pass:'short_medium',long_pass:'long',through:'through_ball',substitution_on:'on',substitution_off:'off',substitution_reason:'reason',shot_open_play:'foot',shot_header:'header',shot_set_piece:'set_piece',save_open_play:'open_play',save_close:'close',save_set_piece:'set_piece',distribution_short:'short',distribution_long:'long',distribution_restart:'restart'};
      raw = aliases[raw] || raw;
      const types = (metric.types || []).flatMap(t => Array.isArray(t) ? [String(t[0])] : [String(t.key), ...(t.children || []).map(c => String(Array.isArray(c) ? c[0] : c.key))]);
      const exact = types.find(key => raw === key || raw.endsWith('_' + key));
      if (exact) return exact;
      if (metric.key === 'passes' && /(short|medium|build_up)/.test(raw)) return 'short_medium';
      if (metric.key === 'passes' && /long/.test(raw)) return 'long';
      if (metric.key === 'passes' && /through/.test(raw)) return 'through_ball';
      return raw;
    };
    const descriptors = metric => {
      const types = (metric.types || []).flatMap(t => {
        if (Array.isArray(t)) return [{key:String(t[0]),label:String(t[1])}];
        if (t.children) return t.children.map(c => Array.isArray(c) ? {key:String(c[0]),label:`${t.label}: ${c[1]}`} : {key:String(c.key),label:`${t.label}: ${c.label}`});
        return [{key:String(t.key),label:String(t.label)}];
      });
      const outcomes = (metric.outcomes || []).map(o => ({key:String(o[0]),label:String(o[1])}));
      if (outcomes.length && types.length) return outcomes.flatMap(o => types.map(t => ({key:`${o.key}::${t.key}`,label:`${o.label} · ${t.label}`,outcome:o.key,type:t.key})));
      if (outcomes.length) return outcomes.map(o => ({...o,outcome:o.key}));

    };
    const count = (side, metric, descriptor) => selected.filter(event => {

      if (descriptor.type && eventSubtype(event, metric) !== descriptor.type) return false;
      return true;
    }).length;
    return html`
      <div>
        <div class="mr-timebox">
          <div class="mr-timerow">
            <strong>Match time bands</strong><span class="mr-timesum">${selectionLabel}</span>
            <button type="button" class="mr-time-action" onClick=${() => setSelectedBands([])}>Full match</button>
            <button type="button" class="mr-time-action" onClick=${() => setSelectedBands(bands.map(b => b.start))}>Select all</button>
          </div>
          <div class="mr-time-groups">
            <div class="mr-time-group"><div class="mr-time-group-head"><b>1st half</b><button type="button" class="mr-time-action" onClick=${() => toggleGroup(0,45)}>Toggle half</button></div>
              <div class="mr-band-grid">${bands.filter(b=>b.start<45).map(b=>html`<label class=${`mr-band-option ${selectedBands.includes(b.start)?'selected':''}`} key=${b.start}><input type="checkbox" checked=${selectedBands.includes(b.start)} onChange=${()=>toggleBand(b.start)}/><span>${b.label}</span></label>`)}</div>
            </div>
            <div class="mr-time-group"><div class="mr-time-group-head"><b>2nd half</b><button type="button" class="mr-time-action" onClick=${() => toggleGroup(45,90)}>Toggle half</button></div>
              <div class="mr-band-grid">${bands.filter(b=>b.start>=45&&b.start<90).map(b=>html`<label class=${`mr-band-option ${selectedBands.includes(b.start)?'selected':''}`} key=${b.start}><input type="checkbox" checked=${selectedBands.includes(b.start)} onChange=${()=>toggleBand(b.start)}/><span>${b.label}</span></label>`)}</div>
            </div>
            ${view.hasExtraTime?html`<div class="mr-time-group"><div class="mr-time-group-head"><b>Extra time</b><button type="button" class="mr-time-action" onClick=${()=>toggleGroup(90,120)}>Toggle extra time</button></div>
              <div class="mr-band-grid">${bands.filter(b=>b.start>=90).map(b=>html`<label class=${`mr-band-option ${selectedBands.includes(b.start)?'selected':''}`} key=${b.start}><input type="checkbox" checked=${selectedBands.includes(b.start)} onChange=${()=>toggleBand(b.start)}/><span>${b.label}</span></label>`)}</div>
            </div>`:''}
          </div>
          <div class="mr-timesum">All available tracker events are included by default. Select one or more 5-minute bands to filter every metric and event together.</div>
        </div>
        ${poss?html`<section class="mr-card"><div class="mr-card-head"><div class="mr-card-title">Possession</div><span class="mr-pill">${selectionLabel}</span></div><${StatRow} label="Ball possession" home=${poss[0]+"%"} away=${poss[1]+"%"} homeNum=${poss[0]} awayNum=${poss[1]}/></section>`:''}
        ${PLAYER_SCHEMA.map(section=>html`<section class="mr-card" key=${section.id}><div class="mr-card-head"><div class="mr-card-title">${section.title}</div><span class="mr-pill">${section.metrics.length} METRICS</span></div>
          ${section.metrics.map(metric=>{
            const fields=descriptors(metric);
            const homeTotal=selected.filter(e=>e.side==='home'&&e.metric===metric.key).length;
            const awayTotal=selected.filter(e=>e.side==='away'&&e.metric===metric.key).length;
            return html`<div class="mr-tracker-metric" key=${metric.key}><div class="mr-tracker-metric-title"><b>${metric.label}</b><span>${homeTotal} / ${awayTotal}</span></div>
              <div class="mr-tracker-fields">${fields.map(field=>html`<div class="mr-tracker-field" key=${field.key}><span>${field.label}</span><strong>${count('home',metric,field)} / ${count('away',metric,field)}</strong></div>`)}</div>
            </div>`;
          })}
        </section>`)}
        <section class="mr-card" style="margin-top:12px"><div class="mr-card-head"><div class="mr-card-title">Timestamped tracker events</div><span class="mr-pill">${selected.length} EVENTS</span></div>
          ${selected.length?selected.map(e=>html`<div class="mr-event" key=${e.id}><div class="mr-minute">${fmtClock(e.sec)}</div><div><div class="mr-event-main">${e.metric||e.kind}</div><div class="mr-event-sub">${[e.player,e.detail].filter(Boolean).join(' · ')}</div></div><div class="mr-event-side">${e.side==='home'?view.match.home:e.side==='away'?view.match.away:''}</div></div>`):html`<${Empty} text="No timestamped tracker events are available in this selection."/>`}
        </section>
      </div>`;
  }

  function StatsView({ view }) {
    const subs = [["overview", "MATCH OVERVIEW"], ["first_half", "1ST HALF"], ["second_half", "2ND HALF"]]
      .concat(view.hasExtraTime ? [["extra_time_first_half", "ET · 1ST HALF"], ["extra_time_second_half", "ET · 2ND HALF"]] : [])
      .concat(view.hasTracker ? [["timeline", "TIMELINE"]] : []);
    const [sub, setSub] = useState("overview");
    const active = subs.some(s => s[0] === sub) ? sub : "overview";
    return html`
      <div>
        <${Subnav} items=${subs} value=${active} onChange=${setSub} />
        ${active === "timeline" ? html`<${Timeline} view=${view} />` : html`<${PeriodStats} key=${active} view=${view} period=${active} />`}
      </div>`;
  }

  // ── Lineups ──
  function PlayerRow({ p, side, mode, onPlayer }) {
    const extra = mode === "height" ? (p.height != null ? `${p.height}cm` : "—") : mode === "age" ? (p.age != null ? `${p.age}y` : "—") : mode === "rating" ? (p.rating != null ? `★ ${p.rating.toFixed(1)}` : "—") : (p.rating != null ? p.rating.toFixed(1) : "");
    return html`
      <button type="button" class="mr-prow" onClick=${() => onPlayer(p)}>
        <span class=${`mr-num ${side}`}>${p.number ?? "•"}</span>
        <span><div class="mr-pname">${p.name || "Unnamed player"}</div><div class="mr-pmeta">${p.position || (p.status === "Substitute" ? "Substitute" : "—")}</div></span>
        <span class="mr-prow-r">${extra}
          ${p.minuteIn != null && p.status === "Substitute" ? html`<span class="mr-in">▲ ${p.minuteIn}'</span>` : ""}
          ${p.minuteOut != null ? html`<span class="mr-out">▼ ${p.minuteOut}'</span>` : ""}</span>
      </button>`;
  }
  function Lineups({ view, onPlayer, homeBadge, awayBadge }) {
    const [mode, setMode] = useState("overview");
    const { lineups, match } = view;
    const has = ["home", "away"].some(s => lineups[s].players.length || lineups[s].substitutes.length);
    if (!has) return html`<${Empty} text="Lineups have not been provided for this match." />`;
    const teams = [["home", match.home, homeBadge], ["away", match.away, awayBadge]];
    return html`
      <div>
        <${Subnav} center=${true} items=${[["overview", "OVERVIEW"], ["age", "AGE"], ["height", "HEIGHT"], ["rating", "AVG. RATING"]]} value=${mode} onChange=${setMode} />
        <section class="mr-card">
          <div class="mr-card-head"><div class="mr-card-title">Line-up pitch</div><span class="mr-pill">TAP A PLAYER FOR STATS</span></div>
          <div style="padding:12px">
            <div class="mr-lu-head">
              <div class="h">${homeBadge && html`<img src=${homeBadge} alt="" />`}${match.home} <small>(${lineups.home.formation || "—"})</small></div>
              <div class="a"><small>(${lineups.away.formation || "—"})</small> ${match.away}${awayBadge && html`<img src=${awayBadge} alt="" />`}</div>
            </div>
            <${Pitch} lineups=${lineups} mode=${mode} onPlayer=${onPlayer} />
          </div>
        </section>
        <div class="mr-lists">
          ${teams.map(([side, name]) => html`
            <section class="mr-card" key=${side}>
              <div class="mr-card-head"><div class="mr-card-title">${name || side} · Starting XI</div><span class="mr-pill">${lineups[side].players.length} PLAYERS</span></div>
              <div class="mr-plist">${lineups[side].players.length ? lineups[side].players.map(p => html`<${PlayerRow} key=${p.key} p=${p} side=${side} mode=${mode} onPlayer=${onPlayer} />`) : html`<${Empty} text="No starting XI recorded." />`}</div>
            </section>`)}
        </div>
        <div class="mr-lists">
          ${teams.map(([side, name]) => html`
            <section class="mr-card" key=${side}>
              <div class="mr-card-head"><div class="mr-card-title">${name || side} · Substitutes</div><span class="mr-pill">${lineups[side].substitutes.length} PLAYERS</span></div>
              <div class="mr-plist">${lineups[side].substitutes.length ? lineups[side].substitutes.map(p => html`<${PlayerRow} key=${p.key} p=${p} side=${side} mode=${mode} onPlayer=${onPlayer} />`) : html`<${Empty} text="No substitutions recorded." />`}</div>
            </section>`)}
        </div>
        ${(lineups.coaches.length || lineups.missingHome.length || lineups.missingAway.length) ? html`
          <section class="mr-card" style="margin-top:12px">
            <div class="mr-card-head"><div class="mr-card-title">Coaches / unavailable</div></div>
            <div class="mr-plist">
              ${lineups.coaches.map((c, i) => html`<div class="mr-prow" key=${"c" + i} style="cursor:default"><span class="mr-num">C</span><span><div class="mr-pname">${c.name}</div><div class="mr-pmeta">${c.team}</div></span><span class="mr-prow-r">Coach</span></div>`)}
              ${[["missingHome", match.home, "home"], ["missingAway", match.away, "away"]].flatMap(([k, team, side]) => lineups[k].map((p, i) => html`<div class="mr-prow" key=${k + i} style="cursor:default"><span class=${`mr-num ${side}`}>!</span><span><div class="mr-pname">${nameOf(p)}</div><div class="mr-pmeta">${team}</div></span><span class="mr-prow-r">${isObj(p) && p.reason ? p.reason : "Missing"}</span></div>`))}
            </div>
          </section>` : ""}
      </div>`;
  }

  // ── Player stats table + popup ──
  function PlayersTable({ view, onPlayer }) {
    const [side, setSide] = useState("all");
    const rows = view.squad.filter(p => side === "all" || p.side === side);
    const cell = v => v === null || v === undefined ? "—" : v;
    if (!view.squad.length) return html`<${Empty} text="No player statistics are available." />`;
    return html`
      <div>
        <${Subnav} items=${[["all", "ALL"], ["home", (view.match.home || "HOME").toUpperCase()], ["away", (view.match.away || "AWAY").toUpperCase()]]} value=${side} onChange=${setSide} />
        <section class="mr-card">
          <div class="mr-card-head"><div class="mr-card-title">Player statistics</div><span class="mr-pill">${rows.length} PLAYERS</span></div>
          <div class="mr-tablewrap" role="region" tabindex="0" aria-label="Player statistics table. Scroll horizontally to view all columns.">
            <table class="mr-table sticky">
              <thead><tr><th>Player</th><th>Team</th><th>Status</th><th>Pos</th><th>Cat.</th><th class="num">Height</th><th class="num">Age</th><th class="num">Rating</th><th class="num">Min</th><th class="num">G</th><th class="num">A</th><th class="num">Shots</th><th class="num">Passes</th></tr></thead>
              <tbody>
                ${rows.map(p => html`
                  <tr key=${p.key} class="click" tabindex="0" onClick=${() => onPlayer(p)} onKeyDown=${e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPlayer(p); } }}>
                    <td><b>${p.name || "—"}</b></td>
                    <td style=${`color:${p.side === "home" ? "var(--mr-home)" : "var(--mr-away)"}`}>${p.side === "home" ? view.match.home : view.match.away}</td>
                    <td class="mr-muted">${p.status}</td>
                    <td>${p.position ? html`<span class="mr-pos">${p.position}</span>` : "—"}</td>
                    <td class="mr-muted" style="text-transform:capitalize">${playerProfile(p).category.replace(/-/g, " ")}</td>
                    <td class="num">${p.height != null ? `${p.height}cm` : "—"}</td><td class="num">${cell(p.age)}</td>
                    <td class="num">${p.rating != null ? html`<span class=${`mr-rate ${ratingClass(p.rating)}`}>${p.rating.toFixed(1)}</span>` : "—"}</td>
                    <td class="num">${cell(p.minutes)}</td><td class="num">${cell(p.goals)}</td><td class="num">${cell(p.assists)}</td><td class="num">${cell(p.shots)}</td><td class="num">${cell(p.passes)}</td>
                  </tr>`)}
              </tbody>
            </table>
          </div>
        </section>
        <div class="mr-hint">Swipe horizontally to see all columns →</div>
      </div>`;
  }

  function PlayerPopup({ player, view, onClose }) {
    useEffect(() => {
      const onKey = e => { if (e.key === "Escape") onClose(); };
      document.addEventListener("keydown", onKey);
      return () => document.removeEventListener("keydown", onKey);
    }, []);
    const profile = playerProfile(player), sections = applicableSections(player);
    const evs = eventsForPlayer(player, view.events).slice().sort((a, b) => (a.sec || 0) - (b.sec || 0));
    const teamName = player.side === "home" ? view.match.home : view.match.away;
    const details = [["Position", player.position || "—"], ["Jersey", player.number ?? "—"], ["Category", profile.category.replace(/-/g, " ")], ["Level", profile.level || "—"], ["Rating", player.rating != null ? player.rating.toFixed(1) : "—"], ["Minutes", player.minutes != null ? `${player.minutes} min` : "—"], ["Age", player.age ?? "—"], ["Height", player.height != null ? `${player.height}cm` : "—"], ["Status", player.status]];
    return html`
      <div class="mr-overlay" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
        <div class="mr-popup" role="dialog" aria-modal="true" aria-label=${`${player.name} statistics`}>
          <div class="mr-popup-head">
            <div><div class="mr-popup-title">${player.name || "Player"}</div><div class="mr-muted">${teamName} · ${player.position || "—"}</div></div>
            <button type="button" class="mr-close" onClick=${onClose} aria-label="Close">×</button>
          </div>
          <div class="mr-profile"><div class="mr-avatar">${player.number ?? "—"}</div>
            <div class="mr-detailgrid">${details.map(d => html`<div class="mr-detail" key=${d[0]}><span>${d[0]}</span><b>${d[1]}</b></div>`)}</div></div>
          ${sections.map(s => html`
            <section class="mr-msec" key=${s.id}><h4>${s.title}</h4>
              <div class="mr-mgrid">${s.metrics.map(m => { const chips = typeChips(player, m, view.events); return html`<div class="mr-mbox" key=${m.key}><strong>${m.label}</strong><b>${metricDisplay(player, m, view.events, view.hasEventLog)}</b>${chips.length ? html`<small>${chips.join(" · ")}</small>` : ""}</div>`; })}</div>
            </section>`)}
          <section class="mr-msec"><h4>MATCH ACTIONS</h4>
            ${evs.length ? evs.map(e => html`<div class="mr-event" key=${e.id}><div class="mr-minute">${Number.isFinite(e.sec) && e.tracker ? fmtClock(e.sec) : Number.isFinite(e.minute) ? `${e.minute}'` : "—"}</div>
              <div><div class="mr-event-main">${e.kind === "sub" ? `${e.playerOut || "—"} → ${e.playerIn || "—"}` : e.metric || e.kind}</div><div class="mr-event-sub">${[e.detail, e.assist && (e.kind === "goal" || e.kind === "penaltygoal") ? `Assist: ${e.assist}` : ""].filter(Boolean).join(" · ")}</div></div>
              <div class="mr-event-side">${teamName}</div></div>`) : html`<${Empty} text="No player-specific actions are available." />`}
          </section>
        </div>
      </div>`;
  }

  // ══════════════════════════════════════════════════════════════════════
  //  MAIN COMPONENT
  // ══════════════════════════════════════════════════════════════════════
  const NAV = [["h2h", "H2H"], ["standings", "STANDINGS"], ["summary", "SUMMARY"], ["stats", "STATS"], ["lineups", "LINEUPS"], ["players", "PLAYER STATS"]];

  function MatchReport({ data, matchId, remote = false, apiBase = "", headers, showHeader = true, initialTab = "summary", homeBadge, awayBadge, onPlayerOpen }) {
    const [tab, setTab] = useState(initialTab);
    const [extra, setExtra] = useState({});
    const [errors, setErrors] = useState({});
    const [selected, setSelected] = useState(null);
    const base = useMemo(() => normalizeReport(data), [data]);
    const view = useMemo(() => {
      let merged = null;
      for (const t of Object.keys(extra)) {
        if (!sectionEmpty(base, t)) continue;
        merged = merged || { ...(isObj(data) ? data : {}) };
        Object.assign(merged, pickSection(t, extra[t]));
      }
      return merged ? normalizeReport(merged) : base;
    }, [data, base, extra]);

    useEffect(() => {
      if (!remote || !matchId || !["h2h", "standings", "lineups", "players"].includes(tab) || extra[tab] || !sectionEmpty(base, tab)) return;
      const controller = new AbortController();
      loadSection(tab, matchId, { apiBase, headers, signal: controller.signal })
        .then(p => { setExtra(c => ({ ...c, [tab]: p })); setErrors(c => ({ ...c, [tab]: "" })); })
        .catch(e => { if (e && e.name !== "AbortError") setErrors(c => ({ ...c, [tab]: `Live ${tab === "players" ? "player stats" : tab} data is unavailable.` })); });
      return () => controller.abort();
    }, [tab, matchId, remote, base]);

    const openPlayer = p => { setSelected(p); if (onPlayerOpen) onPlayerOpen(p); };
    const { match } = view;
    const scoreText = `${match.homeScore ?? "—"}–${match.awayScore ?? "—"}`;
    const onTabKey = e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      e.preventDefault();
      const tabs = Array.from(e.currentTarget.parentElement.querySelectorAll('[role="tab"]'));
      const next = (tabs.indexOf(e.currentTarget) + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
      tabs[next].focus(); tabs[next].click();
    };
    const tabs = html`
      <nav class=${`mr-tabs${showHeader ? "" : " standalone"}`} role="tablist" aria-label="Match report sections">
        ${NAV.map(([id, label]) => html`<button type="button" key=${id} role="tab" id=${`mr-tab-${id}`} aria-selected=${tab === id} aria-controls="mr-panel" tabIndex=${tab === id ? 0 : -1}
          class=${`mr-tab ${tab === id ? "active" : ""}`} onKeyDown=${onTabKey} onClick=${() => { setTab(id); setSelected(null); }}>${label}</button>`)}
      </nav>`;
    const body = tab === "h2h" ? html`<${H2H} view=${view} />`
      : tab === "standings" ? html`<${Standings} view=${view} />`
      : tab === "summary" ? html`<${Summary} view=${view} />`
      : tab === "stats" ? html`<${StatsView} view=${view} />`
      : tab === "lineups" ? html`<${Lineups} view=${view} onPlayer=${openPlayer} homeBadge=${homeBadge} awayBadge=${awayBadge} />`
      : html`<${PlayersTable} view=${view} onPlayer=${openPlayer} />`;
    return html`
      <div class="mr-root">
        ${showHeader ? html`
          <section class="mr-head">
            <div class="mr-ctx">
              <div><span class="mr-ctx-pill">${match.country || "MATCH"}</span><span class="mr-ctx-pill">${match.round || "MATCH"}</span></div>
              <div><span class="mr-ctx-pill">${match.venue || "Venue —"}</span><span class="mr-ctx-pill">${match.referee || "Referee —"}</span></div>
            </div>
            <div class="mr-comp">${match.competition || "MATCH"}</div>
            <div class="mr-teams">
              <div class="mr-team home"><div class="mr-badge">${homeBadge ? html`<img src=${homeBadge} alt="" />` : initials(match.home)}</div><div class="mr-team-name">${match.home || "Home"}</div></div>
              <div class="mr-score"><div class="mr-score-main">${scoreText}</div><div class="mr-status">${match.status}${match.clock ? ` · ${match.clock}` : ""}</div><div class="mr-date">${fmtDate(match.date)}</div></div>
              <div class="mr-team away"><div class="mr-badge">${awayBadge ? html`<img src=${awayBadge} alt="" />` : initials(match.away)}</div><div class="mr-team-name">${match.away || "Away"}</div></div>
            </div>
            ${tabs}
          </section>` : tabs}
        <div class="mr-content" id="mr-panel" role="tabpanel" aria-labelledby=${`mr-tab-${tab}`}>
          ${errors[tab] && html`<div class="mr-alert">${errors[tab]}</div>`}
          ${view.source === "live_draft" || (data && data.available === false) ? html`<div class="mr-alert">${data && data.available === false ? "No public club-tracker snapshot is available for this match yet. It will appear after the tracker saves a draft or submission." : "Live tracker data — figures update automatically."}</div>` : ""}
          ${body}
        </div>
        ${selected && html`<${PlayerPopup} player=${selected} view=${view} onClose=${() => setSelected(null)} />`}
      </div>`;
  }

  return { MatchReport, normalizeReport, loadReport, loadSection, FORMATIONS, version: "2.0.0" };
});


</script>
<script>(function() {
const { h, render } = preact;
const { useState, useEffect, useCallback, useRef, useMemo } = preactHooks;
const html = htm.bind(h);
const API_BASE = '/api';
const MEDIA_PHOTOS_KEY = '__enejistats_club_media_photos__';
const MAX_PHOTOS_BYTES = 10 * 1024 * 1024;
const MGMT_POSITIONS = ['Director', 'General Manager', 'Team Manager', 'Head Coach', 'Assistant Coach', 'Goalkeeper Coach', 'Fitness Coach', 'Kit Manager', 'Club Secretary'];
const fmtDate = (d) => { if (!d) return '—'; try { return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); } catch { return d; } };
const timeAgo = (d) => { if (!d) return '—'; const s = (Date.now() - new Date(d)) / 1000; if (s < 60) return 'Just now'; if (s < 3600) return `${Math.floor(s/60)}m ago`; if (s < 86400) return `${Math.floor(s/3600)}h ago`; return `${Math.floor(s/86400)}d ago`; };
const extractYouTubeId = (url) => { try { const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; } catch { return null; } };
const getFlagUrl = (country) => { if (!country) return null; const map = {Nigeria:'ng',Ghana:'gh',Kenya:'ke','South Africa':'za',Egypt:'eg',Senegal:'sn',Cameroon:'cm',Morocco:'ma',Ethiopia:'et',Uganda:'ug'}; const code = map[country]; return code ? `https://flagcdn.com/24x18/${code}.png` : null; };
const getResultClass = (r) => { if (!r) return 'result-d'; const u = r.toUpperCase(); if (u==='W'||u==='WIN') return 'result-w'; if (u==='L'||u==='LOSS') return 'result-l'; return 'result-d'; };
const getRatingClass = (r) => r >= 7 ? 'rating-great' : r >= 5 ? 'rating-good' : 'rating-low';
const fmt2 = (n) => { if (n == null || n === '' || isNaN(n)) return '—'; return Number(n) % 1 === 0 ? String(n) : Number(n).toFixed(1); };
const copyToClipboard = (text) => { navigator.clipboard.writeText(text).catch(()=>{}); };
const CLUB_STAT_SCHEMA = [
{ id:'attack', title:'ATTACK', fields:[
{key:'goals_for', label:'Goals For'},{key:'goals_against', label:'Goals Against'},
{key:'shots_total', label:'Total Shots'},{key:'shots_on_target', label:'Shots On Target'},

]},
{ id:'discipline', title:'DISCIPLINE', fields:[

]},
];

// Canonical metric registry copied from the Club Stats Tracker. This is the
// display contract for every club metric card and match-results comparison.
const CLUB_TRACKER_METRIC_SECTIONS = [ { id:'attack', title:'ATTACK', metrics:[ {key:'goals',label:'Goals',icon:'fa-futbol',
outfieldOnly:true,types:[['open_play','Open Play'],['set_piece','Set Piece'],['penalty','Penalty'],['free_kick',
'Free Kick']]}, {key:'shots',label:'Shots',icon:'fa-crosshairs',outfieldOnly:true,outcomes:[['on_target',
'On Target'],['off_target','Off Target'],['blocked','Blocked'],['woodwork','Woodwork']],types:[['foot','Foot'],
['header','Header'],['set_piece','Set Piece']]}, {key:'assists',label:'Assists',icon:'fa-hands-helping',
outfieldOnly:true,types:[['open_play','Open Play'],['set_piece','Set Piece'],['transition','Transition']]},
{key:'key_passes',label:'Key Passes',icon:'fa-lightbulb',outfieldOnly:true,types:[['open_play','Open Play'],
['set_piece','Set Piece'],['penetrative','Penetrative / Delivery']]}, {key:'crosses',label:'Crosses',icon:'fa-share',
outfieldOnly:true,outcomes:[['successful','Successful'],['unsuccessful','Unsuccessful']],types:[['open_play',
'Open Play'],['cutback','Cutback'],['set_piece','Set Piece']]}, {key:'passes',label:'Passes',icon:'fa-exchange-alt',
outfieldOnly:true,goalkeeperAvailable:true,outcomes:[['successful','Successful'],['unsuccessful','Unsuccessful']],
types:[['short_medium','Short / Medium'],['long','Long'],['through_ball','Through Ball']]}, {key:'dribbles',
label:'Dribbles',icon:'fa-running',outfieldOnly:true,goalkeeperAvailable:true,outcomes:[['successful','Successful'],
['unsuccessful','Unsuccessful']],types:[['standard','Standard'],['progressive','Progressive'],['take_on',
'Take-On']]}, {key:'carries',label:'Carries',icon:'fa-road',outfieldOnly:true,outcomes:[['successful','Successful'],
['unsuccessful','Unsuccessful']],types:[['standard','Standard'],['progressive','Progressive'],['final_third',

${competitions.length===0 ? html`<div class="empty-state"><i class="fas fa-trophy"></i><div>No competitions available at this time</div></div>` :
competitions.map(c => {
const compId = c._id||c.id;
const appState = competitionApplications[compId];
return html`
<div key=${compId} class="competition-card">
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem;flex-wrap:wrap;">
<div class="competition-card-title" style="flex:1;">${c.title||c.name}</div>
<div style="flex-shrink:0;">
${appState==='applied' ? html`<span class="applied-badge"><i class="fas fa-check-circle"></i> Applied</span>` :
html`<button class="apply-btn" disabled=${appState==='applying'} onClick=${()=>handleApplyCompetition(c)}>
${appState==='applying'?html`<i class="fas fa-spinner fa-spin"></i> Applying...`:html`<i class="fas fa-paper-plane"></i> Apply`}
</button>`
}
</div>
</div>
<p style="font-size:0.83rem;color:#374151;line-height:1.5;margin:0.4rem 0;">${c.description||'—'}</p>
<div class="competition-card-meta">
${c.organizer?html`<span><i class="fas fa-building"></i> ${c.organizer}</span>`:''}
${c.date?html`<span><i class="fas fa-calendar"></i> ${fmtDate(c.date)}</span>`:''}
${c.location?html`<span><i class="fas fa-map-pin"></i> ${c.location}</span>`:''}
</div>
${c.eligibility?html`<div style="margin-top:0.5rem;font-size:0.8rem;background:#f0f9ff;padding:0.4rem 0.65rem;border-radius:5px;color:#0369a1;"><i class="fas fa-check-circle"></i> Eligibility: ${c.eligibility}</div>`:''}
${appState==='applied'?html`<div style="margin-top:0.5rem;font-size:0.78rem;background:#dcfce7;padding:0.4rem 0.65rem;border-radius:5px;color:#166534;"><i class="fas fa-check"></i> Application submitted. Club ID ${clubId} attached.</div>`:''}
</div>
`;
})
}
</div>
</div>
`}
<!-- ══ NOTIFICATIONS TAB ══ -->
${activeTab==='notifications' && html`
<div>
<div class="card">
<div class="card-title" style="justify-content:space-between;">
<span><i class="fas fa-bell"></i> Notifications ${unreadCount>0?html`<span style="background:var(--primary);color:white;font-size:0.68rem;padding:1px 8px;border-radius:999px;margin-left:0.25rem;">${unreadCount}</span>`:''}</span>
${unreadCount>0 && html`<button class="btn btn-sm btn-outline" onClick=${markAllRead}>Mark All Read</button>`}
</div>
<div class="filter-bar" style="margin-bottom:0.75rem;">
${['all','match_result','admin','competition','player_inquiry'].map(f=>html`
<button key=${f} class=${`filter-btn ${notifSubTab===f?'active':''}`} onClick=${()=>setNotifSubTab(f)}>
${f==='all'?'All':f.replace(/_/g,' ').split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ')}
</button>
`)}
</div>
${notifications.filter(n=>notifSubTab==='all'||n.type===notifSubTab||(n.type||'').includes(notifSubTab)).length===0 ?
html`<div class="empty-state"><i class="fas fa-bell-slash"></i><div>No notifications</div></div>` :
notifications.filter(n=>notifSubTab==='all'||n.type===notifSubTab||(n.type||'').includes(notifSubTab)).map(n => {
const nid = n._id||n.id;
const isEx = expandedNotif===nid;
const iconMap = { match_result:'fa-futbol', admin:'fa-shield-halved', competition:'fa-trophy', player_inquiry:'fa-user' };
return html`
<div key=${nid} class=${`notif-item ${!n.read?'unread':''}`} onClick=${()=>{setExpandedNotif(isEx?null:nid);if(!n.read)markNotifRead(nid);}}>
<div class="notif-item-row">
<div class="notif-icon"><i class=${`fas ${iconMap[n.type]||'fa-bell'}`}></i></div>
<div class="notif-body">
<div class="notif-type">${(n.type||'notification').replace(/_/g,' ').toUpperCase()}</div>
<div class="notif-msg">${n.message||n.body||'—'}</div>
<div class="notif-time">${timeAgo(n.created_at||n.timestamp)}</div>
</div>
<div class="notif-tick-wrap">
<span class=${`notif-tick ${!n.read?'unread':'read'}`}>${!n.read?'✓':'✓✓'}</span>
<button style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:0.78rem;padding:0.15rem;" onClick=${e=>{e.stopPropagation();deleteNotif(nid);}} title="Delete"><i class="fas fa-trash"></i></button>
</div>
</div>
${isEx && html`<div class="notif-expanded">${n.message||n.body||'—'}</div>`}
</div>
`;
})
}
</div>
</div>
`}
<!-- ══ ACCOUNT TAB ══ -->
${activeTab==='account' && html`
<div class="sub-tabs" style="max-width:320px;">
<button class=${`sub-tab-btn ${accountSubTab==='settings'?'active':''}`} onClick=${()=>setAccountSubTab('settings')}><i class="fas fa-gear"></i> Settings</button>
<button class=${`sub-tab-btn ${accountSubTab==='support'?'active':''}`} onClick=${()=>setAccountSubTab('support')}><i class="fas fa-headset"></i> Support</button>
</div>
`}
${activeTab==='account' && accountSubTab==='support' && html`
<div>
<div class="card">
<div class="card-title"><i class="fas fa-headset"></i> Club Support</div>
${!chatTicket ? html`
<div style="text-align:center;padding:1.5rem 0;">
<div style="font-size:2rem;color:var(--primary);margin-bottom:0.75rem;"><i class="fas fa-comments"></i></div>
<div style="font-weight:700;font-size:1rem;margin-bottom:0.35rem;">Need Help?</div>
<div style="font-size:0.85rem;color:#64748b;margin-bottom:1.25rem;">Open a support ticket and chat with our team.</div>
<div style="max-width:320px;margin:0 auto;">
<label style="font-size:0.82rem;font-weight:700;color:#374151;display:block;text-align:left;margin-bottom:0.35rem;">Reason for contacting support</label>
<select class="ticket-reason-select" value=${ticketReason} onChange=${e=>setTicketReason(e.target.value)}>
<option value="">Select a reason...</option>
<option value="profile_issue">Club Profile Issue</option>
<option value="stats_issue">Match Stats Issue</option>
<option value="match_request">Match Request Issue</option>
<option value="technical">Technical Problem</option>
<option value="account">Account & Access</option>
<option value="billing">Billing / Tokens</option>
<option value="other">Other</option>
</select>
<button class="ticket-start-btn" onClick=${startSupportChat} disabled=${!ticketReason}><i class="fas fa-comments"></i> Start Support Chat</button>
</div>
</div>
` : html`
<div>
<div style="font-size:0.82rem;font-weight:700;color:#16a34a;margin-bottom:0.75rem;"><i class="fas fa-circle-check"></i> Ticket #${chatTicket.ticket_id} — ${chatTicket.reason}</div>
<div style="height:300px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:0.75rem;display:flex;flex-direction:column;gap:0.65rem;background:#f8fafc;">
${chatMessages.map(msg => html`
<div key=${msg.id} class=${`chat-msg ${msg.sender==='club'?'sent':msg.sender==='system'?'':msg.sender==='support'?'received':''}`}>
${msg.sender==='system' ? html`<div style="text-align:center;font-size:0.72rem;color:#94a3b8;">${msg.text}</div>` :
html`<div class="chat-msg-bubble">${msg.text}</div>
<div class="chat-msg-meta">${msg.sender==='club'?'You':'Support Agent'}</div>`
}
</div>
`)}
<div ref=${chatBottomRef}></div>
</div>
<div style="display:flex;gap:0.5rem;margin-top:0.65rem;">
<input class="chat-input" placeholder="Type your message..." value=${chatInput} onInput=${e=>setChatInput(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&!e.shiftKey&&sendChatMessage()} />
<button class="chat-send-btn" onClick=${sendChatMessage}><i class="fas fa-paper-plane"></i></button>
</div>
</div>
`}
</div>
<div class="card">
<div class="card-title"><i class="fas fa-phone"></i> Direct Contact</div>
<div style="font-size:0.85rem;color:#374151;line-height:2;">
<div><i class="fas fa-envelope" style="color:var(--primary);width:18px;"></i> <strong>Email:</strong> enejistats@gmail.com</div>
<div><i class="fas fa-phone" style="color:var(--primary);width:18px;"></i> <strong>Phone:</strong> +234 808 394 0039</div>
<div><i class="fab fa-whatsapp" style="color:#25d366;width:18px;"></i> <strong>WhatsApp:</strong> +234 706 555 6569</div>
</div>
</div>
</div>
`}
${activeTab==='account' && accountSubTab==='settings' && html`
<div>
<div class="card">
<div class="card-title"><i class="fas fa-image"></i> Club Badge / Photo</div>
<div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
<img src=${editPhotoPreview||badgeUrl||badgeFallback} alt=${clubName} style="width:80px;height:80px;border-radius:10px;border:3px solid var(--primary);object-fit:contain;background:#f8fafc;padding:4px;" onerror=${`this.src='${badgeFallback}'`} />
<div style="flex:1;">
<div style="font-size:0.85rem;font-weight:700;color:#374151;margin-bottom:0.5rem;">Upload a new club badge or photo</div>
<div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
<label class="btn btn-outline btn-sm" style="cursor:pointer;">
<i class="fas fa-upload"></i> Choose Image
<input ref=${photoInputRef} type="file" accept="image/*" style="display:none;" onChange=${handleSettingsPhotoSelect} />
</label>
${editPhotoFile && html`<button class="btn btn-primary btn-sm" onClick=${handleProfilePhotoSave}><i class="fas fa-check"></i> Save Badge</button>`}
${editPhotoPreview && html`<button class="btn btn-sm" style="border:1.5px solid #e2e8f0;" onClick=${()=>{setEditPhotoPreview(null);setEditPhotoFile(null);}}><i class="fas fa-times"></i> Cancel</button>`}
</div>
<div style="font-size:0.75rem;color:#94a3b8;margin-top:0.35rem;">Accepted: JPG, PNG, SVG. Recommended: square image.</div>
</div>
</div>
</div>
<div class="card">
<div class="card-title" style="justify-content:space-between;">
<span><i class="fas fa-users-gear"></i> Management Team</span>
<button class="btn btn-primary btn-sm" onClick=${()=>{setMgmtEditTarget(-1);setMgmtModalOpen(true);}}><i class="fas fa-plus"></i> Add Personnel</button>
</div>
${managementTeam.length===0 ? html`<div class="empty-state" style="padding:1rem;"><i class="fas fa-users-slash"></i><div>No management personnel added yet</div></div>` :
managementTeam.map((person,idx)=>html`
<div key=${idx} class="mgmt-person-row">
<span class="mgmt-pos-chip">${person.position}</span>
<span class="mgmt-name">${person.name}</span>
<button class="mgmt-edit-btn" onClick=${()=>{setMgmtEditTarget(idx);setMgmtModalOpen(true);}}><i class="fas fa-pen"></i> Edit</button>
</div>
`)
}
</div>
<div class="card">
<div class="card-title"><i class="fas fa-lock"></i> Change Password</div>
<div class="form-group"><label>Current Password</label><input type="password" value=${pwForm.current} onInput=${e=>setPwForm(p=>({...p,current:e.target.value}))} placeholder="Enter current password" /></div>
<div class="form-row">
<div class="form-group"><label>New Password</label><input type="password" value=${pwForm.newpw} onInput=${e=>setPwForm(p=>({...p,newpw:e.target.value}))} placeholder="New password" /></div>
<div class="form-group"><label>Confirm New Password</label><input type="password" value=${pwForm.confirm} onInput=${e=>setPwForm(p=>({...p,confirm:e.target.value}))} placeholder="Confirm new password" /></div>
</div>
<button class="btn btn-primary" onClick=${handlePasswordChange} disabled=${!pwForm.current||!pwForm.newpw||!pwForm.confirm}><i class="fas fa-key"></i> Change Password</button>
</div>
<div class="card">
<div class="card-title"><i class="fas fa-info-circle"></i> Account Information</div>
<div style="font-size:0.85rem;line-height:2;">
<div><strong>Club ID:</strong> <span style="font-family:var(--mono);">${clubId}</span></div>
<div><strong>Club Name:</strong> ${clubName}</div>
<div><strong>Email:</strong> ${club?.email||'—'}</div>
<div><strong>Category:</strong> ${club?.club_category||'—'}</div>
<div><strong>Country:</strong> ${club?.country||'—'}</div>
<div><strong>Token Balance:</strong> ${tokenBalance} tokens</div>
</div>
</div>
<div class="card">
<div class="card-title"><i class="fas fa-sign-out-alt"></i> Session</div>
<button class="btn btn-danger" onClick=${handleLogout}><i class="fas fa-sign-out-alt"></i> Logout</button>
</div>
</div>
`}
</div>
</main>
<button class="support-fab" onClick=${()=>{setAccountSubTab('support');showTab('account');}} title="Support"><i class="fas fa-headset"></i></button>
`;
}
render(h(App, null), document.getElementById('root'));
})();</script>
<script>if ('serviceWorker' in navigator) {
window.addEventListener('load', function() {
navigator.serviceWorker.register('/sw.js', { scope: '/' })
.then(function(reg) {
reg.addEventListener('updatefound', function() {
var newWorker = reg.installing;
if (newWorker) {
newWorker.addEventListener('statechange', function() {
if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
newWorker.postMessage({ type: 'SKIP_WAITING' });
}
});
}
});
})
.catch(function(err) {
console.warn('SW registration failed (non-fatal):', err);
});
navigator.serviceWorker.addEventListener('controllerchange', function() {
window.location.reload();
});
});
}</script>
</body>
</html>
