<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Forgot Password — Enejistats</title>
  <meta name="description" content="Reset your Enejistats account password securely."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* ────────────────────────────────────────────────
       Reset & root tokens
    ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0b1630;
      --bg-alt:      #0d1b3e;
      --surface:     #141f3a;
      --surface-2:   #1a2548;
      --border:      rgba(255,255,255,.09);
      --border-focus:rgba(255,215,0,.55);
      --primary:     #1a56db;
      --gold:        #f5b800;
      --gold-dim:    rgba(255,215,0,.12);
      --muted:       #94a3b8;
      --text:        #cbd5e1;
      --text-bright: #e2e8f0;
      --warning:#f59e0b;--danger:      #ef4444;
      --danger-dim:  rgba(239,68,68,.08);
      --success:     #22c55e;
      --success-dim: rgba(34,197,94,.08);
      --info:        #3b82f6;
      --info-dim:    rgba(59,130,246,.08);
      --warn:        #f59e0b;

      --radius-sm:  6px;
      --radius-md:  10px;
      --radius-lg:  16px;
      --radius-xl:  20px;

      --shadow-card: 0 24px 64px rgba(0,0,0,.45);
      --shadow-glow: 0 0 20px rgba(255,215,0,.18);

      --transition: .2s cubic-bezier(.4,0,.2,1);
      --transition-slow: .35s cubic-bezier(.4,0,.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Focus ring ── */
    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }

    /* ────────────────────────────────────────────────
       Top navigation
    ──────────────────────────────────────────────── */
    .site-header {
      background: rgba(11,22,48,.96);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 82px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .header-tagline {
      font-size: .68rem;
      color: var(--muted);
      letter-spacing: .6px;
      flex: 1;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .header-nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: .82rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      transition: color var(--transition), background var(--transition);
    }
    .header-nav a:hover {
      color: var(--text-bright);
      background: rgba(255,255,255,.06);
    }
    .header-nav a.nav-cta {
      color: var(--gold);
      border: 1px solid rgba(255,215,0,.3);
    }
    .header-nav a.nav-cta:hover {
      background: var(--gold-dim);
      color: var(--gold);
    }

    /* ────────────────────────────────────────────────
       Page layout
    ──────────────────────────────────────────────── */
    .page-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }

    /* ────────────────────────────────────────────────
       Card
    ──────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 44px 40px 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: .45;
    }

    /* ── Step icon ── */
    .card-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--gold-dim);
      border: 1px solid rgba(255,215,0,.22);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      margin: 0 auto 22px;
      transition: background var(--transition-slow), border-color var(--transition-slow);
    }
    .card-icon i { color: var(--gold); }
    .card-icon.success-icon-wrap {
      width: 76px; height: 76px;
      background: var(--success-dim);
      border: 2px solid var(--success);
      font-size: 2rem;
    }
    .card-icon.success-icon-wrap i { color: var(--success); }

    /* ── Headings ── */
    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -.3px;
    }
    .sub {
      font-size: .84rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.65;
    }
    .sub strong { color: var(--gold); font-weight: 700; }
    .masked-email {
      color: var(--gold);
      font-weight: 700;
    }

    /* ────────────────────────────────────────────────
       Step indicator
    ──────────────────────────────────────────────── */
    .steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin-bottom: 30px;
    }

    .step-dot {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 700;
      background: rgba(255,255,255,.05);
      border: 1.5px solid rgba(255,255,255,.12);
      color: var(--muted);
      transition: background var(--transition-slow), border-color var(--transition-slow),
                  color var(--transition-slow), box-shadow var(--transition-slow),
                  transform var(--transition-slow);
      position: relative;
      z-index: 1;
    }
    .step-dot.active {
      background: var(--gold-dim);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 0 4px rgba(255,215,0,.1), 0 0 16px rgba(255,215,0,.18);
      transform: scale(1.08);
    }
    .step-dot.done {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
      transform: scale(1);
      box-shadow: none;
    }
    .step-dot.done i { font-size: .6rem; animation: pop-in .25s ease; }

    @keyframes pop-in {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .step-line {
      width: 48px; height: 2px;
      background: rgba(255,255,255,.07);
      transition: background var(--transition-slow);
      position: relative;
    }
    .step-line.done {
      background: var(--success);
    }
    .step-line.done::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 100%;
      background: linear-gradient(90deg, var(--success), #4ade80);
      border-radius: 2px;
      animation: line-fill .4s ease forwards;
    }

    @keyframes line-fill {
      from { width: 0; }
      to   { width: 100%; }
    }

    /* ────────────────────────────────────────────────
       Form elements
    ──────────────────────────────────────────────── */
    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: .72rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .9px;
      margin-bottom: 7px;
    }

    .input-base {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      color: #fff;
      font-size: .92rem;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
    }
    .input-base:focus {
      border-color: var(--primary);
      background: rgba(255,255,255,.07);
      box-shadow: 0 0 0 3px rgba(26,86,219,.18);
    }
    .input-base[aria-invalid="true"] {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(239,68,68,.15);
    }
    .input-base::placeholder { color: var(--muted); }

    /* ── OTP boxes ── */
    .otp-grid {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .otp-box {
      width: 52px;
      height: 58px;
      background: rgba(255,255,255,.06);
      border: 2px solid rgba(255,255,255,.14);
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 1.65rem;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      text-align: center;
      outline: none;
      caret-color: var(--gold);
      transition: border-color var(--transition), background var(--transition),
                  box-shadow var(--transition), transform var(--transition);
      -webkit-appearance: none;
      appearance: none;
    }
    .otp-box:focus {
      border-color: var(--gold);
      background: rgba(255,215,0,.06);
      box-shadow: 0 0 0 3px rgba(255,215,0,.14);
      transform: translateY(-2px);
    }
    .otp-box.filled {
      border-color: rgba(255,215,0,.5);
      background: rgba(255,215,0,.07);
    }
    .otp-box[aria-invalid="true"] {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(239,68,68,.15);
    }

    /* ── OTP countdown ── */
    .otp-countdown-wrap {
      text-align: center;
      margin-bottom: 16px;
    }
    .otp-countdown-label {
      font-size: .72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .7px;
      margin-bottom: 4px;
    }
    .otp-countdown-timer {
      font-size: 1.6rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: .05em;
      color: var(--gold);
      font-family: 'Courier New', monospace;
      transition: color var(--transition);
    }
    .otp-countdown-timer.urgent { color: var(--danger); }

    /* ── Password wrap ── */
    .pw-wrap { position: relative; }
    .pw-wrap .input-base { padding-right: 44px; }
    .pw-toggle {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: .9rem; padding: 5px;
      border-radius: var(--radius-sm);
      transition: color var(--transition);
      line-height: 1;
    }
    .pw-toggle:hover { color: var(--text-bright); }

    /* ── Strength bar ── */
    .strength-bar {
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,.07);
      margin-top: 9px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width .35s ease, background .35s ease;
    }
    .strength-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .strength-label {
      font-size: .72rem;
      font-weight: 600;
      transition: color .35s ease;
    }
    .caps-warning {
      font-size: .7rem;
      color: var(--warn);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Requirements checklist ── */
    .pw-requirements {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
    }
    .req-item {
      font-size: .74rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color var(--transition);
    }
    .req-item.met { color: var(--success); }
    .req-item i { width: 12px; font-size: .7rem; }

    /* ────────────────────────────────────────────────
       Buttons
    ──────────────────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-md);
      border: none;
      font-size: .92rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity var(--transition), transform .1s, box-shadow var(--transition);
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-gold {
      background: var(--gold);
      color: #1e1e2f;
    }
    .btn-gold:hover:not(:disabled) {
      opacity: .92;
      box-shadow: 0 4px 20px rgba(255,215,0,.25);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,215,0,.35);
      color: var(--gold);
    }
    .btn-outline:hover:not(:disabled) {
      background: var(--gold-dim);
      border-color: rgba(255,215,0,.6);
    }

    .btn-ghost-back {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: .82rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      margin-bottom: 16px;
      font-family: inherit;
      transition: color var(--transition);
    }
    .btn-ghost-back:hover { color: var(--text-bright); }

    /* Ripple */
    .btn-ripple::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.1);
      transform: scale(0);
      opacity: 0;
      border-radius: inherit;
      transition: transform .4s ease, opacity .4s ease;
    }
    .btn-ripple:active::after {
      transform: scale(1);
      opacity: 1;
      transition: 0s;
    }

    /* ────────────────────────────────────────────────
       Alerts
    ──────────────────────────────────────────────── */
    .alert {
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: .84rem;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
      line-height: 1.55;
      animation: slide-down .25s ease;
    }
    .alert i { margin-top: 2px; flex-shrink: 0; }

    @keyframes slide-down {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .alert-error   {
      background: var(--danger-dim);
      border: 1px solid rgba(239,68,68,.28);
      color: #f87171;
    }
    .alert-success {
      background: var(--success-dim);
      border: 1px solid rgba(34,197,94,.28);
      color: #4ade80;
    }
    .alert-info    {
      background: var(--info-dim);
      border: 1px solid rgba(59,130,246,.28);
      color: #93c5fd;
    }

    /* ────────────────────────────────────────────────
       Bottom nav links
    ──────────────────────────────────────────────── */
    .bottom-nav {
      text-align: center;
      margin-top: 26px;
      font-size: .82rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .bottom-nav a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      padding: 2px 4px;
      border-radius: var(--radius-sm);
      transition: opacity var(--transition);
    }
    .bottom-nav a:hover { opacity: .8; }
    .bottom-nav .sep { color: rgba(255,255,255,.18); }

    /* ────────────────────────────────────────────────
       Resend row
    ──────────────────────────────────────────────── */
    .resend-row {
      text-align: center;
      margin-top: 14px;
      font-size: .8rem;
      color: var(--muted);
    }
    .resend-btn-inline {
      background: none; border: none;
      color: var(--gold); cursor: pointer;
      font-size: .8rem; font-weight: 700;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      transition: opacity var(--transition);
    }
    .resend-btn-inline:disabled { opacity: .4; cursor: not-allowed; }
    .resend-btn-inline:not(:disabled):hover { opacity: .8; }

    /* ────────────────────────────────────────────────
       Success animated checkmark
    ──────────────────────────────────────────────── */
    .success-check-wrap {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--success-dim);
      border: 2px solid var(--success);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; color: var(--success);
      margin: 0 auto 24px;
      animation: success-pop .5s cubic-bezier(.175,.885,.32,1.275) forwards;
      transform-origin: center;
    }
    @keyframes success-pop {
      0%   { transform: scale(0) rotate(-10deg); opacity: 0; }
      70%  { transform: scale(1.12) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .success-check-wrap i {
      animation: check-appear .35s .25s ease both;
    }
    @keyframes check-appear {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .success-badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: .7rem;
      font-weight: 600;
      color: var(--success);
      background: var(--success-dim);
      border: 1px solid rgba(34,197,94,.25);
      border-radius: 100px;
      padding: 3px 10px;
      letter-spacing: .3px;
    }

    .success-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    /* ────────────────────────────────────────────────
       Footer
    ──────────────────────────────────────────────── */
    .site-footer {
      background: rgba(11,22,48,.8);
      border-top: 1px solid var(--border);
      padding: 18px 24px;
      text-align: center;
      font-size: .72rem;
      color: var(--muted);
    }
    .site-footer a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }
    .site-footer a:hover { text-decoration: underline; }

    /* ────────────────────────────────────────────────
       Screen transition
    ──────────────────────────────────────────────── */
    .step-enter {
      animation: step-in .28s ease forwards;
    }
    @keyframes step-in {
      from { opacity: 0; transform: translateX(14px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ────────────────────────────────────────────────
       Spinner
    ──────────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .fa-spin { animation: spin .7s linear infinite; }

    /* ────────────────────────────────────────────────
       Divider
    ──────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 22px 0;
    }

    /* ────────────────────────────────────────────────
       Responsive
    ──────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .site-header { padding: 0 16px; }
      .header-tagline { display: none; }
      .header-nav a:not(.nav-cta) { display: none; }
      .card { padding: 32px 20px 28px; border-radius: var(--radius-lg); }
      .otp-box { width: 44px; height: 52px; font-size: 1.4rem; }
      .otp-grid { gap: 6px; }
      .pw-requirements { grid-template-columns: 1fr; }
    }

    @media (max-width: 360px) {
      .otp-box { width: 38px; height: 48px; font-size: 1.25rem; }
      .otp-grid { gap: 4px; }
    }

    @media (min-width: 1200px) {
      .card { max-width: 480px; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>

</head>
<body>

  <div id="app"></div>

  <!-- Preact UMD + hooks + htm -->
  <script src="https://unpkg.com/preact@10.19.6/dist/preact.umd.js"></script>
  <script src="https://unpkg.com/preact@10.19.6/hooks/dist/hooks.umd.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

  <script>
  (function () {
    'use strict';

    const { h, render, Fragment } = preact;
    const { useState, useEffect, useRef, useCallback, useReducer } = preactHooks;
    const html = htm.bind(h);

    /* ═══════════════════════════════════════════════════
       API LAYER
       Compatible with both current and future FastAPI endpoints.
       Current:  POST /api/auth/reset-password-otp { email, otp, new_password }
       Future:   POST /api/auth/forgot-password    { email }          → 204
                 POST /api/auth/verify-reset-code  { email, otp }     → { reset_token }
                 POST /api/auth/reset-password     { reset_token, new_password }
                 POST /api/auth/resend-reset-code  { email }          → 204
    ═══════════════════════════════════════════════════ */
    const API_BASE = '/api/auth';

    async function apiFetch(path, body, signal) {
      const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal,
      });

      let data = {};
      try { data = await res.json(); } catch (_) {}

      if (!res.ok) {
        const msg = data.detail
          || data.message
          || data.error
          || 'An unexpected error occurred. Please try again.';
        const err = new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
        err.status = res.status;
        throw err;
      }
      return data;
    }

    const api = {
      sendCode:   (email, signal)                        => apiFetch('/forgot-password',   { email },                       signal),
      verifyOtp:  (email, otp, signal)                   => apiFetch('/verify-reset-code',  { email, otp },                  signal),
      resetPw:    (email, otp, newPw, signal)            => apiFetch('/reset-password-otp', { email, otp, new_password: newPw }, signal),
      resetPwToken:(token, newPw, signal)                => apiFetch('/reset-password',     { reset_token: token, new_password: newPw }, signal),
      resendCode: (email, signal)                        => apiFetch('/resend-reset-code',  { email },                       signal),
    };

    /* ═══════════════════════════════════════════════════
       HELPERS
    ═══════════════════════════════════════════════════ */
    function maskEmail(email) {
      const [local, domain] = email.split('@');
      if (!domain) return email;
      const visible = local.slice(0, Math.min(3, local.length));
      return visible + '•••@' + domain;
    }

    function validateEmail(val) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val.trim());
    }

    function formatTimer(seconds) {
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      return m + ':' + s;
    }

    function sanitizePassword(val) { return val; }

    function getPasswordStrength(pw, email) {
      if (!pw) return { score: 0, label: '', color: 'transparent', pct: 0 };
      let score = 0;
      if (pw.length >= 10)            score++;
      if (/[A-Z]/.test(pw))           score++;
      if (/[a-z]/.test(pw))           score++;
      if (/[0-9]/.test(pw))           score++;
      if (/[^A-Za-z0-9]/.test(pw))   score++;
      const tiers = [
        { label: '',           color: 'transparent', pct: 0   },
        { label: 'Weak',       color: '#ef4444',     pct: 20  },
        { label: 'Fair',       color: '#f59e0b',     pct: 40  },
        { label: 'Good',       color: '#3b82f6',     pct: 65  },
        { label: 'Strong',     color: '#22c55e',     pct: 85  },
        { label: 'Very Strong',color: '#16a34a',     pct: 100 },
      ];
      return { score, ...tiers[score] };
    }

    function getRequirements(pw, email) {
      const e = (email || '').toLowerCase().split('@')[0];
      return [
        { key: 'len',     label: '10+ characters',     met: pw.length >= 10 },
        { key: 'upper',   label: 'Uppercase letter',   met: /[A-Z]/.test(pw) },
        { key: 'lower',   label: 'Lowercase letter',   met: /[a-z]/.test(pw) },
        { key: 'number',  label: 'Number',              met: /[0-9]/.test(pw) },
        { key: 'special', label: 'Special character',  met: /[^A-Za-z0-9]/.test(pw) },
        { key: 'noEmail', label: 'No email in password', met: !e || !pw.toLowerCase().includes(e) },
      ];
    }

    function validatePassword(pw, confirmPw, email) {
      const errs = [];
      if (pw.trim() !== pw)       errs.push('Password cannot start or end with spaces.');
      if (pw.length < 10)         errs.push('Password must be at least 10 characters.');
      if (!/[A-Z]/.test(pw))      errs.push('Must include an uppercase letter.');
      if (!/[a-z]/.test(pw))      errs.push('Must include a lowercase letter.');
      if (!/[0-9]/.test(pw))      errs.push('Must include a number.');
      if (!/[^A-Za-z0-9]/.test(pw)) errs.push('Must include a special character.');
      const localPart = (email || '').split('@')[0].toLowerCase();
      if (localPart && pw.toLowerCase().includes(localPart))
        errs.push('Password cannot contain your email address.');
      if (pw !== confirmPw)       errs.push('Passwords do not match.');
      return errs;
    }

    /* ═══════════════════════════════════════════════════
       OTP INPUT — 6 separate boxes
    ═══════════════════════════════════════════════════ */
    function OtpInput({ onComplete, disabled, hasError }) {
      const [digits, setDigits] = useState(['','','','','','']);
      const inputsRef = useRef([]);
      const LEN = 6;

      useEffect(() => {
        inputsRef.current[0] && inputsRef.current[0].focus();
      }, []);

      function focusIndex(i) {
        const el = inputsRef.current[Math.max(0, Math.min(i, LEN - 1))];
        el && el.focus();
      }

      function updateDigits(newDigits) {
        setDigits(newDigits);
        const val = newDigits.join('');
        if (val.length === LEN) onComplete(val);
      }

      function handleKeyDown(i, e) {
        if (e.key === 'Backspace') {
          e.preventDefault();
          const nd = [...digits];
          if (nd[i]) {
            nd[i] = '';
            updateDigits(nd);
          } else if (i > 0) {
            nd[i - 1] = '';
            updateDigits(nd);
            focusIndex(i - 1);
          }
        } else if (e.key === 'ArrowLeft' && i > 0) {
          e.preventDefault();
          focusIndex(i - 1);
        } else if (e.key === 'ArrowRight' && i < LEN - 1) {
          e.preventDefault();
          focusIndex(i + 1);
        } else if (e.key === 'Delete') {
          e.preventDefault();
          const nd = [...digits];
          nd[i] = '';
          updateDigits(nd);
        }
      }

      function handleInput(i, e) {
        const raw = e.target.value.replace(/\D/g, '');
        if (!raw) return;

        if (raw.length > 1) {
          // Paste or multi-character input
          const chars = raw.slice(0, LEN).split('');
          const nd = [...digits];
          chars.forEach((c, ci) => { if (i + ci < LEN) nd[i + ci] = c; });
          updateDigits(nd);
          const nextFocus = Math.min(i + chars.length, LEN - 1);
          focusIndex(nextFocus);
          return;
        }

        const nd = [...digits];
        nd[i] = raw[0];
        updateDigits(nd);
        if (i < LEN - 1) focusIndex(i + 1);
      }

      function handlePaste(e) {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text');
        const nums  = text.replace(/\D/g, '').slice(0, LEN);
        if (!nums) return;
        const nd = ['','','','','',''];
        nums.split('').forEach((c, i) => { nd[i] = c; });
        updateDigits(nd);
        focusIndex(Math.min(nums.length, LEN - 1));
      }

      function handleFocus(i, e) {
        e.target.select();
      }

      return html`
        <div
          class="otp-grid"
          role="group"
          aria-label="6-digit verification code"
        >
          ${digits.map((d, i) => html`
            <input
              key=${i}
              ref=${el => (inputsRef.current[i] = el)}
              type="text"
              inputmode="numeric"
              maxlength="6"
              class=${'otp-box' + (d ? ' filled' : '') + (hasError ? ' [aria-invalid=true]' : '')}
              aria-label=${'Digit ' + (i + 1) + ' of 6'}
              aria-invalid=${hasError ? 'true' : 'false'}
              value=${d}
              autocomplete=${i === 0 ? 'one-time-code' : 'off'}
              disabled=${disabled}
              onKeyDown=${e => handleKeyDown(i, e)}
              onInput=${e => handleInput(i, e)}
              onPaste=${handlePaste}
              onFocus=${e => handleFocus(i, e)}
            />
          `)}
        </div>
      `;
    }

    /* ═══════════════════════════════════════════════════
       STEP 2 — OTP
    ═══════════════════════════════════════════════════ */
    const OTP_EXPIRY_SECS = 600;  // 10 minutes
    const RESEND_COOLDOWN = 60;

    function Step2({ email, onSuccess, onBack }) {
      const [otp, setOtp]               = useState('');
      const [loading, setLoading]       = useState(false);
      const [alert, setAlert]           = useState(null);
      const [otpError, setOtpError]     = useState(false);
      const [expiry, setExpiry]         = useState(OTP_EXPIRY_SECS);
      const [resendLeft, setResendLeft] = useState(RESEND_COOLDOWN);
      const [canResend, setCanResend]   = useState(false);
      const [resending, setResending]   = useState(false);
      const abortRef                    = useRef(null);
      const expiryRef                   = useRef(null);
      const resendRef                   = useRef(null);

      function startExpiry() {
        clearInterval(expiryRef.current);
        setExpiry(OTP_EXPIRY_SECS);
        expiryRef.current = setInterval(() => {
          setExpiry(prev => {
            if (prev <= 1) { clearInterval(expiryRef.current); return 0; }
            return prev - 1;
          });
        }, 1000);
      }

      function startResendTimer() {
        clearInterval(resendRef.current);
        setResendLeft(RESEND_COOLDOWN);
        setCanResend(false);
        resendRef.current = setInterval(() => {
          setResendLeft(prev => {
            if (prev <= 1) {
              clearInterval(resendRef.current);
              setCanResend(true);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
      }

      useEffect(() => {
        startExpiry();
        startResendTimer();
        return () => {
          clearInterval(expiryRef.current);
          clearInterval(resendRef.current);
          abortRef.current && abortRef.current.abort();
        };
      }, []);

      function handleComplete(val) {
        setOtp(val);
        setOtpError(false);
      }

      async function handleSubmit(e) {
        e.preventDefault();
        setAlert(null);
        if (otp.length < 6) {
          setOtpError(true);
          setAlert({ type: 'error', msg: 'Please enter all 6 digits of the reset code.' });
          return;
        }
        if (expiry === 0) {
          setAlert({ type: 'error', msg: 'Your code has expired. Please request a new one.' });
          return;
        }

        if (abortRef.current) abortRef.current.abort();
        abortRef.current = new AbortController();
        setLoading(true);

        try {
          // Try the newer verify-reset-code endpoint first; fall back gracefully
          let token = null;
          try {
            const data = await api.verifyOtp(email, otp, abortRef.current.signal);
            token = data.reset_token || null;
          } catch (err) {
            if (err.name === 'AbortError') return;
            // If 404 (endpoint doesn't exist yet), proceed without token (step-3 will validate)
            if (err.status !== 404) {
              throw err;
            }
          }
          setLoading(false);
          onSuccess(otp, token);
        } catch (err) {
          if (err.name === 'AbortError') return;
          setLoading(false);
          setOtpError(true);
          if (err.status === 429) {
            setAlert({ type: 'error', msg: 'Too many attempts. Please wait before trying again.' });
          } else {
            setAlert({ type: 'error', msg: 'Invalid or expired code. Please check and try again.' });
          }
        }
      }

      async function handleResend() {
        if (!canResend || resending) return;
        setAlert(null);
        setResending(true);

        if (abortRef.current) abortRef.current.abort();
        abortRef.current = new AbortController();

        try {
          await api.resendCode(email, abortRef.current.signal);
        } catch (err) {
          if (err.name === 'AbortError') return;
          // Still show the neutral message
        }

        setResending(false);
        setOtp('');
        setOtpError(false);
        startExpiry();
        startResendTimer();
        setAlert({ type: 'info', msg: 'A new code has been sent if the account exists.' });
      }

      const isUrgent = expiry > 0 && expiry <= 60;

      return html`
        <div class="step-enter">
          <button
            type="button"
            class="btn-ghost-back"
            onClick=${onBack}
            aria-label="Change email address"
          >
            <i class="fas fa-arrow-left" aria-hidden="true"></i> Change email
          </button>

          <div class="card-icon" aria-hidden="true">
            <i class="fas fa-envelope-open-text"></i>
          </div>
          <h1>Enter Reset Code</h1>
          <p class="sub">
            A 6-digit code was sent to<br/>
            <span class="masked-email">${maskEmail(email)}</span>
          </p>

          ${alert && html`<${AlertBox} type=${alert.type} message=${alert.msg} />`}

          <div class="otp-countdown-wrap" aria-live="polite" aria-atomic="true">
            <p class="otp-countdown-label">Code expires in</p>
            <div
              class=${'otp-countdown-timer' + (isUrgent ? ' urgent' : '')}
              aria-label=${'Code expires in ' + formatTimer(expiry)}
            >
              ${expiry === 0 ? 'Expired' : formatTimer(expiry)}
            </div>
          </div>

          <form onSubmit=${handleSubmit} novalidate aria-label="Enter verification code">
            <div class="field">
              <label>6-Digit Code</label>
              <${OtpInput}
                onComplete=${handleComplete}
                disabled=${loading || expiry === 0}
                hasError=${otpError}
              />
            </div>

            <button
              type="submit"
              class="btn btn-gold btn-ripple"
              disabled=${loading || otp.length < 6 || expiry === 0}
              aria-busy=${String(loading)}
            >
              ${loading
                ? html`<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Verifying…`
                : html`<i class="fas fa-check-circle" aria-hidden="true"></i> Verify Code`}
            </button>
          </form>

          <div class="resend-row" aria-live="polite">
            ${canResend
              ? html`
                  Didn&rsquo;t receive it?${' '}
                  <button
                    type="button"
                    class="resend-btn-inline"
                    onClick=${handleResend}
                    disabled=${resending}
                    aria-busy=${String(resending)}
                  >
                    ${resending
                      ? html`<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Resending…`
                      : 'Resend code'}
                  </button>
                `
              : html`
                  Resend available in <strong style="color:var(--gold)">${resendLeft}s</strong>
                `}
          </div>

          <div class="bottom-nav" aria-label="Navigation links">
            <a href="/login.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Login</a>
            <span class="sep" aria-hidden="true">&bull;</span>
            <a href="/register.html">Create Account</a>
            <span class="sep" aria-hidden="true">&bull;</span>
            <a href="/">Return Home</a>
          </div>
        </div>
      `;
    }

    /* ═══════════════════════════════════════════════════
       STEP 3 — PASSWORD
    ═══════════════════════════════════════════════════ */
    function Step3({ email, otp, resetToken, onSuccess }) {
      const [newPw,     setNewPw]     = useState('');
      const [confirmPw, setConfirmPw] = useState('');
      const [showNew,   setShowNew]   = useState(false);
      const [showConf,  setShowConf]  = useState(false);
      const [capsOn,    setCapsOn]    = useState(false);
      const [loading,   setLoading]   = useState(false);
      const [alert,     setAlert]     = useState(null);
      const abortRef                  = useRef(null);
      const newPwRef                  = useRef(null);

      const strength = getPasswordStrength(newPw, email);
      const reqs     = getRequirements(newPw, email);

      useEffect(() => {
        newPwRef.current && newPwRef.current.focus();
        function handleCaps(e) { setCapsOn(e.getModifierState && e.getModifierState('CapsLock')); }
        window.addEventListener('keydown',  handleCaps);
        window.addEventListener('keyup',    handleCaps);
        return () => {
          window.removeEventListener('keydown',  handleCaps);
          window.removeEventListener('keyup',    handleCaps);
          abortRef.current && abortRef.current.abort();
        };
      }, []);

      async function handleSubmit(e) {
        e.preventDefault();
        setAlert(null);

        const errs = validatePassword(newPw, confirmPw, email);
        if (errs.length) {
          setAlert({ type: 'error', msg: errs[0] });
          return;
        }

        if (abortRef.current) abortRef.current.abort();
        abortRef.current = new AbortController();
        setLoading(true);

        try {
          if (resetToken) {
            await api.resetPwToken(resetToken, newPw, abortRef.current.signal);
          } else {
            await api.resetPw(email, otp, newPw, abortRef.current.signal);
          }
          setLoading(false);
          onSuccess();
        } catch (err) {
          if (err.name === 'AbortError') return;
          setLoading(false);
          const msg = err.message || 'Could not reset password. Please try again.';
          setAlert({ type: 'error', msg });
        }
      }

      const allMet = reqs.every(r => r.met) && confirmPw && newPw === confirmPw;

      return html`
        <div class="step-enter">
          <div
            class="card-icon"
            style="background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3)"
            aria-hidden="true"
          >
            <i class="fas fa-key" style="color:var(--success)"></i>
          </div>
          <h1>Set New Password</h1>
          <p class="sub">Choose a strong, unique password for your account.</p>

          ${alert && html`<${AlertBox} type=${alert.type} message=${alert.msg} />`}

          <form onSubmit=${handleSubmit} novalidate aria-label="Set new password">

            <div class="field">
              <label for="new-pw">New Password</label>
              <div class="pw-wrap">
                <input
                  ref=${newPwRef}
                  type=${showNew ? 'text' : 'password'}
                  id="new-pw"
                  class="input-base"
                  placeholder="At least 10 characters"
                  autocomplete="new-password"
                  required
                  aria-required="true"
                  aria-describedby="pw-strength-desc pw-reqs"
                  value=${newPw}
                  onInput=${e => setNewPw(e.target.value)}
                  disabled=${loading}
                />
                <button
                  type="button"
                  class="pw-toggle"
                  onClick=${() => setShowNew(v => !v)}
                  aria-label=${showNew ? 'Hide password' : 'Show password'}
                  aria-pressed=${String(showNew)}
                >
                  <i class=${'fas ' + (showNew ? 'fa-eye-slash' : 'fa-eye')} aria-hidden="true"></i>
                </button>
              </div>

              ${newPw && html`
                <div class="strength-bar" role="progressbar" aria-valuenow=${strength.pct} aria-valuemin="0" aria-valuemax="100" aria-label="Password strength">
                  <div class="strength-fill" style=${'width:' + strength.pct + '%;background:' + strength.color}></div>
                </div>
                <div class="strength-row">
                  <span class="strength-label" id="pw-strength-desc" style=${'color:' + strength.color}>
                    ${strength.label}
                  </span>
                  ${capsOn && html`
                    <span class="caps-warning" aria-live="polite">
                      <i class="fas fa-exclamation-triangle" aria-hidden="true"></i> Caps Lock on
                    </span>
                  `}
                </div>
              `}
            </div>

            ${newPw && html`
              <div class="pw-requirements" id="pw-reqs" aria-label="Password requirements">
                ${reqs.map(r => html`
                  <div key=${r.key} class=${'req-item' + (r.met ? ' met' : '')} aria-label=${r.label + (r.met ? ', met' : ', not met')}>
                    <i class=${'fas ' + (r.met ? 'fa-check-circle' : 'fa-circle')} aria-hidden="true"></i>
                    ${r.label}
                  </div>
                `)}
              </div>
            `}

            <div class="field" style="margin-top:16px">
              <label for="confirm-pw">Confirm Password</label>
              <div class="pw-wrap">
                <input
                  type=${showConf ? 'text' : 'password'}
                  id="confirm-pw"
                  class="input-base"
                  placeholder="Repeat your new password"
                  autocomplete="new-password"
                  required
                  aria-required="true"
                  aria-invalid=${confirmPw && confirmPw !== newPw ? 'true' : 'false'}
                  aria-describedby="confirm-pw-hint"
                  value=${confirmPw}
                  onInput=${e => setConfirmPw(e.target.value)}
                  disabled=${loading}
                />
                <button
                  type="button"
                  class="pw-toggle"
                  onClick=${() => setShowConf(v => !v)}
                  aria-label=${showConf ? 'Hide confirm password' : 'Show confirm password'}
                  aria-pressed=${String(showConf)}
                >
                  <i class=${'fas ' + (showConf ? 'fa-eye-slash' : 'fa-eye')} aria-hidden="true"></i>
                </button>
              </div>
              ${confirmPw && confirmPw !== newPw && html`
                <p id="confirm-pw-hint" style="font-size:.75rem;color:var(--danger);margin-top:5px" role="alert">
                  <i class="fas fa-times-circle" aria-hidden="true"></i> Passwords do not match
                </p>
              `}
              ${confirmPw && confirmPw === newPw && newPw && html`
                <p id="confirm-pw-hint" style="font-size:.75rem;color:var(--success);margin-top:5px">
                  <i class="fas fa-check-circle" aria-hidden="true"></i> Passwords match
                </p>
              `}
            </div>

            <button
              type="submit"
              class="btn btn-gold btn-ripple"
              disabled=${loading || !allMet}
              aria-busy=${String(loading)}
            >
              ${loading
                ? html`<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Resetting…`
                : html`<i class="fas fa-lock" aria-hidden="true"></i> Reset Password`}
            </button>
          </form>

          <div class="bottom-nav" aria-label="Navigation links">
            <a href="/login.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Login</a>
            <span class="sep" aria-hidden="true">&bull;</span>
            <a href="/register.html">Create Account</a>
            <span class="sep" aria-hidden="true">&bull;</span>
            <a href="/">Return Home</a>
          </div>
        </div>
      `;
    }

    /* ═══════════════════════════════════════════════════
       SUCCESS SCREEN
    ═══════════════════════════════════════════════════ */
    function StepSuccess() {
      return html`
        <div class="step-enter" style="text-align:center">
          <div
            class="success-check-wrap"
            role="img"
            aria-label="Success"
          >
            <i class="fas fa-check" aria-hidden="true"></i>
          </div>
          <h1>Password Changed</h1>
          <p class="sub" style="margin-bottom:16px">
            Your password has been updated securely.<br/>
            All active sessions may require signing in again.
          </p>

          <div class="success-badges" role="list">
            <span class="badge" role="listitem">
              <i class="fas fa-shield-alt" aria-hidden="true"></i>&nbsp; Secure
            </span>
            <span class="badge" role="listitem">
              <i class="fas fa-check-circle" aria-hidden="true"></i>&nbsp; Verified
            </span>
          </div>

          <div class="divider" aria-hidden="true"></div>

          <div class="success-btn-group">
            <a href="/login.html" class="btn btn-gold btn-ripple" style="text-decoration:none">
              <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Sign In
            </a>
            <a href="/" class="btn btn-outline" style="text-decoration:none">
              <i class="fas fa-home" aria-hidden="true"></i> Return Home
            </a>
          </div>
        </div>
      `;
    }

    /* ═══════════════════════════════════════════════════
       ROOT APP
    ═══════════════════════════════════════════════════ */
    function App() {
      const [step,       setStep]       = useState(1);
      const [email,      setEmail]      = useState('');
      const [otp,        setOtp]        = useState('');
      const [resetToken, setResetToken] = useState(null);

      function handleEmail(resolvedEmail) {
        setEmail(resolvedEmail);
        setStep(2);
      }

      function handleOtp(resolvedOtp, token) {
        setOtp(resolvedOtp);
        setResetToken(token || null);
        setStep(3);
      }

      function handleSuccess() {
        setStep('success');
      }

      return html`
        <${Fragment}>
          <${SiteHeader} />

          <main class="page-center" id="main-content">
            <div class="card" role="main" aria-label="Password reset">

              ${step !== 'success' && html`<${StepIndicator} current=${step} />`}

              ${step === 1 && html`
                <${Step1} onSuccess=${handleEmail} />
              `}
              ${step === 2 && html`
                <${Step2}
                  email=${email}
                  onSuccess=${handleOtp}
                  onBack=${() => setStep(1)}
                />
              `}
              ${step === 3 && html`
                <${Step3}
                  email=${email}
                  otp=${otp}
                  resetToken=${resetToken}
                  onSuccess=${handleSuccess}
                />
              `}
              ${step === 'success' && html`<${StepSuccess} />`}

            </div>
          </main>

          <${SiteFooter} />
        </${Fragment}>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  })();
  </script>
</body>
</html>
