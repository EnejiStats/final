      const n=['successful','won','saved','on_target','created'].includes(event.outcome)?'success':['unsuccessful','lost','foul','off_target','blocked','woodwork','missed'].includes(event.outcome)?'failure':event.outcome;
      clubTrackerIncrement(target,n);
    }
    if(event.type)clubTrackerIncrement(target.types,event.type);
    if(event.detail)clubTrackerIncrement(target.details,event.detail);
  }
}
function clubTrackerRebuildDerived(){
  clubWidgetState.tracker.stats.home._derived={};
  clubWidgetState.tracker.stats.away._derived={};
  clubWidgetState.tracker.events.forEach(e=>clubTrackerRecordDerived(e));
}
function clubTrackerRebuildPossession(){rebuildPossessionFromTimeline();updatePossessionDisplays();updatePossessionActiveState(clubWidgetState.possession.currentTeam);}
function clubTrackerRenderEventLog(){
  const render=(team,id,labelId)=>{
    const box=document.getElementById(id),label=document.getElementById(labelId);
    if(label)label.textContent=`${clubTrackerTeamName(team)} Events`;
    if(!box)return;
    const events=clubWidgetState.tracker.events.filter(e=>e.team===team).slice(-50).reverse();
    box.innerHTML=events.length?events.map(e=>`<div class="club-team-event-item" title="${e.timestampLocal}"><span class="club-team-event-time">${e.matchClock}</span><div class="club-team-event-main"><strong>${e.metricLabel}</strong><span class="club-team-event-detail">${[e.outcomeLabel,e.typeLabel,e.detailLabel].filter(Boolean).join(' · ')||'Recorded'} · ${e.timestampLocal}</span></div></div>`).join(''):`<div class="club-team-event-empty">No ${team} events recorded.</div>`;
  };
  render('home','homeEventLog','homeEventLogLabel');
  render('away','awayEventLog','awayEventLogLabel');
}
function clubTrackerUndoOpenMarkup(team,event){
  const name=clubTrackerTeamName(team);
  const detail=event?`${event.matchClock} · ${event.metricLabel} · ${[event.outcomeLabel,event.typeLabel,event.detailLabel].filter(Boolean).join(' · ')}`:'No events recorded';
  const redoCount=clubTrackerRedoStack(team).length;
  return `<button type="button" class="tracker-flow-choice ${team}" data-undo-team="${team}">${name}<span class="tracker-undo-latest">${detail}</span><span class="tracker-team-action-row"><span>Undo latest</span></span></button><div class="tracker-undo-team-actions"><button type="button" class="tracker-redo-btn" data-redo-team="${team}" ${redoCount?'':'disabled'} title="Redo the most recently undone ${name} event">↻ Redo${redoCount?` (${redoCount})`:''}</button></div>`;
}
function clubTrackerOpenUndo(){
  const old=document.getElementById('clubTrackerUndo');
  if(old)old.remove();
  const h=clubTrackerLatestEvent('home'),a=clubTrackerLatestEvent('away');
  const back=document.createElement('div');
  back.id='clubTrackerUndo';
  back.className='tracker-flow-backdrop';
  back.innerHTML=`<div class="tracker-flow-dialog tracker-undo-team-dialog"><div class="tracker-flow-header"><div><div class="tracker-flow-title">Undo latest team event</div><div class="tracker-flow-subtitle">Choose a club to undo its current most recent event. The list updates after every undo.</div></div><button type="button" class="tracker-flow-close" data-undo-close>×</button></div><div class="tracker-flow-body"><div class="tracker-flow-choice-grid"><div>${clubTrackerUndoOpenMarkup('home',h)}</div><div>${clubTrackerUndoOpenMarkup('away',a)}</div></div></div></div>`;
  document.body.appendChild(back);
}
function clubTrackerRefreshUndoDialog(){
  const dialog=document.getElementById('clubTrackerUndo');
  if(!dialog)return;
  const h=clubTrackerLatestEvent('home'),a=clubTrackerLatestEvent('away');
  const body=dialog.querySelector('.tracker-flow-body');
  if(body)body.innerHTML=`<div class="tracker-flow-choice-grid"><div>${clubTrackerUndoOpenMarkup('home',h)}</div><div>${clubTrackerUndoOpenMarkup('away',a)}</div></div>`;
}
function clubTrackerUndoTeam(team){
  const event=clubTrackerLatestEvent(team);
  if(!event){showNotification(`No recorded events for ${clubTrackerTeamName(team)}`,'warning');clubTrackerRefreshUndoDialog();return;}
  if(clubTrackerUndoEvent(event.id)){
    showNotification(`Undid ${event.metricLabel} for ${clubTrackerTeamName(team)} at ${event.matchClock}`,'success');
    clubTrackerRefreshUndoDialog();
  }
}
function clubTrackerReset(){
  clubWidgetState.tracker.stats={home:{},away:{}};
  clubWidgetState.tracker.events=[];
  clubWidgetState.tracker.redo={home:[],away:[]};
  clubTrackerClose();
  clubTrackerRenderAllValues();
}
function clubTrackerBind(){
  if(document.body.dataset.clubTrackerBound==='1')return;
  document.body.dataset.clubTrackerBound='1';
  document.addEventListener('click',e=>{
    const metric=e.target.closest('.tracker-metric-button');
    if(metric){e.preventDefault();e.stopPropagation();clubTrackerOpen(metric.dataset.trackerMetric);return;}
    const undo=e.target.closest('[data-undo-team]');
    if(undo){clubTrackerUndoTeam(undo.dataset.undoTeam);return;}
    const redo=e.target.closest('[data-redo-team]');
    if(redo){if(!redo.disabled){clubTrackerRedoEvent(redo.dataset.redoTeam);clubTrackerRefreshUndoDialog();}return;}
    if(e.target.closest('[data-undo-close]')){const d=document.getElementById('clubTrackerUndo');if(d)d.remove();return;}
    const flow=e.target.closest('#clubTrackerFlow');
    if(!flow)return;
    if(e.target.matches('[data-flow-action="close"]')){clubTrackerClose();return;}
    const team=e.target.closest('[data-flow-team]');
    if(team){clubWidgetState.tracker.flow.team=team.dataset.flowTeam;const metric=CLUB_TRACKER_METRIC_MAP[clubWidgetState.tracker.flow.key];clubWidgetState.tracker.flow.stage=clubTrackerMetricOutcomes(metric).length?'outcome':'type';clubTrackerRenderFlow();return;}
    const outcome=e.target.closest('[data-flow-outcome]');
    if(outcome){clubWidgetState.tracker.flow.outcome=outcome.dataset.flowOutcome;clubWidgetState.tracker.flow.stage='type';clubTrackerRenderFlow();return;}
    const type=e.target.closest('[data-flow-type]');
    if(type){clubWidgetState.tracker.flow.type=type.dataset.flowType;clubTrackerRecord(clubWidgetState.tracker.flow);return;}
    const back=e.target.closest('[data-flow-action="back"]');
    if(back){const f=clubWidgetState.tracker.flow;if(f.stage==='type')f.stage=clubTrackerMetricOutcomes(CLUB_TRACKER_METRIC_MAP[f.key]).length?'outcome':'team';else f.stage='team';clubTrackerRenderFlow();return;}
    const confirm=e.target.closest('[data-flow-confirm]');
    if(confirm)clubTrackerRecord(clubWidgetState.tracker.flow);
  });
}

function clubWidgetSelectValue(id, value) {
  const select = document.getElementById(id);
  if (!select || !value) return;
  const text = String(value).trim();
  let option = Array.from(select.options).find(item => item.value === text);
  if (!option) { option = document.createElement('option'); option.value = text; option.textContent = text; select.appendChild(option); }
  select.value = text;
  select.dispatchEvent(new Event('change', { bubbles: true }));
}
function resetClubWidgetForAssignment(assignment) {
  pauseTimer();
  if (clubWidgetState.submissionCountdown) clearInterval(clubWidgetState.submissionCountdown);
  if (clubWidgetState.buttonTimeout) clearTimeout(clubWidgetState.buttonTimeout);
  clubWidgetState.submissionCountdown = null;
  clubWidgetState.isSubmissionInProgress = false;
  clubWidgetState.activeStatButton = null;
  clubWidgetState.statHistory = [];
  clubWidgetState.match.homeScore = 0;
  clubWidgetState.match.awayScore = 0;
  clubWidgetState.match.matchTime = 0;
  clubWidgetState.match.isTimerRunning = false;
  clubWidgetState.match.isFirstHalf = true;
  clubWidgetState.match.additionalMinutes = 0;
  clubWidgetState.match.hasStarted = false;
  clubWidgetState.match.startTime = null;
  clubWidgetState.match.isEnded = false;
  clubWidgetState.possession = { currentTeam: null, startTime: null, totalTime: { home: 0, away: 0 }, intervals: [], switches: [], methodology: 'event_timeline', clockBasis: 'match_clock_seconds', inPlayOnly: true };
  ['home','away'].forEach(team => { clubWidgetState.teams[team].possession = 50; clubWidgetState.teams[team].currentlyInPossession = false; clubWidgetState.teams[team].possessionStartTime = null; });
  initializeTeamStats();
  clubTrackerReset();
  updateAllStatDisplays('home');
  updateAllStatDisplays('away');
  document.getElementById('homeScore').textContent = '0';
  document.getElementById('awayScore').textContent = '0';
  document.getElementById('timerDisplay').textContent = '00:00';
  document.getElementById('timerStatus').textContent = 'Pre-Match';
  document.getElementById('timerBtn').textContent = 'Start Match';
  document.getElementById('timerBtn').disabled = false;
  document.getElementById('endMatchBtn').textContent = 'End Match';
  document.getElementById('endMatchBtn').disabled = false;
  document.getElementById('halfIndicator').textContent = '1st Half';
  updatePossessionDisplays();
  updatePossessionActiveState(null);
  let home = String(assignment.homeTeam || '').trim();
  let away = String(assignment.awayTeam || '').trim();
  const club = String(assignment.clubName || '').trim();
  const side = String(assignment.teamSide || '').toLowerCase();
  if (!home && !away && club) { if (side === 'away' || side === 'away_team' || side === 'visitor') away = club; else home = club; }
  if (!home) home = club || 'Home Team';
  if (!away) away = 'Opponent';
  clubWidgetSelectValue('homeTeam', home);
  clubWidgetSelectValue('awayTeam', away);
  updateTeamNames();
  updateTimerDisplay();
}
window.mountClubAssignment = function(assignment) {
  if (!assignment || !assignment.id || String(assignment.status).toLowerCase() !== 'accepted') {
    showNotification('Only accepted club assignments can be mounted.', 'warning');
    return false;
  }
  const currentId = String(window.__activeClubAssignmentId || '');
  const nextId = String(assignment.id);
  const hasData = (clubWidgetState.tracker?.events || []).length > 0 || clubWidgetState.match.hasStarted;
  if (currentId && currentId !== nextId && hasData && !window.confirm('Switching assignments will clear the current match data from this page. Continue?')) return false;
  if (currentId !== nextId) resetClubWidgetForAssignment(assignment);
  window.__activeClubAssignmentId = nextId;
  window.__activeClubAssignment = assignment;
  return true;
};
window.getClubWidgetState = () => clubWidgetState;
window.setInterval(() => {
  const bridge = window.ClubStatsAssignmentBridge;
  if (bridge && typeof bridge.saveDraft === 'function') bridge.saveDraft(clubWidgetState);
}, 120000);
function initializeCanonicalClubTracker(){try{clubTrackerBind();clubTrackerRenderAllValues();}catch(error){console.error('Club tracker initialization failed:',error);}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initializeCanonicalClubTracker,{once:true});else initializeCanonicalClubTracker();

</script>
