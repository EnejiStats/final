<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnejiStats – Club Stats Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/preact@10.19.3/dist/preact.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/preact@10.19.3/hooks/dist/hooks.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{--primary:#004aad;--secondary:#0066cc;--success:#218653;--danger:#dc3545;--warning:#ffc107;--gray:#6c757d;--border:#dee2e6;--shadow:0 2px 12px #00000012}
*{box-sizing:border-box}body{margin:0;background:#f0f2f5;color:#263244;font-family:Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:16px}.topbar{background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;padding:15px 18px;border-radius:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.topbar h1{font-size:1.15rem;margin:0}.topbar p{margin:5px 0 0;font-size:.82rem;opacity:.9}
.panel{background:white;border-radius:10px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:var(--gray);font-size:.84rem}.btn{border:0;border-radius:6px;padding:9px 13px;font-weight:700}.primary{background:var(--primary);color:white}.good{background:var(--success);color:white}.bad{background:var(--danger);color:white}.neutral{background:#e9eef5;color:#24364d}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}.assignment{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}.assignment-head{padding:12px;background:#f7f9fc;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{font-size:.68rem;font-weight:800;text-transform:uppercase;padding:4px 8px;border-radius:20px;background:#e8f0fe;color:#1a73e8}.club-name{font-size:1.05rem;font-weight:800;margin:0 0 8px;overflow-wrap:anywhere}.assignment-body{padding:13px}.fixture{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:10px 0;padding:10px;background:#f8fafc;border-radius:7px}.fixture .away{text-align:right}.vs{color:var(--gray);font-size:.75rem;font-weight:900}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.detail small{display:block;color:var(--gray);font-size:.68rem;text-transform:uppercase;margin-bottom:3px}.detail strong{font-size:.83rem;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:36px 12px;color:var(--gray)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid var(--border);background:white;border-radius:6px;padding:9px 12px;font-weight:700}.tab.active{background:var(--primary);color:white}
.match-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}.team{font-weight:900;overflow-wrap:anywhere}.score{font-size:1.5rem;font-weight:900;color:var(--primary);white-space:nowrap}.clock{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}.clock strong{font-size:1.25rem;font-variant-numeric:tabular-nums}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px;margin-top:14px}.metric{border:1px solid #cbd7e6;border-radius:8px;padding:13px 7px;background:#f8fafc;text-align:center;color:var(--primary);font-weight:800;min-height:78px}.metric span{display:block;font-size:.7rem;margin-top:7px}.event-list{display:grid;gap:7px;margin-top:12px}.event{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;background:#f8fafc;border-radius:6px;font-size:.82rem}.notice{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;padding:10px 16px;background:#1f2937;color:white;border-radius:7px;box-shadow:var(--shadow);max-width:90vw}.notice.error{background:var(--danger)}.notice.success{background:var(--success)}.hidden{display:none!important}
@media(max-width:480px){.wrap{padding:8px}.panel{padding:10px}.details{grid-template-columns:1fr 1fr}.topbar{padding:12px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body><div id="app"></div>
<script>
const {h,render}=preact;const {useState,useEffect,useRef}=preactHooks;const html=htm.bind(h);
const API={user:'/api/dco/user-info',assignments:'/api/dco/assignments',accept:'/api/dco/accept-assignment',decline:'/api/dco/decline-assignment',metrics:'/api/dco/metrics',submissions:'/api/dco/submissions',submit:id=>`/api/dco/${encodeURIComponent(id)}/widget/submit`,draft:id=>`/api/dco/${encodeURIComponent(id)}/widget/save-draft`};
async function apiFetch(url,options={}){const token=localStorage.getItem('dco_token');const headers={...(token?{Authorization:'Bearer '+token}:{}),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})};const res=await fetch(url,{credentials:'include',...options,headers});if(res.status===401||res.status===403){localStorage.removeItem('dco_token');window.location.replace('/login');throw Error('Session expired. Please sign in again.')}if(!res.ok)throw Error(`Request failed (${res.status}): ${await res.text()}`);const txt=await res.text();if(!txt.trim())return null;try{return JSON.parse(txt)}catch{return {message:txt}}}
const first=(...v)=>v.find(x=>x!==undefined&&x!==null&&String(x).trim()!=='');
function normalizeClub(raw={}){const req=raw.stats_request||raw.statsRequest||raw.request||raw.stats_request_data||{};const match=raw.match||raw.fixture||req.match||req.fixture||{};const club=raw.club&&typeof raw.club==='object'?raw.club:req.club||{};const merged={...req,...match,...raw};const name=first(raw.club_name,raw.clubName,club.name,club.club_name,req.club_name,req.clubName,typeof raw.club==='string'?raw.club:null,raw.home_team,raw.homeTeam,'Club assignment');const id=String(first(raw.assignmentId,raw.assignment_id,raw.id,raw._id,req.assignment_id,req.assignmentId,req.id,raw.request_id,raw.requestId,raw.stats_request_id,raw.statsRequestId,'')).trim();return {...merged,id,clubName:String(name),club_id:first(raw.club_id,raw.clubId,club.id,club._id,req.club_id,req.clubId,''),status:String(first(raw.status,req.status,'assigned')).toLowerCase(),homeTeam:String(first(raw.homeTeam,raw.home_team,match.homeTeam,match.home_team,req.homeTeam,req.home_team,name)),awayTeam:String(first(raw.awayTeam,raw.away_team,match.awayTeam,match.away_team,req.awayTeam,req.away_team,'Opposition')),matchDate:first(raw.matchDate,raw.match_date,match.date,req.match_date,'TBD'),matchTime:first(raw.matchTime,raw.match_time,match.time,req.match_time,'TBD'),venue:first(raw.venue,raw.venueStadium,raw.venue_stadium,match.venue,req.venue,'TBD'),competition:first(raw.competition,raw.competition_name,match.competition,req.competition,'TBD')}}
function isClub(raw){const x=raw||{},r=x.stats_request||x.statsRequest||x.request||{};const typ=String(first(x.entityType,x.entity_type,x.requestType,x.request_type,x.assignmentType,x.assignment_type,x.trackingType,x.tracking_type,r.entityType,r.entity_type,r.requestType,r.request_type,'')).toLowerCase().replace(/[\s-]+/g,'_');if(['club','team','club_match','club_stats','club_statistics','club_tracking','club_assignment','team_match','team_tracking','team_assignment'].includes(typ))return true;const c=x.club&&typeof x.club==='object'?x.club:{};return !!(x.club_id||x.clubId||x.club_name||x.clubName||x.club_role||x.jersey_color||r.club_id||r.club_name||c.id||c.name)}
const METRICS=[['goals','Goals'],['shots','Shots'],['shots_on_target','Shots on Target'],['corners','Corners'],['free_kicks','Free Kicks'],['offsides','Offsides'],['fouls','Fouls'],['yellow_cards','Yellow Cards'],['red_cards','Red Cards'],['saves','Goalkeeper Saves'],['passes','Passes'],['crosses','Crosses'],['tackles','Tackles'],['interceptions','Interceptions'],['clearances','Clearances'],['blocks','Blocks'],['recoveries','Recoveries'],['possession_won','Possession Won']];
function App(){const [assignments,setAssignments]=useState([]),[loading,setLoading]=useState(true),[error,setError]=useState(''),[view,setView]=useState('assignments'),[active,setActive]=useState(null),[events,setEvents]=useState([]),[homeScore,setHomeScore]=useState(0),[awayScore,setAwayScore]=useState(0),[seconds,setSeconds]=useState(0),[running,setRunning]=useState(false),[period,setPeriod]=useState(1),[notice,setNotice]=useState(null),[busy,setBusy]=useState(false);const noticeTimer=useRef(null);
const notify=(message,type='success')=>{setNotice({message,type});clearTimeout(noticeTimer.current);noticeTimer.current=setTimeout(()=>setNotice(null),3200)};
const load=async()=>{setLoading(true);setError('');try{const [a]=await Promise.all([apiFetch(API.assignments)]);const rows=Array.isArray(a)?a:(a?.assignments||a?.data||a?.items||[]);setAssignments(rows.filter(isClub).map(normalizeClub));}catch(e){setError(e.message||'Unable to load club assignments.');}finally{setLoading(false)}};
useEffect(()=>{load();return()=>clearInterval(noticeTimer.current)},[]);
useEffect(()=>{if(!running)return;const id=setInterval(()=>setSeconds(s=>s+1),1000);return()=>clearInterval(id)},[running]);
const track=async raw=>{const a=normalizeClub(raw);if(!a.id){notify('This club assignment has no usable assignment/request ID.','error');return}if(!['accepted','in_progress','tracking','assigned','pending'].includes(a.status)){notify('This assignment is not available for tracking.','error');return}setActive(a);setEvents([]);setHomeScore(0);setAwayScore(0);setSeconds(0);setPeriod(1);setRunning(false);setView('widget');notify(`${a.clubName} mounted on the club tracking widget.`)};
const updateStatus=async(a,action)=>{try{await apiFetch(action==='accept'?API.accept:API.decline,{method:'POST',body:JSON.stringify({assignment_id:a.id,assignmentId:a.id,request_id:a.request_id||a.stats_request_id,club_id:a.club_id,action})});notify(`Club assignment ${action==='accept'?'accepted':'declined'}.`);await load()}catch(e){notify(e.message||`Could not ${action} assignment.`,'error')}};
const record=(key,label,team)=>{if(!running){notify('Start the match timer before recording club statistics.','error');return}const event={id:`club-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,kind:'club_tracker',team,teamName:team==='home'?active.homeTeam:active.awayTeam,oppositionTeam:team==='home'?active.awayTeam:active.homeTeam,key,metricLabel:label,outcome:null,type:null,periodSeconds:seconds,matchTime:(period-1)*45*60+seconds,matchClock:`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`,period,half:period,timestamp:new Date().toISOString(),recordedAt:new Date().toISOString(),homeTeam:active.homeTeam,awayTeam:active.awayTeam};setEvents(prev=>[...prev,event]);if(key==='goals')team==='home'?setHomeScore(n=>n+1):setAwayScore(n=>n+1)};
const submit=async()=>{if(!active||!events.length){notify('Record at least one club event before submitting.','error');return}setBusy(true);try{const payload={assignmentId:active.id,assignment_id:active.id,request_id:active.request_id||active.stats_request_id,stats_request_id:active.stats_request_id,entityType:'club',requestType:'club',club_id:active.club_id,club_name:active.clubName,matchId:active.matchId||active.match_id||active.id,match_id:active.matchId||active.match_id||active.id,homeTeam:active.homeTeam,awayTeam:active.awayTeam,home_team:active.homeTeam,away_team:active.awayTeam,matchDate:active.matchDate,matchTime:active.matchTime,venue:active.venue,score:{home:homeScore,away:awayScore},homeScore,awayScore,period,timerSeconds:seconds,clubTracking:{events,stats:events.reduce((o,e)=>(o[e.key]=(o[e.key]||0)+1,o),{}),possession:{switches:[]}},events};await apiFetch(API.submit(active.id),{method:'POST',body:JSON.stringify(payload)});notify('Club statistics submitted successfully.');setActive(null);setView('assignments');setRunning(false);await load()}catch(e){notify(e.message||'Submission failed.','error')}finally{setBusy(false)}};
const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
return html`<main class="wrap"><header class="topbar"><div><h1><i class="fas fa-shield-alt"></i> EnejiStats — Club Stats Tracker</h1><p>Club assignments and team-level match statistics only</p></div><button class="btn neutral" onClick=${()=>view==='widget'?(setView('assignments'),setRunning(false)):load()}><i class="fas fa-${view==='widget'?'arrow-left':'sync'}"></i> ${view==='widget'?'Assignments':'Refresh'}</button></header>
<nav class="tabs"><button class=${'tab '+(view==='assignments'?'active':'')} onClick=${()=>setView('assignments')}><i class="fas fa-clipboard-list"></i> Club Assignments</button><button class=${'tab '+(view==='widget'?'active':'')} disabled=${!active} onClick=${()=>setView('widget')}><i class="fas fa-stopwatch"></i> Club Tracking Widget</button></nav>
${view==='assignments'?html`<section class="panel"><div class="row"><div><strong>Club assignments</strong><div class="muted">Club stats requests assigned through the Match Centre.</div></div><span class="badge">${assignments.length} club assignment${assignments.length===1?'':'s'}</span></div>
${loading?html`<div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loading club assignments…</p></div>`:error?html`<div class="empty"><p>${error}</p><button class="btn primary" onClick=${load}>Try again</button></div>`:assignments.length===0?html`<div class="empty"><i class="fas fa-shield-alt fa-2x"></i><p>No club assignments found.</p><small>Only club/team assignments are displayed here.</small></div>`:html`<div class="cards">${assignments.map(a=>html`<article class="assignment" key=${a.id}><div class="assignment-head"><span class="badge">${a.status.replaceAll('_',' ')}</span><small class="muted">${a.id||'No assignment ID'}</small></div><div class="assignment-body"><h2 class="club-name">${a.clubName}</h2><div class="fixture"><strong>${a.homeTeam}</strong><span class="vs">VS</span><strong class="away">${a.awayTeam}</strong></div><div class="details"><div class="detail"><small>Match date</small><strong>${a.matchDate}</strong></div><div class="detail"><small>Kick-off</small><strong>${a.matchTime}</strong></div><div class="detail"><small>Competition</small><strong>${a.competition}</strong></div><div class="detail"><small>Venue</small><strong>${a.venue}</strong></div></div><div class="actions">${!['accepted','in_progress','tracking','completed'].includes(a.status)?html`<button class="btn good" onClick=${()=>updateStatus(a,'accept')}><i class="fas fa-check"></i> Accept</button>`:null}${!['declined','completed'].includes(a.status)?html`<button class="btn neutral" onClick=${()=>updateStatus(a,'decline')}><i class="fas fa-times"></i> Decline</button>`:null}<button class="btn primary" onClick=${()=>track(a)}><i class="fas fa-play"></i> Track</button></div></div></article>`)}</div>`}</section>`:!active?html`<section class="panel empty">Select a club assignment and tap Track to mount it here.</section>`:html`<section class="panel"><div class="row"><div><span class="badge">Club mounted</span><h2 class="club-name" style="margin-top:8px">${active.clubName}</h2></div><button class="btn neutral" onClick=${()=>{setRunning(false);setView('assignments')}}>UnMount / Back</button></div><div class="fixture"><strong>${active.homeTeam}</strong><span class="vs">VS</span><strong class="away">${active.awayTeam}</strong></div><div class="match-head"><div class="team">${active.homeTeam}</div><div class="score">${homeScore} : ${awayScore}</div><div class="team">${active.awayTeam}</div></div><div class="clock"><strong>${fmt(seconds)}</strong><span class="badge">${period===1?'1st Half':'2nd Half'}</span><button class="btn ${running?'bad':'good'}" onClick=${()=>setRunning(v=>!v)}><i class="fas fa-${running?'pause':'play'}"></i> ${running?'Pause':'Start'}</button><button class="btn neutral" onClick=${()=>{setRunning(false);setSeconds(0)}}>Reset Clock</button><button class="btn neutral" onClick=${()=>{setRunning(false);setPeriod(p=>p===1?2:1);setSeconds(0)}}>Switch Half</button></div><p class="muted">Choose a team, then tap a metric to record one club-level event. The match clock must be running.</p><div class="metric-grid">${METRICS.map(([key,label])=>html`<button class="metric" onClick=${()=>record(key,label,'home')}><i class="fas fa-plus-circle"></i><span>${active.homeTeam} · ${label}</span></button><button class="metric" onClick=${()=>record(key,label,'away')}><i class="fas fa-plus-circle"></i><span>${active.awayTeam} · ${label}</span></button>`)}</div><div class="row" style="margin-top:18px"><strong>Recorded club events (${events.length})</strong><div class="actions"><button class="btn neutral" disabled=${!events.length} onClick=${()=>setEvents(v=>v.slice(0,-1))}><i class="fas fa-undo"></i> Undo last</button><button class="btn bad" onClick=${()=>{setEvents([]);setHomeScore(0);setAwayScore(0)}}>Clear events</button><button class="btn good" disabled=${busy||!events.length} onClick=${submit}>${busy?'Submitting…':'Submit club stats'}</button></div></div><div class="event-list">${events.slice().reverse().map(e=>html`<div class="event" key=${e.id}><span><strong>${e.teamName}</strong> — ${e.metricLabel}</span><span class="muted">${e.matchClock} · H${e.period}</span></div>`)}</div></section>`}
</main>${notice?html`<div class=${'notice '+notice.type}>${notice.message}</div>`:null}`;}
render(html`<${App}/>`,document.getElementById('app'));
</script></body></html>
