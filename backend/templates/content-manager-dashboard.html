<script>
(function(){
  const {h,render} = preact; const {useState,useEffect,useMemo,useCallback,useRef} = preactHooks; const html=htm.bind(h);
function useStates(countryCode) {
  const [states,setStates]=useState([]), [loading,setLoading]=useState(false);
  const [regionLabel,setRegionLabel]=useState('State / Region');
  useEffect(()=>{
    if(!countryCode){setStates([]);setRegionLabel('State / Region');return;}
    const controller=new AbortController();
    setLoading(true);
    fetch('/api/public/countries/'+encodeURIComponent(String(countryCode).toUpperCase())+'/regions',{credentials:'include',signal:controller.signal})
      .then(r=>r.ok?r.json():Promise.reject(new Error('regions request failed')))
      .then(d=>{
        const list=Array.isArray(d)?d:(d.regions||[]);
        setStates(list.map(x=>typeof x==='string'?x:(x?.name||x?.state||x?.region||'')).filter(Boolean));
        setRegionLabel(d.region_label||'State / Region');
      }).catch(e=>{if(e.name!=='AbortError')setStates([]);})
      .finally(()=>{if(!controller.signal.aborted)setLoading(false);});
    return ()=>controller.abort();
  },[countryCode]);
  return [states,loading,regionLabel];
}

function useLGAs(countryCode,region) {
  const [lgas,setLGAs]=useState([]), [loading,setLoading]=useState(false);
  const [subregionLabel,setSubregionLabel]=useState('LGA / Local Area');
  useEffect(()=>{
    if(!countryCode||!region){setLGAs([]);setSubregionLabel('LGA / Local Area');return;}
    const controller=new AbortController();
    setLoading(true);
    const url='/api/public/countries/'+encodeURIComponent(String(countryCode).toUpperCase())+'/regions/'+encodeURIComponent(region)+'/subregions';
    fetch(url,{credentials:'include',signal:controller.signal})
      .then(r=>r.ok?r.json():Promise.reject(new Error('subregions request failed')))
      .then(d=>{
        const list=Array.isArray(d)?d:(d.subregions||[]);
        setLGAs(list.map(x=>typeof x==='string'?x:(x?.name||x?.lga||x?.subregion||'')).filter(Boolean));
        setSubregionLabel(d.subregion_label||'LGA / Local Area');
      }).catch(e=>{if(e.name!=='AbortError')setLGAs([]);})
      .finally(()=>{if(!controller.signal.aborted)setLoading(false);});
    return ()=>controller.abort();
  },[countryCode,region]);
  return [lgas,loading,subregionLabel];
}

function CountrySelect({label, value, onChange, countries, required, placeholder}) {
  const [search, setSearch] = useState('');
  const [open,   setOpen]   = useState(false);
  const ref = useRef();
  const close = useCallback(() => setOpen(false), []);
  useClickOutside(ref, close);
  const selected  = countries.find(c => c.code === value);
  const filtered  = useMemo(() => countries.filter(c => c.name.toLowerCase().includes(search.toLowerCase())).slice(0, 40), [countries, search]);
  const select    = c => { onChange(c.code); setSearch(''); setOpen(false); };
  return html`
    <div class="form-group" ref=${ref}>
      <label>${label || 'Country'}${required ? html`<span class="req"> *</span>` : ''}</label>
      <div class="smart-select-wrap">
        <div class="input-group">
          <input class="form-control" value=${selected ? selected.name : search}
            onInput=${e => { setSearch(e.target.value); onChange(''); setOpen(true); }}
            onFocus=${() => setOpen(true)}
            placeholder=${placeholder || 'Search country…'}
            aria-autocomplete="list" aria-expanded=${open} role="combobox"/>
          <span class="input-icon" aria-hidden="true"><i class="fas fa-chevron-down" style="font-size:.7rem"></i></span>
        </div>
        ${open && filtered.length ? html`
          <div class="smart-select-results" role="listbox">
            ${filtered.map(c => html`
              <div key=${c.code} class="smart-select-item" role="option"
                onMouseDown=${e => { e.preventDefault(); select(c); }}>
                <span>${c.name}</span><small style="color:var(--muted);margin-left:8px">${c.code}</small>
              </div>`)}
          </div>` : ''}
      </div>
    </div>`;
}

function StateSelect({states, loading, regionLabel, value, onChange, phOverride}) {
  const [search, setSearch] = useState(value || '');
  const [open,   setOpen]   = useState(false);
  const ref = useRef();
  const close = useCallback(() => setOpen(false), []);
  useClickOutside(ref, close);
  useEffect(() => { if (value !== undefined && value !== search) setSearch(value || ''); }, [value]);
  const ph       = phOverride || (regionLabel ? 'Select ' + regionLabel.toLowerCase() + '…' : 'Select state / region…');
  const filtered = useMemo(() => (states || []).filter(s => s.toLowerCase().includes(search.toLowerCase())).slice(0, 60), [states, search]);
  if (loading) return html`<div class="loading-shimmer" style="margin-top:6px"></div>`;
  return html`
    <div class="smart-select-wrap" ref=${ref}>
      <div class="input-group">
        <input class="form-control" value=${search}
          onInput=${e => { setSearch(e.target.value); onChange(''); setOpen(true); }}
          onFocus=${() => { setOpen(true); setSearch(''); }}
          placeholder=${ph}
          aria-autocomplete="list" aria-expanded=${open} role="combobox"/>
        <span class="input-icon" aria-hidden="true"><i class="fas fa-chevron-down" style="font-size:.7rem"></i></span>
      </div>
      ${open && filtered.length ? html`
        <div class="smart-select-results" role="listbox">
          ${filtered.map(s => html`
            <div key=${s} class="smart-select-item" role="option"
              onMouseDown=${e => { e.preventDefault(); setSearch(s); onChange(s); setOpen(false); }}>
              ${s}
            </div>`)}
        </div>` : ''}
    </div>`;
}

function LGASelect({lgas, loading, subregionLabel, value, onChange, phOverride}) {
  const [search, setSearch] = useState(value || '');
  const [open,   setOpen]   = useState(false);
  const ref = useRef();
  const close = useCallback(() => setOpen(false), []);
  useClickOutside(ref, close);
  useEffect(() => { if (value !== undefined && value !== search) setSearch(value || ''); }, [value]);
  const ph       = phOverride || (subregionLabel ? 'Search ' + subregionLabel.toLowerCase() + '…' : 'Search local area…');
  const filtered = useMemo(() => (lgas || []).filter(l => l.toLowerCase().includes(search.toLowerCase())).slice(0, 50), [lgas, search]);
  if (loading) return html`<div class="loading-shimmer" style="margin-top:6px"></div>`;
  return html`
    <div class="smart-select-wrap" ref=${ref}>
      <div class="input-group">
        <input class="form-control" value=${search} placeholder=${ph}
          onInput=${e => { setSearch(e.target.value); onChange(''); setOpen(true); }}
          onFocus=${() => setOpen(true)}
          aria-autocomplete="list" aria-expanded=${open} role="combobox"/>
        <span class="input-icon" aria-hidden="true"><i class="fas fa-chevron-down" style="font-size:.7rem"></i></span>
      </div>
      ${open && filtered.length ? html`
        <div class="smart-select-results" role="listbox">
          ${filtered.map(l => html`
            <div key=${l} class="smart-select-item" role="option"
              onMouseDown=${e => { e.preventDefault(); setSearch(l); onChange(l); setOpen(false); }}>
              ${l}
            </div>`)}
        </div>` : ''}
    </div>`;
}

function CMRegisterLocation({form,setForm}) {
  const [countries,setCountries]=useState([]); const [venueResults,setVenueResults]=useState([]); const [venueBusy,setVenueBusy]=useState(false);
  useEffect(()=>{let alive=true;fetch('/api/public/countries',{credentials:'include'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(!alive)return;const list=Array.isArray(d)?d:(d.countries||d.data||[]);setCountries(list.map(c=>({code:c.code||c.v||c.value||c.id,name:c.name||c.l||c.label||c.code||c.v||c.value||c.id,regionLabel:c.region_label||'State / Region',subregionLabel:c.subregion_label||'LGA / Local Area'})).filter(c=>c.code&&c.name));}).catch(()=>alive&&setCountries([]));return()=>{alive=false}},[]);

      ${venueBusy&&html`<div class="muted">Searching registered venues…</div>`}

    </div>
    <div class="field span2"><label>Detailed Address *</label><textarea value=${form.venue_detailed_address||form.venue_address||''} onInput=${e=>setForm(f=>({...f,venue_detailed_address:e.target.value,venue_address:e.target.value}))} placeholder="Automatically populated from the selected registered venue; editable if needed."></textarea>${form.venue_id&&html`<div style="margin-top:7px;padding:10px;border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff;color:#1e3a8a"><strong><i class="fas fa-stadium"></i> ${form.venue_name}</strong><div style="font-size:.72rem;margin-top:3px">${[form.venue_country,form.venue_state,form.venue_province||form.venue_region,form.venue_city,form.venue_lga].filter(Boolean).join(' · ')}</div><div style="font-size:.72rem;margin-top:3px">${form.venue_detailed_address||form.venue_address||'No detailed address registered'}</div><button type="button" class="btn btn-outline" style="margin-top:5px" onClick=${()=>setForm(f=>({...f,venue_id:'',venue_name:'',venue_address:'',venue_detailed_address:''}))}>Clear venue</button></div>`}</div>
  </>`;
}

  const API='/api';
  let authRedirecting=false;
  function forceLoginRedirect(){
    if(authRedirecting) return;
    authRedirecting=true;
    try{localStorage.removeItem('enejistats_token');localStorage.removeItem('token');}catch(_){}
    try{sessionStorage.removeItem('enejistats_token');sessionStorage.removeItem('token');}catch(_){}
    window.location.replace('/login');
  }
  const esc = v => String(v ?? '');
  const token = ()=>{try{return localStorage.getItem('enejistats_token')||localStorage.getItem('token')||''}catch(_){return ''}};

/* ── Entry point: called when Find Players tab is activated ── */
async function loadFP() {
  if (!DS.initialized) {
    await initDiscovery();
    // Auto-load all players on first open
    executeDiscSearch(true);
  }
}

async function initDiscovery() {
  DS.initialized = true;
  await loadDiscoveryCountries();
}

/* ── Load all countries into the country dropdown ── */
async function loadDiscoveryCountries() {
  try {
    const sel = $('disc-countries-select');
    const res = await fetch('/api/public/countries', { credentials: 'include' });
    let data = await res.json().catch(() => null);
    let list = [];
    if (Array.isArray(data)) list = data;
    else if (data && Array.isArray(data.countries)) list = data.countries;
    else if (data && Array.isArray(data.data)) list = data.data;
    DS.allCountries = list.map(c => ({
      code: (c.code || c.iso || c.iso_code || c.alpha2 || '').toUpperCase(),
      name: c.name || c.country_name || c.label || c.code || '',
    })).filter(c => c.code && c.name).sort((a,b)=>a.name.localeCompare(b.name));
    if (sel) {
      sel.innerHTML = '<option value="">Select a country to add…</option>' +
        DS.allCountries.map(c => `<option value="${esc(c.code)}" data-name="${esc(c.name)}">${esc(c.name)}</option>`).join('');
    }
  } catch(e) {
    console.warn('[discovery] Could not load countries:', e.message);
  }
}

/* ── Load regions for a country code ── */
async function loadDiscoveryRegions(countryCode) {
  if (!countryCode) return [];
  if (DS.regionCache[countryCode]) return DS.regionCache[countryCode];
  try {
    const res = await fetch(`/api/public/countries/${countryCode}/regions`, { credentials: 'include' });
    if (!res.ok) return [];
    const data = await res.json();
    const regions = Array.isArray(data) ? data :
                    Array.isArray(data.regions) ? data.regions :
                    Array.isArray(data.regions) ? data.regions : [];
    const names = regions.map(r => typeof r === 'string' ? r : (r.name || r.state || r.region || '')).filter(Boolean);
    DS.regionCache[countryCode] = names;
    if (!Array.isArray(data) && data.region_label) DS.regionLabelCache[countryCode] = data.region_label;
    return names;
  } catch(e) { return []; }
}

/* ── Load subregions for a country + region ── */
async function loadDiscoverySubregions(countryCode, region) {
  const key = countryCode + '|' + region;
  if (DS.subregionCache[key]) return DS.subregionCache[key];
  try {
    const res = await fetch(`/api/public/countries/${countryCode}/regions/${encodeURIComponent(region)}/subregions`, { credentials: 'include' });
    if (!res.ok) return [];
    const data = await res.json();
    const subs = Array.isArray(data) ? data :
                 Array.isArray(data.subregions) ? data.subregions :
                 Array.isArray(data.subregions) ? data.subregions : [];
    const names = subs.map(s => typeof s === 'string' ? s : (s.name || s.lga || s.subregion || '')).filter(Boolean);
    DS.subregionCache[key] = names;
    if (!Array.isArray(data) && data.subregion_label) DS.subregionLabelCache[key] = data.subregion_label;
    return names;
  } catch(e) { return []; }
}

/* ── Multi-value chip toggle ── */
function toggleDiscChip(field, value, btn) {
  const set = DS[field === 'africa_region' ? 'africa_regions' : field + 's'] || DS[field];
  if (!(set instanceof Set)) return;
  if (set.has(value)) { set.delete(value); btn.classList.remove('disc-chip-on'); }
  else               { set.add(value);    btn.classList.add('disc-chip-on'); }
  onDiscFilterChange();
}

/* ── Single-value chip toggle ── */
function toggleDiscSingle(field, value, btn) {
  const wasOn = DS[field] === value;
  btn.closest('.disc-chip-group').querySelectorAll('.disc-chip').forEach(c => c.classList.remove('disc-chip-on'));
  if (wasOn) { DS[field] = null; }
  else       { DS[field] = value; btn.classList.add('disc-chip-on'); }
  onDiscFilterChange();
}

/* ── Add a country chip from the dropdown ── */
async function addDiscCountry(sel) {
  const code = sel.value;
  if (!code) return;
  const opt = sel.options[sel.selectedIndex];
  const name = opt.dataset.name || opt.textContent || code;
  if (DS.countries.some(c => c.code === code)) {
    sel.value = '';
    discToast('Country already selected.','info');
    return;
  }
  DS.countries.push({ code, name });
  sel.value = '';
  renderDiscCountryTags();
  if (DS.countries.length === 1) {
    await refreshDiscStateDropdown();
  } else {
    $('disc-state-group').style.display = 'none';
    $('disc-lga-group').style.display   = 'none';
    DS.selectedState = null;
    DS.selectedLga   = null;
    DS.states = [];
    DS.lgas   = [];
  }
  onDiscFilterChange();
}

/* ── Remove a country chip ── */
async function removeDiscCountry(code) {
  DS.countries = DS.countries.filter(c => c.code !== code);
  renderDiscCountryTags();
  if (DS.countries.length === 1) {
    await refreshDiscStateDropdown();
  } else if (DS.countries.length === 0) {
    $('disc-state-group').style.display = 'none';
    $('disc-lga-group').style.display   = 'none';
    DS.selectedState = null; DS.selectedLga = null;
    DS.states = []; DS.lgas = [];
  }
  onDiscFilterChange();
}

function renderDiscCountryTags() {
  const wrap = $('disc-country-tags');
  if (!wrap) return;
  wrap.innerHTML = DS.countries.map(c =>
    `<span class="disc-ctag">${esc(c.name)}<button class="disc-ctag-rm" onclick="removeDiscCountry('${esc(c.code)}')" title="Remove"><i class="fas fa-times"></i></button></span>`
  ).join('');
}

/* ── Refresh state dropdown ── */
async function refreshDiscStateDropdown() {
  if (DS.countries.length !== 1) return;
  const code = DS.countries[0].code;
  const regions = await loadDiscoveryRegions(code);
  const stateEl = $('disc-state-select');
  if (!stateEl) return;
  if (!regions.length) {
    $('disc-state-group').style.display = 'none';
    return;
  }
  const regionLabel = DS.regionLabelCache[code] || 'State / Region';
  const stateLabelEl = $('disc-state-label');
  if (stateLabelEl) stateLabelEl.textContent = regionLabel;
  stateEl.innerHTML = '<option value="">All ' + regionLabel.toLowerCase() + 's…</option>' +
    regions.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
  if (DS.selectedState && regions.includes(DS.selectedState)) {
    stateEl.value = DS.selectedState;
  } else {
    DS.selectedState = null;
    DS.states = [];
    $('disc-lga-group').style.display = 'none';
  }
  $('disc-state-group').style.display = 'block';
}

/* ── Handle state/region selection ── */
async function onDiscStateChange(sel) {
  const state = sel.value;
  DS.selectedState = state || null;
  DS.states = state ? [state] : [];
  DS.selectedLga = null; DS.lgas = [];
  $('disc-lga-group').style.display = 'none';
  if (state && DS.countries.length === 1) {
    const countryCode = DS.countries[0].code;
    const subs = await loadDiscoverySubregions(countryCode, state);
    const lgaEl = $('disc-lga-select');
    if (subs.length && lgaEl) {
      const subLabel = DS.subregionLabelCache[countryCode + '|' + state] || 'LGA / Local Area';
      const lgaLabelEl = $('disc-lga-label');
      if (lgaLabelEl) lgaLabelEl.textContent = subLabel;
      lgaEl.innerHTML = '<option value="">All ' + subLabel.toLowerCase() + 's…</option>' +
        subs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
      $('disc-lga-group').style.display = 'block';
    }
  }
  onDiscFilterChange();
}

/* ── Handle LGA selection ── */
function onDiscLgaChange(sel) {
  const lga = sel.value;
  DS.selectedLga = lga || null;
  DS.lgas = lga ? [lga] : [];
  onDiscFilterChange();
}

/* ── Range input change ── */
function onDiscFilterChange() {
  const count = _countDiscActiveFilters();
  const badge = $('disc-filter-badge');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'inline-block' : 'none';
  }
}

function _countDiscActiveFilters() {
  let n = 0;
  const q = ($('disc-q') ? $('disc-q').value : '') || '';
  if (q.trim()) n++;
  n += DS.continents.size;
  n += DS.africa_regions.size;
  n += DS.countries.length;
  if (DS.selectedState) n++;
  if (DS.selectedLga) n++;
  n += DS.levels.size;
  n += DS.position_categories.size;
  n += DS.positions.size;
  if (DS.preferred_foot) n++;
  const rangeIds = [
    'disc-age-min','disc-age-max','disc-height-min','disc-height-max',
    'disc-weight-min','disc-weight-max','disc-goals-min','disc-goals-max',
    'disc-assists-min','disc-assists-max','disc-matches-min','disc-matches-max',
    'disc-rating-min','disc-rating-max','disc-pass-min','disc-pass-max',
    'disc-cs-min','disc-cs-max','disc-tackles-min','disc-tackles-max',
    'disc-inter-min','disc-inter-max',
  ];
  rangeIds.forEach(id => { const el=$(id); if(el && el.value) n++; });
  return n;
}

  DS.africa_regions.forEach(v => chips.push({ label: v, remove: () => { DS.africa_regions.delete(v); _syncChipBtns('disc-africa-chips', DS.africa_regions); renderDiscActiveChips(); onDiscFilterChange(); } }));
  DS.countries.forEach(c => chips.push({ label: c.name, remove: () => removeDiscCountry(c.code) }));
  if (DS.selectedState) chips.push({ label: 'State: '+DS.selectedState, remove: () => { $('disc-state-select').value=''; onDiscStateChange($('disc-state-select')); } });
  if (DS.selectedLga)   chips.push({ label: 'LGA: '+DS.selectedLga,     remove: () => { $('disc-lga-select').value='';   onDiscLgaChange($('disc-lga-select')); } });
  DS.levels.forEach(v => chips.push({ label: v, remove: () => { DS.levels.delete(v); _syncChipBtns('disc-level-chips', DS.levels); renderDiscActiveChips(); onDiscFilterChange(); } }));
  DS.position_categories.forEach(v => chips.push({ label: v, remove: () => { DS.position_categories.delete(v); _syncChipBtns('disc-pos-cat-chips', DS.position_categories); renderDiscActiveChips(); onDiscFilterChange(); } }));
  DS.positions.forEach(v => chips.push({ label: 'Pos: '+v, remove: () => { DS.positions.delete(v); const cb=document.querySelector(`#disc-pos-grid input[value="${v}"]`); if(cb) cb.checked=false; renderDiscActiveChips(); onDiscFilterChange(); } }));
  if (DS.preferred_foot) chips.push({ label: 'Foot: '+DS.preferred_foot, remove: () => { DS.preferred_foot=null; document.querySelectorAll('#disc-foot-chips .disc-chip').forEach(b=>b.classList.remove('disc-chip-on')); renderDiscActiveChips(); onDiscFilterChange(); } });
  const rangeChips = [
    ['Age','disc-age-min','disc-age-max','yrs'],
    ['Height','disc-height-min','disc-height-max','cm'],
    ['Weight','disc-weight-min','disc-weight-max','kg'],
    ['Goals','disc-goals-min','disc-goals-max',''],
    ['Assists','disc-assists-min','disc-assists-max',''],
    ['Matches','disc-matches-min','disc-matches-max',''],
    ['Rating','disc-rating-min','disc-rating-max',''],
    ['Pass%','disc-pass-min','disc-pass-max','%'],
    ['Clean Sheets','disc-cs-min','disc-cs-max',''],
    ['Tackles','disc-tackles-min','disc-tackles-max',''],
    ['Inter','disc-inter-min','disc-inter-max',''],
  ];
  rangeChips.forEach(([label, minId, maxId, unit]) => {
    const minV = $(minId)?.value; const maxV = $(maxId)?.value;
    if (minV || maxV) {
      const txt = (minV&&maxV) ? `${label}: ${minV}–${maxV}${unit}` : minV ? `${label}: ≥${minV}${unit}` : `${label}: ≤${maxV}${unit}`;
      chips.push({ label: txt, remove: () => { if($(minId)) $(minId).value=''; if($(maxId)) $(maxId).value=''; renderDiscActiveChips(); onDiscFilterChange(); } });
    }
  });

  const row = $('disc-active-row');
  if (!row) return;
  if (!chips.length) { row.style.display='none'; return; }
  row.style.display='flex';
  row.innerHTML = chips.map((c,i) =>
    `<span class="disc-active-chip">${esc(c.label)}<button class="disc-active-chip-rm" onclick="_discChipRemove(${i})" title="Remove"><i class="fas fa-times"></i></button></span>`
  ).join('') + `<button class="disc-clear-all-btn" onclick="clearAllDiscFilters()"><i class="fas fa-times"></i> Clear all</button>`;
  row._chipRemovers = chips.map(c => c.remove);
}

function _discChipRemove(i) {
  const row = $('disc-active-row');
  if (row && row._chipRemovers && row._chipRemovers[i]) row._chipRemovers[i]();
}

function _syncChipBtns(groupId, activeSet) {
  const group = $(groupId); if (!group) return;
  group.querySelectorAll('.disc-chip').forEach(btn => {
    const val = btn.dataset.val || btn.textContent.trim();
    btn.classList.toggle('disc-chip-on', activeSet.has(val));
  });
}

/* ── Build URLSearchParams from current DS state ── */
function _buildDiscSearchParams() {
  const params = new URLSearchParams();
  const q = ($('disc-q')?.value || '').trim();
  if (q) params.set('q', q);
  DS.continents.forEach(c     => params.append('continents', c));
  DS.africa_regions.forEach(r => params.append('africa_regions', r));
  DS.countries.forEach(c      => params.append('countries', c.code));
  if (DS.selectedState) params.append('states', DS.selectedState);
  if (DS.selectedLga)   params.append('lgas', DS.selectedLga);
  DS.levels.forEach(l             => params.append('levels', l));
  DS.position_categories.forEach(c=> params.append('position_categories', c));
  DS.positions.forEach(p          => params.append('positions', p));
  if (DS.preferred_foot) params.set('preferred_foot', DS.preferred_foot);
  const _r = (key, id) => { const el=$(id); if(el&&el.value) params.set(key, el.value); };
  _r('age_min','disc-age-min');       _r('age_max','disc-age-max');
  _r('height_min','disc-height-min'); _r('height_max','disc-height-max');
  _r('weight_min','disc-weight-min'); _r('weight_max','disc-weight-max');
  _r('goals_min','disc-goals-min');   _r('goals_max','disc-goals-max');
  _r('assists_min','disc-assists-min');_r('assists_max','disc-assists-max');
  _r('matches_min','disc-matches-min');_r('matches_max','disc-matches-max');
  _r('rating_min','disc-rating-min'); _r('rating_max','disc-rating-max');
  _r('pass_accuracy_min','disc-pass-min');_r('pass_accuracy_max','disc-pass-max');
  _r('clean_sheets_min','disc-cs-min');_r('clean_sheets_max','disc-cs-max');
  _r('tackles_min','disc-tackles-min');_r('tackles_max','disc-tackles-max');
  _r('interceptions_min','disc-inter-min');_r('interceptions_max','disc-inter-max');
  const sortSel = $('disc-sort-by');
  params.set('sort_by', sortSel?.value || DS.sort_by || 'name');
  params.set('sort_order', DS.sort_order);
  params.set('page', DS.page);
  params.set('page_size', DS.pageSize);
  return params;
}

/* ── Execute search ── */
async function executeDiscSearch(resetPage) {
  if (resetPage) DS.page = 1;
  if (DS.loading) return;
  DS.loading = true;
  $('fp-list').innerHTML = loadingHtml();
  $('disc-pagination').style.display = 'none';
  $('disc-results-hdr').style.display = 'none';
  try {
    const params = _buildDiscSearchParams();
    const data = await api('/content-manager/search-players?' + params.toString());
    const players  = Array.isArray(data?.players) ? data.players : [];
    const total    = data.total    || 0;
    DS.total   = total;
    DS.hasMore = data.hasMore || false;
    CM_DISCOVERY.players = players;
    CM_DISCOVERY.pendingProposalMap = {};
    players.forEach(p => { if (p.pendingProposalId) CM_DISCOVERY.pendingProposalMap[p.id] = p.pendingProposalId; });
    renderDiscoveryResults(players, { total, page: DS.page, pageSize: DS.pageSize });
    renderDiscActiveChips();
    onDiscFilterChange();
    const hdr = $('disc-results-hdr');
    const cnt = $('disc-results-count');
    if (hdr && cnt) {
      hdr.style.display = 'flex';
      cnt.textContent = total === 0 ? 'No players found' :
        `${total.toLocaleString()} player${total===1?'':'s'} found`;
    }
    _renderDiscPagination(total);
  } catch(e) {
    $('fp-list').innerHTML = `<div class="empty"><p class="text-danger"><i class="fas fa-exclamation-circle"></i> ${esc(e.message)}</p></div>`;
  } finally {
    DS.loading = false;
  }
}

function _renderDiscPagination(total) {
  const pg   = $('disc-pagination');
  const info = $('disc-page-info');
  const prev = $('disc-prev-btn');
  const next = $('disc-next-btn');
  const totalPages = Math.ceil(total / DS.pageSize);
  if (!pg || totalPages <= 1) { if(pg) pg.style.display='none'; return; }
  pg.style.display = 'flex';
  if (info) info.textContent = `Page ${DS.page} of ${totalPages}`;
  if (prev) prev.disabled = DS.page <= 1;
  if (next) next.disabled = DS.page >= totalPages;
}

function discPrevPage() { if (DS.page > 1) { DS.page--; executeDiscSearch(); } }
function discNextPage() { if (DS.hasMore || DS.page < Math.ceil(DS.total/DS.pageSize)) { DS.page++; executeDiscSearch(); } }

  const el = $('fp-list');

  el.innerHTML = list.map(p => {
    const photoSrc = p.photoUrl
      ? esc(p.photoUrl)
      : `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name||'?')}&background=2e2e45&color=e2e8f0&size=46`;
    const age = p.age || (p.dob ? calcAge(p.dob) : null);
    const isFree = p.contractStatus==='none' || p.contractStatus==='expired';
    const catBadge = p.category ? `<span class="cat-badge">${esc(toTitleCase(p.category))}</span>` : '';
    const locationParts = [p.city, p.lga, p.state, p.nationality||p.country].filter(Boolean);
    const location = locationParts.join(', ');
    let statsPills = '';

      if (s.totalGoals)     pills.push(`<span class="disc-stat-pill">Goals <b>${s.totalGoals}</b></span>`);
      if (s.totalAssists)   pills.push(`<span class="disc-stat-pill">Ast <b>${s.totalAssists}</b></span>`);
      if (Number.isFinite(Number(s.avgRating))) pills.push(`<span class="disc-stat-pill">⭐ <b>${Number(s.avgRating).toFixed(1)}</b></span>`);
      if (Number.isFinite(Number(s.avgPassAcc))) pills.push(`<span class="disc-stat-pill">Pass <b>${Number(s.avgPassAcc).toFixed(0)}%</b></span>`);

    }
    const physMeta = [

      p.height ? p.height+'cm' : null,

      : `<button class="btn btn-primary btn-sm" onclick="openContentManagerProposal('${esc(p.id)}')"><i class="fas fa-paper-plane"></i> Send Management Request</button>`;

    return `<div class="disc-card">
      <div class="disc-av"><img src="${photoSrc}" alt="${esc(p.name)}" loading="lazy"/></div>
      <div class="disc-body">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span class="disc-name">${esc(p.name)}</span>
          ${p.position ? `<span class="pos-badge">${esc(p.position)}</span>` : ''}
          ${catBadge}
          <span style="font-size:10px;color:var(--text2);font-family:monospace">${esc(p.id||'')}</span>
        </div>
        <div class="disc-meta">${esc(p.club||'Free Agent')}${age?' · Age '+age:''}${location?' · '+esc(location):''}</div>
        <div class="disc-badges" style="margin-top:3px">
          <span class="badge ${sMap[p.contractStatus]||'badge-none'}">${esc(toTitleCase((p.contractStatus||'unknown').replace(/_/g,' ')))}</span>
          ${isFree?'<span style="font-size:10px;font-weight:700;color:var(--warning);background:rgba(245,158,11,.08);padding:2px 6px;border-radius:4px">Free Agent</span>':''}
          ${p.contract?.endDate?`<span style="font-size:11px;color:var(--text2)">${fmtDays(p.contract.endDate)}</span>`:''}

    </div>`;
  }).join('');
}
