<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EnejiStats – Register Venue</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/preact@10.19.3/dist/preact.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/preact@10.19.3/hooks/dist/hooks.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
  <style>
    :root{--primary:#004aad;--secondary:#0066cc;--success:#28a745;--danger:#dc3545;--warning:#ffc107;--dark:#1a1a2e;--gray:#6c757d;--gold:#ffd700;--border:#dee2e6;--shadow:0 2px 12px rgba(0,0,0,.08);--transition:all .2s ease}
    *,*:before,*:after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI",Arial,sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
    button,input,select,textarea{font:inherit}
    main{max-width:none;margin:0;padding:0}
    .panel{background:transparent;border-radius:0;box-shadow:none;padding:1rem}

    /* ── FORM BASICS ── */
    .section-block{background:#fafbff;border:1px solid #e5eaff;border-radius:12px;padding:1.1rem;margin-bottom:1.25rem;box-shadow:0 1px 6px rgba(0,74,173,.04)}
    .section-block-title{font-weight:700;font-size:.88rem;color:var(--primary);margin-bottom:1rem;display:flex;align-items:center;gap:7px;padding-bottom:.6rem;border-bottom:1px solid #e5eaff}
    .form-group{margin-bottom:1rem}
    .form-group:last-child{margin-bottom:0}
    label{display:block;font-weight:600;font-size:.88rem;margin-bottom:5px;color:var(--dark)}
    .req{color:var(--danger)}
    .form-control{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.88rem;outline:none;background:#fff;color:#333;transition:var(--transition)}
    .form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,74,173,.1)}
    .form-control:disabled{background:#f8f9fa;cursor:not-allowed;opacity:.7}
    .form-row{display:grid;grid-template-columns:1fr;gap:1rem}
    .helper-text{font-size:.78rem;color:var(--gray);margin-top:3px}
    .error-text{font-size:.78rem;color:var(--danger);margin-top:3px;display:flex;align-items:center;gap:5px}
    .gps-coords{font-size:.78rem;color:var(--success);margin-top:5px;font-weight:600}

    /* ── COUNTRY / SMART SELECT ── */
    .country-search-container,.smart-select-wrap{position:relative}
    .registration-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.88rem;outline:none;background:#fff;color:#333;transition:var(--transition)}
    .registration-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,74,173,.1)}
    .country-results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--border);border-radius:8px;max-height:200px;overflow-y:auto;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.12);display:none}
    .country-results.show{display:block}
    .country-result-item{padding:8px 12px;cursor:pointer;font-size:.84rem}
    .country-result-item:hover{background:#f0f4ff;color:var(--primary)}
    .smart-select-results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--border);border-radius:8px;max-height:200px;overflow-y:auto;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.12)}
    .smart-select-item{padding:8px 12px;cursor:pointer;font-size:.84rem}
    .smart-select-item:hover{background:#f0f4ff;color:var(--primary)}
    .loading-shimmer{height:40px;border-radius:8px;background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}

    /* ── REGISTRATION BUTTON / MESSAGE ── */
    .registration-button{width:100%;padding:13px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border:0;border-radius:10px;cursor:pointer;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 10px rgba(0,74,173,.2);transition:var(--transition)}
    .registration-button:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,74,173,.35)}
    .registration-button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
    .registration-message{padding:10px 14px;border-radius:8px;font-size:.86rem;font-weight:600;margin-top:.5rem}
    .registration-message.error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
    .registration-message.success{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0}

    /* ── BUTTONS ── */
    .btn{padding:.6rem 1.2rem;border:none;border-radius:6px;font-weight:600;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;gap:5px;font-size:.88rem}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:#003d8f}
    .btn-secondary{background:var(--gray);color:#fff}
    .btn-secondary:hover{background:#5a6268}
    .btn-sm{padding:.4rem .85rem;font-size:.82rem}

    /* ── MODAL ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
    .modal{background:#fff;border-radius:14px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:fadeIn .25s ease}
    .modal-header{padding:1.2rem 1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .modal-header h3{font-size:1.05rem;color:var(--dark);display:flex;align-items:center;gap:8px;margin:0}
    .modal-close{background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--gray);line-height:1}
    .modal-close:hover{color:var(--danger)}
    .modal-body{padding:1.5rem}
    .modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
    .modal-btn{padding:10px 20px;border:0;border-radius:8px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:7px;font-size:.88rem}
    .modal-btn.primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff}
    .modal-btn.primary:disabled{opacity:.55;cursor:not-allowed}
    .modal-btn.secondary{background:var(--gray);color:#fff}

    /* ── NOTIFICATIONS ── */
    .widget-notification{position:fixed;top:16px;right:16px;z-index:200;min-width:260px;max-width:360px;padding:1rem;border-radius:10px;box-shadow:0 5px 20px rgba(0,0,0,.2);display:flex;align-items:center;border-left:5px solid;animation:slideInRight .3s ease}
    .widget-notification.success{background:#28a745;color:#fff;border-left-color:#1e7e34}
    .widget-notification.error{background:#dc3545;color:#fff;border-left-color:#bd2130}
    .widget-notification.info{background:#17a2b8;color:#fff;border-left-color:#117a8b}
    .widget-notification.warning{background:#ffc107;color:#212529;border-left-color:#e0a800}
    .dco-notif{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:8px;color:#fff;font-weight:600;font-size:.85rem;z-index:9990;display:flex;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.2);animation:slideInDown .3s ease;max-width:420px;min-width:260px}
    .dco-notif.success{background:var(--success)}
    .dco-notif.error{background:var(--danger)}
    .dco-notif.warning{background:var(--warning);color:#333}
    .dco-notif.info{background:#17a2b8}

    /* ── LOADING ── */
    .loading-spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s ease-in-out infinite}
    .loading-spinner.dark{border-color:rgba(0,74,173,.2);border-top-color:var(--primary)}
    .hidden{display:none!important}
    .empty-state{text-align:center;padding:3rem 2rem;color:var(--gray)}
    .empty-state i{font-size:3rem;margin-bottom:1rem;opacity:.5;display:block}

    /* ── STATUS BADGE ── */
    .status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.73rem;font-weight:700}
    .badge-primary{background:#dbeafe;color:#1e40af}

    /* ── SECTION TITLE ── */
    .section-title{font-weight:700;color:var(--dark);font-size:1rem;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
    .section-title i{color:var(--primary)}

    /* ── SMART LIVENESS BANNER ── */
    .venue-liveness-banner{background:linear-gradient(135deg,#003a8c,#0055b3,#0066cc);color:#fff;border-radius:12px;padding:1.1rem 1.3rem;margin-bottom:1.25rem;display:flex;align-items:flex-start;gap:12px;font-size:.86rem;line-height:1.6;box-shadow:0 3px 14px rgba(0,74,173,.25)}
    .venue-liveness-banner i{font-size:1.2rem;margin-top:2px;flex-shrink:0;color:#7dd3fc}
    .venue-liveness-banner strong{display:block;margin-bottom:4px;font-size:.95rem;letter-spacing:.01em}
    .venue-liveness-banner em{color:#bfdbfe;font-style:normal;font-weight:600}

    /* ── GPS ACCURACY ── */
    .gps-accuracy-ok{color:#4ade80;font-weight:700}
    .gps-accuracy-warn{color:#fbbf24;font-weight:700}
    .gps-accuracy-bad{color:#f87171;font-weight:700}

    /* ── GPS LIVENESS LIVE DISPLAY ── */
    .gps-live-display{background:linear-gradient(135deg,#0a1a0a,#0d3b1e);color:#fff;border-radius:10px;padding:1rem 1.25rem;margin:0 0 .5rem}
    .gps-live-display .gps-live-label{font-size:.72rem;color:rgba(255,255,255,.55);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px}
    .gps-live-display .gps-live-label i{color:#4ade80}
    .gps-coords-big{font-family:'Courier New',monospace;font-size:.92rem;color:#4ade80;font-weight:700;letter-spacing:.02em}
    .gps-live-acc{font-size:.75rem;font-weight:600;margin-top:4px}
    .gps-live-ts{font-size:.68rem;color:rgba(255,255,255,.4);margin-top:2px}
    .stamp-badge{display:inline-block;background:rgba(220,38,38,.85);color:#fff;font-size:.63rem;font-weight:800;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:middle;letter-spacing:.04em;text-transform:uppercase}

    /* ── VIDEO RECORDER ── */
    .video-record-section{border:1.5px solid #e5eaff;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 6px rgba(0,74,173,.04)}
    .video-record-preview-wrap{position:relative;background:#0a0a0a;min-height:180px;display:flex;align-items:center;justify-content:center}
    .video-record-preview-wrap video{width:100%;display:block;max-height:260px;object-fit:cover}
    .video-no-stream{color:rgba(255,255,255,.35);text-align:center;padding:2.5rem 1rem;font-size:.84rem}
    .video-no-stream i{font-size:2.4rem;display:block;margin-bottom:8px;opacity:.6}
    .video-no-stream p{margin-top:4px;font-size:.75rem;color:rgba(255,255,255,.25)}
    .video-gps-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.3));padding:7px 10px}
    .video-gps-overlay .stamp-coord{font-family:'Courier New',monospace;font-size:.72rem;color:#4ade80;font-weight:700;display:block;text-shadow:0 1px 3px rgba(0,0,0,.5)}
    .video-gps-overlay .stamp-ts{font-size:.63rem;color:rgba(255,255,255,.7);display:block;margin-top:1px}
    .video-gps-overlay .stamp-acc{font-size:.62rem;color:rgba(74,222,128,.8);display:block}
    .video-rec-timer{position:absolute;top:10px;right:12px;background:rgba(220,38,38,.9);color:#fff;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:7px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .video-rec-dot{width:7px;height:7px;background:#fff;border-radius:50%;animation:blink 1s step-end infinite}
    .video-gps-acquiring{position:absolute;top:10px;left:12px;background:rgba(0,0,0,.65);color:#fbbf24;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:7px;display:flex;align-items:center;gap:6px}
    .video-record-controls{display:flex;align-items:center;gap:10px;padding:.85rem 1rem;background:#f8fafc;border-top:1px solid #e5eaff;flex-wrap:wrap}
    .btn-record{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border:none;border-radius:9px;padding:10px 20px;font-weight:700;font-size:.88rem;cursor:pointer;display:flex;align-items:center;gap:7px;transition:var(--transition);box-shadow:0 2px 8px rgba(220,38,38,.25)}
    .btn-record:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(220,38,38,.4)}
    .btn-record.stop{background:linear-gradient(135deg,#374151,#4b5563);box-shadow:0 2px 8px rgba(0,0,0,.2)}
    .btn-record.stop:hover:not(:disabled){box-shadow:0 4px 12px rgba(0,0,0,.3)}
    .btn-record:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .video-hint{font-size:.75rem;color:var(--gray);flex:1;min-width:80px;line-height:1.4}
    .video-ready-badge{background:#d1fae5;color:#065f46;font-size:.78rem;font-weight:700;padding:5px 12px;border-radius:7px;white-space:nowrap;display:flex;align-items:center;gap:5px;border:1px solid #a7f3d0}
    .btn-recapture{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;border-radius:9px;padding:9px 18px;font-weight:700;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:7px;transition:var(--transition);box-shadow:0 2px 8px rgba(124,58,237,.25)}
    .btn-recapture:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(124,58,237,.4)}

    /* ── GPS ACQUIRING OVERLAY ── */
    .gps-acquiring-banner{background:linear-gradient(135deg,#1a3a1a,#0d4a1e);border:1px solid rgba(74,222,128,.2);border-radius:8px;padding:.8rem 1rem;margin-top:.6rem;display:flex;align-items:center;gap:10px;font-size:.82rem;color:#d1fae5}
    .gps-acquiring-banner i{color:#4ade80;flex-shrink:0}

    /* ── RESPONSIVE ── */
    @media(min-width:560px){.form-row{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.panel{padding:.85rem}.modal-footer{flex-direction:column-reverse}.modal-footer .modal-btn{width:100%}}

    /* ── ANIMATIONS ── */
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shimmer{0%,100%{opacity:.6}50%{opacity:1}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes slideInDown{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  
/* REGISTER SOURCE GEO CONTROLS — no GPS */
.smart-select-wrap{position:relative;width:100%}
.smart-select-results{position:absolute;top:100%;left:0;right:0;z-index:500;background:#fff;border:1.5px solid #dee2e6;border-radius:8px;max-height:220px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.smart-select-item{padding:8px 12px;cursor:pointer;font-size:.84rem}
.smart-select-item:hover{background:#f0f4ff;color:#004aad}
.input-group{position:relative;display:flex;align-items:center}
.input-group .form-control{flex:1}
.input-icon{display:flex;align-items:center;justify-content:center;margin-left:-30px;width:30px;color:#64748b;pointer-events:none}
.loading-shimmer{height:40px;border-radius:8px;background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:200% 100%;animation:registerGeoShimmer 1.2s infinite}
@keyframes registerGeoShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
  <div id="app"></div>
  <script>
const { h, render, Fragment } = preact;
const { useState, useRef, useEffect, useCallback } = preactHooks;
const html = htm.bind(h);

/* ── CONSTANTS ── */
const VENUE_TYPES    = ['Stadium','Football Field','Training Ground','Sports Complex','School Ground','Indoor Arena','Mini Pitch','Other'];
const VENUE_SURFACES = ['Natural Grass','Artificial Turf','Hybrid Grass','Concrete / Tarmac','Sand','Other'];
const GPS_ACCURACY_THRESHOLD = 100; // metres

/* ── API ENDPOINTS ── */
const API = {
  userInfo:      '/api/dco/user-info',
  metrics:       '/api/dco/metrics',
  regStats:      '/api/dco/registration-stats',
  registerVenue: '/api/dco/register-venue',
  countries:     '/api/public/countries',
};

/* ── TITLE CASE HELPER — auto-capitalise first letter of every word ── */
function toTitleCase(str) {
  return str.replace(/(^|[\s\-\/])([a-z])/g, (_, sep, ch) => sep + ch.toUpperCase());
}

/* ── API HELPERS ── */
async function apiFetch(endpoint, options = {}) {
  try {
    const storedToken = localStorage.getItem('dco_token');
    const authHeaders = storedToken ? { 'Authorization': 'Bearer ' + storedToken } : {};
    const isJson = options.body && !(options.body instanceof FormData);
    const res = await fetch(endpoint, {
      credentials: 'include',
      headers: {
        ...authHeaders,
        ...(isJson ? { 'Content-Type': 'application/json' } : {}),
        ...(options.headers || {})
      },
      ...options
    });
    if (!res.ok) {
      if (res.status === 401 || res.status === 403) {
        localStorage.clear(); sessionStorage.clear();
        window.location.replace('/login');
        const e = new Error('Session expired'); e.status = res.status; throw e;
      }
      const txt = await res.text();
      const e = new Error(`HTTP ${res.status}: ${txt}`); e.status = res.status; throw e;
    }
    return res.json();
  } catch (err) {
    if (!err.status) console.error(`API error (${endpoint}):`, err);
    throw err;
  }
}

async function apiFetchFormData(endpoint, formData) {
  try {
    const storedToken = localStorage.getItem('dco_token');
    const authHeaders = storedToken ? { 'Authorization': 'Bearer ' + storedToken } : {};
    const res = await fetch(endpoint, {
      method: 'POST', credentials: 'include',
      headers: { ...authHeaders }, body: formData
    });
    if (!res.ok) {
      if (res.status === 401 || res.status === 403) {
        localStorage.clear(); sessionStorage.clear();
        window.location.replace('/login');
        throw new Error('Session expired');
      }
      const txt = await res.text();
      throw new Error(`HTTP ${res.status}: ${txt}`);
    }
    return res.json();
  } catch (err) {
    console.error(`API error (${endpoint}):`, err);
    throw err;
  }
}

/* ── UTILITIES ── */
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtBytes(b) {
  return b < 1048576 ? (b / 1024).toFixed(1) + 'KB' : (b / 1048576).toFixed(2) + 'MB';
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m > 0 ? `${m}:${sec.toString().padStart(2,'0')}` : `${sec}s`;
}

/* ── NOTIFICATIONS ── */
function showNotification(message, type = 'info', duration = 5000) {
  document.querySelectorAll('.widget-notification').forEach(el => el.remove());
  const n = document.createElement('div');
  n.className = `widget-notification ${type}`;
  const iconMap = { error:'exclamation-circle', success:'check-circle', warning:'exclamation-triangle', info:'info-circle' };
  n.innerHTML = `<i class="fas fa-${iconMap[type]||'info-circle'}"></i>
    <span style="margin-left:9px;flex:1">${escHtml(message)}</span>
    <button onclick="this.parentElement.remove()" style="background:none;border:none;color:inherit;cursor:pointer;margin-left:9px"><i class="fas fa-times"></i></button>`;
  document.body.appendChild(n);
  setTimeout(() => n.parentElement && n.remove(), duration);
}

/* ── METRICS LOADER ── */
async function loadMetrics() {
  try {
    const res = await apiFetch(API.metrics);
    let reg = { players: {}, clubs: {} };
    try { reg = await apiFetch(API.regStats); } catch {}
    return {
      totalPlayersRegistered:  res.assigned_players || 0,
      bioUpdatesTotal:         res.bio_updates_total || 0,
      achievementsUpdatesTotal:res.stats_total || 0,
      totalPlayersAssigned:    res.assigned_players || 0,
      totalStatsSubmitted:     res.stats_total || 0,
      tokenBalance:            res.token_balance || 0,
      pendingValidation:       res.pending_validation || 0,
      playerPro:               reg.players?.Professional || 0,
      playerSemi:              reg.players?.['Semi-professional'] || 0,
      playerAcademy:           reg.players?.Academy || 0,
      playerLocal:             reg.players?.Local || 0,
      playerUniversity:        reg.players?.University || 0,
      clubPro:                 reg.clubs?.Professional || 0,
      clubSemi:                reg.clubs?.['Semi-professional'] || 0,
      clubAcademy:             reg.clubs?.Academy || 0,
      clubLocal:               reg.clubs?.Local || 0,
      clubUniversity:          reg.clubs?.University || 0,
      totalClubsRegistered:    reg.totalClubs || 0,
    };
  } catch {
    throw new Error('Failed to load metrics from server');
  }
}

/* ── HOOKS ── */
function useClickOutside(ref, handler) {
  useEffect(() => {
    function listener(e) { if (ref.current && !ref.current.contains(e.target)) handler(); }
    document.addEventListener('mousedown', listener);
    return () => document.removeEventListener('mousedown', listener);
  }, [ref, handler]);
}

function useStates(countryCode) {
  const [states,setStates]=useState([]), [loading,setLoading]=useState(false);
  const [regionLabel,setRegionLabel]=useState('State / Region');

   VENUE REGISTRATION

   1. Smart Liveness Banner          (top of form)
   2. Venue Details & Location

function VenueRegistration({ metrics, setMetrics, isLoading, setIsLoading, countries, currentUser }) {
  const EMPTY = {

  const [f, setF]           = useState(EMPTY);
  const [geoStates, geoStatesLoading, geoRegionLabel] = useStates(f.country || '');
  const [geoLgas, geoLgasLoading, geoSubregionLabel] = useLGAs(f.country || '', f.state || '');
  const set                 = useCallback((k, v) => setF(prev => ({ ...prev, [k]: v })), []);
  const [submitting,        setSubmitting]    = useState(false);
  const [formMessage,       setFormMessage]   = useState('');
  const [msgType,           setMsgType]       = useState('');
  const [showConfirm,       setShowConfirm]   = useState(false);
  const [gpsTs,             setGpsTs]         = useState(null);

  /* ── Video recording state ── */
  const [recording,         setRecording]     = useState(false);
  const [recSecs,           setRecSecs]       = useState(0);
  const [videoReady,        setVideoReady]    = useState(false);
  const [gpsStatus,         setGpsStatus]     = useState('idle'); // idle | acquiring | captured | failed
  const mediaRecorderRef    = useRef(null);
  const chunksRef           = useRef([]);
  const recTimerRef         = useRef(null);
  const liveVideoRef        = useRef(null);
  const streamRef           = useRef(null);
  const gpsRef              = useRef(null); // holds live GPS during recording

  /* ── GPS stamp text ── */
  const gpsStampText = f.gps
    ? `${f.gps.lat.toFixed(6)}, ${f.gps.lng.toFixed(6)}`
    : null;
  const gpsAccClass = !f.gps ? ''
    : f.gps.acc <= GPS_ACCURACY_THRESHOLD       ? 'gps-accuracy-ok'
    : f.gps.acc <= GPS_ACCURACY_THRESHOLD * 3   ? 'gps-accuracy-warn'
    : 'gps-accuracy-bad';
  const gpsOk = f.gps && f.gps.acc <= GPS_ACCURACY_THRESHOLD * 3;

  useEffect(() => { set('state', ''); set('lga', ''); }, [f.country]);

    };

  const acquireGps = () => new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('Geolocation not supported'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        const gpsData = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          acc: pos.coords.accuracy,
        };
        resolve(gpsData);
      },
      err => reject(err),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  });

  const startRecording = async () => {
    setGpsStatus('acquiring');
    setFormMessage('');

    // Determine best supported video mime type
    const mimeTypes = [
      'video/mp4;codecs=h264',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm',

      facingMode: 'environment',
      width:     { ideal: 3840, min: 1280 },
      height:    { ideal: 2160, min: 720 },
      frameRate: { ideal: 60,   min: 30  },
    };

      // Start camera and GPS simultaneously

        navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false })

      // Stop stream if it started before GPS error
      if (streamRef.current) {
        streamRef.current.getTracks().forEach(t => t.stop());
        streamRef.current = null;
      }
    }

    }

    set('gps', null);
    setGpsTs(null);
    setGpsStatus('idle');
    gpsRef.current = null;
    setRecSecs(0);

      const res = await apiFetchFormData(API.registerVenue, fd);

            <!-- GPS overlay — shown during live recording -->
            ${recording && gpsStatus === 'captured' && f.gps ? html`
              <div class="video-gps-overlay">
                <span class="stamp-coord">GPS: ${gpsStampText}</span>
                <span class="stamp-acc class=${gpsAccClass}">Accuracy: ±${f.gps.acc.toFixed(0)}m</span>
                <span class="stamp-ts">${gpsTs}</span>
              </div>` : ''}

            <!-- Acquiring GPS indicator while recording waits -->
            ${gpsStatus === 'acquiring' ? html`
              <div class="video-gps-acquiring">
                <i class="fas fa-spinner fa-spin"></i> Acquiring GPS…
              </div>` : ''}

          </div>

          <!-- Controls bar -->
          <div class="video-record-controls">

            ${!recording && !videoReady ? html`
              <button type="button" class="btn-record" onClick=${startRecording}>
                <i class="fas fa-circle"></i> Start Recording
              </button>
              <span class="video-hint">Tap to record up to 10 s — GPS captured automatically at start</span>` : ''}

            ${recording ? html`
              <button type="button" class="btn-record stop" onClick=${stopRecording}>
                <i class="fas fa-stop"></i> Stop Recording
              </button>
              <span class="video-hint">
                ${gpsStatus === 'acquired' || gpsStatus === 'captured'
                  ? html`<i class="fas fa-satellite-dish" style="color:var(--success)"></i> GPS locked — auto-stops at 10 s`
                  : gpsStatus === 'acquiring'
                  ? html`<i class="fas fa-spinner fa-spin"></i> Acquiring GPS…`
                  : 'Recording… auto-stops at 10 s'}
              </span>` : ''}

            ${!recording && videoReady ? html`
              <span class="video-ready-badge">
                <i class="fas fa-check-circle"></i> Video Ready
              </span>
              <button type="button" class="btn-recapture" onClick=${discardVideo}>
                <i class="fas fa-redo-alt"></i> Recapture
              </button>` : ''}

          </div>
        </div>

        <!-- GPS result display (below video card, after recording) -->
        ${videoReady && f.gps ? html`
          <div class="gps-live-display" style="margin-top:.75rem">
            <div class="gps-live-label">
              <i class="fas fa-satellite-dish"></i> On-Site GPS — Liveness Verified
            </div>
            <div class="gps-coords-big">${f.gps.lat.toFixed(6)}, ${f.gps.lng.toFixed(6)}</div>
            <div class=${'gps-live-acc ' + gpsAccClass}>
              ${f.gps.acc <= GPS_ACCURACY_THRESHOLD
                ? html`<i class="fas fa-check-circle"></i> Excellent accuracy ±${f.gps.acc.toFixed(0)}m`
                : f.gps.acc <= GPS_ACCURACY_THRESHOLD * 3
                ? html`<i class="fas fa-exclamation-triangle"></i> Fair accuracy ±${f.gps.acc.toFixed(0)}m — submission allowed`
                : html`<i class="fas fa-times-circle"></i> Poor accuracy ±${f.gps.acc.toFixed(0)}m — consider re-recording in an open area`}
            </div>
            ${gpsTs ? html`<div class="gps-live-ts">Captured: ${gpsTs}</div>` : ''}
          </div>` : ''}

        ${gpsStatus === 'failed' ? html`
          <div class="gps-acquiring-banner" style="background:linear-gradient(135deg,#3a0a0a,#4a1a1a);border-color:rgba(248,113,113,.2);color:#fecaca">
            <i class="fas fa-exclamation-triangle" style="color:#f87171"></i>
            GPS failed — ensure location permissions are enabled in your browser settings, then try recording again.
          </div>` : ''}

        ${!f.video ? html`
          <p class="helper-text" style="margin-top:6px;color:var(--danger)">
            <i class="fas fa-exclamation-circle"></i> Venue video is required.
          </p>` : ''}
      </div>

      <button class="registration-button" type="submit" disabled=${isLoading || submitting}>
        ${isLoading || submitting
          ? html`<div class="loading-spinner"></div>`
          : html`<i class="fas fa-map-marker-alt"></i>`}
        ${isLoading || submitting ? 'Registering Venue…' : 'Review & Register Venue'}
      </button>

      ${formMessage && html`<div class=${'registration-message ' + msgType}>${formMessage}</div>`}
    </form>

    <!-- ── Confirmation Modal ── -->
    ${showConfirm && html`
      <div class="modal-overlay" style="display:flex">
        <div class="modal">
          <div class="modal-header">
            <h3><i class="fas fa-map-marker-alt"></i> Confirm Venue Registration</h3>
            <button class="modal-close" onClick=${() => setShowConfirm(false)}>&times;</button>
          </div>
          <div class="modal-body">
            <p style="margin-bottom:12px;font-size:.88rem;color:var(--gray)">Please review the details below before submitting:</p>
            <div style="background:#f8fafc;padding:.9rem;border-radius:10px;font-size:.84rem;border:1px solid #e9ecef">
              ${[
                ['Venue Name',    f.venueName],
                ['Venue Type',    f.venueType],
                ['Surface',       f.surfaceType || '—'],
                ['Capacity',      f.capacity    || '—'],
                ['Country',       f.country],
                ['State',         f.state       || '—'],
                ['LGA',           f.lga         || '—'],
                ['Address',       f.fullAddress],
                ['Video',         f.video ? '✓ Recorded (' + fmtBytes(f.video.size) + ')' : '—'],
                ['Registered By', currentUser?.name || '—'],

              ].map(([k, v]) => html`
                <div style="display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid #e9ecef;gap:1rem">
                  <strong style="flex-shrink:0;color:var(--dark)">${k}:</strong>
                  <span style="text-align:right;color:var(--gray)">${v || '—'}</span>
                </div>`)}
            </div>
            <div style="background:#eef5ff;border:1px solid rgba(0,74,173,.2);border-radius:10px;padding:.85rem;margin-top:1rem;font-size:.82rem;display:flex;align-items:flex-start;gap:8px">
              <i class="fas fa-shield-alt" style="color:var(--primary);margin-top:2px;flex-shrink:0"></i>
              <div><strong>GPS Liveness Verified</strong> — location confirmed on-site at the time of recording. GPS coordinates are <strong>not</strong> stored in the database.</div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="modal-btn secondary" onClick=${() => setShowConfirm(false)}>
              <i class="fas fa-arrow-left"></i> Edit
            </button>
            <button class="modal-btn primary" onClick=${handleConfirm} disabled=${isLoading || submitting}>
              ${isLoading || submitting
                ? html`<div class="loading-spinner"></div> Registering…`
                : html`<i class="fas fa-check"></i> Confirm & Register`}
            </button>
          </div>
        </div>
      </div>`}
  `;
}

/* ══════════════════════════════════════════════════════════
   VENUES APP — renders the registration form directly
   (no tabs, no My Venues section)
══════════════════════════════════════════════════════════ */
function VenuesApp() {
  const [metrics,     setMetrics]     = useState({
    tokenBalance: 0, totalPlayersRegistered: 0, totalClubsRegistered: 0,
    bioUpdatesTotal: 0, achievementsUpdatesTotal: 0,
    totalPlayersAssigned: 0, pendingValidation: 0,
    playerPro: 0, playerSemi: 0, playerAcademy: 0, playerLocal: 0, playerUniversity: 0,
    clubPro: 0, clubSemi: 0, clubAcademy: 0, clubLocal: 0, clubUniversity: 0,
  });
  const [isLoading,   setIsLoading]   = useState(false);
  const [countries,   setCountries]   = useState([]);
  const [currentUser, setCurrentUser] = useState({ name: 'DCO', id: '', dco_id: '', photo: '' });

  useEffect(() => {
    apiFetch(API.userInfo)
      .then(user => setCurrentUser({
        name:   user.name || user.fullName || 'DCO',
        id:     user._id  || user.id       || user.dco_id || '',
        dco_id: user.dco_id || user.id || '',
        photo:  user.photo  || user.profileImage || '',
      }))
      .catch(() => {});

    apiFetch(API.countries)
      .then(data => {
        const list = Array.isArray(data) ? data : (data.countries || data.data || []);
        setCountries(list);
      })
      .catch(() => {});

    loadMetrics().then(setMetrics).catch(() => {});
  }, []);

  return html`
    <main>
      <div class="panel">
        <${VenueRegistration}
          key="venue-reg"
          metrics=${metrics}
          setMetrics=${setMetrics}
          isLoading=${isLoading}
          setIsLoading=${setIsLoading}
          countries=${countries}
          currentUser=${currentUser}/>
      </div>
    </main>`;
}

render(html`<${VenuesApp}/>`, document.getElementById('app'));
  </script>
</body>
</html>
