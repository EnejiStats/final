<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enejistats — Communications Officer Dashboard</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --primary:#1a4fa0;--secondary:#0066cc;--gold:#f5b800;
      --dark1:#0d1117;--dark2:#161b22;--dark3:#21262d;--dark4:#30363d;
      --text:#e6edf3;--muted:#8b949e;
      --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;
      --sidebar-w:270px;
    }
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--dark1);color:var(--text);min-height:100vh;overflow-x:hidden}
    input,select,textarea,button{font-family:inherit}
    a{color:var(--secondary);text-decoration:none}

    /* ── SIDEBAR ── */
    #sidebar{position:fixed;top:0;left:0;height:100vh;width:var(--sidebar-w);background:var(--dark2);border-right:1px solid var(--dark4);z-index:1100;display:flex;flex-direction:column;transition:transform .3s ease;overflow-y:auto}
    #sidebar.closed{transform:translateX(calc(-1 * var(--sidebar-w)))}
    .sb-head{background:linear-gradient(160deg,var(--primary) 0%,var(--secondary) 100%);padding:1.1rem 1rem;display:flex;align-items:center;gap:.6rem;flex-shrink:0}
    .sb-logo{font-size:1.2rem;font-weight:900;color:#fff;letter-spacing:1px}
    .sb-logo span{color:var(--gold)}
    .sb-profile{padding:1.1rem;display:flex;flex-direction:column;align-items:center;gap:.35rem;border-bottom:1px solid var(--dark4);flex-shrink:0}
    .sb-av{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--gold);background:rgba(26,79,160,.4);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:1.4rem;overflow:hidden;flex-shrink:0}
    .sb-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .sb-name{color:var(--text);font-weight:700;font-size:.9rem;text-align:center}
    .role-badge{background:var(--gold);color:#111;font-size:.6rem;font-weight:800;padding:.2rem .6rem;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
    .sb-email{font-size:.68rem;color:var(--muted);text-align:center;word-break:break-all}
    .sb-nav{flex:1;padding:.4rem 0}
    .nav-item{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.1rem;color:rgba(255,255,255,.75);cursor:pointer;transition:all .18s;font-size:.87rem;border-left:3px solid transparent;position:relative}
    .nav-item:hover{background:rgba(255,255,255,.06);color:var(--text);padding-left:1.3rem}
    .nav-item.active{background:rgba(26,79,160,.2);border-left-color:var(--secondary);color:#fff}
    .nav-item i{color:var(--secondary);width:20px;text-align:center;font-size:.9rem}
    .nav-item.active i{color:var(--gold)}
    .nav-item.logout-item{border-top:1px solid var(--dark4);margin-top:.3rem;color:var(--danger)}
    .nav-item.logout-item i{color:var(--danger)}

    /* ── OVERLAY ── */
    #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1050}
    #overlay.show{display:block}

    /* ── HEADER ── */
    #header{position:fixed;top:0;left:var(--sidebar-w);right:0;height:58px;z-index:1000;background:linear-gradient(90deg,var(--dark2),rgba(26,79,160,.3));border-bottom:1px solid var(--dark4);display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;transition:left .3s}
    #header.full{left:0}
    .h-left{display:flex;align-items:center;gap:.8rem}
    .hamburger{background:none;border:none;color:var(--text);font-size:1.25rem;cursor:pointer;padding:.25rem}
    .h-title{color:var(--text);font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:.4rem}
    .h-title i{color:var(--gold)}
    .h-right{display:flex;align-items:center;gap:.8rem}
    .h-av{width:34px;height:34px;border-radius:50%;background:rgba(26,79,160,.5);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:.9rem;border:1.5px solid var(--gold)}
    .h-name{color:var(--text);font-size:.82rem;font-weight:600}
    .h-role{font-size:.67rem;color:var(--muted)}
    .h-info{display:none;flex-direction:column}
    .btn-lo{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--danger);padding:.3rem .75rem;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:600;transition:all .2s}
    .btn-lo:hover{background:rgba(239,68,68,.25)}

    /* ── MAIN ── */
    #main{margin-left:var(--sidebar-w);margin-top:58px;padding:1.4rem;min-height:calc(100vh - 58px);transition:margin-left .3s;overflow-x:hidden}
    #main.full{margin-left:0}
    .breadcrumb{font-size:.78rem;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:.4rem}
    .breadcrumb i{font-size:.7rem}

    /* ── CARDS ── */
    .card{background:var(--dark2);border:1px solid var(--dark4);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
    .card-title{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:.85rem;display:flex;align-items:center;gap:.45rem}
    .card-title i{color:var(--gold)}
    .welcome-card{background:linear-gradient(135deg,var(--primary) 0%,#0e3a7a 100%);border:1px solid rgba(26,79,160,.5);border-radius:14px;padding:1.5rem;margin-bottom:1.2rem}
    .welcome-card h2{font-size:1.25rem;font-weight:800;margin-bottom:.3rem;color:#fff}
    .welcome-card p{color:rgba(255,255,255,.75);font-size:.84rem}

    /* ── STATS ROW ── */
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.2rem}
    .stat-card{background:var(--dark2);border:1px solid var(--dark4);border-radius:12px;padding:1.1rem;border-top:3px solid var(--primary);transition:transform .15s}
    .stat-card:hover{transform:translateY(-2px)}
    .stat-val{font-size:1.7rem;font-weight:800;color:var(--text);line-height:1.1}
    .stat-label{font-size:.69rem;color:var(--muted);font-weight:600;text-transform:uppercase;margin-top:.3rem;letter-spacing:.5px}

    /* ── TABLES ── */
    .tw{overflow-x:auto;border-radius:8px;border:1px solid var(--dark4)}
    table{width:100%;border-collapse:collapse;font-size:.83rem}
    th{background:rgba(26,79,160,.25);color:var(--muted);padding:.65rem .8rem;text-align:left;font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--dark4)}
    td{padding:.6rem .8rem;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text);vertical-align:middle}
    tr:hover td{background:rgba(255,255,255,.025)}
    tr:last-child td{border-bottom:none}

    /* ── BADGES ── */
    .badge{display:inline-block;padding:.18rem .55rem;border-radius:20px;font-size:.68rem;font-weight:700;letter-spacing:.3px}
    .b-success{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.25)}
    .b-warning{background:rgba(245,158,11,.15);color:var(--warning);border:1px solid rgba(245,158,11,.25)}
    .b-danger{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.25)}
    .b-info{background:rgba(26,79,160,.2);color:#60a5fa;border:1px solid rgba(96,165,250,.25)}
    .b-secondary{background:rgba(255,255,255,.08);color:var(--muted);border:1px solid var(--dark4)}
    .b-gold{background:rgba(245,184,0,.15);color:var(--gold);border:1px solid rgba(245,184,0,.25)}
    .b-player{background:rgba(96,165,250,.15);color:#60a5fa;border:1px solid rgba(96,165,250,.2)}
    .b-club{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.2)}
    .b-agent{background:rgba(245,158,11,.15);color:var(--warning);border:1px solid rgba(245,158,11,.2)}
    .b-scout{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.2)}
    .b-ds{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2)}

    /* ── BUTTONS ── */
    .btn{padding:.42rem .95rem;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .18s;display:inline-flex;align-items:center;gap:.4rem}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover:not(:disabled){background:var(--secondary)}
    .btn-secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--dark4)}
    .btn-secondary:hover:not(:disabled){background:rgba(255,255,255,.14)}
    .btn-success{background:rgba(34,197,94,.2);color:#22c55e;border:1px solid rgba(34,197,94,.3)}
    .btn-success:hover:not(:disabled){background:rgba(34,197,94,.3)}
    .btn-danger{background:rgba(239,68,68,.2);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
    .btn-danger:hover:not(:disabled){background:rgba(239,68,68,.3)}
    .btn-warning{background:rgba(245,158,11,.2);color:var(--warning);border:1px solid rgba(245,158,11,.3)}
    .btn-sm{padding:.28rem .65rem;font-size:.73rem}

    /* ── FORMS ── */
    .form-group{margin-bottom:.9rem}
    label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.35rem;letter-spacing:.2px}
    input[type=text],input[type=email],input[type=password],input[type=date],input[type=datetime-local],input[type=url],input[type=number],input[type=file],select,textarea{width:100%;padding:.5rem .8rem;border:1.5px solid var(--dark4);border-radius:8px;font-family:inherit;font-size:.83rem;transition:border .2s;background:var(--dark1);color:var(--text)}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--secondary)}
    textarea{resize:vertical;min-height:80px}
    select option{background:var(--dark2);color:var(--text)}
    .err{color:var(--danger);font-size:.73rem;margin-top:.2rem}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem}

    /* ── RICH TEXT EDITOR ── */
    .rte-bar{display:flex;gap:.3rem;flex-wrap:wrap;padding:.4rem;background:var(--dark3);border:1.5px solid var(--dark4);border-bottom:none;border-radius:8px 8px 0 0}
    .rte-btn{padding:.22rem .48rem;border:1px solid var(--dark4);border-radius:4px;background:var(--dark2);color:var(--text);cursor:pointer;font-size:.78rem;transition:all .15s}
    .rte-btn:hover{background:rgba(255,255,255,.1);border-color:var(--secondary)}
    .rte-content{border:1.5px solid var(--dark4);border-radius:0 0 8px 8px;padding:.6rem;min-height:100px;outline:none;font-size:.83rem;line-height:1.5;background:var(--dark1);color:var(--text)}
    .rte-content:focus{border-color:var(--secondary)}

    /* ── MODALS ── */
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2000;display:flex;align-items:center;justify-content:center;padding:1rem}
    .modal{background:var(--dark2);border:1px solid var(--dark4);border-radius:14px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .modal.wide{max-width:820px}
    .modal-head{background:linear-gradient(90deg,var(--primary),var(--secondary));padding:.9rem 1.2rem;display:flex;align-items:center;justify-content:space-between;border-radius:14px 14px 0 0}
    .modal-title{color:#fff;font-weight:700;font-size:.95rem}
    .modal-close{background:none;border:none;color:rgba(255,255,255,.7);font-size:1.3rem;cursor:pointer;line-height:1}
    .modal-close:hover{color:#fff}
    .modal-body{padding:1.2rem}
    .modal-foot{padding:.8rem 1.2rem;display:flex;gap:.5rem;justify-content:flex-end;border-top:1px solid var(--dark4)}

    /* ── ACTIVITY LIST ── */
    .act-list{list-style:none}
    .act-item{display:flex;align-items:flex-start;gap:.65rem;padding:.55rem 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.82rem}
    .act-item:last-child{border-bottom:none}
    .act-icon{width:30px;height:30px;border-radius:50%;background:rgba(26,79,160,.2);display:flex;align-items:center;justify-content:center;color:var(--secondary);font-size:.8rem;flex-shrink:0;border:1px solid rgba(26,79,160,.3)}
    .act-time{font-size:.7rem;color:var(--muted);margin-top:.2rem}

    /* ── SECTION EDITOR BLOCK ── */
    .sec-block{border:1px solid var(--dark4);border-radius:10px;padding:1rem;margin-bottom:.9rem;background:var(--dark3)}
    .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;flex-wrap:wrap;gap:.5rem}
    .sec-title{font-weight:700;color:var(--text);font-size:.87rem}
    .sec-up{font-size:.7rem;color:var(--muted)}
    .sec-acts{display:flex;gap:.35rem;flex-wrap:wrap}

    /* ── COMPETITION CARD ── */
    .comp-card{border:1px solid var(--dark4);border-radius:12px;padding:1rem;margin-bottom:.8rem;background:var(--dark3);display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;transition:border-color .2s}
    .comp-card:hover{border-color:rgba(26,79,160,.4)}
    .comp-info h3{font-size:.92rem;font-weight:700;color:var(--text);margin-bottom:.2rem}
    .comp-meta{font-size:.76rem;color:var(--muted);display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.35rem}
    .comp-meta i{color:var(--secondary)}
    .comp-acts{display:flex;gap:.4rem;flex-shrink:0;flex-wrap:wrap;align-items:flex-start}

    /* ── TICKET CARD ── */
    .ticket-card{border:1px solid var(--dark4);border-radius:12px;padding:1rem;margin-bottom:.8rem;background:var(--dark3)}
    .tkt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;flex-wrap:wrap;gap:.4rem}
    .tkt-id{font-weight:800;color:var(--secondary);font-size:.84rem}
    .tkt-meta{display:flex;gap:.7rem;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-bottom:.5rem}
    .chat-thread{background:var(--dark3);border-radius:10px;padding:.9rem;min-height:180px;max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:.55rem;border:1px solid var(--dark4)}
    .msg-row{display:flex;flex-direction:column}
    .msg-row-agent{align-items:flex-end}
    .msg-row-user{align-items:flex-start}
    .msg-b{max-width:72%;padding:.55rem .85rem;border-radius:12px;font-size:.83rem;line-height:1.4;word-break:break-word}
    .msg-agent{background:var(--primary);color:#fff;border-radius:12px 2px 12px 12px}
    .msg-user{background:var(--dark2);color:var(--text);border-radius:2px 12px 12px 12px;border:1px solid var(--dark4)}
    .msg-time{font-size:.66rem;opacity:.7;margin-top:.2rem}
    .ticks-r{color:var(--gold)}

    /* ── ANALYTICS ── */
    .anl-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}
    .anl-card{background:var(--dark2);border:1px solid var(--dark4);border-radius:12px;padding:1rem;border-left:3px solid var(--primary)}
    .anl-title{font-size:.74rem;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:.35rem;letter-spacing:.4px}
    .anl-val{font-size:1.4rem;font-weight:800;color:var(--text)}
    .anl-bar-wrap{background:var(--dark3);border-radius:4px;height:6px;margin-top:.5rem;overflow:hidden}
    .anl-bar{background:var(--primary);height:6px;border-radius:4px;transition:width .4s}

    /* ── ANNOUNCEMENT FORM ── */
    .ann-form{background:var(--dark3);border-radius:10px;padding:1rem;border:1px solid var(--dark4);margin-bottom:1rem}

    /* ── PAGE TABS ── */
    .page-tabs{display:flex;gap:0;border-bottom:1.5px solid var(--dark4);margin-bottom:1rem;flex-wrap:wrap;overflow-x:auto}
    .ptab{padding:.45rem .9rem;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap;transition:all .18s}
    .ptab:hover{color:var(--text)}
    .ptab.active{color:var(--secondary);border-bottom-color:var(--secondary)}

    /* ── FILTER ROW ── */
    .filter-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
    .filter-row select,.filter-row input{flex:1;min-width:110px;max-width:200px}

    /* ── SKELETON ── */
    .skeleton{background:linear-gradient(90deg,var(--dark3) 25%,var(--dark4) 50%,var(--dark3) 75%);background-size:200%;animation:shim 1.5s infinite;border-radius:8px}
    @keyframes shim{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .sk-line{height:16px;margin-bottom:8px}
     .spin{animation:spin 1s linear infinite}
     @keyframes spin{to{transform:rotate(360deg)}}

    /* ── EMPTY STATE ── */
    .empty-state{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
    .empty-state i{font-size:2.2rem;display:block;margin-bottom:.7rem;color:var(--dark4)}

    /* ── TOAST ── */
    #tc{position:fixed;top:70px;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
    .toast{padding:.75rem 1.1rem;border-radius:10px;color:#fff;font-size:.83rem;font-weight:600;display:flex;align-items:center;gap:.55rem;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:sli .3s ease;min-width:250px;max-width:360px;pointer-events:all;cursor:pointer;border:1px solid rgba(255,255,255,.1)}
    .t-success{background:rgba(34,197,94,.9)}
    .t-error{background:rgba(239,68,68,.9)}
    .t-warning{background:rgba(245,158,11,.9);color:#111}
    .t-info{background:rgba(26,79,160,.95)}
    @keyframes sli{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

    /* ── NOTE / HIGHLIGHT ── */
    .note-item{background:rgba(245,184,0,.07);border-left:3px solid var(--gold);padding:.55rem .8rem;border-radius:0 8px 8px 0;font-size:.8rem;margin-bottom:.4rem;color:var(--text)}

    /* ── CONFIRM DIALOG ── */
    .confirm-dlg{background:var(--dark2);border:1px solid var(--dark4);border-radius:14px;padding:1.8rem;text-align:center;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .confirm-dlg h3{color:var(--danger);margin-bottom:.7rem;font-size:1.05rem}
    .confirm-dlg p{font-size:.84rem;color:var(--muted);margin-bottom:1.3rem;line-height:1.5}
    .dlg-btns{display:flex;gap:.6rem;justify-content:center}
     .team-editor{display:flex;flex-direction:column;gap:.8rem}
     .team-editor-card{border:1px solid var(--dark4);border-radius:10px;padding:.9rem;background:var(--dark2)}
     .team-editor-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.6rem}
     .team-editor-photo{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:var(--dark1);display:block} .json-editor{display:flex;flex-direction:column;gap:.8rem}.json-editor .team-editor-card{margin:0}


    /* ── PROFESSIONAL GROUPED PAGE EDITOR ── */
    .page-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.85rem;margin-bottom:1rem}
    .page-overview-card{background:linear-gradient(135deg,var(--dark2),var(--dark3));border:1px solid var(--dark4);border-radius:12px;padding:1rem;cursor:pointer;transition:.18s}
    .page-overview-card:hover{border-color:var(--secondary);transform:translateY(-2px)}
    .page-group{background:var(--dark2);border:1px solid var(--dark4);border-radius:12px;margin-bottom:.85rem;overflow:hidden}
    .page-group-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.9rem 1rem;cursor:pointer;background:linear-gradient(90deg,rgba(26,79,160,.16),rgba(255,255,255,.02))}
    .page-group-head:hover{background:rgba(26,79,160,.2)}
    .page-group-title{display:flex;align-items:center;gap:.65rem;font-size:.88rem;font-weight:800}
    .page-group-title i{color:var(--gold);width:20px;text-align:center}
    .page-group-count{font-size:.68rem;color:var(--muted);background:rgba(255,255,255,.06);padding:.2rem .5rem;border-radius:20px}
    .page-group-body{padding:.75rem}
    .page-section-row{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:center;border:1px solid rgba(255,255,255,.06);background:var(--dark3);border-radius:10px;padding:.8rem;margin-bottom:.55rem}
    .page-section-row:last-child{margin-bottom:0}
    .page-section-main{min-width:0}
    .page-section-label{font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:.22rem}
    .page-section-preview{font-size:.73rem;color:var(--muted);line-height:1.4;max-height:42px;overflow:hidden}
    .page-section-type{font-size:.62rem;text-transform:uppercase;color:var(--secondary);font-weight:800;letter-spacing:.4px}
    .page-builder-note{font-size:.75rem;color:var(--muted);padding:.65rem .8rem;background:rgba(245,184,0,.06);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;margin-bottom:.8rem}

// ═══════════════════════════════════════════════════
// AUTH + API LAYER
// Matches the player dashboard pattern: auth is checked by the
// mounted Preact app, with demo data available when the backend
// is unavailable. There is no sign-in gate in this dashboard.
// ═══════════════════════════════════════════════════
const {h,render}=preact;
const {useState,useEffect,useCallback,useRef,useMemo}=preactHooks;
const html=htm.bind(h);
const API_BASE='/api';

function closeSidebar(){
  const sb=document.getElementById('sidebar');
  if(sb&&window.innerWidth<1025)sb.classList.remove('open');
  const overlay=document.getElementById('overlay');
  if(overlay)overlay.classList.remove('show');
}

async function apiCall(endpoint,opts={}){
  const url=endpoint.startsWith('/api')?endpoint:API_BASE+endpoint;
  const token=['enejistats_token','access_token','auth_token','token']
    .map(key=>localStorage.getItem(key)||sessionStorage.getItem(key))
    .find(Boolean);
  const authHeader=token?{'Authorization':'Bearer '+token}:{};
  const options={
    credentials:'include',
    headers:{'Content-Type':'application/json',...authHeader,...(opts.headers||{})},
    ...opts
  };
  if(options.body instanceof FormData)delete options.headers['Content-Type'];
  const res=await fetch(url,options);
  if(!res.ok){
    const err=await res.json().catch(()=>({}));
    const e=new Error(err.detail||err.message||`HTTP ${res.status}`);
    e.status=res.status;
    throw e;
  }
  if(res.status===204)return null;
  return res.json();
}

async function api(method,path,body,formData){
  const opts={method};
  if(formData)opts.body=formData;
  else if(body!==undefined&&body!==null)opts.body=JSON.stringify(body);
  return apiCall(path.startsWith('/api')?path.slice(4):path,opts);
}

function toast(message,type='info'){
  const root=document.getElementById('tc');if(!root)return;
  const el=document.createElement('div');
  el.className='toast t-'+type;
  el.textContent=String(message||'');
  el.onclick=()=>el.remove();
  root.appendChild(el);
  window.setTimeout(()=>el.remove(),4500);
}

async function safeApi(method,path,body,fallback,successMessage){
  try{
    const result=await api(method,path,body);
    if(successMessage)toast(successMessage,'success');
    return result;
  }catch(error){
    // Read operations may opt into an explicit fallback snapshot.
    // Mutations pass no fallback and therefore MUST propagate the error;
    // otherwise the UI could claim a save/password change succeeded when
    // FastAPI rejected the request or the session expired.
    if(fallback!==undefined&&fallback!==null){
      toast('Live data unavailable; showing the saved local view.','warning');
      return fallback;
    }
    throw error;
  }
}

function doLogout(){
  localStorage.removeItem('enejistats_token');
  localStorage.removeItem('access_token');
  localStorage.removeItem('auth_token');
  localStorage.removeItem('token');
  sessionStorage.clear();
  window.location.assign('/login');
}

function parseJsonValue(value,fallback=[]){
  try{
    const parsed=typeof value==='string'?JSON.parse(value):value;
    return Array.isArray(parsed)?parsed:fallback;
  }catch(e){return fallback;}
}

function safeMarkup(value){
  const box=document.createElement('div');
  box.innerHTML=String(value||'');
  box.querySelectorAll('script,style,iframe,object,embed,form,input,button').forEach(n=>n.remove());
  box.querySelectorAll('*').forEach(node=>{
    [...node.attributes].forEach(attr=>{
      if(attr.name.toLowerCase().startsWith('on'))node.removeAttribute(attr.name);
      if((attr.name==='href'||attr.name==='src')&&/^\s*javascript:/i.test(attr.value))node.removeAttribute(attr.name);
    });
  });
  return box.innerHTML;
}

function RTE({value,onChange}){
  const ref=useRef(null);
  useEffect(()=>{if(ref.current)ref.current.innerHTML=safeMarkup(value||'');},[]);
  const ex=(cmd,v=null)=>{document.execCommand(cmd,false,v);ref.current&&ref.current.focus();};
  return html`<div>
    <div class="rte-bar">
      <button type="button" class="rte-btn" title="Bold" onClick=${()=>ex('bold')}><b>B</b></button>
      <button type="button" class="rte-btn" title="Italic" onClick=${()=>ex('italic')}><i>I</i></button>
      <button type="button" class="rte-btn" title="Underline" onClick=${()=>ex('underline')}><u>U</u></button>
      <button type="button" class="rte-btn" title="Bullet" onClick=${()=>ex('insertUnorderedList')}>• List</button>
      <button type="button" class="rte-btn" title="Numbered" onClick=${()=>ex('insertOrderedList')}>1. List</button>
      <button type="button" class="rte-btn" title="Heading" onClick=${()=>ex('formatBlock','H3')}>H3</button>
      <button type="button" class="rte-btn" title="Clear" onClick=${()=>ex('removeFormat')}>✕ Clear</button>
    </div>
     <div class="rte-content" contentEditable ref=${ref}
       onInput=${e=>onChange&&onChange(safeMarkup(e.target.innerHTML))}></div>
  </div>`;
}

function ImgUpload({label,onUploaded,section,pageSlug}){
  const [preview,setPreview]=useState(null);
  const [uploading,setUploading]=useState(false);
  const fileRef=useRef(null);
  const pick=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>5*1024*1024){toast('File too large. Max 5MB.','error');return;}
    const r=new FileReader();r.onload=ev=>setPreview(ev.target.result);r.readAsDataURL(f);
  };
  const upload=async()=>{
    if(!preview||!fileRef.current?.files[0])return;
    setUploading(true);
    try{
      const fd=new FormData();fd.append('file',fileRef.current.files[0]);
      const r=await api('POST',`/api/co/pages/${pageSlug}/images`,null,fd);
      toast('Image uploaded.','success');
      onUploaded&&onUploaded(r?.url||preview);
    }catch(e){toast('Image upload failed: '+e.message,'error');}
    setUploading(false);
  };
  return html`<div class="form-group">
    <label>${label||'Upload Image'} (jpg/png/webp, max 5MB)</label>
    <input type="file" accept="image/jpeg,image/png,image/webp" ref=${fileRef} onChange=${pick}/>
    ${preview&&html`<div style="margin-top:.5rem">
      <img src=${preview} style="max-width:180px;max-height:120px;border-radius:8px;border:2px solid var(--dark4)"/>
      <br/>
      <button type="button" class="btn btn-primary btn-sm" style="margin-top:.4rem" onClick=${upload} disabled=${uploading}>
        ${uploading?html`<i class="fas fa-spinner spin"></i> Uploading…`:'💾 Save Image'}
      </button>
    </div>`}
  </div>`;
}

    bio:String(m?.bio||m?.desc||'').trim(),
    photo_url:String(m?.photo_url||m?.photo||'').trim(),

    const next=members.map((m,i)=>i===index?{...m,[key]:val}:m);
    update(next);

  return html`<div class="team-editor">
    <p style="font-size:.75rem;color:var(--muted)">Each member is saved as structured JSON. Uploading a photo stores its URL and the public About page uses it instead of initials.</p>

function normalisePageDefinition(page){
  const source=page&&typeof page==='object'?page:{};
  const sections=Array.isArray(source.sections)?source.sections.filter(Boolean).map((sec,i)=>({
    key:String(sec.key||`section_${i+1}`),
    label:String(sec.label||sec.key||`Section ${i+1}`),
    type:sec.type==='rich'?'rich':'text',
    value:sec.value==null?'':String(sec.value)
  })):[];
  return {...source,slug:String(source.slug||''),label:String(source.label||source.slug||'Untitled Page'),sections};
}

function getPageGroups(page){
  const safePage=normalisePageDefinition(page);
  const sections=safePage.sections;
  const rules=Array.isArray(PAGE_GROUP_RULES[safePage.slug])?PAGE_GROUP_RULES[safePage.slug]:[];
  const byKey=new Map(sections.map(sec=>[sec.key,sec]));
  const used=new Set();
  const groups=rules.map(rule=>{
    const title=String(rule?.[0]||'Content');
    const keys=Array.isArray(rule?.[1])?rule[1]:[];
    const grouped=keys.map(key=>byKey.get(key)).filter(Boolean);
    grouped.forEach(sec=>used.add(sec.key));
    return {title,sections:grouped};
  }).filter(group=>group.sections.length>0);
  const extra=sections.filter(sec=>!used.has(sec.key));
  if(extra.length)groups.push({title:'Additional Content',sections:extra});
  return groups;
}

function mergePageSections(base,saved){
  const safeBase=normalisePageDefinition(base);
  const savedSections=Array.isArray(saved)?saved.filter(Boolean):[];
  const byKey=new Map(savedSections.map(sec=>[String(sec.key||''),sec]));
  const merged=safeBase.sections.map(sec=>byKey.has(sec.key)?normalisePageDefinition({sections:[{...sec,...byKey.get(sec.key)}]}).sections[0]:sec);
  const known=new Set(merged.map(sec=>sec.key));
  savedSections.forEach((sec,index)=>{
    const key=String(sec.key||'');
    if(key&&!known.has(key)){
      merged.push(normalisePageDefinition({sections:[sec]}).sections[0]);
      known.add(key);
    }
  });
  return {...safeBase,sections:merged};
}

function PageContentTab(){
  const [pages,setPages]=useState(()=>PAGE_DEFS.map(normalisePageDefinition));
  const [selSlug,setSelSlug]=useState(null);
  const [editing,setEditing]=useState({});
  const [vals,setVals]=useState({});
  const [saving,setSaving]=useState({});
  const [loadingPage,setLoadingPage]=useState(false);
  const [openGroups,setOpenGroups]=useState({});

  const selPage=pages.find(p=>p.slug===selSlug);

  const loadPage=async(slug)=>{
    setSelSlug(slug);setEditing({});setLoadingPage(true);
    try{
      const r=await api('GET',`/api/co/pages/${encodeURIComponent(slug)}`);
      if(r?.sections){
        setPages(prev=>prev.map(p=>p.slug===slug?mergePageSections(p,r.sections):p));
      }
    }catch(e){toast('Could not load saved page content: '+e.message,'warning');}
    finally{setLoadingPage(false);}
  };

  const startEdit=sec=>{
    setEditing(e=>({...e,[sec.key]:true}));
    setVals(v=>({...v,[sec.key]:sec.value??''}));
  };

  const save=async(slug,sec)=>{
    const key=sec.key;setSaving(v=>({...v,[key]:true}));
    try{
      await api('PUT',`/api/co/pages/${encodeURIComponent(slug)}/sections/${encodeURIComponent(key)}`,{
        value:vals[key]??'',type:sec.type||'text',label:sec.label||key
      });
      setPages(prev=>prev.map(p=>p.slug===slug?{...p,sections:p.sections.map(x=>x.key===key?{...x,value:vals[key]??''}:x)}:p));
      setEditing(v=>({...v,[key]:false}));
      toast(`"${sec.label||key}" saved successfully.`,'success');
    }catch(e){toast('Save failed: '+e.message,'error');}
    finally{setSaving(v=>({...v,[key]:false}));}
  };

  const toggleGroup=(title)=>setOpenGroups(v=>({...v,[title]:v[title]===false}));
  const preview=v=>String(v??'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()||'(empty)';

  if(!selSlug)return html`<div>
    <div class="card">
      <div class="card-title"><i class="fas fa-file-alt"></i> Page Content Manager</div>
      <div class="page-builder-note"><i class="fas fa-layer-group"></i> Content is organised by page and functional group. Open a page, then edit only the section you need. Structured About-page blocks keep their dedicated editors.</div>
      <div class="page-overview">
        ${pages.map(p=>html`<div class="page-overview-card" onClick=${()=>loadPage(p.slug)}>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem">
            <div style="display:flex;align-items:center;gap:.55rem"><i class="fas fa-file-alt" style="color:var(--secondary)"></i><b>${p.label}</b></div>
            <span class="page-group-count">${normalisePageDefinition(p).sections.length}</span>
          </div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:.45rem">${getPageGroups(p).length} content groups</div>
          <div style="margin-top:.7rem"><span class="btn btn-primary btn-sm"><i class="fas fa-edit"></i> Manage</span></div>
        </div>`)}
      </div>
    </div>
  </div>`;

  return html`<div>
    <div class="editor-toolbar">
      <button class="btn btn-secondary" onClick=${()=>setSelSlug(null)}><i class="fas fa-arrow-left"></i> All Pages</button>
      <h2 style="font-size:1.05rem;font-weight:700">${selPage?.label||selSlug}</h2>
      <button class="btn btn-secondary btn-sm" style="margin-left:auto" onClick=${()=>loadPage(selSlug)}><i class="fas fa-sync"></i> Refresh</button>
    </div>
    <div class="page-builder-note"><i class="fas fa-info-circle"></i> Grouped editor for <b>${selPage?.label||selSlug}</b>. Each Save button writes directly to the corresponding backend section.</div>
    ${loadingPage?html`<div class="card"><div class="skeleton sk-line" style="height:80px"></div></div>`
    :getPageGroups(selPage||{slug:selSlug,sections:[]}).map(group=>html`<div class="page-group">
      <div class="page-group-head" onClick=${()=>toggleGroup(group.title)}>
        <div class="page-group-title"><i class="fas fa-folder-open"></i>${group.title}<span class="page-group-count">${group.sections.length} field${group.sections.length!==1?'s':''}</span></div>
        <i class=${'fas '+(openGroups[group.title]===false?'fa-chevron-down':'fa-chevron-up')}></i>
      </div>
      ${openGroups[group.title]!==false&&html`<div class="page-group-body">
        ${group.sections.map(sec=>html`<div class="page-section-row">
          <div class="page-section-main">
            <div class="page-section-label">${sec.label||sec.key}</div>
            <div class="page-section-type">${sec.type==='rich'?'Rich text':'Text'}</div>
            ${!editing[sec.key]&&html`<div class="page-section-preview">${preview(sec.value)}</div>`}
          </div>
          <div class="sec-acts">
            ${!editing[sec.key]
              ?html`<button class="btn btn-secondary btn-sm" onClick=${()=>startEdit(sec)}><i class="fas fa-edit"></i> Edit</button>`
              :html`<div style="display:flex;gap:.4rem;flex-wrap:wrap">
                <button class="btn btn-primary btn-sm" onClick=${()=>save(selSlug,sec)} disabled=${saving[sec.key]}>
                  ${saving[sec.key]?html`<i class="fas fa-spinner spin"></i>`:html`<i class="fas fa-save"></i>`} Save
                </button>
                <button class="btn btn-secondary btn-sm" onClick=${()=>setEditing(v=>({...v,[sec.key]:false}))}>Cancel</button>
              </div>`}
          </div>
          ${editing[sec.key]&&html`<div style="grid-column:1/-1">
            ${sec.key==='team'
              ?html`<${TeamEditor} value=${vals[sec.key]} pageSlug=${selSlug} onChange=${v=>setVals(x=>({...x,[sec.key]:v}))}/>`
              :sec.key==='mission_cards'
                ?html`<${JsonListEditor} value=${vals[sec.key]} label="Create and edit each mission card." itemLabel="Mission card"
                    fields=${[{key:'icon',label:'Font Awesome Icon',placeholder:'fa-crosshairs'},{key:'title',label:'Title'},{key:'desc',label:'Description',type:'textarea',rows:4}]}
                    addItem=${()=>({icon:'fa-circle-info',title:'',desc:''})} onChange=${v=>setVals(x=>({...x,[sec.key]:v}))}/>`

                    addItem=${()=>({icon:'fa-star',title:'',desc:''})} onChange=${v=>setVals(x=>({...x,[sec.key]:v}))}/>`
              :sec.type==='rich'

                :html`<textarea rows="4" value=${vals[sec.key]??''} onInput=${e=>setVals(x=>({...x,[sec.key]:e.target.value}))}></textarea>`}
            ${!['team','mission_cards','story_paragraphs','what_we_do_tabs','values'].includes(sec.key)&&html`<${ImgUpload} label="Upload image for this section" pageSlug=${selSlug} section=${sec.key} onUploaded=${url=>setVals(x=>({...x,[sec.key]:(x[sec.key]||'')+`<img src="${url}" style="max-width:100%"/>`}))}/>`}
          </div>`}
        </div>`)}
      </div>`}
    </div>`)}
  </div>`;
}

function makeCustomField(index=0){
  return {id:'cf_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),label:'Custom Field '+(index+1),key:'custom_field_'+(index+1),type:'text',placeholder:'',required:false,width:'full',options:[],value:'',order:index};
}
function normaliseCustomFields(fields){
  const seen=new Set();
  return (Array.isArray(fields)?fields:[]).map((f,i)=>{
    const label=String(f?.label||`Custom Field ${i+1}`).trim();
    let key=String(f?.key||label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||`custom_field_${i+1}`);
    let base=key,n=2;while(seen.has(key))key=base+'_'+n++;
    seen.add(key);
    const type=CUSTOM_FIELD_TYPES.some(t=>t.value===f?.type)?f.type:'text';
    return {...makeCustomField(i),...f,id:String(f?.id||`cf_${Date.now()}_${i}`),label,key,type,
      placeholder:String(f?.placeholder||''),required:!!f?.required,width:['full','half','third'].includes(f?.width)?f.width:'full',
      options:type==='select'?(Array.isArray(f?.options)?f.options.map(String).filter(Boolean):[]):[],value:f?.value??'',order:i};
  });
}

function FieldInputPreview({field}){
  const common={placeholder:field.placeholder||'',disabled:true};
  if(field.type==='textarea')return html`<textarea rows="2" placeholder=${field.placeholder||''} disabled></textarea>`;
  if(field.type==='select')return html`<select disabled><option>${field.options?.[0]||'Select an option'}</option></select>`;
  if(field.type==='checkbox')return html`<label style="display:flex;gap:.45rem;align-items:center;margin:0;color:var(--text)"><input type="checkbox" disabled/> ${field.label||'Checkbox'}</label>`;
  return html`<input type=${field.type||'text'} placeholder=${field.placeholder||''} disabled/>`;
}

      </div>

        <div class="form-group"><label>Input Type *</label><select value=${field.type} onChange=${e=>change(i,'type',e.target.value)}>${CUSTOM_FIELD_TYPES.map(t=>html`<option value=${t.value}>${t.label}</option>`)}</select></div>

        <div class="form-group"><label>Placeholder</label><input type="text" value=${field.placeholder||''} onInput=${e=>change(i,'placeholder',e.target.value)}/></div>
        <div class="form-group"><label>Default / Current Value</label><input type="text" value=${field.value??''} onInput=${e=>change(i,'value',e.target.value)}/></div>
      </div>
      ${field.type==='select'&&html`<div class="field-options"><label>Dropdown Options</label>
        ${(field.options||[]).map((opt,j)=>html`<div class="field-option-row"><input type="text" value=${opt} onInput=${e=>change(i,'options',(field.options||[]).map((x,k)=>k===j?e.target.value:x))}/><button type="button" class="btn btn-danger btn-sm" onClick=${()=>change(i,'options',(field.options||[]).filter((_,k)=>k!==j))}><i class="fas fa-trash"></i></button></div>`)}

        </div>

    <div class="card">

      <p style="color:var(--muted);font-size:.8rem;margin-bottom:1rem">Read-only view of all support tickets handled by Customer Care Agents.</p>

function SettingsTab({user,onUserUpdate}){
  const [name,setName]=useState(user?.name||'');
  const [email,setEmail]=useState(user?.email||'');
  const [phone,setPhone]=useState(user?.phone||'');
  const [saving,setSaving]=useState(false);
  const [showPw,setShowPw]=useState(false);
  const [otpSent,setOtpSent]=useState(false);
  const [otp,setOtp]=useState('');
  const [newPw,setNewPw]=useState('');
  const [confirmPw,setConfirmPw]=useState('');
  const [changingPw,setChangingPw]=useState(false);
  const [notifs,setNotifs]=useState({emailAnnouncements:true,emailTickets:true,browserNotif:true});

  const saveProfile=async()=>{
    if(!name.trim()){toast('Name is required.','error');return;}
    setSaving(true);
    try{
      await safeApi('PATCH','/api/co/settings',{name,phone},null,'Profile updated successfully.');
      onUserUpdate&&onUserUpdate({...user,name,phone});
    }catch(e){toast('Update failed: '+e.message,'error');}
    setSaving(false);
  };
  const requestOtp=async()=>{
    if(!email.trim()){toast('Enter your registered email address.','error');return;}
    try{
      await api('POST','/api/co/settings/request-otp',{email});
      setOtpSent(true);
      toast('OTP sent to your registered email.','info');
    }catch(e){
      toast('OTP request failed: '+e.message,'error');
    }
  };
  const changePw=async()=>{
    if(!otp.trim()){toast('Enter the OTP from your email.','error');return;}
    if(!newPw||newPw.length<8){toast('Password must be at least 8 characters.','error');return;}
    if(newPw!==confirmPw){toast('Passwords do not match.','error');return;}
    setChangingPw(true);
    try{
      await safeApi('POST','/api/co/settings/change-password',{otp,newPassword:newPw},null,'Password changed successfully.');
      setShowPw(false);setOtp('');setNewPw('');setConfirmPw('');setOtpSent(false);
    }catch(e){toast('Password change failed: '+e.message,'error');}
    setChangingPw(false);
  };
  const saveNotifs=async()=>{
    try{await safeApi('PATCH','/api/co/settings/notifications',notifs,null,'Notification preferences saved.');}
    catch(e){toast('Save failed: '+e.message,'error');}
  };

  return html`<div>
    <div class="card">
      <div class="card-title"><i class="fas fa-user-edit"></i> Profile Settings</div>
      <div class="grid2">
        <div class="form-group"><label>Full Name *</label><input type="text" value=${name} onInput=${e=>setName(e.target.value)}/></div>
        <div class="form-group"><label>Email Address</label><input type="email" value=${email} disabled style="opacity:.6;cursor:not-allowed"/></div>
        <div class="form-group"><label>Phone / Contact</label><input type="text" value=${phone} onInput=${e=>setPhone(e.target.value)} placeholder="+234…"/></div>
      </div>
      <button class="btn btn-primary" onClick=${saveProfile} disabled=${saving}>
        ${saving?html`<i class="fas fa-spinner spin"></i> Saving…`:'💾 Save Profile'}
      </button>
    </div>

    <div class="card">
      <div class="card-title"><i class="fas fa-lock"></i> Change Password</div>
      ${!showPw?html`<button class="btn btn-secondary" onClick=${()=>setShowPw(true)}><i class="fas fa-key"></i> Change Password</button>`
      :html`<div>
        ${!otpSent?html`<div>
          <p style="font-size:.82rem;color:var(--muted);margin-bottom:.7rem">An OTP will be sent to: <b style="color:var(--text)">${email}</b></p>
          <div style="display:flex;gap:.5rem">
            <button class="btn btn-primary" onClick=${requestOtp}><i class="fas fa-envelope"></i> Send OTP</button>
            <button class="btn btn-secondary" onClick=${()=>setShowPw(false)}>Cancel</button>
          </div>
        </div>`
        :html`<div>
          <p style="color:var(--success);font-size:.82rem;margin-bottom:.7rem"><i class="fas fa-check-circle"></i> OTP sent to ${email}.</p>
          <div class="grid2">
            <div class="form-group"><label>OTP Code *</label><input type="text" maxlength="6" value=${otp} onInput=${e=>setOtp(e.target.value)} placeholder="Enter OTP…"/></div>
            <div></div>
            <div class="form-group"><label>New Password * (min 8 chars)</label><input type="password" value=${newPw} onInput=${e=>setNewPw(e.target.value)}/></div>
            <div class="form-group"><label>Confirm New Password *</label><input type="password" value=${confirmPw} onInput=${e=>setConfirmPw(e.target.value)}/></div>
          </div>
          <div style="display:flex;gap:.5rem">
            <button class="btn btn-primary" onClick=${changePw} disabled=${changingPw}>
              ${changingPw?html`<i class="fas fa-spinner spin"></i> Changing…`:'✓ Change Password'}
            </button>
            <button class="btn btn-secondary" onClick=${()=>{setShowPw(false);setOtpSent(false);setOtp('');setNewPw('');setConfirmPw('');}}>Cancel</button>
          </div>
        </div>`}
      </div>`}
    </div>

    <div class="card">
      <div class="card-title"><i class="fas fa-bell"></i> Notification Preferences</div>
      ${[
        {k:'emailAnnouncements',label:'Email me when an announcement is sent'},
        {k:'emailTickets',label:'Email me when a new support ticket is escalated'},
        {k:'browserNotif',label:'Browser push notifications'},
      ].map(n=>html`<div style="display:flex;align-items:center;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid rgba(255,255,255,.05)">
        <div style="font-size:.85rem;color:var(--text)">${n.label}</div>
        <label style="position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;margin:0">
          <input type="checkbox" checked=${notifs[n.k]} onChange=${e=>setNotifs(p=>({...p,[n.k]:e.target.checked}))} style="opacity:0;width:0;height:0"/>
          <span style=${'position:absolute;cursor:pointer;inset:0;background:'+(notifs[n.k]?'var(--primary)':'var(--dark4)')+';border-radius:22px;transition:.2s'}></span>
          <span style=${'position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;transform:'+(notifs[n.k]?'translateX(18px)':'none')}></span>
        </label>
      </div>`)}
      <button class="btn btn-primary" style="margin-top:.8rem" onClick=${saveNotifs}><i class="fas fa-save"></i> Save Preferences</button>
    </div>
  </div>`;
}

/* ENEJISTATS REGISTER GEO CONTRACT — exact endpoint/reset semantics mirrored from register(5).html. */
function useRegisterGeoCountries(){const [countries,setCountries]=useState([]);useEffect(()=>{let cancelled=false;const c=new AbortController();fetch('/api/public/countries',{credentials:'include',signal:c.signal}).then(r=>r.ok?r.json():Promise.reject(new Error('countries request failed'))).then(d=>{if(cancelled)return;const list=Array.isArray(d)?d:(d.countries||d.data||[]);setCountries(list.map(c=>({code:c.code||c.v||c.value||c.id,name:c.name||c.l||c.label||c.code||c.v||c.value||c.id,regionLabel:c.region_label||'State / Region',subregionLabel:c.subregion_label||'LGA / Local Area'})).filter(c=>c.code&&c.name));}).catch(e=>{if(e.name!=='AbortError')setCountries([])});return()=>{cancelled=true;c.abort()};},[]);return countries}
function useRegisterGeoRegions(countryCode){const [items,setItems]=useState([]),[loading,setLoading]=useState(false),[label,setLabel]=useState('State / Region');useEffect(()=>{if(!countryCode){setItems([]);setLabel('State / Region');return}const c=new AbortController();setLoading(true);fetch('/api/public/countries/'+encodeURIComponent(String(countryCode).toUpperCase())+'/regions',{credentials:'include',signal:c.signal}).then(r=>r.ok?r.json():Promise.reject(new Error('regions request failed'))).then(d=>{const a=Array.isArray(d)?d:(d.regions||[]);setItems(a.map(x=>typeof x==='string'?x:(x?.name||x?.state||x?.region||'')).filter(Boolean));setLabel(d.region_label||'State / Region')}).catch(e=>{if(e.name!=='AbortError')setItems([])}).finally(()=>{if(!c.signal.aborted)setLoading(false)});return()=>c.abort()},[countryCode]);return [items,loading,label]}
function useRegisterGeoSubregions(countryCode,region){const [items,setItems]=useState([]),[loading,setLoading]=useState(false),[label,setLabel]=useState('LGA / Local Area');useEffect(()=>{if(!countryCode||!region){setItems([]);setLabel('LGA / Local Area');return}const c=new AbortController();setLoading(true);fetch('/api/public/countries/'+encodeURIComponent(String(countryCode).toUpperCase())+'/regions/'+encodeURIComponent(region)+'/subregions',{credentials:'include',signal:c.signal}).then(r=>r.ok?r.json():Promise.reject(new Error('subregions request failed'))).then(d=>{const a=Array.isArray(d)?d:(d.subregions||[]);setItems(a.map(x=>typeof x==='string'?x:(x?.name||x?.lga||x?.subregion||'')).filter(Boolean));setLabel(d.subregion_label||'LGA / Local Area')}).catch(e=>{if(e.name!=='AbortError')setItems([])}).finally(()=>{if(!c.signal.aborted)setLoading(false)});return()=>c.abort()},[countryCode,region]);return [items,loading,label]}

function App(){

    window.addEventListener('resize',handleResize);

  },[]);

      return next;
    });
  };

  const nav=tab=>{setActiveTab(tab);if(window.innerWidth<1025){setSidebarOpen(false);const ov=document.getElementById('overlay');if(ov)ov.classList.remove('show');}};
  const closeSb=()=>{if(window.innerWidth<1025){setSidebarOpen(false);const ov=document.getElementById('overlay');if(ov)ov.classList.remove('show');}};
  const initials=s=>s?s.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase():'CO';
  const canonicalRole=value=>String(value||'').trim().toLowerCase().replace(/[- ]/g,'_');

  useEffect(()=>{
    async function checkAuth(){
      try{
        const me=await apiCall('/co/me');
        const role=canonicalRole(me?.sub_role||me?.role);
        if(me&&role === 'communication_officer'){
          setCoUser({
             id:me.user_id||me.id||'CO001',
             name:me.name||me.full_name||me.email||'CO Officer',
            email:me.email||'',
             role,
             photo:me.avatar||me.photo||'',
             phone:me.phone||''
          });
          setAuthState('authenticated');
        }else{
          localStorage.clear();
          sessionStorage.clear();
          window.location.replace('/login');
        }
      }catch(err){
        if(err.status===401||err.status===403){
          localStorage.clear();
          sessionStorage.clear();
          window.location.replace('/login');
        }else{
          setCoUser({id:'CO001',name:'CO Officer',email:'',role:'communication_officer',photo:''});
          setAuthState('demo');
        }
      }
    }
    checkAuth();
  },[]);

  if(authState==='loading')return html`<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:1rem;"><i class="fas fa-spinner fa-spin" style="font-size:2.5rem;color:var(--secondary);"></i><div style="color:var(--muted);font-weight:600;">Loading Dashboard...</div></div>`;
  return html`<div>
    <${Sidebar} active=${activeTab} onNav=${nav} user=${coUser} open=${sidebarOpen} onClose=${closeSb}/>

    <div id="header" class=${sidebarOpen&&window.innerWidth>=1025?'':'full'}>
      <div class="h-left">
        <button class="hamburger" onClick=${toggleSidebar} title="Toggle sidebar">☰</button>
        <span class="h-title"><i class="fas fa-satellite-dish"></i> <span>CO Dashboard — ${TAB_TITLES[activeTab]||activeTab}</span></span>
      </div>
      <div class="h-right">
        <div class="h-av">${coUser.photo?html`<img src=${coUser.photo} style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>`
          :html`<span style="font-size:.75rem;font-weight:800;color:var(--gold)">${initials(coUser.name)}</span>`}</div>
        <div class="h-info">
          <div class="h-name">${coUser.name}</div>
          <div class="h-role">Communications Officer</div>
        </div>
        <button class="btn-lo" onClick=${()=>doLogout()}>Logout</button>
      </div>
    </div>

    <div id="main" class=${sidebarOpen&&window.innerWidth>=1025?'':'full'}>
      <div class="breadcrumb"><i class="fas fa-home"></i> <i class="fas fa-chevron-right"></i> ${TAB_TITLES[activeTab]||activeTab}</div>
      ${activeTab==='overview'&&html`<${OverviewTab} user=${coUser}/>`}
      ${activeTab==='page-content'&&html`<${PageContentTab}/>`}
      ${activeTab==='competitions'&&html`<${CompetitionManager}/>`}
      ${activeTab==='customer-care'&&html`<${CustomerCareTab}/>`}
      ${activeTab==='announcements'&&html`<${AnnouncementsTab}/>`}
      ${activeTab==='analytics'&&html`<${AnalyticsTab}/>`}
      ${activeTab==='settings'&&html`<${SettingsTab} user=${coUser} onUserUpdate=${setCoUser}/>`}
    </div>
  </div>`;
}

function renderApp(){
  render(html`<${App}/>`,document.getElementById('app'));
}
renderApp();
</script>
</body>
</html>
