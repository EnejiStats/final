              <li>Once verified, <span style="color:#e2e8f0">${verifiedNote}</span></li>
              <li>Return here and sign in to access your dashboard</li>
            </ol>
          </div>
          ${reviewNote ? html`
            <div class="csm-review-note">
              <i class="fas fa-clock" style="color:#f5b800;margin-right:6px" aria-hidden="true"></i>
              <strong style="color:#f5b800">Pending Review —</strong> ${reviewNote}

            <i class="fas fa-hourglass-half" aria-hidden="true"></i>&nbsp;

          ${submitError ? html`
            <div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:12px;margin-top:14px;font-size:.85rem;color:#f87171;line-height:1.5" role="alert">
              <i class="fas fa-exclamation-triangle" aria-hidden="true"></i> ${submitError}

        </div>

          <button class="btn btn-outline" onClick=${onCancel} disabled=${submitting}

          </button>
          <button class="btn btn-gold" onClick=${onConfirm} disabled=${submitting}

            ${submitting

  const [otpError,      setOtpError]     = useState('');

  const [otpSuccess,    setOtpSuccess]    = useState(false);

  const { posMap, playerLevels, countries, allPositions } = usePlatformConfig();
  const set = useCallback((field, value) => setFormData(prev => ({...prev, [field]: value})), []);

  useEffect(() => {
    const p = new URLSearchParams(window.location.search);
    const r = p.get('role');
    if (r && ROLE_DEFS.some(x => x.id === r)) { setRole(r); setStep(2); }
  }, []);

  const buildPayload = useCallback(livenessToken => {
    const d = formData;
    const base = {
      role,
      email:             d.email,
      password:          d.password,
      phone:             d.phone,
      whatsapp:          d.samePhone ? d.phone : d.whatsapp,
      country:           d.country,
      state:             d.state,
      lga:               d.lga,
      liveness_verified: true,
      liveness_token:    livenessToken || ('lv_' + Date.now().toString(36)),
      gps_lat:           d.gps?.lat,
      gps_lng:           d.gps?.lng,
      terms_accepted_at:  legalRecord ? (legalRecord.accepted_at || new Date().toISOString()) : new Date().toISOString(),
      legal_acceptance:   legalRecord || { accepted: true, accepted_at: new Date().toISOString(), version: '2.0' },
    };
    switch (role) {
      case 'player':
        return { ...base,
          player_level:        d.playerLevel,
          first_name:          d.firstName,
          middle_name:         d.middleName,
          last_name:           d.lastName,
          dob:                 d.dob,
          dob_visible:         d.dobVisible || false,
          gender:              d.gender,
          height:              d.height,
          weight:              d.weight,
          nationality:         d.nationality,
          dominant_foot:       d.dominantFoot,
          position_category:   d.positionCategory,
          preferred_position:  d.preferredPosition,
          secondary_positions: d.secondaryPositions || [],
          club_id:             d.clubId,
          current_club:        d.currentClub,
          detailed_address:    d.detailedAddress,
        };
      case 'club':
        return { ...base,
          full_name:             d.fullName,
          club_level:            d.clubLevel,
          club_name:             d.clubName,
          club_nickname:         d.clubNickname,
          city:                  d.city || '',
          founded:               d.founded,
          stadium:               d.primaryGround ? (d.primaryGround.venue_name || d.primaryGround.name || '') : '',
          stadium_address:       d.stadiumAddress || (d.primaryGround ? (d.primaryGround.full_address || d.primaryGround.address || '') : ''),
          stadium_gps_lat:       d.primaryGround ? (d.primaryGround.gps_lat || (d.primaryGround.gps && d.primaryGround.gps.lat) || null) : null,
          stadium_gps_lng:       d.primaryGround ? (d.primaryGround.gps_lng || (d.primaryGround.gps && d.primaryGround.gps.lng) || null) : null,
          primary_ground_id:     d.primaryGround ? (d.primaryGround._id || d.primaryGround.venue_id || '') : '',
          club_office_gps_lat:   d.clubOfficeGps?.lat || null,
          club_office_gps_lng:   d.clubOfficeGps?.lng || null,
          has_secondary_stadium: !!d.secondaryGround,
          stadium2:              d.secondaryGround ? (d.secondaryGround.venue_name || d.secondaryGround.name || '') : '',
          stadium2_address:      d.secondaryGround ? (d.secondaryGround.full_address || '') : '',
          stadium_gps2_lat:      d.secondaryGround ? (d.secondaryGround.gps_lat || (d.secondaryGround.gps && d.secondaryGround.gps.lat) || null) : null,
          stadium_gps2_lng:      d.secondaryGround ? (d.secondaryGround.gps_lng || (d.secondaryGround.gps && d.secondaryGround.gps.lng) || null) : null,
          secondary_ground_id:   d.secondaryGround ? (d.secondaryGround._id || d.secondaryGround.venue_id || '') : '',
          club_email:            d.clubEmail,
          club_phone:            d.clubPhone,
          website:               d.website,
          is_registered:         d.isRegistered || '',
          cac_number:            d.isRegistered === 'registered' ? (d.cacNumber || '') : '',
        };
      case 'scout':
        return { ...base,
          full_name:        d.fullName,
          dob:              d.dob,
          nationality:      d.nationality,
          gender:           d.gender,
          affiliation_type: d.affiliationType,
          affiliated_club:  d.affiliatedClub,
          role_in_org:      d.roleInOrg,
          operating_region: d.operatingRegion,
          years_experience: d.yearsExperience,
          specialization:   d.specialization,
          linkedin:         d.linkedin,
          instagram:        d.instagram,
          bio:              d.bio,
          detailed_address: d.detailedAddress,
        };
      case 'agent':
        return { ...base,
          full_name: d.agentType === 'individual'
            ? ([d.firstName, d.lastName].filter(Boolean).join(' ') || d.fullName)
            : (d.agencyName || d.fullName),
          account_type:            d.agentType,
          dob:                     d.dob,
          nationality:             d.nationality,
          gender:                  d.gender,
          fifa_license:            d.fifaLicense,
          agency_name:             d.agencyName,
          registration_number:     d.registrationNumber,
          country_of_registration: d.countryOfRegistration,
          website:                 d.website,
          instagram:               d.instagram,
          linkedin:                d.linkedin,
          years_experience:        d.yearsExperience,
          bio:                     d.bio,
          detailed_address:        d.detailedAddress,
        };
      case 'dco':
        return { ...base,
          full_name:        d.fullName,
          dob:              d.dob,
          gender:           d.gender,
          languages:        (d.languages || []).join(', '),
          education_level:  d.educationLevel,
          applicant_type:   'dco',
          detailed_address: d.detailedAddress,
        };
      case 'supervisor':
        return { ...base,
          full_name:           d.fullName,
          dob:                 d.dob,
          gender:              d.gender,
          languages:           (d.languages || []).join(', '),
          states_of_operation: d.statesOfOp || [],
          years_experience:    d.yearsExperience,
          education_level:     d.educationLevel,
          applicant_type:      'supervisor',
          detailed_address:    d.detailedAddress,
        };
      default:
        return base;
    }
  }, [role, formData]);

  const handleVerifyOtp = useCallback(async () => {
    if (!otpState || otpCode.length !== 6) return;
    setOtpSubmitting(true); setOtpError('');
    try {
      const r = await fetch('/api/auth/verify-registration-otp', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user_id: otpState.user_id, role: otpState.role, otp: otpCode}),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || 'Verification failed. Please try again.');
      setOtpSuccess(true);
      showToast('Email verified! Welcome to EnejiStats.', 'success');
      setTimeout(() => {
        setOtpState(null); setOtpSuccess(false); setOtpCode('');
        setUserData(otpState); setSuccess(true);
      }, 1500);
    } catch(e) {
      setOtpError(e.message || 'Invalid code. Please try again.');
    } finally { setOtpSubmitting(false); }
  }, [otpState, otpCode]);

  const handleResendOtp = useCallback(async () => {
    if (!otpState) return;
    setOtpResending(true); setOtpError('');
    try {
      const r = await fetch('/api/auth/resend-registration-otp', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user_id: otpState.user_id, role: otpState.role}),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || 'Could not resend code.');
      showToast('New code sent to your email.', 'info');
      setOtpCode('');
    } catch(e) {
      setOtpError(e.message || 'Could not resend code. Please wait and try again.');
    } finally { setOtpResending(false); }
  }, [otpState]);

  const handleSubmit = useCallback(async livenessToken => {
    setSubmitting(true); setSubmitError('');
    {
      const d = formData;
      if (!d.country) {
        setSubmitError('Country is required. Please select your country.');
        setSubmitting(false); return;
      }
      if (!d.state) {
        setSubmitError('State / Region is required. Please select your state.');
        setSubmitting(false); return;
      }
      if (!d.lga) {
        setSubmitError('LGA / Local area is required. Please select your local area.');
        setSubmitting(false); return;
      }
      if (role !== 'club' && !(d.detailedAddress || '').trim()) {
        setSubmitError('Street / detailed address is required.');
        setSubmitting(false); return;
      }
      if (role === 'club' && !d.primaryGround) {
        setSubmitError('Primary Ground is required — select a registered venue from the Club form.');
        setSubmitting(false); return;
      }
      if (role === 'club' && !d.city) {
        setSubmitError('City / District is required. Please enter the city or district name in the Location section.');
        setSubmitting(false); return;
      }
      // Stadium address is now auto-sourced from the selected venue record — no manual validation needed.
      if (role === 'club' && !d.clubOfficeGps) {
        setSubmitError('Club Office / Location GPS is required. Please capture your GPS coordinates.');
        setSubmitting(false); return;
      }
      if ((role === 'scout' || role === 'agent' || role === 'dco' || role === 'supervisor') && !d.gps) {
        setSubmitError('GPS location is required. Please capture your GPS coordinates.');
        setSubmitting(false); return;
      }
    }
    const payload = buildPayload(livenessToken);
    const fd = new FormData();
    Object.entries(payload).forEach(([k, v]) => {
      if (v != null) fd.append(k, Array.isArray(v) || typeof v === 'object' ? JSON.stringify(v) : v);
    });
    if (formData.profilePhoto) fd.append('photo', formData.profilePhoto);
    if (formData.logo)         fd.append('logo',  formData.logo);
    if (formData.cv)           fd.append('cv',    formData.cv);
    try {
      const r = await fetch('/api/auth/register', {method: 'POST', body: fd, credentials: 'include'});
      let data;
      try { data = await r.json(); } catch { data = {}; }
      if (!r.ok) throw new Error(data.detail || data.message || 'Registration failed. Please try again.');
      if (data.requires_otp) {
        setOtpState({user_id: data.user_id, role: data.role, email: data.email, name: data.name});
        setOtpCode(''); setOtpError(''); setOtpSuccess(false);
        showToast('Account created! Enter the 6-digit code sent to your email.', 'success');
      } else {
        setUserData(data); setSuccess(true);
        showToast('Account created! Please verify your email to continue.', 'success');
      }
    } catch(err) {
      setSubmitError(err.message || 'Something went wrong — please try again.');
    } finally { setSubmitting(false); }
  }, [buildPayload, formData]);

  const renderContent = () => {
    if (success) return html`<${SuccessPage} role=${role} userData=${userData}/>`;
    switch (step) {
      case 1: return html`<${Step1} selectedRole=${role} setSelectedRole=${setRole} onNext=${() => setStep(2)}/>`;
      case 2: return html`<${Step2} role=${role} d=${formData} set=${set}
                  onNext=${() => setStep(3)} onBack=${() => setStep(1)}
                  legalAccepted=${legalAccepted} setLegalAccepted=${setLegal}
                  legalRecord=${legalRecord} setLegalRecord=${setLegalRecord}
                  posMap=${posMap} playerLevels=${playerLevels} countries=${countries} allPositions=${allPositions}/>`;
      case 3: return html`<${Step3} role=${role} d=${formData}
                  onBack=${() => setStep(2)} onSubmit=${handleSubmit}
                  submitting=${submitting} submitError=${submitError} countries=${countries}/>`;
    }
  };

  return html`
    <div>
      ${otpState ? html`<${EmailVerifyOverlay}
        email=${otpState.email}
        code=${otpCode}
        onCode=${c => { setOtpCode(c); setOtpError(''); }}
        onVerify=${handleVerifyOtp}
        onResend=${handleResendOtp}
        submitting=${otpSubmitting}
        resending=${otpResending}
        error=${otpError}
        success=${otpSuccess}
      />` : null}
      <${SiteHeader}/>
      <div class="auth-layout">
        <aside class="brand-panel" aria-label="Platform features">
          <${Logo} size=${36}/>
          <h2>Africa's Trusted<br/>Football Data Platform</h2>
          <p>Join thousands of players, clubs, scouts, and agents using verified data to connect talent with opportunity across Africa.</p>
          <ul class="bp-features">
            ${[
              ['chart-line',   'Data-driven player statistics'],
              ['shield-alt',   'Verified identities & liveness check'],
              ['globe-africa', 'Pan-African talent network'],
              ['handshake',    'Secure agent-player connections'],
              ['trophy',       'Leaderboards & rankings'],
              ['lock',         'Your data, always protected'],
            ].map(([ic, txt], i) => html`
              <li key=${i}><i class=${'fas fa-' + ic} aria-hidden="true"></i><span dangerouslySetInnerHTML=${{__html: txt}}></span></li>`)}
          </ul>
          <p class="tagline">"Tracking talent with precision, integrity and reliability."</p>
        </aside>
        <div class="form-panel">
          <div class="form-card">
            ${!success ? html`<${StepIndicator} current=${step - 1}/>` : null}
            ${renderContent()}
            ${!success ? html`
  <div class="auth-links">
    <span class="auth-links-text">Already have an account?</span>
    <a href="/login.html" class="auth-link">Sign in</a>
    <span class="auth-divider" aria-hidden="true"></span>
    <a href="/forgot-password.html" class="auth-link">Forgot password?</a>
  </div>` : ''}
          </div>
        </div>
      </div>
      <${SiteFooter}/>
      <${ToastContainer}/>
    </div>`;
}

render(html`<${App}/>`, document.getElementById('app'));
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js', {scope: '/'})
      .then(function(reg) {
        reg.addEventListener('updatefound', function() {
          var nw = reg.installing;
          if (nw) nw.addEventListener('statechange', function() {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) nw.postMessage({type: 'SKIP_WAITING'});
          });
        });
      })
      .catch(function(err) { console.warn('SW registration failed (non-fatal):', err); });
    navigator.serviceWorker.addEventListener('controllerchange', function() { window.location.reload(); });
  });
}
</script>
</body>
</html>
