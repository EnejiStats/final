<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Register — EnejiStats</title>
<meta name="description" content="Create your EnejiStats account — Africa's trusted football intelligence platform."/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://unpkg.com/preact@10.19.3/dist/preact.umd.js"></script>
<script src="https://unpkg.com/preact@10.19.3/hooks/dist/hooks.umd.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{
  --primary:#004aad;--primary-light:#0066cc;--gold:#f5b800;
  --header-bg:#162060;--dark-bg:#1e1e2f;--page-bg:#0f172a;
  --brand-gradient:linear-gradient(135deg,#162060 0%,#0d1b3e 100%);
  --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--muted:#94a3b8;
  --border:rgba(255,255,255,.12);--surface:rgba(255,255,255,.05);
  --radius:12px;--font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--page-bg);min-height:100vh;color:#e2e8f0;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

/* ── Header ── */
.site-header{position:sticky;top:0;z-index:1000;background:var(--header-bg);border-bottom:4px solid var(--gold)}
.site-header .inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;padding:0 20px;height:68px;gap:16px}
.logo-link{text-decoration:none;white-space:nowrap;display:inline-block;vertical-align:middle}
.hamburger{display:none;background:none;border:none;font-size:1.4rem;cursor:pointer;color:#fff;margin-left:auto}
.site-nav{display:flex;align-items:center;gap:4px;margin-left:auto;list-style:none}
.site-nav a{padding:6px 10px;font-size:.85rem;color:rgba(255,255,255,.8);border-radius:6px;font-weight:500;transition:all .2s;text-decoration:none}
.site-nav a:hover,.site-nav a.active{color:#fff;background:rgba(255,255,255,.1)}
.site-nav .btn-register{background:var(--gold);color:#0f172a!important;padding:7px 14px;border-radius:8px;font-weight:700}
.site-nav .btn-register:hover{opacity:.9}
@media(max-width:768px){
  .hamburger{display:block}
  .site-nav{display:none;position:fixed;top:68px;left:0;right:0;bottom:0;background:var(--header-bg);flex-direction:column;align-items:flex-start;padding:20px;gap:0;overflow-y:auto;z-index:999}
  .site-nav.open{display:flex}
  .site-nav a{width:100%;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:1rem}
}

/* ── Footer ── */
.site-footer{background:#1e1e1e;color:#94a3b8;padding:60px 20px 20px}
.footer-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr}}
.footer-col h4{color:#fff;font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.footer-col p,.footer-col li{font-size:.83rem;line-height:1.7;color:#94a3b8}
.footer-col ul{list-style:none}
.footer-col ul li a{color:#94a3b8;font-size:.83rem}
.footer-col ul li a:hover{color:var(--gold)}
.footer-social{display:flex;gap:10px;margin-top:10px}
.footer-social a{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:.8rem;transition:background .2s}
.footer-social a:hover{background:var(--primary);color:#fff}
.footer-bottom{max-width:1200px;margin:40px auto 0;padding-top:20px;border-top:1px solid #2d2d2d;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:.78rem}
.footer-bottom a{color:#94a3b8}

/* ── Layout ── */
.auth-layout{display:flex;min-height:calc(100vh - 68px)}
.brand-panel{width:420px;flex-shrink:0;background:var(--brand-gradient);border-right:4px solid var(--gold);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 40px;text-align:center}
@media(max-width:768px){.brand-panel{display:none}}
.brand-panel h2{color:#fff;font-size:1.5rem;font-weight:700;margin:1.4rem 0 .5rem;line-height:1.3}
.brand-panel p{color:rgba(255,255,255,.72);font-size:.88rem;line-height:1.65;margin-bottom:28px}
.brand-panel .tagline{color:var(--gold);font-style:italic;font-size:.85rem;border-top:1px solid rgba(255,255,255,.15);padding-top:18px;margin-top:auto}
.bp-features{list-style:none}
.bp-features li{color:rgba(255,255,255,.82);font-size:.85rem;padding:7px 0;display:flex;align-items:center;gap:10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
.bp-features li:last-child{border-bottom:none}
.bp-features li i{color:var(--gold);width:16px;flex-shrink:0}
.form-panel{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto}
@media(max-width:600px){.form-panel{padding:20px 12px}}
.form-card{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:700px;backdrop-filter:blur(10px)}
@media(max-width:600px){.form-card{padding:24px 16px}}

/* ── Step indicator ── */
.step-indicator{display:flex;align-items:center;justify-content:center;margin-bottom:28px}
.step-bubble{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;border:2px solid var(--muted);color:var(--muted);background:transparent;flex-shrink:0;transition:all .3s}
.step-bubble.active{background:var(--gold);border-color:var(--gold);color:#1e1e2f}
.step-bubble.done{background:var(--success);border-color:var(--success);color:#fff}
.step-line{flex:1;height:2px;background:var(--muted);max-width:80px;transition:background .3s}
.step-line.done{background:var(--success)}
.step-label{font-size:.72rem;color:var(--muted);margin-top:6px;text-align:center;white-space:nowrap}
.step-wrap{display:flex;flex-direction:column;align-items:center}

/* ── Role grid ── */
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}
@media(max-width:640px){.role-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:400px){.role-grid{grid-template-columns:1fr}}
.role-card{border:2px solid rgba(255,255,255,.12);border-radius:12px;padding:20px 16px;cursor:pointer;transition:all .25s;background:rgba(255,255,255,.04);text-align:center;position:relative}
.role-card:hover{border-color:var(--gold);transform:translateY(-3px);background:rgba(255,215,0,.06)}
.role-card.selected{border-color:var(--gold);background:rgba(255,215,0,.1)}
.role-card .check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#1e1e2f;opacity:0;transition:opacity .2s}
.role-card.selected .check{opacity:1}
.role-card .role-icon{font-size:2.2rem;margin-bottom:10px;display:block}
.role-card h3{color:#fff;font-size:1rem;font-weight:700;margin-bottom:6px}
.role-card p{color:var(--muted);font-size:.78rem;line-height:1.5}

/* ── Form elements ── */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:#cbd5e1;margin-bottom:6px}
.form-group label .req{color:var(--danger)}
.form-control{width:100%;padding:10px 14px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:8px;color:#f1f5f9;font-size:.9rem;font-family:var(--font);outline:none;transition:border .2s,background .2s}
.form-control:focus{border-color:var(--primary-light);background:rgba(255,255,255,.1)}
.form-control::placeholder{color:var(--muted)}
.form-control option{background:#1e1e2f;color:#f1f5f9}
.form-control:disabled{opacity:.5;cursor:not-allowed}
.input-group{position:relative}
.input-group .form-control{padding-right:40px}
.input-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;pointer-events:none}
.input-icon.clickable{pointer-events:all;cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}
textarea.form-control{resize:vertical;min-height:80px}
/* ── Title-case all plain text / textarea inputs ── */
input.form-control:not([type=email]):not([type=password]):not([type=number]):not([type=date]):not([type=url]):not([type=tel]),
textarea.form-control{text-transform:capitalize}
.helper-text{font-size:.76rem;color:var(--muted);margin-top:4px}
.error-text{font-size:.76rem;color:var(--danger);margin-top:4px}
.success-text{font-size:.76rem;color:var(--success);margin-top:4px}
.warning-text{font-size:.76rem;color:var(--warning);margin-top:4px}
.check-label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem;color:#cbd5e1;padding:4px 0}
.check-label input[type=checkbox],.check-label input[type=radio]{width:16px;height:16px;accent-color:var(--primary)}
.radio-group{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.radio-card{flex:1;min-width:140px;border:2px solid var(--border);border-radius:10px;padding:14px 12px;cursor:pointer;text-align:center;transition:all .2s}
.radio-card:hover{border-color:var(--gold)}
.radio-card.active{border-color:var(--gold);background:rgba(255,215,0,.08)}
.radio-card h5{color:#fff;font-size:.88rem;font-weight:700;margin-bottom:4px}
.radio-card p{color:var(--muted);font-size:.74rem}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 24px;border-radius:8px;font-weight:600;font-size:.9rem;cursor:pointer;border:none;font-family:var(--font);transition:all .2s;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn-gold{background:var(--gold);color:#1e1e2f}
.btn-gold:hover{background:#e6c200}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light)}
.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3)}
.btn-outline:hover{border-color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 14px;font-size:.82rem}
.btn-full{width:100%}
.btn-group{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);gap:12px}

/* ── Password strength ── */
.pw-bar{height:4px;border-radius:2px;margin-top:8px;background:rgba(255,255,255,.1)}
.pw-fill{height:100%;border-radius:2px;transition:all .3s}
.pw-label{font-size:.75rem;margin-top:4px;font-weight:600}
.pw-rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pw-rule{font-size:.73rem;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--muted)}
.pw-rule.met{background:rgba(34,197,94,.1);color:var(--success)}

/* ── File upload ── */
.file-upload-area{border:2px dashed rgba(255,255,255,.2);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:border .2s;background:rgba(255,255,255,.03)}
.file-upload-area:hover{border-color:var(--gold)}
.file-upload-area .icon{font-size:1.8rem;color:var(--muted);margin-bottom:8px}
.file-upload-area p{font-size:.82rem;color:var(--muted)}
.file-preview{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(255,255,255,.05);border-radius:8px;margin-top:8px}
.file-preview img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:2px solid var(--primary)}
.file-preview .file-info{flex:1;min-width:0}
.file-preview .file-info span{display:block;font-size:.82rem;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-preview .file-info small{color:var(--muted);font-size:.74rem}

/* ── GPS ── */
.gps-coords{font-family:monospace;font-size:.78rem;background:rgba(0,0,0,.3);padding:6px 10px;border-radius:6px;margin-top:8px;color:var(--success)}

/* ── Tags ── */
.tag-input{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:8px;min-height:44px;cursor:text}
.tag-item{background:var(--primary);color:#fff;padding:3px 10px;border-radius:20px;font-size:.78rem;display:flex;align-items:center;gap:6px}
.tag-item button{background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:.9rem;line-height:1;padding:0}
.tag-item button:hover{color:#fff}
.tag-dropdown{position:absolute;z-index:100;top:100%;left:0;right:0;background:#1e1e2f;border:1px solid var(--border);border-radius:8px;max-height:200px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tag-dropdown-item{padding:8px 14px;cursor:pointer;font-size:.85rem;color:#e2e8f0;transition:background .15s}
.tag-dropdown-item:hover{background:rgba(255,255,255,.08)}

/* ── Chips ── */
.check-chip{display:flex;align-items:center;gap:6px;padding:5px 12px;border:1.5px solid rgba(255,255,255,.2);border-radius:20px;cursor:pointer;font-size:.8rem;color:#cbd5e1;transition:all .15s;user-select:none}
.check-chip.active{border-color:var(--primary);background:rgba(0,74,173,.25);color:#fff}
.check-chip input{display:none}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* ── Section blocks ── */
.section-block{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:18px;margin-bottom:16px}
.section-block:last-child{margin-bottom:0}
.section-block-title{font-size:.7rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* ── Review ── */
.review-section{margin-bottom:20px}
.review-section h4{font-size:.78rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
@media(max-width:500px){.review-grid{grid-template-columns:1fr}}
.review-item dt{font-size:.74rem;color:var(--muted)}
.review-item dd{font-size:.85rem;color:#e2e8f0;font-weight:500;word-break:break-word}

/* ── Note card ── */
.note-card{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:16px;font-size:.83rem;color:#fbbf24;line-height:1.7}
.note-card ul{margin-top:8px;padding-left:18px}
.note-card li{margin-bottom:4px}

/* ── Applicant badge ── */
.applicant-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,74,173,.2);border:1px solid rgba(0,74,173,.4);color:#7eb3ff;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}

/* ── Toasts ── */
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{padding:12px 20px;border-radius:10px;font-size:.88rem;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:slideIn .3s ease;pointer-events:all;max-width:320px}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.info{background:var(--primary)}
.toast.warning{background:var(--warning);color:#1e1e2f}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(5px)}}

/* ── Overlays ── */
.overlay-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5000;display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.overlay-card{background:#1e1e2f;border:1px solid var(--border);border-radius:16px;width:100%;max-width:640px;max-height:min(85dvh,900px);min-height:0;margin:auto 0;display:flex;flex-direction:column}
.overlay-header{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between}
.overlay-header h3{font-size:1.1rem;font-weight:700;color:#fff}
.overlay-content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 24px;font-size:.85rem;color:#94a3b8;line-height:1.8}
.overlay-footer{padding:16px 24px;border-top:1px solid rgba(255,255,255,.1)}
.overlay-tabs{display:flex;gap:.35rem;margin-bottom:1rem;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:0}
.overlay-tab-btn{padding:.5rem 1rem;font-size:.82rem;font-weight:700;cursor:pointer;background:transparent;border:none;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font,sans-serif);transition:all .2s}
.overlay-tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.overlay-tab-btn:hover:not(.active){color:#cbd5e1}
.overlay-doc{color:#94a3b8;line-height:1.8;font-size:.85rem}
.overlay-doc h4,.overlay-doc h2{color:#fff;font-size:.95rem;margin:16px 0 8px}
.overlay-doc p{margin-bottom:10px}
.overlay-doc ul,.overlay-doc ol{padding-left:18px;margin:.5rem 0}
.overlay-doc li{margin-bottom:4px}
.overlay-doc strong{color:#e2e8f0}
.overlay-doc table{width:100%;border-collapse:collapse;margin:.8rem 0;font-size:.82rem}
.overlay-doc th{background:rgba(0,74,173,.2);color:#7eb3ff;text-align:left;padding:.5rem .7rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.12)}
.overlay-doc td{padding:.5rem .7rem;border-bottom:1px solid rgba(255,255,255,.07);color:#94a3b8}
.overlay-doc h2{font-size:1rem;font-weight:700;color:var(--gold);margin:1.1rem 0 .55rem;padding-bottom:.45rem;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:.4rem}
.overlay-doc h2 .num{background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.68rem;flex-shrink:0}
.overlay-doc a{color:var(--gold)}

/* ── Club search result card ── */
.club-result-card{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(255,255,255,.04)}
.club-result-card:hover{background:rgba(255,255,255,.06)}
.club-result-card:last-child{border-bottom:none}
.club-badge{width:42px;height:42px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,var(--primary),#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem;color:#fff;letter-spacing:.5px;background-size:cover;background-position:center}
.club-result-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.club-result-name{font-size:.86rem;font-weight:700;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.club-result-level{font-size:.73rem;color:var(--gold);font-weight:600}
.club-result-meta{font-size:.72rem;color:var(--muted)}
.club-result-fields{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:3px}
.club-result-field{font-size:.71rem;color:#94a3b8;display:flex;align-items:center;gap:3px}
.club-result-field strong{color:#cbd5e1}

/* ── Smart select ── */
.smart-select-wrap{position:relative}
.smart-select-results{position:absolute;top:100%;left:0;right:0;z-index:50;background:#1e1e2f;border:1px solid var(--border);border-radius:8px;max-height:220px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.4);margin-top:2px}
.smart-select-item{padding:9px 14px;cursor:pointer;font-size:.85rem;color:#e2e8f0;transition:background .15s}
.smart-select-item:hover,.smart-select-item.highlighted{background:rgba(255,255,255,.09)}
.search-results{position:absolute;top:100%;left:0;right:0;z-index:50;background:#1e1e2f;border:1px solid var(--border);border-radius:8px;max-height:240px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.4);margin-top:2px}
.search-result-item{padding:9px 14px;cursor:pointer;font-size:.85rem;color:#e2e8f0;transition:background .15s;display:flex;justify-content:space-between;align-items:center}
.search-result-item:hover{background:rgba(255,255,255,.07)}
.search-result-item small{color:var(--muted);font-size:.75rem}
.loading-shimmer{height:36px;background:rgba(255,255,255,.06);border-radius:8px;animation:shimmer 1.5s infinite;border:1px solid var(--border)}
@keyframes shimmer{0%,100%{opacity:.6}50%{opacity:1}}

/* ── Misc ── */

(function(){

const { useState, useEffect, useRef, useCallback, useMemo } = preactHooks;
const html = htm.bind(h);

/* ─── CONSTANTS ─────────────────────────────────────────────────────────────── */
const FALLBACK_POSITION_MAP = {
  'Goalkeeper': ['GK'],

const LANGUAGES_LIST   = ['English','French','Arabic','Portuguese','Hausa','Yoruba','Igbo','Swahili','Amharic','Zulu','Afrikaans','Twi','Wolof','Fulani','Spanish','German','Italian'];
const EDUCATION_LEVELS = ['B.Sc.','M.Sc.','Ph.D.','HND','OND','O-Level (WAEC/NECO)','A-Level','NCE','MBA','B.Eng.','B.Ed.','B.Tech.','Other'];
const YEAR_NOW = new Date().getFullYear();

/* ── Utility: title-case a string (capitalise first letter of every word) ── */
const toTitleCase = s => !s ? s : s.replace(/\b\w/g, c => c.toUpperCase());

/* ─── TEMPLATE HELPERS (personalised legal doc) ─────────────────────────── */
function _escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getTemplatePlaceholders(d, role) {
  const now     = new Date();
  const fmt     = dt => dt.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  const roleDef = ROLE_DEFS.find(r => r.id === role) || {};
  const fName   = d.firstName || '';
  const lName   = d.lastName  || '';
  const full    = d.fullName  || [fName, d.middleName, lName].filter(Boolean).join(' ') || '';
  const org     = d.clubName  || d.agencyName || d.affiliatedClub || '';
  return {
    fullName:        full   || 'Not provided',
    firstName:       fName  || full.split(' ')[0]   || 'Not provided',
    lastName:        lName  || full.split(' ').slice(-1)[0] || '',
    email:           d.email  || 'Not provided',
    phone:           d.phone  || 'Not provided',
    userId:          'Will be assigned upon successful registration',
    userType:        roleDef.label || role || '',
    userRole:        roleDef.label || role || '',
    userCategory:    d.playerLevel || d.clubLevel || d.agentType || d.affiliationType || 'Standard',
    department:      d.roleInOrg   || d.specialization || 'N/A',
    organization:    d.affiliatedClub || d.agencyName || 'N/A',
    businessName:    org  || 'N/A',
    registrationDate: fmt(now),
    acceptedDate:    fmt(now),
    currentDate:     fmt(now),
    applicationName: 'EnejiStats',
    companyName:     'Enejistats',
  };
}
function applyTemplate(html, phs) {
  return html.replace(/\{\{(\w+)\}\}/g, (_, k) => phs.hasOwnProperty(k) ? _escHtml(phs[k]) : '');
}
async function hashContent(text) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  } catch(_) { return ''; }
}

const ROLE_DEFS = [
  {id:'player',     icon:'⚽', label:'Player',                  desc:'Track match stats, manage your profile, connect with agents.'},
  {id:'club',       icon:'🏟️', label:'Club',                    desc:'Manage your squad and request professional stats tracking.'},
  {id:'scout',      icon:'🔍', label:'Scout',                    desc:'Search, watchlist and compare players across Africa.'},
  {id:'agent',      icon:'🤝', label:'Agent',                    desc:'Represent players, manage contracts and generate reports.'},

];

/* ─── SHARED HOOK — click outside ───────────────────────────────────────────── */
function useClickOutside(ref, handler) {
  useEffect(() => {
    function listener(e) {
      if (ref.current && !ref.current.contains(e.target)) handler();
    }
    document.addEventListener('mousedown', listener);
    return () => document.removeEventListener('mousedown', listener);
  }, [ref, handler]);
}

/* ─── DATA HOOKS ─────────────────────────────────────────────────────────────── */
function useConfig(endpoint, fallback, transform) {
  const [data, setData] = useState(fallback);
  useEffect(() => {
    let cancelled = false;
    fetch(endpoint)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(d => {
        if (cancelled) return;
        const result = transform ? transform(d) : d;
        if (result && (Array.isArray(result) ? result.length > 0 : Object.keys(result).length > 0)) setData(result);
      })
      .catch(() => {});
    return () => { cancelled = true; };
  }, [endpoint]);
  return data;
}

/*
 * usePlatformConfig
 * Fetches:
 *   GET /api/config/positions       → posMap
 *   GET /api/config/player-levels   → playerLevels
 *   GET /api/public/countries       → countries list (code + name, dynamically from backend)
 *
 * Country list response: { countries: [{ code, name, region_label, subregion_label }, ...] }
 * Country names come entirely from the backend COUNTRY_NAMES registry — no local hardcoding.
 */
function usePlatformConfig() {
  const posMap = useConfig('/api/config/positions', FALLBACK_POSITION_MAP, d => d.positions || d.data || d);
  const playerLevels = useConfig('/api/config/player-levels', FALLBACK_PLAYER_LEVELS,
    d => Array.isArray(d) ? d : (d.levels || d.data || FALLBACK_PLAYER_LEVELS));
  const countries = useConfig('/api/public/countries', [],
    d => {
      const list = Array.isArray(d) ? d : (d.countries || d.data || []);
      return list.map(c => ({
        code: c.code || c.v || c.value || c.id,
        name: c.name || c.l || c.label || c.code || c.v || c.value || c.id,
        regionLabel:    c.region_label    || 'State / Region',
        subregionLabel: c.subregion_label || 'LGA / Local Area',
      })).filter(c => c.code && c.name);
    });
  const allPositions = useMemo(() => Object.values(posMap).flat(), [posMap]);
  return { posMap, playerLevels, countries, allPositions };
}

/*
 * useStates — Fetches the list of regions (states / provinces / emirates / etc.)
 * for a given ISO-3166-1 alpha-2 country code.
 *
 * Endpoint: GET /api/public/countries/{ISO_CODE}/regions
 * Response: { country, region_label, regions: string[] }
 *
 * Returns: [regions: string[], loading: bool, regionLabel: string]
 */
function useStates(countryCode) {
  const [states,setStates]=useState([]), [loading,setLoading]=useState(false);
  const [regionLabel,setRegionLabel]=useState('State / Region');
  useEffect(()=>{
    if(!countryCode){setStates([]);setRegionLabel('State / Region');return;}
    const controller=new AbortController();
    setLoading(true);
    fetch('/api/public/countries/'+encodeURIComponent(String(countryCode).toUpperCase())+'/regions',{credentials:'include',signal:controller.signal})
      .then(r=>r.ok?r.json():Promise.reject(new Error('regions request failed')))
      .then(d=>{
        const list=Array.isArray(d)?d:(d.regions||[]);
        setStates(list.map(x=>typeof x==='string'?x:(x?.name||x?.state||x?.region||'')).filter(Boolean));
        setRegionLabel(d.region_label||'State / Region');
      }).catch(e=>{if(e.name!=='AbortError')setStates([]);})
      .finally(()=>{if(!controller.signal.aborted)setLoading(false);});
    return ()=>controller.abort();
  },[countryCode]);
  return [states,loading,regionLabel];
}

/*
 * useLGAs — Fetches the list of subregions (LGAs / counties / cities / districts / etc.)
 * for a given country + region combination.
 *
 * Endpoint: GET /api/public/countries/{ISO_CODE}/regions/{region_name}/subregions
 * Response: { subregion_label, subregions: string[] }
 *
 * Returns: [subregions: string[], loading: bool, subregionLabel: string]
 */
function useLGAs(countryCode,region) {
  const [lgas,setLGAs]=useState([]), [loading,setLoading]=useState(false);
  const [subregionLabel,setSubregionLabel]=useState('LGA / Local Area');
  useEffect(()=>{
    if(!countryCode||!region){setLGAs([]);setSubregionLabel('LGA / Local Area');return;}
    const controller=new AbortController();
    setLoading(true);
    const url='/api/public/countries/'+encodeURIComponent(String(countryCode).toUpperCase())+'/regions/'+encodeURIComponent(region)+'/subregions';
    fetch(url,{credentials:'include',signal:controller.signal})
      .then(r=>r.ok?r.json():Promise.reject(new Error('subregions request failed')))
      .then(d=>{
        const list=Array.isArray(d)?d:(d.subregions||[]);
        setLGAs(list.map(x=>typeof x==='string'?x:(x?.name||x?.lga||x?.subregion||'')).filter(Boolean));
        setSubregionLabel(d.subregion_label||'LGA / Local Area');
      }).catch(e=>{if(e.name!=='AbortError')setLGAs([]);})
      .finally(()=>{if(!controller.signal.aborted)setLoading(false);});
    return ()=>controller.abort();
  },[countryCode,region]);
  return [lgas,loading,subregionLabel];
}


/* ─── TOAST ──────────────────────────────────────────────────────────────────── */
let _setToasts = null;
function showToast(msg, type = 'info') {
  if (!_setToasts) return;
  const id = Date.now();
  _setToasts(p => [...p, {id, msg, type}]);
  setTimeout(() => _setToasts(p => p.filter(t => t.id !== id)), 4000);
}
function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => { _setToasts = setToasts; return () => { _setToasts = null; }; }, []);
  return html`<div class="toast-container">${toasts.map(t => html`<div key=${t.id} class=${'toast ' + t.type}>${t.msg}</div>`)}</div>`;
}

function StepIndicator({current}) {

/* ─── GPS CAPTURE ────────────────────────────────────────────────────────────── */
function GPSCapture({value, onChange, label, required}) {
  const [status, setStatus] = useState(value ? 'captured' : 'idle');
  const capture = () => {
    setStatus('loading');
    if (!navigator.geolocation) {
      setStatus('error');
      showToast('Geolocation is not supported by your browser.', 'error');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        onChange({lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy});
        setStatus('captured');
      },
      err => {
        setStatus('error');
        showToast('Could not get location — check permissions and retry.', 'error');
      },
      {enableHighAccuracy: true, timeout: 15000}
    );
  };
  return html`
    <div class="form-group" style="margin-bottom:0">
      <label>${label || 'GPS Location'}${required ? html`<span class="req"> *</span>` : ''}</label>
      <button type="button" class=${'btn btn-sm ' + (status === 'captured' ? 'btn-success' : 'btn-primary')} onClick=${capture}>
        <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
        ${status === 'loading' ? 'Getting location…' : status === 'captured' ? '✓ Location captured — tap to update' : '📍 Get My Location'}
      </button>
      ${status === 'loading' ? html`<p class="helper-text" style="margin-top:6px"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Acquiring GPS…</p>` : ''}

/* ─── PASSWORD STRENGTH ──────────────────────────────────────────────────────── */
function pwStrength(pw) {
  if (!pw) return {score: 0, label: '', color: ''};
  let s = 0;
  if (pw.length >= 8)          s++;
  if (/[A-Z]/.test(pw))        s++;
  if (/[0-9]/.test(pw))        s++;
  if (/[^A-Za-z0-9]/.test(pw)) s++;
  const labels = ['Weak','Fair','Strong','Very Strong'];
  const colors = ['#ef4444','#f97316','#f59e0b','#22c55e'];
  return {score: s, label: labels[s-1] || '', color: colors[s-1] || '#ef4444'};
}
function PasswordStrength({pw}) {
  const {score, label, color} = pwStrength(pw);
  const rules = [
    {label:'8+ chars',  met: pw.length >= 8},
    {label:'Uppercase', met: /[A-Z]/.test(pw)},
    {label:'Number',    met: /[0-9]/.test(pw)},
    {label:'Special',   met: /[^A-Za-z0-9]/.test(pw)},
  ];
  if (!pw) return null;
  return html`
    <div>
      <div class="pw-bar" role="progressbar" aria-valuenow=${score * 25} aria-valuemin="0" aria-valuemax="100">
        <div class="pw-fill" style=${{width: (score / 4 * 100) + '%', background: color}}></div>
      </div>
      <p class="pw-label" style=${{color}}>${label}</p>
      <div class="pw-rules" aria-label="Password requirements">
        ${rules.map((r, i) => html`<span key=${i} class=${'pw-rule' + (r.met ? ' met' : '')}>
          <i class=${'fas fa-' + (r.met ? 'check' : 'times')} style="font-size:.65rem;margin-right:3px" aria-hidden="true"></i>${r.label}
        </span>`)}
      </div>
    </div>`;
}

/* ─── FILE UPLOAD ────────────────────────────────────────────────────────────── */
function fmtBytes(b) {
  return b < 1024 * 1024 ? (b / 1024).toFixed(1) + 'KB' : (b / (1024 * 1024)).toFixed(2) + 'MB';
}
function FileUpload({id, label, accept, maxMB, required, value, onChange, hint}) {
  const ref = useRef();
  const maxBytes = (maxMB || 1) * 1024 * 1024;
  const handleChange = e => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > maxBytes) { showToast('File too large. Max ' + (maxMB || 1) + 'MB', 'error'); return; }
    onChange(f);
  };
  const preview = value && value.type?.startsWith('image/') ? URL.createObjectURL(value) : null;
  return html`
    <div class="form-group" style="margin-bottom:0">
      <label for=${'file-' + id}>${label}${required ? html`<span class="req"> *</span>` : ''}</label>
      <div class="file-upload-area" onClick=${() => ref.current.click()} role="button" tabIndex="0"
        onKeyDown=${e => e.key === 'Enter' && ref.current.click()}>
        <div class="icon"><i class="fas fa-cloud-upload-alt" aria-hidden="true"></i></div>
        <p>${value ? 'Click to change' : 'Click to upload'}</p>
        ${hint ? html`<p style="font-size:.72rem;color:#475569;margin-top:3px">${hint}</p>` : ''}
      </div>
      ${value ? html`
        <div class="file-preview">
          ${preview ? html`<img src=${preview} alt="Preview of uploaded file"/>` : ''}
          <div class="file-info"><span>${value.name}</span><small>${fmtBytes(value.size)}</small></div>
          <button type="button" class="btn btn-sm btn-danger" onClick=${e => { e.stopPropagation(); onChange(null); }} aria-label="Remove file">
            <i class="fas fa-trash" aria-hidden="true"></i>
          </button>
        </div>` : ''}
      <input ref=${ref} id=${'file-' + id} type="file" accept=${accept} style="display:none" onChange=${handleChange}/>
    </div>`;
}

/* ─── EMAIL FIELD ────────────────────────────────────────────────────────────── */
function EmailField({value, onChange}) {
  const [status, setStatus] = useState('idle');
  const timer = useRef();
  const check = useCallback(email => {
    clearTimeout(timer.current);
    if (!email.includes('@') || !email.includes('.')) { setStatus('idle'); return; }
    setStatus('checking');
    timer.current = setTimeout(async () => {
      try {
        const r = await fetch('/api/auth/check-email?email=' + encodeURIComponent(email));
        const d = await r.json();
        setStatus(d.available ? 'ok' : 'taken');
      } catch { setStatus('idle'); }
    }, 300);
  }, []);
  return html`
    <div class="form-group">
      <label for="email-field">Email Address <span class="req">*</span></label>
      <div class="input-group">
        <input id="email-field" type="email" class="form-control" value=${value}
          onInput=${e => { onChange(e.target.value); check(e.target.value); }}
          placeholder="you@example.com" autocomplete="email"
          aria-describedby="email-status-msg" aria-invalid=${status === 'taken' ? 'true' : 'false'}/>
        <span class="input-icon" aria-hidden="true">
          ${status === 'checking' ? html`<i class="fas fa-spinner fa-spin"></i>` : ''}
          ${status === 'ok'       ? html`<i class="fas fa-check"  style="color:#22c55e"></i>` : ''}
          ${status === 'taken'    ? html`<i class="fas fa-times"  style="color:#ef4444"></i>` : ''}

      </div>
      ${status === 'ok'    ? html`<p id="email-status-msg" class="email-status ok"   role="status"><i class="fas fa-check-circle" aria-hidden="true"></i> Email available</p>` : ''}
      ${status === 'taken' ? html`<p id="email-status-msg" class="email-status err"  role="alert"><i class="fas fa-times-circle" aria-hidden="true"></i> Already registered — <a href="/login.html">Sign in?</a></p>` : ''}

/* ─── CLUB SEARCH ────────────────────────────────────────────────────────────── */
/*
 * Location-aware club search. Passes country/state/lga to the API so results
 * are pre-filtered server-side. Client-side fallback filtering then enforces
 * the lowest (most specific) supplied location tier: lga > state > country.
 *
 * Club result card displays ≥ 5 identification fields:
 *   1. Club name (+ verified badge)
 *   2. Club level
 *   3. Country
 *   4. State / Region
 *   5. LGA / Local Area
 *   6. Home Ground (if available)
 *   7. Year Founded (if available)
 */
function ClubSearch({value, clubId, onSelect, level, country, state, lga, required}) {
  const [q,       setQ]       = useState(value || '');
  const [results, setResults] = useState([]);
  const [open,    setOpen]    = useState(false);
  const [loading, setLoading] = useState(false);
  const timer = useRef();
  const ref   = useRef();
  const close = useCallback(() => setOpen(false), []);
  useClickOutside(ref, close);

  const search = useCallback(async query => {
    if (query.length < 2) { setResults([]); return; }
    setLoading(true);
    try {
      /* Build URL with all location params for server-side filtering */
      const params = new URLSearchParams({ q: query });
      if (level)   params.set('level',   level);
      if (country) params.set('country', country);
      if (state)   params.set('state',   state);
      if (lga)     params.set('lga',     lga);
      const r   = await fetch('/api/public/clubs?' + params.toString());
      const d   = await r.json();
      let clubs = (d.clubs || d.data || d.results || []).slice(0, 30);

      /* Client-side fallback: prioritise most specific location field */
      const ql = query.toLowerCase();
      if (lga) {
        const lgaL = lga.toLowerCase();
        clubs = clubs.filter(c =>
          (c.lga || c.local_area || '').toLowerCase().includes(lgaL) ||
          (c.name || c.club_name || '').toLowerCase().includes(ql)
        );
      } else if (state) {
        const stL = state.toLowerCase();
        clubs = clubs.filter(c =>
          (c.state || c.region || '').toLowerCase().includes(stL) ||
          (c.name || c.club_name || '').toLowerCase().includes(ql)
        );
      } else if (country) {
        const ctL = country.toLowerCase();
        clubs = clubs.filter(c =>
          (c.country || c.country_code || '').toLowerCase().includes(ctL) ||
          (c.name || c.club_name || '').toLowerCase().includes(ql)
        );
      }

      setResults(clubs.slice(0, 20));
      setOpen(true);
    } catch { setResults([]); }
    finally  { setLoading(false); }
  }, [level, country, state, lga]);

  const handleInput = e => {
    const v = e.target.value;
    setQ(v); onSelect(v, '');
    clearTimeout(timer.current);
    timer.current = setTimeout(() => search(v), 350);
  };

  const select = c => {
    const name = c.name || c.club_name || c.title || '';
    setQ(name);
    onSelect(name, c.id || c._id || c.club_id || '');
    setOpen(false); setResults([]);
  };

  return html`
    <div class="form-group" style="margin-bottom:0" ref=${ref}>
      <label>Current Club${required ? html`<span class="req"> *</span>` : ''}</label>
      <p class="helper-text" style="margin-bottom:6px">Search registered clubs or type "Free Agent"${(lga || state || country) ? html` — filtered by your location` : ''}</p>
      <div class="search-wrap" style="position:relative">
        <div class="input-group">
          <input class="form-control" value=${q} onInput=${handleInput} placeholder="Club name or Free Agent…"
            aria-autocomplete="list" aria-expanded=${open} role="combobox"/>
          ${loading ? html`<span class="input-icon"><i class="fas fa-spinner fa-spin" style="font-size:.75rem" aria-hidden="true"></i></span>` : ''}
          ${clubId  ? html`<span class="input-icon" style="color:#22c55e" aria-hidden="true"><i class="fas fa-check-circle"></i></span>` : ''}
        </div>
        ${open && results.length ? html`
          <div class="search-results" style="padding:4px 0" role="listbox">
            ${results.map(c => {
              const name     = c.name || c.club_name || '';
              const initials = name.split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
              const logo     = c.logo_url || c.logo || c.badge || '';
              const cLevel    = c.level || c.club_level || '';
              const cNickname = c.nickname || c.club_nickname || '';
              const cCountry  = c.country_name || c.country || '';
              const cState    = c.state || c.region || '';
              const cLga      = c.lga || c.local_area || c.city || '';
              const cGround   = c.home_ground || c.primary_ground || c.stadium || '';
              const cFounded  = c.founded || c.year_founded || '';
              const cStatus   = c.registration_status || c.status || '';
              return html`

                    <div class="club-result-fields">
                      ${cCountry ? html`<span class="club-result-field"><i class="fas fa-globe-africa" style="font-size:.62rem;color:var(--primary)"></i><strong>${cCountry}</strong></span>` : ''}
                      ${cState   ? html`<span class="club-result-field"><i class="fas fa-map" style="font-size:.62rem;color:#64748b"></i>${cState}</span>` : ''}
                      ${cLga     ? html`<span class="club-result-field"><i class="fas fa-map-pin" style="font-size:.62rem;color:#64748b"></i>${cLga}</span>` : ''}
                      ${cGround  ? html`<span class="club-result-field"><i class="fas fa-futbol" style="font-size:.62rem;color:#64748b"></i>${cGround}</span>` : ''}
                      ${cFounded ? html`<span class="club-result-field"><i class="fas fa-calendar-alt" style="font-size:.62rem;color:#64748b"></i>Est. ${cFounded}</span>` : ''}
                      ${cStatus  ? html`<span class="club-result-field"><i class="fas fa-certificate" style="font-size:.62rem;color:#64748b"></i>${cStatus}</span>` : ''}
                    </div>
                  </div>
                </div>`;
            })}

      </div>
      ${clubId ? html`<p class="success-text" style="margin-top:4px"><i class="fas fa-check-circle" aria-hidden="true"></i> Club matched</p>` :
        q && q.toLowerCase() !== 'free agent' ? html`<p class="warning-text" style="margin-top:4px"><i class="fas fa-exclamation-circle" aria-hidden="true"></i> No match yet — keep typing or type "Free Agent"</p>` : ''}
    </div>`;
}

/* ─── VENUE GROUND SEARCH ────────────────────────────────────────────────────── */
/*
 * Location-aware venue search.
 * Passes search + country/state/lga to the API for server-side filtering.
 * Client-side fallback enforces the most specific location tier: lga > state > country.
 *
 * Selected venue detail card shows ≥ 5 identification fields:
 *   1. Venue name
 *   2. Venue type
 *   3. Surface type
 *   4. Capacity
 *   5. Country
 *   6. State / Region
 *   7. LGA / Local Area
 *   8. Full address
 *   9. Owner / Managing club (if available)
 */
function VenueGroundSearch({value, venueData, onSelect, country, countryName, state, lga, label, required, placeholder}) {
  const [q, setQ]             = useState(value || '');
  const [results, setResults] = useState([]);
  const [open, setOpen]       = useState(false);
  const [loading, setLoading] = useState(false);
  const timer                 = useRef();
  const ref                   = useRef();

  useEffect(() => { setQ(value || ''); }, [value]);

  useEffect(() => {
    const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, []);

  const search = useCallback(async query => {
    const normalizedQuery = String(query || '').trim();
    if (normalizedQuery.length < 3) { setResults([]); setOpen(false); return; }
    setLoading(true);
    try {
      /*
       * The FastAPI endpoint names its venue-name search parameter "search".
       * Keep the request contract aligned with /api/public/venues rather than
       * sending "q", which the endpoint ignores.
       */
      /*
       * Registration stores the human-readable country name (for example,
       * "Nigeria"), while the country selector stores the ISO code ("NG").
       * Send the name to the venues endpoint so its exact country filter
       * matches the value persisted in MongoDB.
       */
      const locationCountry = countryName || country;
      const params = new URLSearchParams({search: normalizedQuery, limit: '100'});
      if (locationCountry) params.set('country', locationCountry);
      if (state)   params.set('state',   state);
      if (lga)     params.set('lga',     lga);

      const r = await fetch('/api/public/venues?' + params.toString(), {credentials: 'include'});
      if (!r.ok) { setResults([]); return; }
      const d = await r.json();
      let venues = Array.isArray(d) ? d : (d.venues || []);

      /* Client-side fallback: filter by name query, then most specific location */
       const ql = normalizedQuery.toLowerCase();
      venues = venues.filter(v => {
         const name = String(
           v.venue_name || v.name || v.stadium || v.stadium_name || v.ground_name || ''
         ).toLowerCase();
        return name.includes(ql);
      });

      if (lga) {
        const lgaL = lga.toLowerCase();
        const byLga = venues.filter(v => (v.lga || v.local_area || '').toLowerCase().includes(lgaL));
        if (byLga.length > 0) venues = byLga;
      } else if (state) {
        const stL = state.toLowerCase();
        const bySt = venues.filter(v => (v.state || v.region || '').toLowerCase().includes(stL));
        if (bySt.length > 0) venues = bySt;
      } else if (country) {
         const ctL = locationCountry.toLowerCase();
        const byCt = venues.filter(v => (v.country || v.country_code || '').toLowerCase().includes(ctL));
        if (byCt.length > 0) venues = byCt;
      }

      setResults(venues.slice(0, 15));
      setOpen(true);
    } catch { setResults([]); }
    finally { setLoading(false); }
  }, [country, countryName, state, lga]);

  const handleInput = e => {
    const v = e.target.value;
    setQ(v);
    if (!v) onSelect(null);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => search(v), 350);
  };

  const select = v => {
    setQ(v.venue_name || v.name || v.stadium || v.stadium_name || v.ground_name || '');
    onSelect(v);
    setOpen(false); setResults([]);
  };

  return html`
    <div ref=${ref} style="position:relative">
      <div class="form-group">
        <label>
          ${label || 'Ground / Venue'}
          ${required ? html`<span class="req"> *</span>` : html`<span style="font-weight:400;font-size:.72rem"> (optional)</span>`}
        </label>
        <p class="helper-text" style="margin-bottom:6px">
          <i class="fas fa-info-circle" aria-hidden="true"></i>
          Type 3+ characters to search DCO-registered venues${(lga || state || country) ? html` — filtered by your location` : ''}
        </p>
        <div style="position:relative">
          <input class="form-control" value=${q}
            onInput=${handleInput}
            onFocus=${() => { if (q.length >= 3) setOpen(true); }}
            placeholder=${placeholder || 'Search registered venues…'}/>
          ${loading ? html`<span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--primary)"><i class="fas fa-spinner fa-spin" style="font-size:.75rem"></i></span>` : ''}
          ${venueData && !loading ? html`<span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--success)"><i class="fas fa-check-circle"></i></span>` : ''}
        </div>
        ${open && results.length ? html`
          <div class="smart-select-results" role="listbox">
            ${results.map(v => {
              const vName    = v.venue_name || v.name || v.stadium || v.stadium_name || v.ground_name || '—';
              const vType    = v.venue_type  || '';
              const vSurface = v.surface_type || '';
              const vCap     = v.capacity ? Number(v.capacity).toLocaleString() + ' seats' : '';
              const vCountry = v.country || v.country_name || '';
              const vState   = v.state   || v.region      || '';
              const vLga     = v.lga     || v.local_area  || '';
              const vAddr    = v.full_address || v.address || '';
              const vOwner   = v.owner   || v.managing_club || '';
              return html`
                <div key=${v._id || v.venue_id || v.id || vName} class="smart-select-item" role="option"
                  onMouseDown=${e => { e.preventDefault(); select(v); }}
                  style="padding:10px 14px">
                  <div style="font-weight:700;color:#e2e8f0;font-size:.9rem;margin-bottom:4px">${vName}</div>
                  <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px">
                    ${vType    ? html`<span style="font-size:.67rem;background:rgba(99,102,241,.18);color:#818cf8;border-radius:4px;padding:1px 6px">${vType}</span>` : ''}
                    ${vSurface ? html`<span style="font-size:.67rem;background:rgba(16,185,129,.14);color:#34d399;border-radius:4px;padding:1px 6px">${vSurface}</span>` : ''}
                    ${vCap     ? html`<span style="font-size:.67rem;background:rgba(245,184,0,.12);color:#fbbf24;border-radius:4px;padding:1px 6px"><i class="fas fa-users" style="font-size:.6rem;margin-right:2px"></i>${vCap}</span>` : ''}
                  </div>
                  <div style="font-size:.72rem;color:#94a3b8;display:flex;flex-wrap:wrap;gap:6px;align-items:center">
                    ${vCountry ? html`<span><i class="fas fa-globe-africa" style="color:var(--primary);margin-right:2px;font-size:.62rem"></i>${vCountry}</span>` : ''}
                    ${vState   ? html`<span style="color:#64748b">›</span><span>${vState}</span>` : ''}
                    ${vLga     ? html`<span style="color:#64748b">›</span><span>${vLga}</span>` : ''}
                    ${vOwner   ? html`<span style="color:#64748b;margin-left:4px"><i class="fas fa-shield-alt" style="font-size:.6rem;margin-right:2px"></i>${vOwner}</span>` : ''}
                  </div>
                  ${vAddr ? html`<div style="font-size:.68rem;color:#475569;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%"><i class="fas fa-road" style="font-size:.6rem;margin-right:3px"></i>${vAddr}</div>` : ''}
                </div>`;
            })}
          </div>` : ''}
        ${open && !loading && results.length === 0 && q.length >= 3 ? html`
          <div class="smart-select-results">
            <div class="smart-select-item" style="color:#94a3b8;cursor:default;font-size:.82rem">
              <i class="fas fa-info-circle" style="margin-right:6px"></i>
              No venues found — ensure venues are registered by a DCO first
            </div>
          </div>` : ''}
      </div>

      ${venueData ? html`
        <div class="ground-detail-card">
          <div class="ground-name">
            <i class="fas fa-map-marker-alt"></i>
            ${venueData.venue_name || venueData.name}
            ${venueData.verified || venueData.is_verified ? html`<i class="fas fa-check-circle" style="color:#3b82f6;font-size:.8rem" aria-label="Verified venue"></i>` : ''}
          </div>
          <div class="ground-detail-grid">
            <div class="ground-detail-item">
              <strong>Venue Type</strong>
              <span>${venueData.venue_type || '—'}</span>
            </div>
            <div class="ground-detail-item">
              <strong>Surface</strong>
              <span>${venueData.surface_type || '—'}</span>
            </div>
            <div class="ground-detail-item">
              <strong>Capacity</strong>
              <span>${venueData.capacity ? Number(venueData.capacity).toLocaleString() + ' seats' : '—'}</span>
            </div>
            <div class="ground-detail-item">
              <strong>Country</strong>
              <span>${venueData.country || venueData.country_name || '—'}</span>
            </div>
            <div class="ground-detail-item">
              <strong>State / Region</strong>
              <span>${venueData.state || venueData.region || '—'}</span>
            </div>
            <div class="ground-detail-item">
              <strong>LGA / Local Area</strong>
              <span>${venueData.lga || venueData.local_area || '—'}</span>
            </div>
            ${venueData.owner || venueData.managing_club ? html`
            <div class="ground-detail-item">
              <strong>Owner / Club</strong>
              <span>${venueData.owner || venueData.managing_club}</span>
            </div>` : ''}
            ${venueData.lighting ? html`
            <div class="ground-detail-item">
              <strong>Floodlights</strong>
              <span>${venueData.lighting}</span>
            </div>` : ''}
          </div>
          ${venueData.full_address || venueData.address ? html`

/* ─── DOC OVERLAY (scroll-gated) ────────────────────────────────────────────── */
function DocOverlay({open, title, fetchUrl, apiUrl, contentHtml, onClose, onAccept, formData, role}) {
  const contentRef = useRef();
  const [canAccept,       setCanAccept]       = useState(false);
  const [bodyHtml,        setBodyHtml]        = useState(contentHtml || '');
  const [fetchTab,        setFetchTab]        = useState('terms');
  const [scrollPct,       setScrollPct]       = useState(0);
  const [loading,         setLoading]         = useState(false);
  const [fetchError,      setFetchError]      = useState(false);
  const [renderedPayload, setRenderedPayload] = useState(null);

  const loadDoc = useCallback(() => {
    if (!fetchUrl) return;
    setLoading(true); setFetchError(false);
    fetch(fetchUrl)
      .then(r => { if (!r.ok) throw new Error(); return r.text(); })
      .then(raw => {
        const doc     = new DOMParser().parseFromString(raw, 'text/html');
        const termsEl = doc.getElementById('terms-doc-content');
        const privEl  = doc.getElementById('privacy-doc-content');
        const phs     = formData ? getTemplatePlaceholders(formData, role) : null;
        const tpl     = s => phs ? applyTemplate(s, phs) : s;

        const termsHtml = tpl(termsEl ? termsEl.innerHTML  : '');
        const privHtml  = tpl(privEl  ? privEl.innerHTML   : '');
        const termsText = termsEl ? termsEl.textContent : '';
        const privText  = privEl  ? privEl.textContent  : '';

        setBodyHtml(termsEl || privEl
          ? '__TABBED__' + JSON.stringify({ terms: termsHtml, privacy: privHtml })
          : tpl(doc.body.innerHTML));

        setRenderedPayload({ termsHtml, privHtml, termsText, privText });
      })
      .catch(() => setFetchError(true))
      .finally(() => setLoading(false));
  }, [fetchUrl, formData, role]);

  useEffect(() => {
    if (!open) return;
    setCanAccept(false); setScrollPct(0); setFetchError(false);
    if (contentRef.current) contentRef.current.scrollTop = 0;
    if (fetchUrl) { loadDoc(); return; }
    if (apiUrl) {
      fetch(apiUrl).then(r => r.ok ? r.json() : Promise.reject())
        .then(d => { if (d.content || d.html) setBodyHtml(d.content || d.html); })
        .catch(() => {});
    }
  }, [open]);

  useEffect(() => {
    if (!open) return;
    const el = contentRef.current; if (!el) return;
    const onScroll = () => {
      const max = el.scrollHeight - el.clientHeight;
      if (max <= 0) { setCanAccept(true); setScrollPct(100); return; }
      const pct = Math.round((el.scrollTop / max) * 100);
      setScrollPct(pct);
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 12) setCanAccept(true);
    };
    el.addEventListener('scroll', onScroll, {passive: true});
    onScroll();
    return () => el.removeEventListener('scroll', onScroll);
  }, [open, fetchTab]);

  if (!open) return null;

  const isTabbed  = typeof bodyHtml === 'string' && bodyHtml.startsWith('__TABBED__');
  let tabbedData  = null;
  if (isTabbed) { try { tabbedData = JSON.parse(bodyHtml.slice('__TABBED__'.length)); } catch(_) {} }

  return html`
    <div class="overlay-backdrop" onClick=${onClose} role="dialog" aria-modal="true" aria-label=${title}>
      <div class="overlay-card" onClick=${e => e.stopPropagation()}>
        <div class="overlay-header">
          <h3>${title}</h3>
          <button class="btn btn-sm btn-outline" onClick=${onClose}>Close</button>
        </div>
        <div style="height:3px;background:rgba(255,255,255,.08)" role="progressbar" aria-valuenow=${scrollPct} aria-valuemin="0" aria-valuemax="100">
          <div style=${{width: scrollPct + '%', height:'100%', background:'var(--gold)', transition:'width .15s'}}></div>
        </div>
        <div class="overlay-content" ref=${contentRef}>
          ${loading ? html`
            <div style="text-align:center;padding:44px 0">
              <i class="fas fa-spinner fa-spin" style="font-size:1.8rem;color:var(--gold);display:block;margin-bottom:12px" aria-hidden="true"></i>
              <p style="color:#94a3b8;font-size:.85rem">Loading document…</p>
            </div>` :
          fetchError ? html`
            <div style="text-align:center;padding:28px 16px">
              <i class="fas fa-exclamation-triangle" style="color:#f59e0b;font-size:1.5rem;display:block;margin-bottom:10px" aria-hidden="true"></i>
              <p style="color:#94a3b8;font-size:.85rem;margin-bottom:14px">Could not load document. Check your connection and try again.</p>
              <button class="btn btn-outline btn-sm" onClick=${loadDoc}><i class="fas fa-redo" aria-hidden="true"></i> Retry</button>
            </div>` :
          tabbedData ? html`
            <div class="overlay-tabs" role="tablist">
              <button class=${'overlay-tab-btn' + (fetchTab === 'terms' ? ' active' : '')} role="tab"
                aria-selected=${fetchTab === 'terms'}
                onClick=${() => { setFetchTab('terms'); setCanAccept(false); if (contentRef.current) contentRef.current.scrollTop = 0; }}>
                <i class="fas fa-file-contract" style="margin-right:5px" aria-hidden="true"></i>Terms of Service
              </button>
              <button class=${'overlay-tab-btn' + (fetchTab === 'privacy' ? ' active' : '')} role="tab"
                aria-selected=${fetchTab === 'privacy'}
                onClick=${() => { setFetchTab('privacy'); setCanAccept(false); if (contentRef.current) contentRef.current.scrollTop = 0; }}>
                <i class="fas fa-shield-alt" style="margin-right:5px" aria-hidden="true"></i>Privacy Policy
              </button>
            </div>
            <div class="overlay-doc" dangerouslySetInnerHTML=${{__html: fetchTab === 'terms' ? tabbedData.terms : tabbedData.privacy}}></div>` :
          html`<div dangerouslySetInnerHTML=${{__html: bodyHtml}}></div>`}
        </div>
        <div class="overlay-footer">
          ${!canAccept ? html`
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px 14px;background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.2);border-radius:8px">
              <i class="fas fa-arrow-down" style="color:var(--gold);animation:bounce .9s infinite alternate" aria-hidden="true"></i>
              <p style="font-size:.82rem;color:#fbbf24;margin:0">Scroll to the end of the document to unlock the Accept button.</p>
            </div>
            <div style="display:flex;gap:10px">
              <button class="btn btn-outline btn-full" onClick=${onClose}><i class="fas fa-times" aria-hidden="true"></i> Decline & Close</button>
              <button class="btn btn-gold btn-full" disabled style="opacity:.35;cursor:not-allowed">
                <i class="fas fa-lock" aria-hidden="true"></i> Accept (scroll to unlock)
              </button>
            </div>` : html`
            <div style="display:flex;gap:10px">
              <button class="btn btn-outline btn-full" onClick=${onClose}><i class="fas fa-times" aria-hidden="true"></i> Decline</button>
              <button class="btn btn-gold btn-full" onClick=${() => { onAccept(renderedPayload); onClose(); }}><i class="fas fa-check" aria-hidden="true"></i> I Accept</button>
            </div>`}
        </div>
      </div>
    </div>`;
}

/* ─── LIVENESS CHECK ─────────────────────────────────────────────────────────── */
function LivenessCheck({onDone}) {
  const [phase,            setPhase]            = useState('idle');
  const [phraseSessionId,  setPhraseSessionId]  = useState('');
  const [phraseText,       setPhraseText]       = useState('');
  const [phraseInput,      setPhraseInput]      = useState('');
  const [phraseError,      setPhraseError]      = useState('');
  const [phraseSubmitting, setPhraseSubmitting] = useState(false);
  const [phraseLoading,    setPhraseLoading]    = useState(false);
  const fetchingRef = useRef(false);

  const fetchChallengePhrase = useCallback(async () => {
    if (fetchingRef.current) return;
    fetchingRef.current = true;
    setPhraseLoading(true); setPhraseError(''); setPhraseText(''); setPhraseSessionId('');
    try {
      const r = await fetch('/api/liveness/session', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
      if (!r.ok) throw new Error('Server error — could not generate challenge phrase.');
      const data = await r.json();
      setPhraseSessionId(data.session_id || '');
      setPhraseText(data.challenge_phrase || '');
    } catch(e) {
      setPhraseError(e.message || 'Could not reach server. Check your connection and retry.');
    } finally {
      setPhraseLoading(false);
      fetchingRef.current = false;
    }
  }, []);

  const submitChallengePhrase = useCallback(async () => {
    if (!phraseInput.trim()) { setPhraseError('Please type the phrase shown above.'); return; }
    if (!phraseSessionId)    { setPhraseError('No active session. Please retry.'); return; }
    setPhraseSubmitting(true); setPhraseError('');
    try {
      const r = await fetch('/api/liveness/complete', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({session_id: phraseSessionId, challenge_response: phraseInput.trim()}),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Challenge validation failed.');
      setPhase('passed');
      onDone({passed: true, token: data.liveness_token});
    } catch(e) {
      const msg = e.message || 'Incorrect phrase. Please try again.';
      setPhraseError(msg);
      if (msg.toLowerCase().includes('expired')) { setPhraseInput(''); fetchChallengePhrase(); }
    } finally { setPhraseSubmitting(false); }
  }, [phraseSessionId, phraseInput, onDone, fetchChallengePhrase]);

  const startChallenge = useCallback(async () => {
    setPhase('challenge_phrase'); setPhraseInput(''); setPhraseError('');
    await fetchChallengePhrase();
  }, [fetchChallengePhrase]);

  if (phase === 'passed') return html`
    <div class="liveness-done" role="status">
      <i class="fas fa-check-circle" style="font-size:2.5rem;color:#22c55e;margin-bottom:12px;display:block" aria-hidden="true"></i>
      <p style="color:#22c55e;font-weight:700;font-size:1rem">Identity Verified</p>
      <p style="color:#64748b;font-size:.82rem;margin-top:4px">Challenge phrase confirmed. Your identity is verified.</p>
    </div>`;

  if (phase === 'challenge_phrase') return html`
    <div class="liveness-card">
      <p style="font-weight:700;font-size:1rem;color:#fff;margin-bottom:4px">
        <i class="fas fa-shield-alt" style="color:var(--gold);margin-right:6px" aria-hidden="true"></i>Server Challenge Verification
      </p>
      <p style="font-size:.82rem;color:#94a3b8;margin-bottom:18px">
        Type the exact phrase displayed below — include every letter, digit and special character.
      </p>
      ${phraseLoading ? html`
        <div style="text-align:center;padding:28px 0">
          <i class="fas fa-spinner fa-spin" style="font-size:1.8rem;color:var(--gold);display:block;margin-bottom:10px" aria-hidden="true"></i>
          <p style="color:#94a3b8;font-size:.85rem">Generating secure challenge phrase…</p>
        </div>` :
      phraseText ? html`
        <div>
          <div style="background:rgba(255,215,0,.07);border:2px solid rgba(255,215,0,.35);border-radius:10px;padding:18px 20px;text-align:center;margin-bottom:18px" aria-live="polite">
            <p style="font-size:.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px">Your one-time challenge phrase</p>
            <p style="font-size:1.35rem;font-weight:800;letter-spacing:3px;color:#f5b800;font-family:monospace;word-break:break-all">${phraseText}</p>
          </div>
          <p style="font-size:.8rem;color:#94a3b8;margin-bottom:10px">Type it exactly — letters, digits <em>and</em> special characters (case-insensitive):</p>
          <input type="text" value=${phraseInput}
            onInput=${e => setPhraseInput(e.target.value)}
            onKeyDown=${e => { if (e.key === 'Enter' && !phraseSubmitting) submitChallengePhrase(); }}
            placeholder="e.g. EAGLE@4-LION#72"
            autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
            style="width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:12px 14px;color:#fff;font-size:1rem;font-family:monospace;letter-spacing:2px;text-transform:uppercase;outline:none;margin-bottom:${phraseError ? '8px' : '14px'}"/>
          ${phraseError ? html`<p style="color:#f87171;font-size:.82rem;margin-bottom:12px" role="alert"><i class="fas fa-exclamation-triangle" aria-hidden="true"></i> ${phraseError}</p>` : ''}
          <button class="btn btn-gold btn-full" onClick=${submitChallengePhrase} disabled=${phraseSubmitting || !phraseInput.trim()}>
            ${phraseSubmitting
              ? html`<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Verifying…`
              : html`<i class="fas fa-check-circle" aria-hidden="true"></i> Confirm Phrase`}
          </button>
        </div>` :
      html`
        <div style="text-align:center;padding:14px 0">
          ${phraseError ? html`<p style="color:#f87171;font-size:.85rem;margin-bottom:16px" role="alert"><i class="fas fa-exclamation-triangle" aria-hidden="true"></i> ${phraseError}</p>` : ''}
          <button class="btn btn-gold" onClick=${fetchChallengePhrase}><i class="fas fa-redo" aria-hidden="true"></i> Retry</button>
        </div>`}
    </div>`;

  return html`
    <div class="liveness-card">
      <p style="font-weight:700;font-size:1rem;color:#fff;margin-bottom:4px">
        <i class="fas fa-shield-alt" style="color:var(--gold);margin-right:6px" aria-hidden="true"></i>Identity Verification
      </p>
      <p style="font-size:.82rem;color:#94a3b8;margin-bottom:18px">
        Our server will generate a unique one-time challenge phrase containing uppercase letters, digits and special characters. Type it exactly to verify your identity.
      </p>
      <div style="text-align:center;padding:20px 0 4px">
        <p style="font-size:.8rem;color:#64748b;margin-bottom:16px">
          <i class="fas fa-lock" style="color:var(--gold)" aria-hidden="true"></i> The phrase combines letters, numbers and symbols for enhanced security.
        </p>
        <button class="btn btn-gold" onClick=${startChallenge}>
          <i class="fas fa-shield-alt" aria-hidden="true"></i> Start Identity Check
        </button>
      </div>
    </div>`;
}

/* ─── EMAIL VERIFY OVERLAY ───────────────────────────────────────────────────── */
function EmailVerifyOverlay({email, code, onCode, onVerify, onResend, submitting, resending, error, success}) {
  const inputRef = useRef(null);
  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);
  if (success) return html`
    <div class="ev-overlay" role="dialog" aria-modal="true" aria-label="Email verified">
      <div class="ev-box">
        <div class="ev-icon done"><i class="fas fa-check-circle" aria-hidden="true"></i></div>
        <h2 style="color:#22c55e;font-size:1.3rem;font-weight:700;margin-bottom:8px">Email Verified!</h2>
        <p style="color:#94a3b8;font-size:.88rem">Redirecting you to sign in…</p>
      </div>
    </div>`;
  return html`
    <div class="ev-overlay" role="dialog" aria-modal="true" aria-label="Verify your email">
      <div class="ev-box">
        <div class="ev-icon"><i class="fas fa-envelope-open-text" aria-hidden="true"></i></div>
        <h2 style="color:#fff;font-size:1.2rem;font-weight:700;margin-bottom:8px">Verify Your Email</h2>
        <p style="color:#94a3b8;font-size:.85rem;margin-bottom:20px">
          We sent a 6-digit code to<br/><strong style="color:#f5b800">${email}</strong>
        </p>
        <input ref=${inputRef} class="ev-otp-input" type="text" inputmode="numeric" maxlength="6"
          placeholder="000000" autocomplete="one-time-code" value=${code}
          aria-label="6-digit verification code"
          onInput=${e => onCode(e.target.value.replace(/\D/g, '').slice(0, 6))}
          onKeyDown=${e => { if (e.key === 'Enter' && code.length === 6 && !submitting) onVerify(); }}/>
        ${error ? html`<p style="color:#f87171;font-size:.82rem;margin:10px 0 0" role="alert"><i class="fas fa-exclamation-triangle" aria-hidden="true"></i> ${error}</p>` : ''}
        <button onClick=${onVerify} disabled=${code.length !== 6 || submitting}
          style="margin-top:20px;width:100%;max-width:260px;padding:13px;border-radius:8px;border:none;background:#f5b800;color:#1e1e2f;font-size:.92rem;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">
          ${submitting
            ? html`<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Verifying…`
            : html`<i class="fas fa-check-circle" aria-hidden="true"></i> Verify Email`}
        </button>
        <p style="font-size:.8rem;color:#64748b;margin-top:16px">
          Didn't get the code?${' '}
          <button type="button" onClick=${onResend} disabled=${resending}
            style="background:none;border:none;color:#f5b800;cursor:pointer;font-size:.8rem;font-weight:600;padding:0;font-family:inherit">
            ${resending ? 'Sending…' : 'Resend code'}
          </button>
        </p>
      </div>
    </div>`;
}

/* ─── STEP 2 — YOUR DETAILS ──────────────────────────────────────────────────── */
function Step2({role, d, set, onNext, onBack, legalAccepted, setLegalAccepted, legalRecord, setLegalRecord, posMap, playerLevels, countries, allPositions}) {
  const [showLegal, setShowLegal] = useState(false);

  const handleLegalAccept = useCallback(async (rendered) => {
    const now = new Date().toISOString();
    let record = { accepted: true, accepted_at: now, version: '2.0' };
    if (rendered) {
      try {
        const phs   = getTemplatePlaceholders(d, role);
        const [th, ph] = await Promise.all([
          hashContent(rendered.termsText  || rendered.termsHtml  || ''),
          hashContent(rendered.privText   || rendered.privHtml   || ''),
        ]);
        record = {
          ...record,
          terms: {
            version:       '2.0',
            accepted:      true,
            accepted_at:   now,
            rendered_html: rendered.termsHtml  || '',
            rendered_text: (rendered.termsText || '').trim(),
            hash_sha256:   th,
          },
          privacy: {
            version:       '2.0',
            accepted:      true,
            accepted_at:   now,
            rendered_html: rendered.privHtml   || '',
            rendered_text: (rendered.privText  || '').trim(),
            hash_sha256:   ph,
          },
          signer: {
            full_name:  phs.fullName,
            email:      phs.email,
            phone:      phs.phone,
            user_type:  phs.userType,
            category:   phs.userCategory,
            business:   phs.businessName !== 'N/A' ? phs.businessName : undefined,
          },
          device: {
            user_agent: navigator.userAgent,
            platform:   navigator.platform || '',
            language:   navigator.language || '',
            timezone:   Intl.DateTimeFormat().resolvedOptions().timeZone || '',
          },
        };
      } catch(_) {}
    }
    setLegalRecord(record);
    setLegalAccepted(true);
    setShowLegal(false);
  }, [d, role, setLegalAccepted, setLegalRecord]);
  const label = ROLE_DEFS.find(r => r.id === role)?.label || role;
  const roleForm = () => {
    switch (role) {
      case 'player':     return html`<${PlayerFields} d=${d} set=${set} posMap=${posMap} playerLevels=${playerLevels} countries=${countries} allPositions=${allPositions}/>`;
      case 'club':       return html`<${ClubFields} d=${d} set=${set} countries=${countries}/>`;
      case 'scout':      return html`<${ScoutFields} d=${d} set=${set} countries=${countries}/>`;
      case 'agent':      return html`<${AgentFields} d=${d} set=${set} countries=${countries}/>`;
      case 'dco':        return html`<${DCOFields} d=${d} set=${set} countries=${countries}/>`;
      case 'supervisor': return html`<${SupervisorFields} d=${d} set=${set} countries=${countries}/>`;
      default:           return null;
    }
  };
  return html`
    <div>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <span style="font-size:1.8rem" aria-hidden="true">${ROLE_DEFS.find(r => r.id === role)?.icon}</span>
        <div>
          <p class="form-heading" style="margin:0">Registering as: ${label}</p>
          <p style="font-size:.78rem;color:#64748b">Fields marked <span style="color:#ef4444" aria-label="required">*</span> are required</p>
        </div>
      </div>

      <${CommonFields} d=${d} set=${set} role=${role}/>
      ${roleForm()}

      <div class="consent-block">
        <p class="consent-title">Consent & Agreements</p>
        <div style="display:flex;align-items:flex-start;gap:10px">
          <input type="checkbox" id="cb-legal" checked=${legalAccepted}
            style="width:16px;height:16px;margin-top:3px;accent-color:var(--primary);flex-shrink:0"
            onChange=${e => { if (e.target.checked) setShowLegal(true); else setLegalAccepted(false); }}/>
          <label for="cb-legal" style="font-size:.88rem;color:#cbd5e1;cursor:pointer;line-height:1.5">
            I have read and accept the
            <button type="button" style="background:none;border:none;color:#f5b800;cursor:pointer;padding:0;text-decoration:underline;font-size:.88rem;font-family:inherit"
              onClick=${e => { e.preventDefault(); setShowLegal(true); }}>
              Terms of Service & Privacy Policy
            </button>
            ${legalAccepted
              ? html`<i class="fas fa-check-circle" style="color:#22c55e;margin-left:6px" aria-label="Accepted" aria-hidden="true"></i>`
              : html`<span style="color:#ef4444;font-size:.74rem;display:block;margin-top:2px" role="status">Required before proceeding</span>`}
          </label>
        </div>
        <p style="font-size:.74rem;color:#64748b;margin-top:8px;padding-left:26px">
          By checking above you confirm you have read both our Terms of Service and Privacy Policy.
          <button type="button" style="background:none;border:none;color:#94a3b8;cursor:pointer;padding:0;font-size:.74rem;text-decoration:underline;font-family:inherit"
            onClick=${e => { e.preventDefault(); window.open('/privacy-terms.html', '_blank'); }}>
            Open in new tab
          </button>
        </p>
      </div>

      <${DocOverlay}
        open=${showLegal}
        title="Terms of Service & Privacy Policy"
        fetchUrl="privacy-terms.html"
        formData=${d}
        role=${role}
        onClose=${() => setShowLegal(false)}
        onAccept=${handleLegalAccept}/>

      <div class="btn-group">
        <button class="btn btn-outline" onClick=${onBack}><i class="fas fa-arrow-left" aria-hidden="true"></i> Back</button>
        <button class="btn btn-gold" onClick=${onNext} disabled=${!legalAccepted || (role === 'club' && !d.clubOfficeGps) || ((role === 'scout' || role === 'agent') && !d.gps)}>Next <i class="fas fa-arrow-right" aria-hidden="true"></i></button>
      </div>
    </div>`;
}

/* ─── STEP 3 — LIVENESS & REVIEW ────────────────────────────────────────────── */
function Step3({role, d, onBack, onSubmit, submitting, submitError, countries}) {
  const [livenessPassed, setLivenessPassed] = useState(false);
  const [livenessToken,  setLivenessToken]  = useState(null);

  const openConfirm = () => {
    if (!livenessPassed) { showToast('Complete liveness verification first', 'error'); return; }

  const closeConfirm = () => { if (!submitting) setShowConfirm(false); };

  return html`
    <div>

      <div style="margin-top:24px">

        <ul>
          <li>Check your email for a verification link.</li>

          <li>Your identity was verified via a secure, server-issued challenge phrase — no camera required.</li>

      ${!showConfirm && submitError ? html`
        <div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:12px;margin-bottom:16px;font-size:.88rem;color:#f87171" role="alert">
          <i class="fas fa-exclamation-triangle" aria-hidden="true"></i> ${submitError}
        </div>` : ''}
      <div class="btn-group">
        <button class="btn btn-outline" onClick=${onBack} disabled=${submitting}>
          <i class="fas fa-arrow-left" aria-hidden="true"></i> Back
        </button>
        <button class="btn btn-gold" disabled=${!livenessPassed || submitting} onClick=${openConfirm}>
          <i class="fas fa-user-check" aria-hidden="true"></i> Create My Account
        </button>
      </div>
      ${showConfirm ? html`
        <${ConfirmSubmitModal}
          role=${role}
          email=${d.email || ''}
          onCancel=${closeConfirm}
          onConfirm=${() => onSubmit(livenessToken)}
          submitting=${submitting}
          submitError=${submitError}/>` : ''}
    </div>`;
}

          </div>
          <h2 style="color:#fff;font-size:1.18rem;font-weight:700;margin-bottom:8px">
            Ready to submit your registration?

          <p style="color:#94a3b8;font-size:.85rem;margin:0;line-height:1.6">
            Your <strong style="color:#f5b800">${roleLabel}</strong> account will be created and a verification email
            will be sent to <strong style="color:#f5b800">${email || 'your email address'}</strong>.
          </p>
        </div>
        <div class="csm-body">
          <div class="csm-next-box">
            <p style="font-size:.78rem;color:#4ade80;font-weight:700;margin-bottom:9px">
              <i class="fas fa-list-check" aria-hidden="true"></i>&nbsp; What will happen next?

                <strong style="color:#f5b800">${email || 'your email address'}</strong>
              </li>
