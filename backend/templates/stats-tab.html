                            ${(contactCard?.whatsapp||player?.whatsapp) && html`<a class="contact-icon-btn contact-whatsapp" href=${`https://wa.me/${(contactCard?.whatsapp||player?.whatsapp).replace(/\D/g,'')}?text=${encodeURIComponent('Hello '+fullName+', I am enquiring from EnejiStats regarding '+fullName+' (ID: '+playerId+', '+positionDisplay+'). My name is [Your Name] and I am contacting on behalf of [Your Organisation].')}`} target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>`}
                            ${(contactCard?.email||player?.email) && html`<a class="contact-icon-btn contact-email" href=${`mailto:${contactCard?.email||player?.email}?subject=Enquiry%20regarding%20${encodeURIComponent(fullName)}%20(${playerId})`} title="Email"><i class="fas fa-envelope"></i></a>`}
                          </div>
                        </div>
                      `}
                    </div>
                  </div>
                </div>
              </div>

              <!-- Player Bio — same source as My Profile -->
              <div class="card print-profile-bio" style="break-inside:avoid;">
                <div class="card-title"><i class="fas fa-user-tag"></i> Player Bio</div>
                ${player?.bio ? html`
                  <div class="bio-card"><p class="bio-text">${player.bio}</p></div>
                ` : html`
                  <div class="empty-state"><i class="fas fa-pen"></i><div>No bio available yet</div></div>
                `}
              </div>

              <!-- Achievements — same source/order as My Profile -->
              <div class="card print-profile-achievements" style="break-inside:avoid;">
                <div class="card-title" style="justify-content:space-between;">
                  <span><i class="fas fa-trophy"></i> Achievements & Awards</span>
                </div>
                ${achievements.length===0 ? html`
                  <div class="empty-state"><i class="fas fa-medal"></i><div>No achievements recorded yet</div></div>
                ` : achievements.map(a => html`
                  <div key=${a._id||a.id} class="achievement-card">
                    <div class="achievement-icon"><i class=${`fas ${a.icon||'fa-trophy'}`} style="color:white;"></i></div>
                    <div class="achievement-body">
                      <div class="achievement-title">${a.title}</div>
                      ${a.category?html`<span class="achievement-badge">${a.category}</span>`:''}
                      <div class="achievement-desc">${a.description}</div>
                      <div class="achievement-meta">
                        <span><i class="fas fa-calendar"></i> ${fmtDate(a.date)}</span>
                        ${a.organizer?html`<span><i class="fas fa-building"></i> ${a.organizer}</span>`:''}
                      </div>
                    </div>
                  </div>
                `)}
              </div>

            </div>

            <!-- Sub tabs -->
            <div class="sub-tabs no-print" style="max-width:420px;">
              <button class=${`sub-tab-btn ${statsSubTab==='summary'?'active':''}`} onClick=${()=>setStatsSubTab('summary')}>Season Summary</button>
              <button class=${`sub-tab-btn ${statsSubTab==='perMatch'?'active':''}`} onClick=${()=>setStatsSubTab('perMatch')}>Per-Match Stats</button>
            </div>

            ${statsSubTab === 'summary' ? html`
              <div>
                <!-- Season Stats Matrix -->
                <div class="matrix-grid">
                  <${MatrixCard}
                     title=${`${fullName} – SEASON STATS`}
                    performanceBadge=${getAvgRatingBadge()}
                    stats=${statsAvgMode ? (() => { const mp=summaryStats?.matchesPlayed||1; const s={}; Object.entries(seasonStats).forEach(([k,v])=>{s[k]=typeof v==='number'?+(v/mp).toFixed(2):v;}); return s; })() : seasonStats}
                    metricBreakdown=${seasonMetricBreakdown}
                    filterCat=${statsFilter}
                    goalBreakdown=${seasonGoalBreakdown}
                    posGroup=${playerRole}
                    playerCategory=${playerCategory}
                     availableKeys=${availableMetricKeys}
                  />
                  <div class="matrix-side">
                    <div class="mini-card key-performance-card">
                      <h4><i class="fas fa-chart-line"></i> KEY PERFORMANCE METRICS</h4>
                      <div class="key-performance-grid">
                        ${keyPerformanceMetrics.map(metric => html`
                          <div key=${metric.k} class="key-performance-item">
                            <span class="key-performance-k">${metric.k}</span>
                            <span class="key-performance-v">${metric.v}</span>
                          </div>
                        `)}
                      </div>
                    </div>
                    <div class="mini-card">
                      <${HeatmapInline} matchData=${matchData} title="Heatmap & Actions" />
                    </div>
                  </div>
                </div>
              </div>
            ` : html`
              <!-- Per-Match Stats View -->
              <div>
                ${matchData.length === 0
                  ? html`<div class="card"><div class="empty-state"><i class="fas fa-futbol"></i><div>No per-match stats available yet</div></div></div>`
                  : html`
                     <div class="print-selection-panel no-print">
                       <div class="print-selection-head">
                         <span class="print-selection-title"><i class="fas fa-print"></i> Select detailed print pages</span>

                           <i class="fas fa-print"></i> Print all pages
                         </button>
                         <button class="btn btn-outline btn-sm" onClick=${()=>setPrintSelectionOrder([])} disabled=${selectedMatchesForPrint.length===0}>
                           Clear selection
                         </button>
                         <button class="btn btn-outline btn-sm" onClick=${printSelectedPages} disabled=${selectedMatchesForPrint.length===0}>
                           Print selected
                         </button>
                       </div>
                       <div class="print-selection-list">
                         ${printSelectionEntries.map(entry => html`
                           <label key=${entry.key} class="print-selection-item">
                             <input
                               type="checkbox"
                               checked=${printSelectionOrder.includes(entry.key)}
                               onChange=${event=>togglePrintSelection(entry.key, event.currentTarget.checked)}
                             />
                             <span>
                               <span class="print-selection-page">Match ${entry.index + 1}</span>
                               ${matchTeamName(entry.match,'home')} ${matchScore(entry.match,'home')} vs ${matchScore(entry.match,'away')} ${matchTeamName(entry.match,'away')}

                           </label>
                         `)}

                    ${currentMatch && html`
                       <div class="conjoined-card print-match-card print-current-match">
                        <div class="match-hdr">
                          <div class="match-scoreline">
                            <div class="team-block"><div class="team-name">${matchTeamName(currentMatch,'home')}</div></div>
                            <div class="team-score">${matchScore(currentMatch,'home')}</div>
                            <div class="vs-text">VS</div>
                            <div class="team-score">${matchScore(currentMatch,'away')}</div>
                            <div class="team-block"><div class="team-name">${matchTeamName(currentMatch,'away')}</div></div>
                             ${matchStatusLabel(currentMatch) ? html`<div class="full-time">${matchStatusLabel(currentMatch)}</div>` : ''}
                          </div>
                          <div class="match-hdr-meta">
                            <span><i class="fas fa-calendar"></i> ${fmtDate(matchDate(currentMatch))}</span>
                            ${currentMatch.competition?html`<span><i class="fas fa-trophy"></i> ${currentMatch.competition}</span>`:''}
                               ${hasDisplayValue(currentMatch.result) ? html`<span class=${`result-badge ${getResultClass(currentMatch.result)}`}>${currentMatch.result}</span>` : ''}
                             ${hasDisplayValue(matchPlayerCategory(currentMatch, '')) ? html`<span><i class="fas fa-layer-group"></i> ${matchPlayerCategory(currentMatch, '')}</span>` : ''}
                             ${hasDisplayValue(matchPlayerLevel(currentMatch, '')) ? html`<span><i class="fas fa-signal"></i> ${matchPlayerLevel(currentMatch, '')}</span>` : ''}
                            ${(readFirst(currentMatch,['role','position','player_position'],playerPosition) || matchMinutes(currentMatch) > 0) ? html`
                              <span class="match-player-line">
                                ${readFirst(currentMatch,['role','position','player_position'],playerPosition)?html`<span class="match-position"><i class="fas fa-tshirt"></i> ${readFirst(currentMatch,['role','position','player_position'],playerPosition)}</span>`:''}
                                ${matchMinutes(currentMatch) > 0 ? html`<span><i class="fas fa-clock"></i> ${formatMinutesPlayed(currentMatch)}</span>`:''}
                              </span>
                            ` : ''}
                          </div>
                          ${(venueName(currentMatch) || venueAddress(currentMatch)) && html`
                            <div class="match-venue-line">
                              <i class="fas fa-location-dot"></i>
                              <span class="match-venue-copy"><strong>${venueName(currentMatch) || 'Venue'}</strong>${venueAddress(currentMatch) ? ` · ${venueAddress(currentMatch)}` : ''}</span>
                            </div>
                          `}
                        </div>
                        <div class="conjoined-body">
                          <div class="matrix-grid">
                            <${MatrixCard}
                              title="Match Performance"
                              performanceBadge=${currentMatch.performance_score?getMatchPerfBadge(currentMatch.performance_score):null}
                              stats=${currentMatch.stats||{}}
                              metricBreakdown=${currentMatch.metricBreakdown || currentMatch.metric_breakdown || {}}
                              filterCat="all"
                              goalBreakdown=${currentMatch.goal_breakdown||null}
                              posGroup=${getRoleFromPosition(readFirst(currentMatch,['role','position','player_position'],playerPosition))}
                               playerCategory=${matchPlayerCategory(currentMatch)}
                               availableKeys=${matchAvailableMetricKeys(currentMatch)}
                            />
                            <div class="matrix-side">
                              <${HeatmapInline} matchData=${[currentMatch]} title="Heatmap & Actions" />
                            </div>
                          </div>
                        </div>
                      </div>
                    `}

                    <!-- Print: All match cards in order for per-match print -->
                    <div class="print-all-matches" style="display:none;">
                      ${selectedMatchesForPrint.map((m, printIndex) => html`
                        <section key=${`${matchId(m)}-${printIndex}`} class="print-page" data-print-page=${printIndex + 1}>
                        <div class="conjoined-card print-match-card" style="margin-bottom:1.5rem;">
                          <div class="match-hdr">
                            <div class="match-scoreline">
                              <div class="team-block"><div class="team-name">${matchTeamName(m,'home')}</div></div>
                              <div class="team-score">${matchScore(m,'home')}</div>
                              <div class="vs-text">VS</div>
                              <div class="team-score">${matchScore(m,'away')}</div>
                              <div class="team-block"><div class="team-name">${matchTeamName(m,'away')}</div></div>
                               ${matchStatusLabel(m) ? html`<div class="full-time">${matchStatusLabel(m)}</div>` : ''}
                            </div>
                            <div class="match-hdr-meta">
                              <span><i class="fas fa-calendar"></i> ${fmtDate(matchDate(m))}</span>
                              ${m.competition?html`<span><i class="fas fa-trophy"></i> ${m.competition}</span>`:''}
                               ${hasDisplayValue(m.result) ? html`<span class=${`result-badge ${getResultClass(m.result)}`}>${m.result}</span>` : ''}
                                ${hasDisplayValue(matchPlayerCategory(m, '')) ? html`<span><i class="fas fa-layer-group"></i> ${matchPlayerCategory(m, '')}</span>` : ''}
                                ${hasDisplayValue(matchPlayerLevel(m, '')) ? html`<span><i class="fas fa-signal"></i> ${matchPlayerLevel(m, '')}</span>` : ''}
                              ${(readFirst(m,['role','position','player_position'],playerPosition) || matchMinutes(m) > 0) ? html`
                                <span class="match-player-line">
                                  ${readFirst(m,['role','position','player_position'],playerPosition)?html`<span class="match-position"><i class="fas fa-tshirt"></i> ${readFirst(m,['role','position','player_position'],playerPosition)}</span>`:''}
                                  ${matchMinutes(m) > 0 ? html`<span><i class="fas fa-clock"></i> ${formatMinutesPlayed(m)}</span>`:''}
                                </span>
                              ` : ''}
                            </div>
                            ${(venueName(m) || venueAddress(m)) && html`
                              <div class="match-venue-line">
                                <i class="fas fa-location-dot"></i>
                                <span class="match-venue-copy"><strong>${venueName(m) || 'Venue'}</strong>${venueAddress(m) ? ` · ${venueAddress(m)}` : ''}</span>
                              </div>
                            `}
                          </div>
                          <div class="conjoined-body">
                            <div class="matrix-grid">
                             <${MatrixCard} title="Match Performance" performanceBadge=${m.performance_score?getMatchPerfBadge(m.performance_score):null} stats=${m.stats||{}} metricBreakdown=${m.metricBreakdown || m.metric_breakdown || {}} filterCat="all" goalBreakdown=${m.goal_breakdown||null} posGroup=${getRoleFromPosition(readFirst(m,['role','position','player_position'],playerPosition))} playerCategory=${matchPlayerCategory(m)} availableKeys=${matchAvailableMetricKeys(m)} />
                              <div class="matrix-side">
                                <div class="mini-card">
                                  <h4>Key Performance Metrics</h4>
                                  <div class="kv-grid">
                                    <span class="kv-k">Performance Score</span>
                                     <span class="kv-v"><span class=${`perf-score ${getPerfClass(m.performance_score||0)}`}>${formatScore(m.performance_score)}/10</span></span>
                                     ${getMatchDerivedStats(getRoleFromPosition(readFirst(m,['role','position','player_position'],playerPosition)), m.stats, m.performance_score).map(f => html`
                                      <span key=${f.k} class="kv-k">${f.k}</span><span key=${f.k+'v'} class="kv-v">${f.v}</span>
                                    `)}
                                  </div>
                                </div>
                                <${HeatmapInline} matchData=${[m]} title="Action map" />
                              </div>
                            </div>
                          </div>
                        </div>
                        </section>
                      `)}
                    </div>
                  `
                }
              </div>
            `}

            <div class="print-footer">
              <div class="print-footer-brand">EnejiStats</div>
              <div class="print-footer-contacts">
                <span class="print-footer-contact"><i class="fas fa-mobile-screen-button"></i><span>+2348083940039</span></span>
                <span class="print-footer-contact"><i class="fas fa-phone"></i><span>+2347065556569</span></span>
                <span class="print-footer-contact"><i class="fas fa-envelope"></i><span>enejistats@gmail.com</span></span>
                <span class="print-footer-contact"><i class="fas fa-globe"></i><span>www.enejistats.com</span></span>
              </div>
              <div class="print-footer-disclaimer">Africa's Football Intelligence Platform · Generated ${new Date().toLocaleDateString('en-GB')}</div>
            </div>

          </div>
        </div>
      </div>
    `;
  }

  render(h(StatsApp, null), document.getElementById('root'));

  // ── PRINT INJECTION: inject profile content before stats on print ──
  window.addEventListener('beforeprint', function() {
    const allMatchesDiv = document.querySelector('.print-all-matches');
    if (allMatchesDiv) { allMatchesDiv.style.display = 'block'; }

    // Smart A4 first-page fit: preserve every profile/bio/achievement element
    // and scale the complete surface only when its measured height exceeds
    // the printable area reserved by the fixed header/footer.
    const profilePage = document.querySelector('.print-profile-first');
    if (profilePage) {
      profilePage.removeAttribute('data-print-fit');
      profilePage.style.removeProperty('--print-profile-scale');
    }
  });
  window.addEventListener('afterprint', function() {
    const allMatchesDiv = document.querySelector('.print-all-matches');
    if (allMatchesDiv) allMatchesDiv.style.display = 'none';
    const profilePage = document.querySelector('.print-profile-first');
    if (profilePage) {
      profilePage.removeAttribute('data-print-fit');
      profilePage.style.removeProperty('--print-profile-scale');
    }
  });

})();
</script>
</body>
</html>
