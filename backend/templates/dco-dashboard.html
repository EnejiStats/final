<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EnejiStats · DCO Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--shell-ink:#172235;--shell-muted:#68778a;--shell-primary:#087f5b;--shell-border:#e4e9f0;--shell-bg:#f4f7fb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--shell-ink);background:var(--shell-bg)}body{height:100dvh;overflow:hidden}
.shell-top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(16px,3vw,34px);background:#fff;border-bottom:1px solid var(--shell-border);position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.02em}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--shell-primary);color:#fff;font-weight:900}.brand small{display:block;margin-top:2px;color:var(--shell-muted);font-size:11px;font-weight:600;letter-spacing:0}
 .user-area{display:flex;align-items:center;gap:11px;font-size:13px}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#e5f2ec;display:grid;place-items:center;color:var(--shell-primary);font-weight:800}.avatar[hidden]{display:none!important}.user-name{font-weight:700;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.logout{border:1px solid #f0c4c3;background:#fff;color:#a73333;border-radius:9px;padding:8px 11px;font:inherit;font-size:12px;font-weight:750;cursor:pointer;white-space:nowrap}.logout:hover{background:#fff5f4}
.shell-layout{height:calc(100dvh - 72px);display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0}.shell-side{padding:16px 12px;background:#fff;border-right:1px solid var(--shell-border)}.shell-side-label{padding:4px 10px 10px;color:#94a1b2;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.shell-nav{display:grid;gap:4px}.shell-nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#536176;border-radius:9px;padding:11px 12px;text-align:left;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .18s,color .18s}.shell-nav button i{width:17px;text-align:center}.shell-nav button:hover{background:#f3f7f6;color:var(--shell-primary)}.shell-nav button[aria-current=page]{background:#eaf5f1;color:var(--shell-primary)}
.shell-main{min-width:0;min-height:0;padding:14px;overflow:auto}.frame-wrap{height:100%;min-height:0;background:#fff;border:1px solid var(--shell-border);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(18,38,63,.06)}.tab-frame{width:100%;height:100%;min-height:0}.tab-frame[hidden]{display:none!important}.tab-frame iframe{display:block;width:100%;height:100%;min-height:calc(100dvh - 104px);border:0;background:#f5f7fb}.shell-toast{position:fixed;right:20px;bottom:20px;z-index:99;padding:11px 15px;border-radius:10px;background:#172235;color:#fff;box-shadow:0 10px 30px #17223530;font-size:13px}.shell-toast.success{background:#218838}.shell-toast.error{background:#b42318}.shell-toast.warning{background:#b7791f}
@media(max-width:850px){.shell-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.shell-side{padding:8px 10px;border-right:0;border-bottom:1px solid var(--shell-border);overflow:auto}.shell-side-label{display:none}.shell-nav{display:flex;width:max-content;min-width:100%}.shell-nav button{width:auto;white-space:nowrap;padding:9px 11px}.shell-main{padding:10px}.frame-wrap{height:100%}}
@media(max-width:560px){.shell-top{height:62px;padding:0 12px}.shell-layout{height:calc(100dvh - 62px)}.brand small,.user-name{display:none}.shell-main{padding:7px}.logout{padding:8px 9px}.tab-frame iframe{min-height:calc(100dvh - 120px)}}
</style><script src="/static/dco-dashboard/dco-dashboard-routes.js"></script></head><body>
<header class="shell-top"><div class="brand"><span class="brand-mark">E</span><span>EnejiStats <small>DCO workspace</small></span></div><div class="user-area"><img id="shell-avatar" class="avatar" alt="" hidden><span id="shell-avatar-fallback" class="avatar">?</span><span id="shell-user-name" class="user-name">Loading account…</span><button id="shell-logout" class="logout" type="button" aria-label="Log out"><i class="fas fa-right-from-bracket"></i> <span>Log out</span></button></div></header>
<div class="shell-layout"><aside class="shell-side"><div class="shell-side-label">Workspace</div><nav id="shell-nav" class="shell-nav" aria-label="DCO dashboard sections">
<button type="button" data-tab="dashboard" aria-current="page"><i class="fas fa-house"></i>Dashboard</button>
<button type="button" data-tab="stats"><i class="fas fa-chart-line"></i>Stats Tracker</button>
<button type="button" data-tab="registration"><i class="fas fa-user-plus"></i>Registration</button>
<button type="button" data-tab="finance"><i class="fas fa-wallet"></i>DCO Finance &amp; Activity</button>
<button type="button" data-tab="support"><i class="fas fa-headset"></i>Support</button></nav></aside>
<main class="shell-main"><div class="frame-wrap" id="frame-wrap">
<section class="tab-frame" data-frame="dashboard"><iframe title="DCO Dashboard" loading="eager"></iframe></section>
<section class="tab-frame" data-frame="stats" hidden><iframe title="Stats Tracker" loading="eager"></iframe></section>
<section class="tab-frame" data-frame="registration" hidden><iframe title="DCO Registration" loading="eager"></iframe></section>
<section class="tab-frame" data-frame="finance" hidden><iframe title="DCO Finance &amp; Activity" loading="eager"></iframe></section>
<section class="tab-frame" data-frame="support" hidden><iframe title="DCO Support" loading="eager"></iframe></section></div></main></div>
<script>(function(){
var loginStarted=false,currentUser=null,tabFiles={dashboard:'/static/dco-dashboard/tabs/dashboard.html',stats:'/static/dco-dashboard/tabs/stats-tracker.html',registration:'/static/dco-dashboard/tabs/registration.html',finance:'/static/dco-dashboard/tabs/dco-finance-activity.html?tab=tokens',support:'/static/dco-dashboard/tabs/support.html'};
var nav=document.getElementById('shell-nav'),nameNode=document.getElementById('shell-user-name'),avatar=document.getElementById('shell-avatar'),fallback=document.getElementById('shell-avatar-fallback');
function redirectToLogin(){if(loginStarted)return;loginStarted=true;try{localStorage.removeItem('dco_token')}catch(e){}window.location.replace('/login')}
async function authorizedFetch(input,options){options=options||{};var statuses=Array.isArray(options.authRedirectStatuses)?options.authRedirectStatuses:[401];var init=Object.assign({},options);delete init.authRedirectStatuses;var headers=new Headers(init.headers||{});var token='';try{token=localStorage.getItem('dco_token')||''}catch(e){}if(token)headers.set('Authorization','Bearer '+token);init.headers=headers;if(!init.credentials)init.credentials='include';var response=await window.fetch(input,init);if(statuses.indexOf(response.status)>=0)redirectToLogin();return response}
window.DCOBridge={routes:window.DCO_ROUTES||{},user:null,fetch:authorizedFetch,authorizeXHR:function(xhr){var token='';try{token=localStorage.getItem('dco_token')||''}catch(e){}if(token)xhr.setRequestHeader('Authorization','Bearer '+token)},notify:function(message,type){var old=document.querySelector('.shell-toast');if(old)old.remove();var node=document.createElement('div');node.className='shell-toast '+(type||'info');node.textContent=String(message||'');document.body.appendChild(node);setTimeout(function(){node.remove()},4500)},logout:async function(){if(loginStarted)return;loginStarted=true;var token='';try{token=localStorage.getItem('dco_token')||''}catch(e){}try{var headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;await Promise.race([window.fetch('/api/auth/logout',{method:'POST',credentials:'include',headers:headers,body:'{}',keepalive:true}).catch(function(){}),new Promise(function(resolve){setTimeout(resolve,1500)})])}catch(e){}try{localStorage.clear()}catch(e){}try{sessionStorage.clear()}catch(e){}window.location.replace('/login')}};
function frameFor(tab){return document.querySelector('[data-frame="'+tab+'"] iframe')}
function sendContext(tab){var frame=frameFor(tab);if(!frame||!frame.contentWindow||!currentUser)return;var userId=currentUser._id||currentUser.id||currentUser.dco_id||'';var dcoId=currentUser.dco_id||currentUser.data_scout_id||currentUser.user_id||userId;frame.contentWindow.postMessage({type:'DCO_CONTEXT',userId:userId,dcoId:dcoId,user:currentUser},location.origin)}
function paintUser(user){currentUser=user||null;window.DCOBridge.user=currentUser;nameNode.textContent=currentUser?(currentUser.full_name||currentUser.name||currentUser.username||'DCO'):'DCO';var photo=currentUser&&(currentUser.photo||currentUser.profileImage||currentUser.avatar||currentUser.profile_photo||currentUser.profile_photo_url);if(photo){avatar.src=photo;avatar.hidden=false;fallback.hidden=true}else{avatar.removeAttribute('src');avatar.hidden=true;fallback.hidden=false;fallback.textContent=currentUser?nameNode.textContent.slice(0,1).toUpperCase():'?'}Object.keys(tabFiles).forEach(sendContext)}
function activate(tab){if(tab==='stats-tracker')tab='stats';if(!tabFiles[tab])tab='dashboard';document.querySelectorAll('[data-tab]').forEach(function(button){if(button.dataset.tab===tab)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});document.querySelectorAll('[data-frame]').forEach(function(frame){frame.hidden=frame.dataset.frame!==tab});var frame=frameFor(tab);if(frame&&!frame.getAttribute('src'))frame.src=tabFiles[tab];setTimeout(function(){sendContext(tab)},0);try{history.replaceState(null,'',location.pathname+'?tab='+encodeURIComponent(tab))}catch(e){}}
nav.addEventListener('click',function(event){var button=event.target.closest('[data-tab]');if(button)activate(button.dataset.tab)});document.getElementById('shell-logout').addEventListener('click',function(){window.DCOBridge.logout()});
document.querySelectorAll('[data-frame]').forEach(function(section){var frame=section.querySelector('iframe');frame.addEventListener('load',function(){sendContext(section.dataset.frame)})});
window.addEventListener('message',function(event){if(event.origin!==location.origin||!event.data)return;var sourceTab=null;Object.keys(tabFiles).some(function(tab){var frame=frameFor(tab);if(frame&&event.source===frame.contentWindow){sourceTab=tab;return true}return false});if(!sourceTab)return;var data=event.data;if(data.type==='DCO_USER_UPDATE'&&data.user){paintUser(data.user);sendContext(sourceTab)}if(data.type==='DCO_NAVIGATE')activate(data.section);if(data.type==='DCO_OPEN_STATS_TRACKER')activate('stats');if(data.type==='DCO_FINANCE_EVENT'&&data.event==='SUBMISSION_RESUBMIT')activate('stats');if(data.type==='DCO_FINANCE_READY')sendContext('finance');if(data.type==='eneji:iframe-height'&&sourceTab==='registration'){var height=Number(data.height);if(Number.isFinite(height)&&height>400&&height<10000){var frame=frameFor('registration');frame.style.height=Math.max(window.innerHeight-122,Math.ceil(height)+8)+'px'}}});
window.addEventListener('resize',function(){var frame=frameFor('registration');if(frame&&frame.getAttribute('src')&&(!frame.style.height||parseInt(frame.style.height,10)<window.innerHeight-122))frame.style.height=(window.innerHeight-122)+'px'});
async function loadUser(){try{var response=await authorizedFetch('/api/dco/user-info',{method:'GET',authRedirectStatuses:[401]});if(!response.ok)throw new Error('HTTP '+response.status);paintUser(await response.json()||{})}catch(error){if(!error||error.status!==401)console.error('DCO account could not be loaded:',error);paintUser(null);nameNode.textContent='Account unavailable'}}
var requested=new URLSearchParams(location.search).get('tab')||'dashboard';loadUser().finally(function(){activate(requested)});})();</script>
</body></html>
