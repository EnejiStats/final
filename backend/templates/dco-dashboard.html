  <style>

function RegistrationExternalIframe(){
  const [frameHeight,setFrameHeight]=useState(900);
  const [loadError,setLoadError]=useState('');
  const frameRef=useRef(null);
  useEffect(function(){
    const onMessage=function(event){
      if(!frameRef.current || event.source!==frameRef.current.contentWindow || event.origin!==window.location.origin) return;
      if(!event.data || event.data.type!=='eneji:iframe-height') return;
      const h=Number(event.data.height);
      if(Number.isFinite(h) && h>400 && h<10000) setFrameHeight(Math.max(720,Math.ceil(h)+8));
    };
    window.addEventListener('message',onMessage);
    return function(){window.removeEventListener('message',onMessage);};
  },[]);
  return h('div',{className:'dco-registration-frame-wrap'},
    loadError
      ? h('div',{className:'dcox-notice error',role:'alert'},loadError)
      : h('iframe',{
          ref:frameRef,
          title:'DCO Registration and Profile Updates',
          src:'register-subtab.html?embedded=1',
          className:'dco-registration-frame',
          style:{height:frameHeight+'px'},
          loading:'eager',
          onError:function(){setLoadError('Unable to load the external registration application.');}
        })
  );
