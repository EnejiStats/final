ument.getElementById('ov-stats-req').textContent=sr.total||0;\n    const [pendingReqs,availScouts,completedToday,pendingUsers]=await Promise.allSettled([\n      api('GET','/api/admin/stats-requests/all?status=pending&limit=1'),\n      api('GET','/api/admin/users?type=dco&status=active&limit=1'),\n      api('GET','/api/admin/stats-requests/all?status=completed&limit=1'),\n      api('GET','/api/admin/users?status=pending&limit=1'),\n    ]);\n    if(pendingReqs.status==='fulfilled') document.getElementById('ov-ops-pending').textContent=pendingReqs.value.total||0;\n    if(availScouts.status==='fulfilled') document.getElementById('ov-ops-scouts').textContent=availScouts.value.total||0;\n    if(completedToday.status==='fulfilled') document.getElementById('ov-ops-completed').textContent=completedToday.value.total||0;\n    if(pendingUsers.status==='fulfilled') document.getElementById('ov-ops-pending-users').textContent=pendingUsers.value.total||0;\n    const bEl=document.getElementById('ov-recent-payouts');\n    if(bEl&&po.payouts){ const list=(po.payouts||[]).slice(0,5); if(!list.length){bEl.innerHTML='<p class=\"text-sm text-muted\">No pending payouts.</p>';} else{bEl.innerHTML=list.map(p=>`<div style=\"display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border)\"><div><div class=\"fw700 text-sm\">${p.user_id||p.dco_id||'—'}</div><div class=\"text-muted\" style=\"font-size:.7rem\">${p.payout_method||'bank'}</div></div><div class=\"gap-sm\"><span class=\"badge badge-warning\">pending</span><span class=\"fw700 text-sm text-gold\">${fmtAmt(p.amount)}</span></div></div>`).join('');} }\n    loadOverviewActivities();\n  }catch(e){ toast('Failed to load overview: '+e.message,'error'); }\n}\n\nasync function loadOverviewActivities(){\n  const el=document.getElementById('ov-activities-list'); if(!el) return;\n  try{\n    const [reqs,assigns]=await Promise.allSettled([\n      api('GET','/api/admin/stats-requests/all?limit=8&so ontainer) return;\n  const list=pmtFilteredList();\n  if(!list.length){ container.innerHTML=''; const empty=document.createElement('div'); empty.className='pmt-empty'; empty.innerHTML='<i class=\"fas fa-credit-card\"></i><p>No payments match the current filter.</p>'; container.appendChild(empty); return; }\n  const totalPages=Math.max(1,Math.ceil(list.length/PMT_PAGE_SIZE));\n  if(_pmtPage>totalPages) _pmtPage=1;\n  const paged=list.slice((_pmtPage-1)*PMT_PAGE_SIZE,_pmtPage*PMT_PAGE_SIZE);\n  container.innerHTML='';\n  const grid=document.createElement('div'); grid.className='payment-cards-grid';\n  paged.forEach(p=>{ const el=document.createElement('div'); render(renderPaymentCard(p),el); grid.appendChild(el.firstChild||el); });\n  container.appendChild(grid);\n  renderPager('pmt-pager',_pmtPage,totalPages,function(p){_pmtPage=p;renderPaymentCards();});\n}\n\nfunction openPmtAction(txRef, action){\n  _pmtActionTxRef=txRef; _pmtActionType=action;\n  const titleMap={approve:'Approve Payment',reject:'Reject Payment',mark_pnr:'Mark as Payment Not Received',confirm_payment:'Confirm Payment Received'};\n  const bodyMap={approve:'Approve this payment and activate the subscription or token credit?',reject:'Reject this payment? The user will be notified.',mark_pnr:'Mark this payment as \"Payment Not Received\"? The user will be asked to retry.',confirm_payment:'Confirm that this payment has been received and activate the subscription?'};\n  document.getElementById('pmt-am-title').textContent=titleMap[action]||'Confirm';\n  document.getElementById('pmt-am-body').textContent=bodyMap[action]||'Are you sure?';\n  const reasonWrap=document.getElementById('pmt-am-reason-wrap');\n  if(reasonWrap) reasonWrap.style.display=(action==='reject'||action==='mark_pnr')?'':'none';\n  const btn=document.getElementById('pmt-am-btn');\n  if(btn){ btn.className='btn '+(action==='approve'||action==='confirm_payment'?'btn-success':action==='reject'?'btn-danger':'btn-warn'); btn.textContent='Confirm'; }\n  openModal('pmt-action-modal');\n}\n\nasync function executePmtAction(){\n  if(!_pmtActionTxRef||!_pmtActionType) return;\n  const reason=(document.getElementById('pmt-am-reason')||{}).value||'';\n  closeModal('pmt-action-modal');\n  const endpointMap={approve:'approve',reject:'reject',mark_pnr:'mark-pnr',confirm_payment:'confirm-payment'};\n  const endpoint=endpointMap[_pmtActionType]||_pmtActionType;\n  try{\n    await api('POST',`/api/admin/payment-intents/${_pmtActionTxRef}/${endpoint}`,{reason})\n          .catch(()=>api('POST',`/api/admin/payments/${_pmtActionTxRef}/${endpoint}`,{reason}));\n    toast('Payment action executed','success');\n    _pmtActionTxRef=null; _pmtActionType=null;\n    loadPayments();\n  }catch(e){ toast('Error: '+e.message,'error'); }\n}\n\nasync function loadPayments(){\n  const container=document.getElementById('pmt-cards-container');\n  if(container) container.innerHTML='<div class=\"loading\"><span class=\"spinner\"></span> Loading payments…</div>';\n  const monthSel=document.getElementById('pmt-month-filter');\n  const month=monthSel?monthSel.value:'';\n  try{\n    const qs=new URLSearchParams({limit:200});\n    if(month) qs.set('month',month);\n    const [intents,receipts,pnr]=await Promise.allSettled([\n      api('GET',`/api/admin/payment-intents?${qs}`),\n      api('GET',`/api/admin/payment-receipts?${qs}`),\n      api('GET',`/api/admin/payment-intents?status=payment_not_received&${qs}`),\n    ]);\n    const seen=new Set(); const all=[];\n    const addList=arr=>{ (arr||[]).forEach(p=>{ const key=p.tx_ref||p._id||''; if(key&&seen.has(key)) return; if(key) seen.add(key); all.push(p); }); };\n    if(intents.status==='fulfilled') addList(intents.value.intents||intents.value.payments||intents.value.results||[]);\n    if(receipts.status==='fulfilled') addList(receipts.value.receipts||receipts.value.results||[]);\n    if(pnr.status==='fulfilled') addList(pnr.value.intents||pnr.value.payments||[]);\n    all.sort((a,b)=>new Date(b.created_at||b.submitted_at||0)-new Date(a.created_at||a.submitted_at||0));\n    _allPayments=all; _pmtPage=1;\n    const pending=all.filter(p=>p.status==='pending_review'||p.status==='pending'||p.status==='awaiting_payment').length;\n    const approved=all.filter(p=>p.status==='active'||p.status==='approved'||p.status==='completed').length;\n    const rejected=all.filter(p=>p.status==='rejected').length;\n    const pnrCount=all.filter(p=>p.status==='payment_not_received').length;\n    const value=all.filter(p=>p.status==='active'||p.status==='approved'||p.status==='completed').reduce((s,p)=>s+(parseFloat(p.amount)||0),0);\n    const se=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v;};\n    se('pmt-stat-pending',pending); se('pmt-stat-approved',approved); se('pmt-stat-rejected',rejected); se('pmt-stat-pnr',pnrCount); se('pmt-stat-value',fmtAmt(value));\n    var bdgP=document.getElementById('badge-payments'); if(bdgP){ bdgP.textContent=pending||''; _setBadgePayments(pending); }\n    renderPaymentCards();\n  }catch(e){ if(container) container.innerHTML=`<div class=\"pmt-empty\"><i class=\"fas fa-exclamation-triangle\"></i><p>Error loading payments: ${e.message}</p></div>`; }\n}\n\n// ═══════════════════════════════════════════════════════════\n// PAYOUTS\n// ═══════════════════════════════════════════════════════════\nfunction setPayoutFilter(el, status){\n  document.querySelectorAll('#page-payouts .filter-tab').forEach(b=>b.classList.remove('active'));\n  el.classList.add('active'); _payoutFilter=status; _payoutsPage=1; loadPayouts();\n}\n\n// ─── REPLACE loadPayouts ENTIRELY ────────────���───────────────────────────\nasync function loadPayouts() {\n  const container = document.getElementById('payouts-container');\n  if (container) container.innerHTML = '<div class=\"loading\"><span class=\"spinner\"></span> Loading payout requests…</div>';\n\n  try {\n    const qs = new URLSearchParams({ page: _payoutsPage, limit: PAGE_SIZE, role: 'dco,supe n>\n          <span class=\"badge badge-${stBadge}\">${st.charAt(0).toUpperCase() + st.slice(1)}</span>\n        </div>\n      </div>\n      <div class=\"pmt-card-body\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:.45rem .75rem;font-size:.78rem\">\n          <div>\n            <div class=\"text-muted\" style=\"font-size:.66rem;margin-bottom:.12rem\">User ID</div>\n            <div class=\"mono fw700\">${uid}</div>\n          </div>\n          <div>\n            <div class=\"text-muted\" style=\"font-size:.66rem;margin-bottom:.12rem\">Amount</div>\n            <div class=\"fw700 text-gold\">${fmtAmt(p.amount)}</div>\n          </div>\n          <div>\n            <div class=\"text-muted\" style=\"font-size:.66rem;margin-bottom:.12rem\">Bank / Method</div>\n            <div class=\"mono text-sm\">${bankLine}</div>\n          </div>\n          <div>\n            <div class=\"text-muted\" style=\"font-size:.66rem;margin-bottom:.12rem\">Requested</div>\n            <div>${fmtDt(p.created_at)}</div>\n          </div>\n          ${extraRows}\n        </div>\n      </div>\n      <div class=\"pmt-card-ftr\">${actions}</div>\n    </div>`;\n}\n  \nfunction payoutAction(id, action){\n  _payoutActionId=id; _payoutActionType=action;\n  const isApprove=(action==='approve');\n  document.getElementById('pam-title').textContent=isApprove?'Approve Payout':'Reject Payout';\n  document.getElementById('pam-desc').textContent=isApprove?'Approve and process this payout? Ensure funds have been disbursed.':'Reject this payout request? The scout will be notified.';\n  document.getElementById('pam-label').textContent=isApprove?'Transaction Reference':'Rejection Reason';\n  document.getElementById('pam-input').placeholder=isApprove?'e.g. bank transfer ref':'e.g. Insufficient details';\n  document.getElementById('pam-confirm-btn').className='btn '+(isApprove?'btn-success':'btn-danger');\n  document.getElementById('pam-confirm-btn').textContent=isApprove?'Approve':'Reject';\n  document.getElementById('pam-input').value='';\n  openModal('payout-action-modal');\n}\n\nasync function executePayout(){\n  if(!_payoutActionId||!_payoutActionType) return;\n  const ref=document.getElementById('pam-input').value;\n  closeModal('payout-action-modal');\n  try{\n    const body=_payoutActionType==='approve'?{transaction_ref:ref,reference:ref}:{reason:ref};\n    await api('POST',`/api/admin/payout-requests/${_payoutActionId}/${_payoutActionType}`,body);\n    toast('Payout '+_payoutActionType+'d successfully','success');\n    loadPayouts();\n  }catch(e){ toast('Error: '+e.message,'error'); }\n}\n\n// ═══════════════════════════════════════════════════════════\n// STATS REQUESTS\n// ═══════════════════════════════════════════════════════════\n// Match Centre operations. This is the single merged implementation of the\n// standalone admin Match Centre and the existing Preact admin dashboard.\nconst MATCH_API = {\n  matches: '/api/admin/match-centre/matches',\n  createMatch: '/api/admin/matches',\n  teams: '/api/admin/match-centre/teams',\n  categories: '/api/admin/match-centre/match-categories',\n  competitions: '/api/admin/match-centre/competitions',\n  venues: '/api/public/venues?limit=100',\n  supervisors: '/api/admin/match-centre/supervisors',\n  acceptedRequests: '/api/admin/match-centre/match-requests/accepted',\n  createFromRequest: function(id){ return '/api/admin/match-centre/match-requests/'+encodeURIComponent(id)+'/create-match'; }\n};\nconst MC_SHARED_KEY='eneji-matchday-shared-v1', MC_SYNC_NAME='eneji-matchday-sync-v1';\nconst MC_LOCAL_KEY='eneji-admin-match-centre-v5';\nvar _mcData={matches:[],teams:[],categories:[],competitions:[],venues:[],supervisors:[],requests:[]};\nvar _mcSelectedClubVenues={home:null,away:null};\nvar _mcSelectedVenue=null,_mcLoading=false,_mcLive=false,_mcSyncChannel=null,_mcSyncStarted=false,_mcLastPublished='';\nvar _mcAssignMatch=null,_mcAssignCandidates=[],_mcAssignSelected=[],_mcAssignFilter={country:'',sta .player_ids)) playerObjects=parent.player_ids.map(function(pid){return {player_id:pid};});\n      if(!playerObjects.length && Array.isArray(parent.selected_players)) playerObjects=parent.selected_players;\n\n      var isClub=!isPlayerRequest(parent);\n      var tracking=statsText(parent.tracking_type||parent.trackingType).toLowerCase();\n      var includeClub=isClub && (tracking==='club_only'||tracking==='club_and_players'||tracking===''||parent.club_tracking===true||parent.club_stats===true);\n      var parentRequester=statsRequesterName(parent);\n      var hasServerExpandedChildren=serverExpandedParents.has(canonicalRid(parent));\n\n      if(isClub && playerObjects.length && !hasServerExpandedChildren &&\n         (tracking==='club_and_players'||tracking==='')){\n        if(includeClub){\n          expanded.push(Object.assign({},parent,{requested_by_name:parentRequester,requested_by_type:'club',_club_request_parent:true,_display_kind:'club'}));\n        }\n        playerObjects.forEach(function(po,idx){\n          var child=(po&&typeof po==='object')?po:{player_id:po};\n          var childId=child.request_id||child._id||child.reference_id||'';\n          var virtualId=childId||String(canonicalRid(parent)||parent.reference_id||('club-request-'+idx))+'::player::'+String(child.player_id||child.id||idx);\n          var merged=Object.assign({},parent,child,{request_id:virtualId,reference_id:child.reference_id||parent.reference_id,\n            player_id:child.player_id||child.id||child.playerId||child.player_id_value||'',\n            player_name:child.player_name||child.name||child.full_name||child.playerName||child.player_id||'Player '+(idx+1),\n            jersey_number:child.jersey_number||child.jersey||parent.jersey_number,\n            player_represents:child.player_represents||child.represents||parent.player_represents,\n            heatmap:child.heatmap!==undefined?child.heatmap:(parent.heatmap||false),\n            requested_by_name:parentRequester,requested_by_type:'club',_club_request_parent_id:canonicalRid(parent),_display_kind:'player',\n            action_request_id:childId||canonicalRid(parent)});\n          expanded.push(merged);\n        });\n      }else{\n        expanded.push(Object.assign({},parent,{requested_by_name:parent.requested_by_name||parent.requested_by||statsRequesterName(parent),requested_by_type:parent.requested_by_type||parent.requester_type||statsRequesterType(parent)}));\n      }\n    });\n\n    // De-duplicate identical child records while retaining separate request IDs.\n    var seen=new Set();\n    expanded=expanded.filter(function(r){\n      var k=[canonicalRid(r),r.action_request_id||'',r.player_id||'',r._display_kind||'',r.club_id||''].join('|');\n      if(seen.has(k))return false;seen.add(k);return true;\n    });\n    var metricStatuses=expanded.map(function(r){return normalizeStatsRequestStatus(r);});\n    var metricValues={total:expanded.length,pending:metricStatuses.filter(function(s){return s==='pending';}).length,assigned:metricStatuses.filter(function(s){return s==='assigned';}).length,completed:metricStatuses.filter(function(s){return s==='completed';}).length,rejected:metricStatuses.filter(function(s){return s==='rejected';}).length};\n    Object.keys(metricValues).forEach(function(k){var el=document.getElementById('sreq-metric-'+k);if(el)el.textContent=metricValues[k].toLocaleString();});\n    if(_statsTab&&_statsTab!=='all'){\n      expanded=expanded.filter(function(r){return normalizeStatsRequestStatus(r)===_statsTab;});\n    }\n    _statsAllReqs=expanded;\n    if(!expanded.length){container.innerHTML='<div class=\"empty\"><i class=\"fas fa-chart-bar\"></i><p>No stats requests found.</p><div class=\"text-muted text-sm\" style=\"margin-top:.35rem\">Club requests and player requests will appear here as soon as they are submitted.</div></div>';return;}\n    renderStatsRequestFolders(container,expanded);\n  }catch(e){\n    if(epoch!==_statsLoadEpoch)return;\n    const message=controller.signal.aborted\n      ?'Stats requests did not load within 20 seconds. Check the connection and retry.'\n      :'Could not load stats requests: '+(e&&e.message||e);\n    container.innerHTML=`<div class=\"empty text-danger\"><i class=\"fas fa-exclamation-triangle\"></i><p>${escHtml(message)}</p><button class=\"btn btn-sm btn-ghost\" type=\"button\" onclick=\"loadStatsRequests()\"><i class=\"fas fa-sync-alt\"></i> Try again</button></div>`;\n  }finally{\n    clearTimeout(timeout);\n    if(epoch===_statsLoadEpoch)_statsLoadController=null;\n  }\n}\n\nfunction statsFolderLabel(f){\n  var date=f.date?fmt(f.date):'Date pending';\n  var time=f.time||'Time pending';\n  return `${escHtml(f.home)} <span style=\"color:var(--gold)\">vs</span> ${escHtml(f.away)}`;\n}\nfunction toggleStatsFolder(key){\n  if(_collapsedStatsFolders.has(key))_collapsedStatsFolders.delete(key);else _collapsedStatsFolders.add(key);\n  var id='sreq-folder-'+btoa(unescape(encodeURIComponent(key))).replace(/[^a-zA-Z0-9_-]/g,'_');\n  var body=document.getElementById(id+'-body'),chev=document.getElementById(id+'-chev');\n  if(body)body.classList.toggle('open',!_collapsedStatsFolders.has(key));\n  if(chev)chev.classList.toggle('open',!_collapsedStatsFolders.has(key));\n}\nfunction toggleStatsClubFolder(key){\n  if(_collapsedStatsClubs.has(key))_collapsedStatsClubs.delete(key);else _collapsedStatsClubs.add(key);\n  var id='sreq-club-'+btoa(unescape(encodeURIComponent(key))).replace(/[^a-zA-Z0-9_-]/g,'_');\n  var body=document.getElementById(id+'-body'),chev=document.getElementById(id+'-chev');\n  if(body)body.classList.toggle('open',!_collapsedStatsClubs.has(key));\n  if(chev)chev.classList.toggle('open',!_collapsedStatsClubs.has(key));\n}\nfunction renderStatsRequestFolders(container,list){\n  var grouped=new Map(),unmatched=[];\n  list.forEach(function(r){\n    var f=statsFixtureInfo(r),key=f.key;\n    if(!key){unmatched.push(r);return;}\n    if(!grouped.has(key))grouped.set(key,{info:f,rows:[]});\n    grouped.get(key).rows.push(r);\n  });\n  var html='';\n  grouped.forEach(function(group,key){\n    var f=group.info;\n    var open=!_collapsedStatsFolders.has(key);\n    var fid='sreq-folder-'+btoa(unescape(encodeURIComponent(key))).replace(/[^a-zA-Z0-9_-]/g,'_');\n    var clubMap=new Map();\n    group.rows.forEach(function(r){\n      var club=statsText(r.requested_by_name||r.requested_by||r.requesting_club_name||r.club_name||r.club_id)||'Unknown requester';\n      var ck=club.toLowerCase()+'|'+statsText(r.club_id||'');\n      if(!clubMap.has(ck))clubMap.set(ck,{name:club,id:r.club_id||'',rows:[]});\n      clubMap.get(ck).rows.push(r);\n    });\n    var clubs=[...clubMap.values()];\n    html+=`<section class=\"sreq-folder\" id=\"${fid}\">\n      <div class=\"sreq-folder-hdr\" onclick=\"toggleStatsFolder(${JSON.stringify(key)})\">\n        <div class=\"sreq-folder-icon\"><i class=\"fas fa-folder-open\"></i></div>\n        <div class=\"sreq-folder-main\"><div class=\"sreq-folder-title\">${statsFolderLabel(f)}</div>\n          <div class=\"sreq-folder-meta\"><span><i class=\"fas fa-calendar\"></i>${escHtml(f.date?fmt(f.date):'Date pending')}</span><span><i class=\"fas fa-clock\"></i>${escHtml(f.time||'Time pending')}</span>${f.venue?`<span><i class=\"fas fa-location-dot\"></i>${escHtml(f.venue)}</span>`:''}</div>\n        </div><div class=\"sreq-folder-count\"><span class=\"badge badge-info\">${group.rows.length} request${group.rows.length===1?'':'s'}</span><i id=\"${fid}-chev\" class=\"fas fa-chevron-down sreq-folder-chevron${open?' open':''}\"></i></div>\n      </div>\n      <div id=\"${fid}-body\" class=\"sreq-folder-body${open?' open':''}\">\n        ${clubs.map(function(c){\n          var ck=key+'|'+c.name.toLowerCase()+'|'+c.id, cid='sreq-club-'+btoa(unescape(encodeURIComponent(ck))).replace(/[^a-zA-Z0-9_-]/g,'_');\n          var copen=!_collapsedStatsClubs.has(ck);\n          var playerCount=c.rows.filter(isPlayerRequest).length,clubCount=c.rows.length-playerCount;\n          return `<div class=\"sreq-club-folder\" id=\"${cid}\"><div class=\"sreq-club-hdr\" onclick=\"toggleStatsClubFolder(${JSON.stringify(ck)})\">\n            <div class=\"sreq-club-icon\"><i class=\"fas fa-shield-halved\"></i></div><div class=\"sreq-club-main\"><div class=\"sreq-club-name\">${escHtml(c.name)}</div><div class=\"sreq-club-sub\">${clubCount?clubCount+' club request · ':''}${playerCount?playerCount+' player request'+(playerCount===1?'':'s'):''}</div></div>\n            <span class=\"badge badge-club\">${c.rows.length}</span><i id=\"${cid}-chev\" class=\"fas fa-chevron-down sreq-club-chevron${copen?' open':''}\"></i></div>\n            <div id=\"${cid}-body\" class=\"sreq-club-body${copen?' open':''}\">${c.rows.map(renderStatsCard).join('')}</div></div>`;\n        }).join('')}\n      </div></section>`;\n  });\n  if(unmatched.length){\n    html+='<div class=\"sreq-unmatched-label\"><i class=\"fas fa-layer-group\"></i> Requests without a complete fixture identity</div><div id=\"sreqs-unmatched\">'+unmatched.map(renderStatsCard).join('')+'</div>';\n  }\n  container.innerHTML=html||'<div class=\"empty\"><i class=\"fas fa-chart-bar\"></i><p>No stats requests found.</p></div>';\n}\n\n// ── Detect entity type ──\nfunction isPlayerRequest(r){\n  const explicit = String(r.entity_type||r.entityType||r.requester_type||r.request_type||'').toLowerCase();\n  if (explicit === 'club') return false;\n  if (explicit === 'player') return true;\n  return !!(r.player_name||r.player_id||r.player_represents||r.jersey_number||(r.heatmap!==undefined&&r.heatmap!==null));\n}\n\n// ── Title-case helper — capitalises the first letter of every word ──\nfunction toTitleCase(str) {\n  if (!str || str === '—') return str;\n  return String(str).replace(/\\b\\w/g, c => c.toUpperCase());\n}\n\n// ── Chip builder ──\nfunction chip(label, value, extraClass){\n  return `<div class=\"sreq-chip${extraClass?' '+extraClass:''}\"><div class=\"rdlbl\">${label}</div><div class=\"rdval\">${value!==undefined&&value!==null&&value!==''?value:'—'}</div></div>`;\n}\n\n// ── Render a single stats request card (player or club) ──\nfunction renderStatsCard(r){\n  const rid = canonicalRid(r);\n  const actionRid = statsActionRid(r);\n  const refId = statsText(r.reference_id||r.request_id||r._id)||'—'; // display only\n  const st = normalizeStatsRequestStatus(r);\n  const stClr = st==='completed'?'s-completed':st==='assigned'?'s-assigned':st==='rejected'?'s-rejected':'';\n  const isOpen = _expandedStats.has(rid);\n  const isPlayer = isPlayerRequest(r);\n\n  // Entity labels\n  const entityName = isPlayer\n    ? (r.player_name||r.player_id||'Unknown Player')\n    : (r.club_name||r.club_id||'Unknown Club');\n  const entityTypeBadge = isPlayer\n    ? `<span class=\"badge badge-player\" style=\"font-size:.58rem\"><i class=\"fas fa-running\" style=\"margin-right:2px\"></i>PLAYER</span>`\n    : `<span class=\"badge badge-token\" style=\"font-size:.58rem\"><i class=\"fas fa-shield-alt\" style=\"margin-right:2px\"></i>CLUB</span>`;\n  const statusBadgeClass = st==='completed'?'badge-active':st==='assigned'?'badge-info':st==='rejected'?'badge-danger':'badge-warning';\n\n  // ── Build detail chips — all API-sourced plain-text values passed through escHtml() ──\n  // Row 1: Reference + Entity ID + Status\n  const refChip = chip('Reference ID', `<span style=\"font-family:monospace;color:var(--gold);font-weight:800\">${escHtml(refId)}</span>`, 'chip-ref');\n  const entityIdChip = isPlayer\n    ? chip('Player ID', escHtml(r.player_id||'—'))\n    : chip('Club ID', escHtml(r.club_id||'—'));\n  const statusChip = chip('Status', `<span class=\"badge ${statusBadgeClass}\" style=\"font-size:.62rem\">${escHtml(st.toUpperCase())}</span>`);\n  const requestedByChip = chip('Requested By', `<span class=\"sreq-origin\" style=\"display:inline-flex;padding:.18rem .4rem;border-radius:5px;font-size:.68rem;font-weight:800\">${escHtml(statsRequesterName(r))}</span>`);\n\n  // Row 2: Match info\n  const matchDateChip = chip('Match Date', fmt(r.match_date||r.event_date));           // fmt() is date-only, safe\n  const matchTimeChip = chip('Match Time', escHtml(r.match_time||'—'));\n  const matchTypeChip = chip('Match Type', toTitleCase(escHtml(String(r.match_type||'—').replace(/_/g,' '))));\n  const homeTeamChip  = chip('Home Team',  toTitleCase(escHtml(r.home_team||r.homeTeam||'—')));\n  const awayTeamChip  = chip('Away Team',  toTitleCase(escHtml(r.away_team||r.awayTeam||'—')));\n\n  // Row 3: Player-specific OR Club-specific\n  let entitySpecificChips = '';\n  if(isPlayer){\n    entitySpecificChips =\n      chip('Jersey No.', escHtml(r.jersey_number||'—')) +\n      chip('Represents', escHtml(r.player_represents||r.club_role||'—')) +\n      chip('Heatmap', r.heatmap===true||r.heatmap==='true'\n        ?'<span class=\"badge badge-info\" style=\"font-size:.58rem\">YES</span>'\n        :'<span class=\"badge badge-muted\" style=\"font-size:.58rem\">NO</span>');\n  } else {\n    entitySpecificChips =\n      chip('Club Role', escHtml(r.club_role||'—')) +\n      chip('Jersey Color', escHtml(r.jersey_color||'—')) +\n      chip('Tracking Type', escHtml(String(r.tracking_type||'—').replace(/_/g,' ')));\n  }\n\n  // Row 4: Venue\n  const venueAddrChip    = chip('Venue Address', toTitleCase(escHtml(r.venue_address||r.venue||r.stadium||'—')));\n  const venueStateChip   = chip('Venue State',   toTitleCase(escHtml(r.venue_state||r.state||'—')));\n  const venueLGAChip     = chip('Venue LGA',     toTitleCase(escHtml(r.venue_lga||'—')));\n  const venueCountryChip = chip('Country',        toTitleCase(escHtml(r.venue_country||r.country||'—')));\n\n  // Row 5: Contact + Assignment + Submitted\n  const contactChip = chip('Contact Phone', escHtml(r.contact_phone||'—'));\n  const assignedScout = r.assigned_dco_id||r.assigned_supervisor_id||r.assigned_scout_name||'';\n  const assignedChip = chip('Assigned Scout',\n    assignedScout\n      ? `<span style=\"color:var(--success ize:.68rem\">${escHtml(refId.slice(-12))}</span>\n      </div>\n      <div class=\"sreq-card-hdr-right\">\n        <span class=\"text-muted text-sm\">${fmt(r.match_date||r.event_date||r.created_at)}</span>\n        <i class=\"fas fa-chevron-down sreq-expand-btn${isOpen?' open':''}\" id=\"sreq-chev-${safeDomRid}\"></i>\n      </div>\n    </div>\n    <div class=\"sreq-card-body${isOpen?' open':''}\" id=\"sreq-body-${safeDomRid}\">\n      <div class=\"sreq-detail-grid\">\n        ${refChip}\n        ${entityIdChip}\n        ${statusChip}\n        ${requestedByChip}\n        ${matchDateChip}\n        ${matchTimeChip}\n        ${matchTypeChip}\n        ${homeTeamChip}\n        ${awayTeamChip}\n        ${entitySpecificChips}\n        ${venueAddrChip}\n        ${venueStateChip}\n        ${venueLGAChip}\n        ${venueCountryChip}\n        ${contactChip}\n        ${assignedChip}\n        ${submittedChip}\n      </div>\n      ${notesBlock}\n      <div class=\"gap-sm\">\n        ${btnAssign}\n        ${btnComplete}\n        ${btnReject}\n        ${btnView}\n      </div>\n    </div>\n  </div>`;\n}\n\nfunction toggleStatsCard(rid){\n  const body=document.getElementById('sreq-body-'+rid); const chev=document.getElementById('sreq-chev-'+rid);\n  if(!body) return;\n  const isOpen=_expandedStats.has(rid);\n  if(isOpen){ _expandedStats.delete(rid); body.classList.remove('open'); if(chev) chev.classList.remove('open'); }\n  else{ _expandedStats.add(rid); body.classList.add('open'); if(chev) chev.classList.add('open'); }\n}\n\n// ── View Details Modal ──\nfunction openRequestDetailsModal(rid){\n  const r = findStatsRequestByActionId(rid);\n  if(!r){ toast('Request not found','warn'); return; }\n  _viewDetailsRequest = r;\n\n  // Single canonical action ID used for ALL buttons — prefer request_id over reference_id\n  const actionId = statsActionRid(r);\n  const safeActionId = actionId.replace(/'/g,\"\\\\'\");\n\n  const isPlayer = isPlayerRequest(r);\n  const refId = r.reference_id||r.request_id||r._id||'—';\n  const entityName = isPlayer ? (r.player_name||r.player_id||'Unknown Player') : (r.club_name||r.club_id||'Unknown Club');\n  const st = normalizeStatsRequestStatus(r);\n  const statusBadgeClass = st==='completed'?'badge-active':st==='assigned'?'badge-info':st==='rejected'?'badge-danger':'badge-warning';\n\n  // rdChip escapes user-sourced values; pass pre-built HTML via second arg only for trusted formatting\n  function rdChip(label, value, isRef){\n    const displayVal = (value===null||value===undefined||value==='')?'—':value;\n    return `<div class=\"rd-chip${isRef?' chip-ref':''}\"><div class=\"rdlbl\">${escHtml(label)}</div><div class=\"rdval\">${displayVal}</div></div>`;\n  }\n  // rdSafeChip: escapes the value itself (for plain API text fields)\n  function rdSafeChip(label, value){\n    return rdChip(label, escHtml(value||'—'));\n  }\n\n  let specificRows = '';\n  if(isPlayer){\n    specificRows = `\n      ${rdSafeChip('Jersey No.', r.jersey_number)}\n      ${rdSafeChip('Represents', r.player_represents||r.club_role)}\n      ${rdChip('Heatmap', r.heatmap===true||r.heatmap==='true'?'Yes':'No')}\n    `;\n  } else {\n    specificRows = `\n      ${rdSafeChip('Club Role', r.club_role)}\n      ${rdSafeChip('Jersey Color', r.jersey_color)}\n      ${rdSafeChip('Tracking Type', (r.tracking_type||'').replace(/_/g,' '))}\n    `;\n  }\n\n  const notes = r.notes||r.additional_notes||r.additionalNotes||'';\n  const notesHtml = notes ? `<div class=\"rd-notes\"><div class=\"rdlbl\" style=\"font-size:.57rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:.3rem\"><i class=\"fas fa-sticky-note\" style=\"margin-right:3px\"></i>Additional Notes</div><div style=\"font-size:.83rem;color:var(--text2);line-height:1.5;white-space:pre-wrap\">${escHtml(notes)}</div></div>` : '';\n\n  const bodyEl = document.getElementById('sreq-details-modal-body');\n  if(bodyEl){\n    bodyEl.innerHTML = `\n      <div style=\"margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap\">\n        ${isPlayer?'<span class=\"badge badge-player\"><i class=\"fas fa-running\" style=\"margin-right:2px\"></i>PLAYER REQUEST</span>':'<span class=\"badge badge-token\"><i class=\"fas fa-shield-alt\" style=\"margin-right:2px\"></i>CLUB REQUEST</span>'}\n        <span class=\"badge ${statusBadgeClass}\">${escHtml(st.toUpperCase())}</span>\n        <span style=\"font-weight:700;font-size:.9rem;color:var(--text)\">${escHtml(entityName)}</span>\n      </div>\n      <div class=\"rd-grid\">\n        ${rdChip('Reference ID', `<span style=\"font-family:monospace;color:var(--gold);font-weight:800\">${escHtml(refId)}</span>`, true)}\n        ${isPlayer ? rdSafeChip('Player ID', r.player_id) : rdSafeChip('Club ID', r.club_id)}\n        ${rdSafeChip('Requested By', statsRequesterName(r))}\n        ${rdChip('Match Date', fmt(r.match_date||r.event_date))}\n        ${rdSafeChip('Match Time', r.match_time)}\n        ${rdSafeChip('Match Type', toTitleCase((r.match_type||'').replace(/_/g,' ')))}\n        ${rdSafeChip('Home Team', toTitleCase(r.home_team||r.homeTeam))}\n        ${rdSafeChip('Away Team', toTitleCase(r.away_team||r.awayTeam))}\n        ${specificRows}\n        ${rdSafeChip('Venue Address', toTitleCase(r.venue_address||r.venue||r.stadium))}\n        ${rdSafeChip('Venue State', toTitleCase(r.venue_state||r.state))}\n        ${rdSafeChip('Venue LGA', toTitleCase(r.venue_lga))}\n        ${rdSafeChip('Country', toTitleCase(r.venue_country||r.country||'—'))}\n        ${rdSafeChip('Contact Phone', r.contact_phone)}\n        ${rdSafeChip('Assigned DCO', r.assigned_dco_id||r.assigned_supervisor_id||r.assigned_scout_name||'Not Assigned')}\n        ${rdChip('Submitted', fmtDt(r.created_at||r.submitted_at))}\n      </div>\n      ${notesHtml}\n      <div class=\"gap-sm\" style=\"margin-top:1rem\">\n        ${st==='pending'?`<button class=\"btn btn-sm btn-primary\" onclick=\"openAssignModal('${safeActionId}','${(r.venue_state||r.state||'').replace(/'/g,\"\\\\'\")}');closeModal('sreq-details-modal')\"><i class=\"fas fa-user-plus\"></i> Assign DCO</button>`:''}\n        ${st!=='completed'&&st!=='rejected'?`<button class=\"btn btn-sm btn-success\" onclick=\"completeStatsRequest('${safeActionId}');closeModal('sreq-details-modal')\"><i class=\"fas fa-check\"></i> Mark Complete</button>`:''}\n        ${st==='pending'||st==='assigned'?`<button class=\"btn btn-sm btn-danger\" onclick=\"openRejectModal('${safeActionId}');closeModal('sreq-details-modal')\"><i class=\"fas fa-times\"></i> Reject</button>`:''}\n      </div>\n    `;\n  }\n  openModal('sreq-details-modal');\n}\n\n// ─── FULL REPLACEMENT — openAssignModal ──────────────────────────────────\nfunction openAssignModal(rid, venueState) {\n  const req = findStatsRequestByActionId(rid) || {};\n  document.getElementById('assign-rid').value = rid;\n  document.getElementById('assign-venue-state').value = venueState || req.venue_state || req.state || '';\n  document.getElementById('assign-notes').value = '';\n\n  _selectedAssignScout = null;\n  _selectedAssignSupervisor = null;\n\n  openModal('assign-modal');\n  loadDCOsForAssignment(req);\n}\n\n// Track supervisor selection\nlet _selectedAssignSupervisor = null;\n\n// ── Safe chip builder — uses DOM API, no innerHTML interpolation ──────────\nfunction _buildChipGrid(container, items, idField, onClick) {\n  container.innerHTML = '';\n  if (!items.length) {\n    const p = document.createElement('p');\n    p.className = 'text-sm text-muted';\n    p.textContent = 'No available users in this area.';\n    container.appendChild(p);\n    return;\n  }\n  const grid = document.createElement('div');\n  grid.className = 'scout-grid';\n  items.forEach(s => {\n    const sid      = s[idField] || s.user_id || s._id || '';\n    const rawName  = s.name || s.full_name || ((s.firstName||'')+' '+(s.lastName||'')).trim() || '—';\n    const tier     = s.tier || s.dco_tier || '';\n    const loc      = s.state || s.venue_state || '';\n    const conflict = s.conflict_reason || '';\n    const isBlocked = !!conflict;\n\n    const chip = document.createElement('div');\n    chip.className = `scout-chip ${isBlocked ? 'sc-busy' : 'sc-avail'}`;\n    chip.title = isBlocked ? conflict : rawName;   // title is text-only — safe\n\n    const nameDiv = document.createElement('div');\n    nameDiv.className = 'scn';\n    nameDiv.textContent = rawName;                 // textContent — XSS-safe\n\n    const sublDiv = document.createElement('div');\n    sublDiv.className = 'scl';\n    sublDiv.textContent = [tier, loc].filter(Boolean).join(' · ');\n\n    const stDiv = document.createElement('div');\n    stDiv.className = 'scs';\n    stDiv.textContent = isBlocked ? `⛔ ${conflict}` : 'Available';\n\n    chip.appendChild(nameDiv);\n    chip.appendChild(sublDiv);\n    chip.appendChild(stDiv);\n\n    if (!isBlocked) {\n      chip.addEventListener('click', () => onClick(sid, rawName, chip));\n    }\n    grid.appendChild(chip);\n  });\n  container.appendChild(grid);\n}\n\n// ─── FULL REPLACEMENT — loadScoutsForAssignment ──────────────────────────\nasync function loadDCOsForAssignment(req) {\n  const dcoGrid   = document.getElementById('assign-dco-grid-wrap');\n  const supGrid   = document.getElementById('assign-supervisor-grid-wrap');\n  const dcoLoad   = document.getElementById('assign-dco-grid-loading');\n  const supLoad   = document.getElementById('assign-supervisor-grid-loading');\n  if (dcoLoad) dcoLoad.style.display = '';\n  if (supLoad) supLoad.style.display = '';\n\n  const country   = req.venue_country || req.country || '';\n  const state     = req.venue_state   || req.state || '';\n  const lga       = req.venue_lga     || '';\n  const matchDate = req.match_date    || req.event_date || '';\n  const matchTime = req.match_time    || '';\n\n  try {\n    const qs = new URLSearchParams({ country, limit: 50 });\n    if (state)     qs.set('state', state);\n    if (lga)       qs.set('lga', lga);\n    if (matchDate) qs.set('match_date', matchDate);\n    if (matchTime) qs.set('match_time', matchTime);\n\n    const [dcoRes, supRes] = await Promise.allSettled([\n      api('GET', `/api/admin/dco/available?${qs}&role=dco`),\n      api('GET', `/api/admin/dco/available?${qs}&role=supervisor`),\n    ]);\n\n    if (dcoLoad) dcoLoad.style.display = 'none';\n    if (supLoad) supLoad.style.display = 'none';\n\n    if (dcoGrid) {\n      const dcos = dcoRes.status === 'fulfilled' ? (dcoRes.value.dcos || dcoRes.value.users || []) : [];\n      _buildChipGrid(dcoGrid, dcos, 'dco_id', (sid, name, el) => {\n        document.querySelectorAll('#assign-dco-grid-wrap .scout-chip').forEach(c => c.classList.remove('sc-sel'));\n        el.classList.add('sc-sel');\n        _selectedAssignScout = { id: sid, name };\n        const input = document.getElementById('assign-id');\n        if (input) input.value = sid;\n        toast(name + ' (DCO) selected', 'info');\n      });\n    }\n\n    if (supGrid) {\n      const sups = supRes.status === 'fulfilled' ? (supRes.value.supervisors || supRes.value.users || []) : [];\n      _buildChipGrid(supGrid, sups, 'supervisor_id', (sid, name, el) => {\n        document.querySelectorAll('#assign-supervisor-grid-wrap .scout-chip').forEach(c => c.classList.remove('sc-sel'));\n        el.classList.add('sc-sel');\n        _selectedAssignSupervisor = { id: sid, name };\n        toast(name + ' (Supervisor) selected as monitor', 'info');\n      });\n    }\n  } catch (e) {\n    if (dcoLoad) dcoLoad.style.display = 'none';\n    if (supLoad) supLoad.style.display = 'none';\n    if (dcoGrid) { dcoGrid.innerHTML = ''; const p = document.createElement('p'); p.className = 'text-sm text-danger'; p.textContent = 'Failed to load DCOs.'; dcoGrid.appendChild(p); }\n  }\n}\n\nasync function doAssign() {\n  const rid = document.getElementById('assign-rid').value;\n  const dcoId = (document.getElementById('assign-id') || {}).value || (_selectedAssignScout && _selectedAssignScout.id) || '';\n  const supId = _selectedAssignSupervisor ? _selectedAssignSupervisor.id : '';\n  const notes = (document.getElementById('assign-notes') || {}).value || '';\n\n  if (!rid || !dcoId) { toast('Select a DCO to assign', 'warn'); return; }\n\n  try {\n    const body = {\n      request_id: rid,\n      assignee_id: dcoId,\n      role: 'dco',\n      notes,\n      ...(supId ? { supervisor_id: supId } : {}),\n    };\n    await api('POST', `/api/admin/stats-requests/${encodeURIComponent(rid)}/assign`, body);\n    toast('DCO assigned successfully', 'success');\n    if (supId && _selectedAssignSupervisor) {\n      toast(_selectedAssignSupervisor.name + ' assigned as supervisor', 'info');\n    }\n    closeModal('assign-modal');\n    loadStatsRequests();\n    loadAssignments();\n  } catch (e) { toast('Error: ' + e.message, 'error'); }\n}\n\nfunction openRejectModal(rid){\n  _sreqRejectRid=rid;\n  document.getElementById('sreq-reject-rid').value=rid;\n  document.getElementById('sreq-reject-reason').value='';\n  openModal('sreq-reject-modal');\n}\n\nasync function executeRejectRequest(){\n  const rid=document.getElementById('sreq-reject-rid').value;\n  const reason=document.getElementById('sreq-reject-reason').value;\n  if(!rid){toast('No request selected','warn');return;}\n  closeModal('sreq-reject-modal');\n  try{\n    await api('POST',`/api/admin/stats-requests/${encodeURIComponent(rid)}/reject`,{reason});\n    toast('Request rejected','info');\n    loadStatsRequests();\n    loadAssignments();\n  }catch(e){ toast('Error: '+e.message,'error'); }\n}\n\nasync function completeStatsRequest(rid){\n  try{\n    await api('POST',`/api/admin/stats-requests/${encodeURIComponent(rid)}/complete`,{});\n    toast('Request marked complete','success');\n    loadStatsRequests();\n    loadAssignments();\n  }catch(e){ toast('Error: '+e.message,'error'); }\n}\n\n// ── Complete from assignment row (delegates to completeStatsRequest) ──\nasync function completeAssignmentRow(requestId){\n  if(!requestId){toast('No request ID found','warn');return;}\n  await completeStatsRequest(requestId);\n}\n\n// ── View a request from assignment row ──\nfunction viewAssignmentRow(requestId){\n  // Find request in cached list\n  const r = findStatsRequestByActionId(requestId);  // uses request_id||_id, matching original\n  if(r){\n    openRequestDetailsModal(requestId);\n  } else {\n    // Load and open\n    api('GET',`/api/admin/stats-requests/${encodeURIComponent(requestId)}`)\n      .then(function(d){\n        const req=d.request||d;\n        _statsAllReqs.push(req);\n        openRequestDetailsModal(requestId);\n      })\n      .catch(function(){ toast('Could not load request details','error'); });\n  }\n}\n\n// ═══════════════════════════════════════════════════════════\n// ASSIGNMENTS\n// ═══════════════════════════════════════════════════════════\n\n// Left panel: Available Scouts with full field display\nasync function loadAvailableScouts(){\n  const el=document.getElementById('avail-scouts-list'); if(!el) return;\n  el.innerHTML='<div class=\"loading\">Loading…</div>';\n  try{\n    const d=await api('GET','/api/admin/users?type=dco&status=active&limit=50');\n    const scouts=d.users||[];\n    _availableScoutsList=scouts;\n    if(!scouts.length){el.innerHTML='<p class=\"text-sm text-muted\" style=\"padding:.5rem 0\">No available scouts.</p>';return;}\n    el.innerHTML=`<div class=\"scout-grid\">${scouts.map(s=>{\n      const busy=s.status==='busy';\n      const name=escHtml(s.name||((s.firstName||'')+' '+(s.lastName||'')).trim()||'—');\n      const tierLabel=escHtml(s.tier||s.dco_tier||'Tier 1');\n      const stateLabel=escHtml(s.venue_state||s.state||'—');\n      return `<div class=\"scout-chip ${busy?'sc-busy':'sc-avail'}\" title=\"${name}\">\n        <div class=\"scn\">${name}</div>\n        <div class=\"scl\">${tierLabel} · ${stateLabel}</div>\n        <div class=\"scs\">${busy?'Busy':'Available'}</div>\n      </div>`;\n    }).join('')}</div>`;\n  }catch(e){ el.innerHTML='<p class=\"text-sm text-muted text-danger\">Error: '+e.message+'</p>'; }\n}\n\n// Right panel: Current Assignments table — Scout | Request ID | Player/Club | Venue | Match Date | Status | Actions\nasync function loadAssignments(){\n  const tbody=document.getElementById('assignments-tbody'); if(!tbody) return;\n  tbody.innerHTML='<tr><td colspan=\"7\" class=\"loading\">Loading…</td></tr>';\n  try{\n    const qs=new URLSearchParams({page:_asgnPage,limit:PAGE_SIZE});\n    const d=await api('GET',`/api/admin/assignments?${qs}`);\n    const list=d.assignments||[];\n    if(!list.length){tbody.innerHTML='<tr><td colspan=\"7\" class=\"empty\" style=\"text-align:center;padding:2rem 1rem;color:#475569\">No assignments found.</td></tr>';return;}\n\n    tbody.innerHTML=list.map(a=>{\n      // requestId is the stats-request resource identifier — NEVER fall back to assignmentId\n      // for request-level API calls (complete/reject). If absent, disable those actions.\n      const assignmentId=a.assignment_id||a._id||'';\n      const requestId=a.stats_request_id||a.request_id||'';\n      const hasRequestId=!!requestId;\n\n      const scoutName=escHtml(a.assigned_dco_id||a.assigned_supervisor_id||a.scout_name||'—'); // original field priority\n      const entityName=escHtml(a.player_name||a.club_name||a.player_id||a.club_id||'—');\n      const venue=escHtml(a.venue_address||a.venue||a.stadium||'—');\n      const matchDate=fmt(a.match_date||a.event_date||a.created_at);\n      const st=(a.status||'assigned').toLowerCase();\n      const statusBadge=`<span class=\"badge badge-${st==='completed'?'active':st==='rejected'?'danger':'info'}\">${escHtml(st)}</span>`;\n      const displayId=escHtml((requestId||assignmentId).slice(-12)||'—');\n\n      // View uses requestId to open the details modal; falls back to assignmentId for lookup\n      const safeViewId=(requestId||assignmentId).replace(/'/g,\"\\\\'\");\n      const btnView=`<button class=\"btn btn-sm btn-ghost\" onclick=\"viewAssignmentRow('${safeViewId}')\"><i class=\"fas fa-eye\"></i> View</button>`;\n\n      // Complete only enabled when we have a real request ID\n      let btnComplete='';\n      if(st!=='completed'&&st!=='rejected'){\n        if(hasRequestId){\n          const safeReqId=requestId.replace(/'/g,\"\\\\'\");\n          btnComplete=`<button class=\"btn btn-sm btn-success\" onclick=\"completeAssignmentRow('${safeReqId}')\"><i class=\"fas fa-check\"></i> Complete</button>`;\n        } else {\n          btnComplete=`<button class=\"btn btn-sm btn-success\" disabled title=\"No request ID available\">Complete</button>`;\n        }\n      }\n\n      return `<tr>\n        <td class=\"fw700\" style=\"color:var(--text)\">${scoutName}</td>\n        <td class=\"mono\" style=\"font-weight:700;color:var(--gold);font-size:.75rem\">${displayId}</td>\n        <td style=\"color:var(--text2)\">${entityName}</td>\n        <td class=\"text-sm text-muted\">${venue}</td>\n        <td class=\"text-sm\">${matchDate}</td>\n        <td>${statusBadge}</td>\n        <td><div class=\"gap-sm\">${btnView}${btnComplete}</div></td>\n      </tr>`;\n    }).join('');\n\n    renderPager('assignments-pager',_asgnPage,Math.ceil((d.total||list.length)/PAGE_SIZE),function(p){_asgnPage=p;loadAssignments();});\n  }catch(e){ tbody.innerHTML=`<tr><td colspan=\"7\" class=\"text-danger text-sm\" style=\"padding:1rem\">Error: ${e.message}</td></tr>`; }\n}\n\n// ═══════════════════════════════════════════════════════════\n// BACKGROUND CHECKS\n// ═══════════════════════════════════════════════════════════\n// ─── REPLACE loadBgChecks ENTIRELY ───────────────────────────────────────\nasync function loadBgChecks() {\n  const container = document.getElementById('bgc-container');\n  if (container) container.innerHTML = '<div class=\"loading\"><span class=\"spinner\"></span> Loading…</div>';\n\n  try {\n    const status = (document.getElementById('bgc-status') || {}).value || '';\n    const qs     = new URLSearchParams({ page: _bgcPage, limit: PAGE_SIZE });\n    if (status) qs.set('status', status);\n\n    const d    = await api('GET', `/api/admin/background-checks?${qs}`)\n                   .catch(() => api('GET', `/api/admin/users?bgcheck=true&${qs}`));\n    const list = d.checks || d.background_checks || d.users || [];\n\n    if (!list.length) {\n      if (container) container.innerHTML = '<div class=\"empty\"><i class=\"fas fa-user-check\"></i><p>No background check records found.</p></div>';\n      return;\n    }\n\n    const html = `<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem\">\n      ${list.map(renderBgCheckCard).join('')}\n    </div>`;\n    if (container) container.innerHTML = html;\n    renderPager('bgc-pager', _bgcPage, Math.ceil((d.total || list.length) / PAGE_SIZE),\n      function(p) { _bgcPage = p; loadBgChecks(); });\n  } catch (e) {\n    if (container) container.innerHTML = `<div class=\"empty text-danger\"><i class=\"fas fa-exclamation-triangle\"></i><p>Error: ${e.message}</p></div>`;\n  }\n}\n\n// ─── ADD THIS NEW FUNCTION (place directly after loadBgChecks) ────────────\nfunction renderBgCheckCard(b) {\n  const uid      = b.user_id || b.dco_id || b.scout_id || b._id || '—';\n  const name     = b.user_name || b.name || '—';\n  const role     = (b.user_type || b.role || 'scout').toLowerCase();\n  const roleColor = role === 'dco' ? 'var(--warning)' : role === 'supervisor' ? 'var(--info)' : 'var(--success)';\n  const st       = b.status || 'pending';\n  const isPending = st === 'pending' || st === 'submitted';\n  const stBadge  = st === 'approved' || st === 'passed' ? 'active'\n                 : st === 'rejected' || st === 'failed'  ? 'danger'\n                 : 'warning';\n\n  const docDetails = [\n    b.document_type   ? `<div><div class=\"text-muted\" style=\"font-size:.66rem;margin-bottom:.12rem\">Document Type</div><div class=\"text-sm\">${b.document_type}</div></div>` : '',\n    b.document_number ? `<div><div class=\"text-muted\" style=\"font-size:.66rem;margin-bottom:.12rem\">Doc Number</div><div class=\"mono text-sm\">${b.document_number}</div></div>` : '',\n    b.bg_check_reject_reason || b.rejection_reason\n      ? `<div style=\"grid-column:1/-1\"><div class=\"text-muted\" style=\"font-size:.66rem;margin-bottom:.12rem\">Rejection Reason</div><div class=\"text-danger text-sm\">${b.bg_check_reject_reason || b.rejection_reason}</div></div>`\n      : '',\n  ].join('');\n\n  const actions = isPending\n    ? `<button class=\"btn btn-sm btn-success\" onclick=\"bgcAction('${uid}','approve')\"><i class=\"fas fa-check\"></i> Approve</button>\n       <button class=\"btn btn-sm btn-danger\"  onclick=\"bgcAction('${uid}','reject')\"><i class=\"fas fa-times\"></i> Reject</button>`\n    : `<span class=\"text-muted text-sm\" style=\"padding:.35rem 0\">Processed  �� ${st}</span>`;\n\n  return `\n    <div class=\"pmt-card\" style=\"border-left:3px solid ${roleColor}\">\n      <div class=\"pmt-card-hdr\">\n        <div class=\"pmt-card-hdr-left\">\n          <i class=\"fas fa-user-shield\" style=\"color:${roleColor};font-size:.85rem\"></i>\n          <span class=\"fw700 text-sm\" style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${name}</span>\n        </div>\n        <div class=\"pmt-card-hdr-right\">\n          <span class=\"badge\" style=\"background:${roleColor}22;color:${roleColor};border:1px solid ${roleColor}55;font-size:.62rem;text-transform:capitalize\">${role}</span>\n          <span class=\"badge badge-${stBadge}\">${st.charAt(0).toUpperCase() + st.slice(1)}</span>\n        </div>\n      </div>\n      <div class=\"pmt-card-body\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:.45rem .75rem;font-size:.78rem\">\n          <div style=\"grid-column:1/-1\">\n            <div class=\"text-muted\" style=\"font-size:.66rem;margin-bottom:.12rem\">User ID</div>\n            <div class=\"mono fw700\">${uid}</div>\n
