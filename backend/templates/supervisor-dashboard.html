<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnejiStats — Supervisor Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://unpkg.com/preact@10.19.3/dist/preact.umd.js"></script>
  <script src="https://unpkg.com/preact@10.19.3/hooks/dist/hooks.umd.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <style>
    @media print {
      .sidebar, .dashboard-header, .sidebar-overlay, .no-print { display:none !important; }
      .main-content { margin-left:0 !important; }
      .page-content { max-width:100% !important; padding:0.5rem !important; }
      .card { box-shadow:none !important; border:1px solid #ccc !important; break-inside:avoid; }
      body { background:#fff !important; color:#000 !important; }
    }
    :root {
      --primary: #004aad;
      --secondary: #0066cc;
      --success: #28a745;
      --danger: #dc3545;
      --warning: #ffc107;
      --info: #17a2b8;
      --dark: #1e1e2f;
      --light: #f8f9fa;
      --gray: #6c757d;
      --border: #dee2e6;
      --gold: #ffd700;
      --card-shadow: 0 2px 8px rgba(0,0,0,0.1);
      --transition: all 0.2s ease;
      --sidebar-width: 260px;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#f0f2f5; color:#333; min-height:100vh; }
    a { color:var(--primary); text-decoration:none; }
    a:hover { text-decoration:underline; }
    button:focus,input:focus,select:focus,textarea:focus { outline:none; }
    select { appearance:auto; }

    .app-layout { display:flex; min-height:100vh; }
    .sidebar {
      width:var(--sidebar-width); background:var(--dark); color:white;
      display:flex; flex-direction:column; position:fixed; left:0; top:0; bottom:0;
      z-index:1000; overflow-y:auto; overflow-x:hidden;
    }
    .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999; }
    .sidebar-overlay.active { display:block; }
    .sidebar-header {
      padding:1.2rem 1rem; background:linear-gradient(135deg,#1e1e2f,#004aad);
      border-bottom:1px solid rgba(255,255,255,0.1); flex-shrink:0;
    }
    .sidebar-brand { display:flex; align-items:center; gap:8px; margin-bottom:1rem; }
    .sidebar-user { display:flex; align-items:center; gap:10px; }
    .sidebar-avatar {
      width:52px; height:52px; border-radius:50%; border:2px solid var(--gold);
      background:var(--primary); display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:1.1rem; color:white; flex-shrink:0; overflow:hidden;
    }
    .sidebar-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .sidebar-user-info { flex:1; min-width:0; }
    .sidebar-user-name { font-weight:700; font-size:0.9rem; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sidebar-role-badge {
      display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.66rem;
      font-weight:700; margin-top:3px; background:rgba(255,215,0,0.2); color:var(--gold); border:1px solid rgba(255,215,0,0.35);
    }
    .sidebar-tier-section { padding:0.6rem 1rem; border-bottom:1px solid rgba(255,255,255,0.08); }
    .tier-badge-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; }
    .tier-badge { padding:2px 10px; border-radius:10px; font-size:0.68rem; font-weight:700; background:linear-gradient(135deg,var(--gold),#f0a500); color:#1a1a1a; }
    .tier-progress-bar { height:5px; background:rgba(255,255,255,0.15); border-radius:3px; overflow:hidden; margin-top:3px; }
    .tier-progress-fill { height:100%; background:var(--gold); border-radius:3px; transition:width 0.4s ease; }
    .tier-progress-label { font-size:0.62rem; color:rgba(255,255,255,0.5); margin-top:3px; }
    .sidebar-meta { padding:0.5rem 1rem 0; font-size:0.7rem; color:rgba(255,255,255,0.55); }
    .sidebar-meta-item { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
    .sidebar-meta-item i { width:14px; text-align:center; color:var(--gold); flex-shrink:0; }
    .sidebar-meta-val { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .toggle-switch { position:relative; width:40px; height:22px; flex-shrink:0; }
    .toggle-switch input { opacity:0; width:0; height:0; }
    .toggle-slider { position:absolute; inset:0; background:#555; border-radius:22px; cursor:pointer; transition:0.3s; }
    .toggle-slider::before { content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:white; left:3px; bottom:3px; transition:0.3s; }
    .toggle-switch input:checked + .toggle-slider { background:var(--success); }
    .toggle-switch input:checked + .toggle-slider::before { transform:translateX(18px); }
    .sidebar-nav { flex:1; padding:0.6rem 0; }
    .nav-item {
      display:flex; align-items:center; gap:10px; padding:0.7rem 1rem; cursor:pointer;
      transition:var(--transition); color:rgba(255,255,255,0.72); font-size:0.84rem;
      position:relative; border-left:3px solid transparent;
    }
    .nav-item:hover { background:rgba(255,255,255,0.07); color:white; }
    .nav-item.active { background:rgba(0,74,173,0.35); color:white; border-left-color:var(--gold); }
    .nav-item i { width:18px; text-align:center; font-size:0.92rem; flex-shrink:0; }
    .nav-item-label { flex:1; }
    .nav-badge { background:var(--danger); color:white; border-radius:10px; font-size:0.65rem; font-weight:700; padding:1px 6px; min-width:18px; text-align:center; }
    .nav-separator { height:1px; background:rgba(255,255,255,0.07); margin:0.5rem 0; }

    .main-content { flex:1; display:flex; flex-direction:column; min-height:100vh; margin-left:var(--sidebar-width); }
    .dashboard-header {
      background:linear-gradient(135deg,var(--dark),var(--primary));
      color:white; padding:0.85rem 1.5rem;
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:900; box-shadow:0 2px 8px rgba(0,0,0,0.25);
    }
    .header-left { display:flex; align-items:center; gap:10px; }
    .hamburger-btn { background:transparent; border:none; color:white; font-size:1.2rem; cursor:pointer; padding:4px 8px; border-radius:5px; transition:var(--transition); display:none; }
    .hamburger-btn:hover { background:rgba(255,255,255,0.12); }
    .header-logo { font-weight:800; font-size:1.2rem; color:white; }
    .header-subtitle { font-size:0.8rem; opacity:0.75; margin-left:4px; }
    .header-right { display:flex; align-items:center; gap:0.75rem; }
    .header-logout-btn { background:rgba(220,53,69,0.18); border:1px solid rgba(220,53,69,0.4); color:white; padding:5px 10px; border-radius:5px; cursor:pointer; font-size:0.78rem; transition:var(--transition); display:flex; align-items:center; gap:5px; }
    .header-logout-btn:hover { background:rgba(220,53,69,0.35); }
    .page-content { flex:1; max-width:1200px; margin:0 auto; width:100%; box-sizing:border-box; }

    .section-title { font-size:1.2rem; font-weight:700; color:var(--primary); margin-bottom:1.2rem; display:flex; align-items:center; gap:8px; padding-bottom:0.5rem; border-bottom:2px solid rgba(0,74,173,0.15); }
    .card { background:white; border-radius:10px; box-shadow:var(--card-shadow); padding:1.5rem; margin-bottom:1.5rem; }
    .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.2rem; padding-bottom:0.75rem; border-bottom:1px solid var(--border); }
    .card-title { font-size:1rem; font-weight:700; color:var(--primary); display:flex; align-items:center; gap:8px; }
    .metrics-grid { display:grid; gap:1rem; margin-bottom:1.5rem; grid-template-columns:repeat(2,1fr); }
    .metric-card { background:white; border-radius:10px; box-shadow:var(--card-shadow); padding:1.2rem; text-align:center; transition:var(--transition); }
    .metric-card:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,0.12); }
    .metric-icon { font-size:1.4rem; margin-bottom:6px; }
    .metric-value { font-size:1.8rem; font-weight:700; margin:6px 0; color:var(--primary); }
    .metric-label { font-size:0.8rem; color:var(--gray); }

    .profile-hero { display:flex; align-items:flex-start; gap:1.5rem; padding:1.5rem; background:linear-gradient(135deg,var(--dark),var(--primary)); border-radius:12px; color:white; margin-bottom:1.5rem; flex-wrap:wrap; }
    .profile-photo-wrap { position:relative; flex-shrink:0; }
    .profile-photo { width:100px; height:100px; border-radius:50%; border:3px solid var(--gold); background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:2.2rem; font-weight:700; color:white; }
    .profile-photo-change { position:absolute; bottom:0; right:0; width:28px; height:28px; background:var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:0.7rem; color:#1a1a1a; border:2px solid white; }
    .profile-photo-change input { display:none; }
    .profile-info { flex:1; min-width:200px; }
    .profile-name { font-size:1.5rem; font-weight:800; margin-bottom:4px; }
    .profile-id-badge { display:inline-block; padding:3px 10px; background:rgba(255,215,0,0.2); border:1px solid rgba(255,215,0,0.4); border-radius:10px; font-size:0.72rem; color:var(--gold); font-weight:700; margin-bottom:8px; }
    .profile-badges { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
    .profile-badge { padding:3px 10px; border-radius:10px; font-size:0.72rem; font-weight:600; background:rgba(255,255,255,0.15); color:rgba(255,255,255,0.9); }
    .profile-badge.gold { background:rgba(255,215,0,0.2); color:var(--gold); }
    .profile-fields-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .profile-field { margin-bottom:0; }
    .profile-field-label { font-size:0.75rem; color:var(--gray); font-weight:600; margin-bottom:3px; text-transform:uppercase; letter-spacing:0.03em; }
    .profile-field-value { font-size:0.92rem; font-weight:600; color:var(--dark); }
    .profile-field-input { width:100%; padding:8px 10px; border:1.5px solid var(--border); border-radius:6px; font-size:0.88rem; transition:var(--transition); }
    .profile-field-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(0,74,173,0.1); }
    .withdrawal-card { border:2px solid var(--primary); border-radius:10px; padding:1.2rem; margin-top:1.2rem; }
    .withdrawal-card-title { font-size:0.92rem; font-weight:700; color:var(--primary); margin-bottom:1rem; display:flex; align-items:center; gap:7px; }
    .accuracy-bar-wrap { margin-top:6px; }
    .accuracy-bar { height:8px; background:#e9ecef; border-radius:4px; overflow:hidden; }
    .accuracy-fill { height:100%; border-radius:4px; transition:width 0.4s; }

    .registration-label { display:block; font-weight:600; color:var(--dark); margin-bottom:5px; font-size:0.88rem; }
    .registration-input { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:7px; font-size:0.9rem; transition:var(--transition); }
    .registration-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(0,74,173,0.1); }
    .registration-select { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:7px; font-size:0.9rem; background:white; transition:var(--transition); cursor:pointer; }
    .field-wrapper { margin-bottom:1rem; }

    .btn { padding:0.38rem 0.85rem; border:none; border-radius:5px; font-weight:600; cursor:pointer; transition:var(--transition); display:inline-flex; align-items:center; gap:4px; font-size:0.78rem; }
    .btn-primary { background:var(--primary); color:white; }
    .btn-success { background:var(--success); color:white; }
    .btn-danger { background:var(--danger); color:white; }
    .btn-warning { background:var(--warning); color:#333; }
    .btn-info { background:var(--info); color:white; }
    .btn-secondary { background:#6c757d; color:white; }
    .btn-sm { padding:0.28rem 0.65rem; font-size:0.72rem; }
    .btn-primary:hover { background:var(--secondary); }
    .btn-success:hover { background:#1e7e34; }
    .btn-danger:hover { background:#bd2130; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }

    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:5000; align-items:center; justify-content:center; padding:1rem; }
    .modal-overlay.active { display:flex; }
    .modal { background:white; border-radius:12px; width:92%; max-width:560px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.35); }
    .modal-header { background:linear-gradient(135deg,var(--dark),var(--primary)); color:white; padding:1rem 1.5rem; border-radius:12px 12px 0 0; display:flex; align-items:center; justify-content:space-between; }
    .modal-header h3 { font-size:1rem; font-weight:700; margin:0; display:flex; align-items:center; gap:8px; }
    .modal-close { background:transparent; border:none; color:rgba(255,255,255,0.8); cursor:pointer; font-size:1.4rem; line-height:1; }
    .modal-close:hover { color:white; }
    .modal-body { padding:1.5rem; }
    .modal-footer { padding:1rem 1.5rem; border-top:1px solid var(--border); display:flex; gap:0.75rem; justify-content:flex-end; }
    .modal-btn { padding:9px 18px; border:none; border-radius:7px; cursor:pointer; font-weight:600; font-size:0.88rem; transition:var(--transition); display:flex; align-items:center; gap:6px; }
    .modal-btn.primary { background:var(--primary); color:white; }
    .modal-btn.primary:hover { background:var(--secondary); }
    .modal-btn.secondary { background:#e9ecef; color:#333; }
    .modal-btn.success { background:var(--success); color:white; }
    .modal-btn.danger { background:var(--danger); color:white; }
    .modal-btn:disabled { opacity:0.5; cursor:not-allowed; }

    .loading-spinner { width:20px; height:20px; border:3px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .empty-state { text-align:center; padding:3rem 2rem; color:var(--gray); }
    .empty-state i { font-size:3rem; margin-bottom:1rem; opacity:0.4; display:block; }
    .empty-state p { font-size:0.95rem; }

    .widget-notification { position:fixed; top:70px; left:50%; transform:translateX(-50%); padding:12px 20px; border-radius:8px; color:white; font-weight:600; font-size:0.85rem; z-index:9990; display:flex; align-items:center; box-shadow:0 4px 15px rgba(0,0,0,0.2); animation:slideIn 0.3s ease; max-width:420px; min-width:260px; }
    .widget-notification.success { background:var(--success); }
    .widget-notification.error { background:var(--danger); }
    .widget-notification.warning { background:var(--warning); color:#333; }
    .widget-notification.info { background:var(--info); }
    @keyframes slideIn { from { opacity:0; top:60px; } to { opacity:1; top:70px; } }

    .status-badge { display:inline-block; padding:3px 9px; border-radius:10px; font-size:0.72rem; font-weight:700; }
    .badge-success { background:#edf7ed; color:var(--success); }
    .badge-danger { background:#fdf0f0; color:var(--danger); }
    .badge-warning { background:#fff8e1; color:#856404; }
    .badge-info { background:#e8f4f8; color:var(--info); }
    .badge-primary { background:#e8edf8; color:var(--primary); }
    .badge-gray { background:#f1f3f5; color:var(--gray); }

    .data-table { width:100%; border-collapse:collapse; }
    .data-table th { background:var(--primary); color:white; padding:0.75rem 1rem; text-align:left; font-size:0.82rem; font-weight:600; }
    .data-table td { padding:0.75rem 1rem; border-bottom:1px solid var(--border); font-size:0.85rem; vertical-align:middle; }
    .data-table tr:hover { background:#f8f9fa; }
    .table-scroll { overflow-x:auto; }
    .filter-bar { display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center; margin-bottom:1.2rem; }
    .filter-input { padding:7px 12px; border:1.5px solid var(--border); border-radius:7px; font-size:0.85rem; flex:1; min-width:180px; transition:var(--transition); }
    .filter-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(0,74,173,0.1); }
    .filter-select { padding:7px 12px; border:1.5px solid var(--border); border-radius:7px; font-size:0.85rem; background:white; cursor:pointer; }

    .dco-card { background:white; border-radius:10px; box-shadow:var(--card-shadow); padding:1.2rem; margin-bottom:1rem; border-left:4px solid var(--primary); display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
    .dco-card-avatar { width:50px; height:50px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.1rem; color:white; flex-shrink:0; overflow:hidden; }
    .dco-card-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .dco-card-info { flex:1; min-width:120px; }
    .dco-card-name { font-weight:700; font-size:0.95rem; color:var(--dark); }
    .dco-card-meta { font-size:0.78rem; color:var(--gray); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; }
    .online-dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }
    .online-dot.online { background:var(--success); box-shadow:0 0 0 2px rgba(40,167,69,0.3); }
    .online-dot.offline { background:var(--gray); }

    .assignment-card { background:white; border-radius:10px; box-shadow:var(--card-shadow); padding:1.2rem; margin-bottom:1rem; border-left:4px solid var(--primary); }
    .assignment-card.pending { border-left-color:var(--warning); }
    .assignment-card.assigned { border-left-color:var(--info); }
    .assignment-card.completed { border-left-color:var(--success); }

    .live-monitor-card { background:white; border-radius:10px; box-shadow:var(--card-shadow); padding:1.2rem; margin-bottom:1rem; border:2px solid var(--success); position:relative; }
    .live-pulse { width:10px; height:10px; border-radius:50%; background:var(--success); position:absolute; top:12px; right:12px; animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.5; transform:scale(1.3); } }

    .submission-review-card { background:white; border-radius:10px; box-shadow:var(--card-shadow); padding:1.2rem; margin-bottom:1rem; }
    .stat-review-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0.75rem; }
    .stat-review-item { background:#f8f9fa; border-radius:8px; padding:0.75rem; }
    .stat-review-label { font-size:0.75rem; font-weight:600; color:var(--gray); margin-bottom:4px; }
    .stat-review-value { font-size:1.1rem; font-weight:700; color:var(--primary); }
    .stat-review-input { width:100%; padding:4px 6px; border:1px solid var(--border); border-radius:4px; font-size:0.88rem; font-weight:700; color:var(--primary); text-align:center; }

    .earnings-summary { background:linear-gradient(135deg,var(--dark),var(--primary)); border-radius:12px; padding:1.5rem; color:white; margin-bottom:1.5rem; }
    .earnings-label { font-size:0.82rem; opacity:0.75; margin-bottom:4px; }
    .earnings-total { font-size:2.2rem; font-weight:800; color:var(--gold); margin-bottom:1rem; }
    .earnings-breakdown { display:grid; grid-template-columns:repeat(2,1fr); gap:0.75rem; }
    .earnings-item { background:rgba(255,255,255,0.1); border-radius:8px; padding:0.7rem; text-align:center; }
    .earnings-item-val { font-weight:700; font-size:0.95rem; color:var(--gold); }
    .earnings-item-lbl { font-size:0.72rem; opacity:0.8; margin-top:2px; }

    .notif-item { display:flex; align-items:flex-start; gap:0.75rem; padding:1rem 1.2rem; border-bottom:1px solid var(--border); cursor:pointer; transition:var(--transition); }
    .notif-item:hover { background:#f8f9fa; }
    .notif-item.unread { background:#f0f4ff; }
    .notif-icon { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.9rem; flex-shrink:0; }
    .notif-icon.blue { background:#e8edf8; color:var(--primary); }
    .notif-icon.green { background:#edf7ed; color:var(--success); }
    .notif-icon.red { background:#fdf0f0; color:var(--danger); }
    .notif-icon.yellow { background:#fff8e1; color:#856404; }
    .notif-icon.purple { background:#f3f0ff; color:#6f42c1; }
    .notif-body { flex:1; min-width:0; }
    .notif-title { font-weight:700; font-size:0.88rem; margin-bottom:3px; }
    .notif-msg { font-size:0.82rem; color:var(--gray); }
    .notif-time { font-size:0.72rem; color:var(--gray); flex-shrink:0; }

    .chat-container { border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .chat-header { background:var(--primary); color:white; padding:0.75rem 1rem; font-weight:700; font-size:0.88rem; }
    .chat-messages { height:350px; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:0.5rem; }
    .chat-bubble { max-width:75%; padding:0.6rem 0.85rem; border-radius:12px; font-size:0.85rem; }
    .chat-bubble.sent { background:var(--primary); color:white; align-self:flex-end; border-radius:12px 12px 2px 12px; }
    .chat-bubble.received { background:#f1f3f5; color:#333; align-self:flex-start; border-radius:12px 12px 12px 2px; }
    .chat-bubble-time { font-size:0.65rem; opacity:0.7; margin-top:3px; }
    .chat-input-row { display:flex; gap:0.5rem; padding:0.75rem; border-top:1px solid var(--border); background:#f8f9fa; }

<script>
'use strict';
const { h, render, Fragment } = preact;
const { useState, useEffect, useRef, useCallback } = preactHooks;
const html = htm.bind(h);

/* ════════ API CONFIG — Supervisor (all role-specific calls use /api/supervisor/ prefix) ════════ */
const API_CONFIG = {
  authMe:                  '/api/auth/me',
  supProfile:              (id) => `/api/supervisor/${id}/profile`,
  supPhoto:                (id) => `/api/supervisor/${id}/photo`,

  supUpdateAssignment:     (id, aid) => `/api/supervisor/${id}/assignments/${aid}`,
  supDeleteAssignment:     (id, aid) => `/api/supervisor/${id}/assignments/${aid}/delete`,
  supChatThreads:          (id) => `/api/supervisor/${id}/chat/threads`,
  supChatMessages:         (id, tid) => `/api/supervisor/${id}/chat/threads/${tid}/messages`,
  supChatSend:             (id, tid) => `/api/supervisor/${id}/chat/threads/${tid}/send`,
  support:                 '/api/support/tickets',
  supportChat:             (tid) => `/api/support/chat/${tid}`,
};

/* ════════ TIER RATES (Supervisor) ════════ */
const TIER_RATES_SUP = {
  1:{ Professional:200, 'Semi-professional':150, Other:100, Club:400 },
  2:{ Professional:350, 'Semi-professional':250, Other:150, Club:700 },
  3:{ Professional:500, 'Semi-professional':350, Other:250, Club:1000 }
};

/* ════════ API HELPERS ════════ */
async function apiFetch(endpoint, options = {}) {
  try {
    const storedToken = localStorage.getItem('enejistats_token') || localStorage.getItem('supervisor_token') || localStorage.getItem('token');
    const authHeaders = storedToken ? { 'Authorization': 'Bearer ' + storedToken } : {};
    const response = await fetch(endpoint, { credentials:'include', headers: { ...authHeaders, ...(options.headers || {}) }, ...options });
    if (!response.ok) {
      if (response.status === 401 || response.status === 403) {
        localStorage.clear(); sessionStorage.clear();
        window.location.replace('/login');
        const e = new Error('Session expired'); e.status = response.status; throw e;
      }
      const errorText = await response.text();
      const e = new Error(`HTTP ${response.status}: ${errorText}`); e.status = response.status; throw e;
    }
    if (response.status === 204) return {};
    const responseText = await response.text();
    if (!responseText) return {};
    try { return JSON.parse(responseText); }
    catch { return { raw: responseText }; }
  } catch (error) { if (!error.status) console.error(`API error (${endpoint}):`, error); throw error; }
}
async function apiFetchFormData(endpoint, formData) {
  try {
    const storedToken = localStorage.getItem('enejistats_token') || localStorage.getItem('supervisor_token') || localStorage.getItem('token');
    const authHeaders = storedToken ? { 'Authorization': 'Bearer ' + storedToken } : {};
    const response = await fetch(endpoint, { method:'POST', credentials:'include', headers: authHeaders, body:formData });
    if (!response.ok) { const t = await response.text(); throw new Error(`HTTP ${response.status}: ${t}`); }
    if (response.status === 204) return {};
    const responseText = await response.text();
    if (!responseText) return {};
    try { return JSON.parse(responseText); }
    catch { return { raw: responseText }; }
  } catch (error) { console.error(`API error (${endpoint}):`, error); throw error; }
}

/* ════════ TITLE CASE ════════ */
function toTitleCase(str) {
  if (!str) return '';
  return String(str).replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
}

/* ════════ NOTIFICATIONS ════════ */
function showScoutNotification(message, type = 'info', duration = 5000) {
  document.querySelectorAll('.widget-notification').forEach(el => el.remove());
  const n = document.createElement('div');
  n.className = `widget-notification ${type}`;
  const icons = { error:'exclamation-circle', success:'check-circle', warning:'exclamation-triangle', info:'info-circle' };
  n.innerHTML = `<i class="fas fa-${icons[type]||'info-circle'}"></i><span style="margin-left:10px;flex:1">${message}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;color:white;cursor:pointer;margin-left:10px"><i class="fas fa-times"></i></button>`;
  document.body.appendChild(n);
  setTimeout(() => { if (n.parentElement) n.remove(); }, duration);
}

/* ════════ SUPERVISOR: Overview ════════ */
function SupervisorOverview({ currentUser, setActiveNav }) {
  const [stats, setStats] = useState({dcosCount:0,pendingApprovals:0,totalSubmissions:0,approvalRate:0,activeMatches:0});
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const load = async () => {
      setLoading(true);
      try {
        const p = await apiFetch(API_CONFIG.supPendingApprovals(currentUser.id));
        const d = await apiFetch(API_CONFIG.supDCOs(currentUser.id));
        const hist = await apiFetch(API_CONFIG.supHistory(currentUser.id));
        const dcos = Array.isArray(d)?d:(d.dcos||[]);
        const approvals = Array.isArray(p)?p:(p.submissions||[]);
        const history = Array.isArray(hist)?hist:(hist.submissions||[]);
        const approved = history.filter(s=>s.status==='approved').length;
        setStats({dcosCount:dcos.length,pendingApprovals:approvals.length,totalSubmissions:history.length,approvalRate:history.length?Math.round((approved/history.length)*100):0,activeMatches:dcos.filter(d=>d.status==='online').length});
      } catch { }
      finally { setLoading(false); }
    };
    if(currentUser.id) load();
  },[currentUser.id]);

  const initials = (currentUser.name||'SV').split(' ').map(n=>n[0]).join('').toUpperCase();

  return h('div',null,
    h('div',{className:'section-title'},h('i',{className:'fas fa-home'}),' Supervisor Overview'),
    h('div',{className:'profile-hero'},
      h('div',{className:'profile-photo-wrap'},
        h('div',{className:'profile-photo',style:{width:'80px',height:'80px',backgroundImage:currentUser.photo?`url('${currentUser.photo}')`:undefined,backgroundSize:'cover',backgroundPosition:'center',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'2rem',fontWeight:700,color:'white'}},!currentUser.photo&&initials)
      ),
      h('div',{className:'profile-info'},
        h('div',{className:'profile-name'},currentUser.name||'Supervisor'),
        h('div',{className:'profile-id-badge'},currentUser.supervisor_id||currentUser.scout_id||currentUser.id||'ENJ-SVR-000000'),
        h('div',{className:'profile-badges'},
          h('span',{className:'profile-badge'},'Supervisor'),
          h('span',{className:'profile-badge gold'},`Tier ${currentUser.tier||1}`)
        )
      )
    ),
    h('div',{className:'metrics-grid'},
      h('div',{className:'metric-card'},h('div',{className:'metric-icon',style:{color:'var(--primary)'}},h('i',{className:'fas fa-users'})),h('div',{className:'metric-value'},loading?'…':stats.dcosCount),h('div',{className:'metric-label'},'My DCOs (max 11)')),
      h('div',{className:'metric-card'},h('div',{className:'metric-icon',style:{color:'var(--warning)'}},h('i',{className:'fas fa-hourglass-half'})),h('div',{className:'metric-value'},loading?'…':stats.pendingApprovals),h('div',{className:'metric-label'},'Pending Approvals')),
      h('div',{className:'metric-card'},h('div',{className:'metric-icon',style:{color:'var(--success)'}},h('i',{className:'fas fa-check-double'})),h('div',{className:'metric-value'},loading?'…':stats.approvalRate+'%'),h('div',{className:'metric-label'},'Approval Rate')),
      h('div',{className:'metric-card'},h('div',{className:'metric-icon',style:{color:'var(--info)'}},h('i',{className:'fas fa-broadcast-tower'})),h('div',{className:'metric-value'},loading?'…':stats.activeMatches),h('div',{className:'metric-label'},'Active DCOs')),
      h('div',{className:'metric-card'},h('div',{className:'metric-icon',style:{color:'var(--secondary)'}},h('i',{className:'fas fa-file-alt'})),h('div',{className:'metric-value'},loading?'…':stats.totalSubmissions),h('div',{className:'metric-label'},'Total Submissions'))
    ),
    h('div',{className:'card'},
      h('div',{className:'card-title',style:{marginBottom:'1rem'}},h('i',{className:'fas fa-bolt'}),' Quick Actions'),
      h('div',{style:{display:'flex',gap:'0.75rem',flexWrap:'wrap'}},
        [['fa-users','My DCOs','my-dcos'],['fa-broadcast-tower','Live Monitoring','live-monitoring'],['fa-check-circle','Pending Approvals','pending-approvals'],['fa-history','Submissions History','submissions-history']].map(([icon,label,nav])=>
          h('button',{key:nav,className:'btn btn-primary',style:{padding:'0.65rem 1rem'},onClick:()=>setActiveNav(nav)},h('i',{className:`fas ${icon}`}),` ${label}`)
        )
      )
    )
  );
}

/* ════════ SUPERVISOR: My Profile ════════ */
function SupervisorProfile({ currentUser, setCurrentUser }) {
  const [editMode, setEditMode] = useState(false);
  const [form, setForm] = useState({fullName:currentUser.name||'',phone:currentUser.phone||'',languages:currentUser.languages||''});
  const [saving, setSaving] = useState(false);
  const [bankName, setBankName] = useState('');
  const [accountNumber, setAccountNumber] = useState('');
  const [savingBank, setSavingBank] = useState(false);

  useEffect(() => {
    if (currentUser.id) {
      apiFetch(API_CONFIG.supWithdrawal(currentUser.id)).then(d=>{if(d){setBankName(d.bank_name||'');setAccountNumber(d.account_number||'');}}).catch(()=>{});
    }
  }, [currentUser.id]);

      await apiFetch(API_CONFIG.supProfile(currentUser.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:form.fullName,phone:form.phone,languages:form.languages})});

    try {
      await apiFetch(API_CONFIG.supWithdrawal(currentUser.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({bank_name:bankName,account_number:accountNumber,account_name:currentUser.name})});
      showScoutNotification('Withdrawal account saved!','success');
    } catch(e){showScoutNotification('Save failed: '+e.message,'error');}
    finally{setSavingBank(false);}
  };

  const initials = (currentUser.name||'SV').split(' ').map(n=>n[0]).join('').toUpperCase();
  const tierPct = ((currentUser.tierProgress||0)/100)*100;

  return h('div',null,
    h('div',{className:'section-title'},h('i',{className:'fas fa-user'}),' My Profile'),
    h('div',{className:'profile-hero'},
      h('div',{className:'profile-photo-wrap'},
        h('div',{className:'profile-photo',style:{width:'100px',height:'100px',backgroundImage:currentUser.photo?`url('${currentUser.photo}')`:undefined,backgroundSize:'cover',backgroundPosition:'center',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'2rem',fontWeight:700,color:'white'}},!currentUser.photo&&initials),
        h('label',{className:'profile-photo-change',title:'Change photo'},
          h('input',{type:'file',accept:'image/*',style:{display:'none'},onChange:async e=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('photo',f);try{const r=await apiFetchFormData(API_CONFIG.supPhoto(currentUser.id),fd);setCurrentUser(prev=>({...prev,photo:r.photo_url||r.profileImage||''}));showScoutNotification('Photo updated!','success');}catch(err){showScoutNotification('Photo upload failed','error');}}}),
          h('i',{className:'fas fa-camera'})
        )
      ),

/* ════════ SUPERVISOR: My DCOs ════════ */
function SupervisorDCOs({ currentUser, onViewLiveMonitoring }) {
  const [dcos, setDcos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [addEmail, setAddEmail] = useState('');
  const [adding, setAdding] = useState(false);

  useEffect(() => {
    const load = async () => {
      setLoading(true);
      try {
        const d = await apiFetch(API_CONFIG.supDCOs(currentUser.id));
        setDcos(Array.isArray(d)?d:(d.dcos||[]));
      } catch { }
      finally { setLoading(false); }
    };
    if(currentUser.id) load();
  },[currentUser.id]);

  const addDCO = async () => {
    if(!addEmail.trim()){showScoutNotification('Enter DCO email','warning');return;}
    if(dcos.length>=11){showScoutNotification('Maximum 11 DCOs allowed','error');return;}
    setAdding(true);
    try {
      const resp = await apiFetch(API_CONFIG.supAddDCO(currentUser.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:addEmail.trim()})});
      setDcos(prev=>[...prev,resp.dco||resp]);
      setAddEmail('');
      showScoutNotification('DCO added successfully!','success');
    } catch(e) { showScoutNotification('Failed: '+e.message,'error'); }
    finally { setAdding(false); }
  };

  const removeDCO = async (dco) => {
    const dcoId = dco.dco_id||dco.user_id||dco._id||dco.id;
    const name  = dco.name||dco.full_name||'this DCO';
    if(!confirm(`Remove ${name} from your team?`)) return;
    try {
      await apiFetch(API_CONFIG.supRemoveDCO(currentUser.id, dcoId),{method:'DELETE'});
      setDcos(prev=>prev.filter(d=>(d.dco_id||d.user_id||d._id||d.id)!==dcoId));
      showScoutNotification('DCO removed','success');
    } catch(e) { showScoutNotification('Failed: '+e.message,'error'); }
  };

  if(loading) return h('div',{className:'empty-state'},h('div',{className:'loading-spinner',style:{width:'40px',height:'40px',margin:'0 auto 1rem',border:'3px solid rgba(0,74,173,0.3)',borderTopColor:'var(--primary)'}}),h('div',null,'Loading DCOs...'));

  return h('div',null,
    h('div',{className:'section-title'},h('i',{className:'fas fa-users'}),' My DCOs (',dcos.length,' / 11)'),
    h('div',{className:'card',style:{marginBottom:'1.5rem'}},
      h('div',{className:'card-title',style:{marginBottom:'1rem'}},h('i',{className:'fas fa-user-plus'}),' Add DCO by Email'),
      h('div',{style:{display:'flex',gap:'0.75rem',flexWrap:'wrap'}},
        h('input',{className:'filter-input',type:'email',placeholder:'Enter DCO email address...',value:addEmail,onInput:e=>setAddEmail(e.target.value),onKeyDown:e=>e.key==='Enter'&&addDCO(),style:{flex:'1',minWidth:'200px'}}),
        h('button',{className:'btn btn-primary',onClick:addDCO,disabled:adding||!addEmail.trim()||dcos.length>=11},
          adding?'Adding...':h(Fragment,null,h('i',{className:'fas fa-plus'}),' Add DCO')
        )
      ),
      dcos.length>=11&&h('div',{style:{fontSize:'0.82rem',color:'var(--warning)',marginTop:'0.5rem'}},h('i',{className:'fas fa-exclamation-triangle'}),' Maximum 11 DCOs reached.')
    ),
    dcos.length===0
      ?h('div',{className:'empty-state'},h('i',{className:'fas fa-users'}),h('p',null,'No DCOs in your team yet.'))
      :dcos.map(dco=>{
          const id=dco._id||dco.id;
          const initials=(dco.name||dco.full_name||'DC').split(' ').map(n=>n[0]).join('').toUpperCase();
          const isOnline=dco.status==='online'||dco.is_online;
          return h('div',{key:id,className:'dco-card'},
            h('div',{className:'dco-card-avatar'},
              dco.photo?h('img',{src:dco.photo,alt:dco.name}):initials
            ),
            h('div',{className:'dco-card-info'},
              h('div',{className:'dco-card-name'},
                h('span',{className:'online-dot '+(isOnline?'online':'offline'),style:{marginRight:'6px'}}),
                dco.name||dco.full_name||'DCO'
              ),
              h('div',{className:'dco-card-meta'},
                h('span',null,dco.dco_id||dco.scout_id||dco.user_id||id.slice(-6)),
                h('span',null,'Tier '+(dco.tier||1)),
                h('span',null,'Accuracy: '+(dco.accuracyScore||dco.accuracy_score||0)+'%'),
                h('span',null,isOnline?'Online':'Offline')
              )
            ),
            h('div',{style:{display:'flex',gap:'0.5rem',flexWrap:'wrap',marginLeft:'auto'}},
              h('button',{className:'btn btn-info btn-sm',onClick:onViewLiveMonitoring},h('i',{className:'fas fa-broadcast-tower'}),' Monitor'),
              h('button',{className:'btn btn-danger btn-sm',onClick:()=>removeDCO(dco)},h('i',{className:'fas fa-user-minus'}),' Remove')
            )
          );
        })
  );
}

/* ════════ SUPERVISOR: Live Monitoring ════════ */
function LiveMonitoring({ currentUser }) {
  const [liveData, setLiveData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [lastUpdated, setLastUpdated] = useState(null);

  const fetchLive = useCallback(async () => {
    try {
      const d = await apiFetch(API_CONFIG.supLiveMonitor(currentUser.id));
      setLiveData(Array.isArray(d)?d:(d.live||[]));
      setLastUpdated(new Date());
    } catch { }
    finally { setLoading(false); }
  }, [currentUser.id]);

  useEffect(() => {

function SubmissionsHistory({ currentUser }) {
  const [submissions, setSubmissions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');

  useEffect(() => {
    const load = async () => {
      setLoading(true);
      try {
        const d = await apiFetch(API_CONFIG.supHistory(currentUser.id));
        setSubmissions(Array.isArray(d)?d:(d.submissions||[]));
      } catch { }
      finally { setLoading(false); }
    };
    if(currentUser.id) load();
  },[currentUser.id]);

  const filtered = submissions.filter(s=>{
    const statusOk = filter==='all'||s.status===filter;
    const searchOk = !searchTerm||[s.homeTeam||s.home_team,s.awayTeam||s.away_team,s.playerName||s.player_name,s.dcoName||s.dco_name,s.clubName||s.club_name].some(f=>(f||'').toLowerCase().includes(searchTerm.toLowerCase()));
    return statusOk&&searchOk;
  });

  const statusBadge = (status) => {
    const map = {approved:'badge-success',rejected:'badge-danger',resubmit_required:'badge-warning',pending_approval:'badge-warning',saved_directly:'badge-info'};
    return h('span',{className:`status-badge ${map[status]||'badge-gray'}`},status?.replace(/_/g,' ')||'unknown');
  };

  if(loading) return h('div',{className:'empty-state'},h('div',{className:'loading-spinner',style:{width:'40px',height:'40px',margin:'0 auto 1rem',border:'3px solid rgba(0,74,173,0.3)',borderTopColor:'var(--primary)'}}),h('div',null,'Loading history...'));

  return h('div',null,
    h('div',{className:'section-title'},h('i',{className:'fas fa-history'}),' Submissions History (',submissions.length,')'),
    h('div',{className:'filter-bar'},
      h('input',{className:'filter-input',placeholder:'Search by match, player, DCO...',value:searchTerm,onInput:e=>setSearchTerm(e.target.value)}),
      h('select',{className:'filter-select',value:filter,onChange:e=>setFilter(e.target.value)},
        h('option',{value:'all'},'All Statuses'),
        h('option',{value:'approved'},'Approved'),
        h('option',{value:'rejected'},'Rejected'),
        h('option',{value:'pending_approval'},'Pending'),
        h('option',{value:'resubmit_required'},'Resubmit Required')
      )
    ),
    filtered.length===0
      ?h('div',{className:'empty-state'},h('i',{className:'fas fa-search'}),h('p',null,'No submissions found.'))
      :h('div',{className:'table-scroll'},
          h('table',{className:'data-table'},
            h('thead',null,h('tr',null,['Match','Date','Player/Club','Position','Level','Competition','DCO','Status'].map(t=>h('th',{key:t},t)))),
            h('tbody',null,
              filtered.map(sub=>{
                const id=sub._id||sub.id;
                const matchStr=[sub.homeTeam||sub.home_team,sub.awayTeam||sub.away_team].filter(Boolean).join(' vs ');
                const playerName=toTitleCase(sub.playerName||sub.player_name||sub.clubName||sub.club_name||'');
                const subPos=toTitleCase(sub.position||'');
                const subLvl=toTitleCase(sub.playerLevel||sub.player_level||sub.category||'');
                const subComp=toTitleCase(sub.competition||sub.matchType||sub.match_type||'');
                const subDco=toTitleCase(sub.dcoName||sub.dco_name||'');
                return h('tr',{key:id},
                  h('td',{style:{fontWeight:600}},matchStr||'—'),
                  h('td',null,(sub.matchDate||sub.match_date||sub.submitted_at)?new Date(sub.matchDate||sub.match_date||sub.submitted_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—'),
                  h('td',null,playerName||'—'),

/* ════════ SUPERVISOR: Payout & Earnings ════════ */
function SupervisorPayout({ currentUser }) {
  const [earnings, setEarnings] = useState(null);
  const [payoutHistory, setPayoutHistory] = useState([]);
  const [loading, setLoading] = useState(true);
  const [requesting, setRequesting] = useState(false);
  const [withdrawal, setWithdrawal] = useState(null);

  useEffect(()=>{
    const load=async()=>{
      setLoading(true);
      try{
        const[e,p,w]=await Promise.allSettled([apiFetch(API_CONFIG.supEarnings(currentUser.id)),apiFetch(API_CONFIG.supPayout(currentUser.id)),apiFetch(API_CONFIG.supWithdrawal(currentUser.id))]);
        if(e.status==='fulfilled') setEarnings(e.value);
        if(p.status==='fulfilled') setPayoutHistory(Array.isArray(p.value)?p.value:(p.value?.requests||[]));
        if(w.status==='fulfilled') setWithdrawal(w.value);
      }catch{}
      finally{setLoading(false);}
    };
    if(currentUser.id) load();
  },[currentUser.id]);

  const requestPayout=async()=>{
    if(!earnings?.pending_amount||earnings.pending_amount===0){showScoutNotification('No pending earnings','warning');return;}
    if(!withdrawal?.account_number){showScoutNotification('Please save withdrawal account first','warning');return;}
    if(!confirm(`Request payout of ₦${earnings.pending_amount?.toLocaleString()}?`)) return;
    setRequesting(true);
    try{
      await apiFetch(API_CONFIG.supPayout(currentUser.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:earnings.pending_amount})});
      showScoutNotification('Payout request submitted!','success');
    }catch(e){showScoutNotification('Failed: '+e.message,'error');}
    finally{setRequesting(false);}
  };

  if(loading) return h('div',{className:'empty-state'},h('div',{className:'loading-spinner',style:{width:'40px',height:'40px',margin:'0 auto 1rem',border:'3px solid rgba(0,74,173,0.3)',borderTopColor:'var(--primary)'}}),h('div',null,'Loading earnings...'));

    h('div',{className:'section-title'},h('i',{className:'fas fa-wallet'}),' Payout & Earnings'),

      h('div',{className:'earnings-label'},'Total Pending Payout (Supervisor)'),

      h('div',{className:'earnings-breakdown'},
        [['Pro DCO Player','₦'+rates.Professional+'/player'],['Semi-Pro DCO','₦'+rates['Semi-professional']+'/player'],['Other DCO','₦'+rates.Other+'/player'],['Club Match','₦'+rates.Club+'/match']].map(([l,r])=>
          h('div',{key:l,className:'earnings-item'},h('div',{className:'earnings-item-val'},r),h('div',{className:'earnings-item-lbl'},l+' (Tier '+tier+')'))
        )

      h('div',{className:'card-title',style:{marginBottom:'0.75rem'}},h('i',{className:'fas fa-university'}),' Withdrawal Account'),
      h('div',{style:{fontSize:'0.88rem'}},
        h('div',null,h('strong',null,'Bank: '),withdrawal.bank_name||'—'),
        h('div',null,h('strong',null,'Account Number: '),withdrawal.account_number||'—'),
        h('div',null,h('strong',null,'Account Name: '),currentUser.name||'—')
      )
    ),
    h('div',{style:{marginBottom:'1.5rem'}},
      h('button',{className:'btn btn-success',style:{padding:'0.75rem 1.5rem'},onClick:requestPayout,disabled:requesting||!earnings?.pending_amount},

      )
    ),
    (earnings?.activities||[]).length>0&&h('div',{className:'card',style:{marginBottom:'1.5rem'}},
      h('div',{className:'card-title',style:{marginBottom:'0.75rem'}},h('i',{className:'fas fa-list'}),' Earnings Breakdown'),
      h('div',{className:'table-scroll'},
        h('table',{className:'data-table'},
          h('thead',null,h('tr',null,['Match','DCO','Category','Amount','Status'].map(t=>h('th',{key:t},t)))),
          h('tbody',null,
            (earnings.activities||[]).map((act,i)=>h('tr',{key:i},
              h('td',null,act.match||'—'),h('td',null,act.dcoName||'—'),h('td',null,act.category||'—'),
              h('td',null,'₦'+(act.amount||0).toLocaleString()),

      h('div',{className:'table-scroll'},

    if(currentUser.id) load();
  },[currentUser.id]);

  const markRead=async(nid)=>{
    try{
      await apiFetch(`/api/supervisor/${currentUser.id}/notifications/${nid}/read`,{method:'PATCH'});
      setNotifications(prev=>prev.map(n=>(n._id||n.id)===nid?{...n,read:true}:n));
    }catch{}
  };

  const iconMap=(type)=>{
    if(type?.includes('assignment')) return {cls:'blue',icon:'fas fa-tasks'};
    if(type?.includes('approved')) return {cls:'green',icon:'fas fa-check-circle'};
    if(type?.includes('rejected')) return {cls:'red',icon:'fas fa-times-circle'};
    if(type?.includes('payout')) return {cls:'yellow',icon:'fas fa-coins'};
    if(type?.includes('tier')) return {cls:'purple',icon:'fas fa-star'};
    return {cls:'blue',icon:'fas fa-bell'};
  };

  if(loading) return h('div',{className:'empty-state'},h('div',{className:'loading-spinner',style:{width:'40px',height:'40px',margin:'0 auto 1rem',border:'3px solid rgba(0,74,173,0.3)',borderTopColor:'var(--primary)'}}),h('div',null,'Loading notifications...'));

  return h('div',null,
    h('div',{className:'section-title'},h('i',{className:'fas fa-bell'}),' Notifications ',notifications.filter(n=>!n.read).length>0&&h('span',{className:'nav-badge',style:{fontSize:'0.78rem',padding:'2px 8px'}},notifications.filter(n=>!n.read).length,' new')),
    h('div',{className:'card',style:{padding:0}},
      notifications.length===0
        ?h('div',{className:'empty-state',style:{padding:'3rem'}},h('i',{className:'fas fa-bell-slash'}),h('p',null,'No notifications yet.'))
        :notifications.map(n=>{
            const id=n._id||n.id;
            const {cls,icon}=iconMap(n.type);
            return h('div',{key:id,className:`notif-item ${!n.read?'unread':''}`,onClick:()=>!n.read&&markRead(id)},
              h('div',{className:`notif-icon ${cls}`},h('i',{className:icon})),
              h('div',{className:'notif-body'},
                h('div',{className:'notif-title'},n.title||n.type||'Notification'),
                h('div',{className:'notif-msg'},n.message||n.body||'—')
              ),
              h('div',{className:'notif-time'},(n.createdAt||n.created_at)?new Date(n.createdAt||n.created_at).toLocaleString():'—')
            );
          })
    )
  );
}

/* ════════ Support ════════ */
function SupportTab({ currentUser }) {
  const [tickets, setTickets] = useState([]);
  const [activeTicket, setActiveTicket] = useState(null);
  const [messages, setMessages] = useState([]);
  const [newMsg, setNewMsg] = useState('');
  const [reason, setReason] = useState('');
  const [creating, setCreating] = useState(false);
  const [sending, setSending] = useState(false);
  const [showNewForm, setShowNewForm] = useState(false);
  const messagesEndRef = useRef(null);

  useEffect(()=>{
    apiFetch(API_CONFIG.support+'?userId='+currentUser.id).then(d=>setTickets(Array.isArray(d)?d:(d.tickets||[]))).catch(()=>{});
  },[currentUser.id]);

  useEffect(()=>{
    if(activeTicket) {
      const tid=activeTicket._id||activeTicket.id;
      apiFetch(API_CONFIG.supportChat(tid)).then(d=>setMessages(Array.isArray(d)?d:(d.messages||[]))).catch(()=>{});
      const iv=setInterval(()=>apiFetch(API_CONFIG.supportChat(tid)).then(d=>setMessages(Array.isArray(d)?d:(d.messages||[]))).catch(()=>{}),10000);
      return()=>clearInterval(iv);
    }
  },[activeTicket]);

  useEffect(()=>{ messagesEndRef.current?.scrollIntoView({behavior:'smooth'}); },[messages]);

  const createTicket=async()=>{
    if(!reason){showScoutNotification('Please select a reason','warning');return;}
    setCreating(true);
    try{
      const d=await apiFetch(API_CONFIG.support,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:currentUser.id,user_name:currentUser.name,reason,role:'supervisor'})});
      setTickets(prev=>[d,...prev]);setActiveTicket(d);setShowNewForm(false);showScoutNotification('Ticket created!','success');
    }catch(e){showScoutNotification('Failed: '+e.message,'error');}
    finally{setCreating(false);}
  };

  const sendMessage=async()=>{
    if(!newMsg.trim()||!activeTicket) return;
    const tid=activeTicket._id||activeTicket.id;
    setSending(true);
    try{
      const m=await apiFetch(API_CONFIG.supportChat(tid),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:'user',text:newMsg.trim()})});
      setMessages(prev=>[...prev,m]);setNewMsg('');
    }catch(e){showScoutNotification('Send failed: '+e.message,'error');}
    finally{setSending(false);}
  };

  const REASONS=['Assignment Issue','Approval Issue','Payout Issue','DCO Management Issue','App Issue','Other'];

  return h('div',null,
    h('div',{className:'section-title'},h('i',{className:'fas fa-headset'}),' Support / Customer Care'),
    !activeTicket&&h('div',null,
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap',gap:'0.5rem'}},
        h('span',{style:{color:'var(--gray)',fontSize:'0.88rem'}},'Your support tickets'),
        h('button',{className:'btn btn-primary',onClick:()=>setShowNewForm(!showNewForm)},h('i',{className:'fas fa-plus'}),' New Ticket')
      ),
      showNewForm&&h('div',{className:'card',style:{marginBottom:'1rem'}},
        h('div',{style:{fontWeight:700,marginBottom:'0.75rem'}},h('i',{className:'fas fa-ticket-alt'}),' New Support Ticket'),
        h('select',{className:'registration-select',style:{marginBottom:'0.75rem'},value:reason,onChange:e=>setReason(e.target.value)},
          h('option',{value:''},'Select reason...'),
          REASONS.map(r=>h('option',{key:r,value:r},r))
        ),
        h('button',{className:'btn btn-primary',onClick:createTicket,disabled:creating||!reason},creating?'Creating...':h(Fragment,null,h('i',{className:'fas fa-paper-plane'}),' Create Ticket'))
      ),
      tickets.length===0
        ?h('div',{className:'empty-state'},h('i',{className:'fas fa-ticket-alt'}),h('p',null,'No support tickets yet.'))
        :tickets.map(t=>h('div',{key:t._id||t.id,style:{padding:'1rem',border:'1px solid var(--border)',borderRadius:'8px',marginBottom:'0.75rem',cursor:'pointer'},onClick:()=>setActiveTicket(t)},
            h('div',{style:{display:'flex',justifyContent:'space-between'}},
              h('strong',null,'#',t.ticketNumber||t._id?.slice(-6)||'—',' — ',t.reason||'—'),
              h('span',{className:`status-badge ${t.status==='open'?'badge-warning':t.status==='resolved'?'badge-success':'badge-gray'}`},t.status||'open')
            ),
            h('div',{style:{fontSize:'0.78rem',color:'var(--gray)',marginTop:'3px'}},t.createdAt?new Date(t.createdAt).toLocaleString():'—')
          ))
    ),
    activeTicket&&h('div',null,
      h('button',{className:'btn btn-secondary btn-sm',style:{marginBottom:'1rem'},onClick:()=>setActiveTicket(null)},h('i',{className:'fas fa-arrow-left'}),' Back to tickets'),
      h('div',{className:'chat-container'},
        h('div',{className:'chat-header'},h('i',{className:'fas fa-ticket-alt'}),' Ticket #',(activeTicket.ticketNumber||activeTicket._id?.slice(-6)||'—'),' — ',activeTicket.reason||'—'),
        h('div',{className:'chat-messages'},
          messages.map((m,i)=>h('div',{key:i,className:`chat-bubble ${m.sender==='user'?'sent':'received'}`},
            m.message,h('div',{className:'chat-bubble-time'},m.createdAt?new Date(m.createdAt).toLocaleTimeString():'—')
          )),
          h('div',{ref:messagesEndRef})
        ),
        h('div',{className:'chat-input-row'},
          h('input',{className:'chat-input',placeholder:'Type a message...',value:newMsg,onInput:e=>setNewMsg(e.target.value),onKeyDown:e=>e.key==='Enter'&&!e.shiftKey&&sendMessage()}),
          h('button',{className:'chat-send-btn',onClick:sendMessage,disabled:sending||!newMsg.trim()},sending?'…':'Send')
        )
      )
    )
  );
}

/* ════════ Settings ════════ */
function SettingsTab({ currentUser, setCurrentUser }) {
  const [notifPrefs, setNotifPrefs] = useState({assignments:true,approvals:true,payouts:true,tier:true});
  const [changePwdMode, setChangePwdMode] = useState(false);

  const changePassword=async()=>{
    if(newPwd!==confirmPwd){showScoutNotification('Passwords do not match','error');return;}
    if(newPwd.length<8){showScoutNotification('Password must be at least 8 characters','error');return;}
    setPwdSaving(true);
    try{
      await apiFetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:currentPwd,new_password:newPwd})});
      showScoutNotification('Password changed successfully!','success');

  return h('div',null,
    h('div',{className:'section-title'},h('i',{className:'fas fa-cog'}),' Settings'),

      h('div',{className:'card-title',style:{marginBottom:'1rem'}},h('i',{className:'fas fa-bell'}),' Notification Preferences'),

        h('label',{key,style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.6rem 0',borderBottom:'1px solid #f0f0f0',cursor:'pointer'}},
          h('span',null,label),
          h('label',{className:'toggle-switch'},

    h('div',{className:'card'},
      h('div',{className:'card-title',style:{marginBottom:'1rem'}},h('i',{className:'fas fa-lock'}),' Change Password'),
      !changePwdMode
        ?h('button',{className:'btn btn-primary',onClick:()=>setChangePwdMode(true)},h('i',{className:'fas fa-key'}),' Change Password')
        :h('div',null,
            h('div',{className:'field-wrapper'},h('label',{className:'registration-label'},'Current Password'),h('input',{className:'registration-input',type:'password',value:currentPwd,onInput:e=>setCurrentPwd(e.target.value)})),
            h('div',{className:'field-wrapper'},h('label',{className:'registration-label'},'New Password (min 8 chars)'),h('input',{className:'registration-input',type:'password',value:newPwd,onInput:e=>setNewPwd(e.target.value)})),
            h('div',{className:'field-wrapper'},h('label',{className:'registration-label'},'Confirm New Password'),h('input',{className:'registration-input',type:'password',value:confirmPwd,onInput:e=>setConfirmPwd(e.target.value)})),
            h('div',{style:{display:'flex',gap:'0.5rem'}},
              h('button',{className:'btn btn-primary',onClick:changePassword,disabled:pwdSaving||!currentPwd||!newPwd||!confirmPwd},pwdSaving?'Saving...':h(Fragment,null,h('i',{className:'fas fa-save'}),' Save Password')),

/* ════════ SubscriptionTab ════════ */
function SubscriptionTab({userId, userRole, user, apiBase, showNotification}) {
  const [sub, setSub] = useState(null);
  const [plans, setPlans] = useState([]);
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedPlan, setSelectedPlan] = useState(null);
  const [step, setStep] = useState('PLAN_SELECT');
  const [bankDetails, setBankDetails] = useState(null);
  const [intentId, setIntentId] = useState('');
  const [reference, setReference] = useState('');
  const [receiptFile, setReceiptFile] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [uploadProgress, setUploadProgress] = useState(0);
  const [paying, setPaying] = useState(false);
  const [err, setErr] = useState('');
  const [isDragOver, setIsDragOver] = useState(false);
  const fileRef = useRef(null);
  const toast = (msg, t='info') => showNotification&&showNotification(msg, t);

  const load = async () => {
    setLoading(true);
    try {
      const [subR, histR, plansR] = await Promise.allSettled([
        fetch(apiBase+'/subscription',{credentials:'include'}).then(r=>r.ok?r.json():null),
        fetch(apiBase+'/subscription/history',{credentials:'include'}).then(r=>r.ok?r.json():[]),
        fetch('/api/subscription/pricing',{credentials:'include'}).then(r=>r.ok?r.json():{}),
      ]);
      if(subR.status==='fulfilled'&&subR.value) setSub(subR.value);
      if(histR.status==='fulfilled') setHistory(Array.isArray(histR.value)?histR.value:(histR.value?.history||[]));
      if(plansR.status==='fulfilled'){const pl=plansR.value?.plans||[];setPlans(pl);if(pl.length)setSelectedPlan(pl.find(x=>x.popular)||pl[0]);}
    } catch(e){}
    finally{setLoading(false);}
  };
  useEffect(()=>{if(userId)load();},[userId]);

  const handleInitiateTransfer = async () => {
    if(!selectedPlan){setErr('Select a plan');return;}
    setPaying(true);setErr('');
    try {
      const r=await fetch('/api/payment/bank-transfer/intent',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        paymentType:'SUBSCRIPTION',
        selectedPlan:selectedPlan.durationMonths===6?'6_MONTH':selectedPlan.durationMonths===12?'12_MONTH':(selectedPlan.key||selectedPlan.plan_id||''),
        role:(userRole||'').toUpperCase(),
        level:user?.tier||user?.level||''
      })});
      const d=await r.json();
      if(!r.ok) throw new Error(d.detail||d.message||'Unable to create payment intent.');
      setIntentId(d.intentId||d.intent_id||'');
      setReference(d.reference||'');
      const bankR=await fetch('/api/bank-details/active',{credentials:'include'});
      if(bankR.ok) setBankDetails(await bankR.json());
      setStep('TRANSFER_DETAILS');
    } catch(e){setErr(e.message);toast(e.message,'error');}
    finally{setPaying(false);}
  };

  const handleFileSelect = (file) => {
    if(!file) return;
    if(!['application/pdf','image/png','image/jpeg','image/jpg'].includes(file.type)&&!file.name.match(/\.(pdf|png|jpe?g)$/i)){setErr('Only PDF, PNG, JPG allowed.');return;}
    if(file.size>10*1024*1024){setErr('Max 10MB.');return;}
    setReceiptFile(file);setErr('');
  };

  const handleReceiptSubmit = async () => {
    if(!receiptFile){setErr('Select receipt file');return;}
    setUploading(true);setErr('');setUploadProgress(0);
    try {
      const fd=new FormData();
      fd.append('intentId',intentId);
      fd.append('receiptFile',receiptFile);
      await new Promise((resolve,reject)=>{
        const xhr=new XMLHttpRequest();
        xhr.upload.onprogress=e=>{if(e.lengthComputable)setUploadProgress(Math.round((e.loaded/e.total)*100));};
        xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300){resolve();}else{try{const d=JSON.parse(xhr.responseText);reject(new Error(d.detail||'Upload failed.'));}catch{reject(new Error('Upload failed.'));}}};
        xhr.onerror=()=>reject(new Error('Network error.'));
        xhr.open('POST','/api/payment/bank-transfer/receipt');
        xhr.withCredentials=true;
        xhr.send(fd);
      });
      setStep('SUBMITTED');
      toast('Receipt submitted! Admin will verify within 24 hours.','success');
    } catch(e){setErr(e.message);toast(e.message,'error');}
    finally{setUploading(false);}
  };

  const copy=(t)=>{navigator.clipboard.writeText(t).then(()=>toast('Copied!','success')).catch(()=>{});};
  const fmtDate=(d)=>{if(!d)return'—';try{return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch{return d;}};
  const SC={TRIAL_ACTIVE:'#f59e0b',TRIAL_ENDING:'#f97316',TRIAL_EXPIRED:'#ef4444',PAYMENT_PENDING:'#3b82f6',ACTIVE:'#22c55e',EXPIRING:'#f97316',EXPIRED:'#ef4444'};
  const cs=sub?.subscription_status||sub?.status||'TRIAL_ACTIVE';
  const sc=SC[cs]||'#64748b';
  const expired=cs==='TRIAL_EXPIRED'||cs==='EXPIRED';
  const WIZ=[{key:'PLAN_SELECT',label:'Select Plan',icon:'fa-tags'},{key:'TRANSFER_DETAILS',label:'Bank Transfer',icon:'fa-university'},{key:'RECEIPT_UPLOAD',label:'Upload Receipt',icon:'fa-upload'},{key:'SUBMITTED',label:'Submitted',icon:'fa-check-circle'}];
  const si=WIZ.findIndex(s=>s.key===step);

  const stepBar=h('div',{style:{display:'flex',alignItems:'center',marginBottom:'1.5rem'}},
    WIZ.map((s,i)=>h('div',{key:s.key,style:{display:'flex',alignItems:'center',flex:i<WIZ.length-1?'1':undefined}},
      h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'.2rem'}},
        h('div',{style:{width:30,height:30,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'.75rem',fontWeight:700,background:i<si?'#22c55e':i===si?'var(--primary)':'#e2e8f0',color:i<=si?'white':'#94a3b8'}},
          i<si?h('i',{className:'fas fa-check'}):h('i',{className:'fas '+s.icon})
        ),
        h('span',{style:{fontSize:'.6rem',fontWeight:600,whiteSpace:'nowrap',color:i<=si?'var(--primary)':'#94a3b8'}},s.label)
      ),
      i<WIZ.length-1&&h('div',{style:{flex:1,height:2,margin:'0 3px',marginBottom:14,background:i<si?'#22c55e':'#e2e8f0'}})
    ))
  );

  if(loading) return h('div',{style:{padding:'2rem',textAlign:'center',color:'var(--gray)'}},h('i',{className:'fas fa-spinner fa-spin',style:{fontSize:'1.5rem'}}),h('div',{style:{marginTop:'.5rem',fontSize:'.85rem'}},'Loading...'));

  if(step==='SUBMITTED') return h('div',{className:'card',style:{textAlign:'center',padding:'2.5rem 1rem'}},
    stepBar,
    h('i',{className:'fas fa-check-circle',style:{fontSize:'3.5rem',color:'#22c55e',display:'block',marginBottom:'1rem'}}),
    h('div',{style:{fontSize:'1.3rem',fontWeight:800,marginBottom:'.5rem'}},'Receipt Submitted!'),
    h('div',{style:{fontSize:'.85rem',color:'var(--gray)',maxWidth:380,margin:'0 auto .75rem'}},'Reference: ',h('strong',{style:{color:'var(--primary)'}},reference)),
    h('p',{style:{fontSize:'.82rem',color:'var(--gray)',marginBottom:'1.5rem'}},'Admin will verify within 24 hours.'),
    h('button',{className:'subscribe-btn',style:{maxWidth:200,margin:'0 auto'},onClick:()=>{setStep('PLAN_SELECT');setReceiptFile(null);setReference('');setIntentId('');load();}},h('i',{className:'fas fa-crown'}),' View Subscription')
  );

  if(step==='RECEIPT_UPLOAD') return h('div',{className:'card'},
    stepBar,
    h('div',{className:'card-title'},h('i',{className:'fas fa-upload'}),' Upload Transfer Receipt'),
    h('div',{
      onDragOver:e=>{e.preventDefault();setIsDragOver(true);},onDragLeave:()=>setIsDragOver(false),
      onDrop:e=>{e.preventDefault();setIsDragOver(false);handleFileSelect(e.dataTransfer.files[0]);},
      onClick:()=>fileRef.current&&fileRef.current.click(),
      style:{border:'2px dashed '+(isDragOver?'#22c55e':'var(--primary)'),borderRadius:12,padding:'1.75rem',textAlign:'center',cursor:'pointer',background:isDragOver?'#f0fdf4':'#f8faff',marginBottom:'.75rem'}
    },
      h('i',{className:'fas fa-cloud-upload-alt',style:{fontSize:'1.75rem',color:'#94a3b8',display:'block',marginBottom:'.4rem'}}),
      receiptFile
        ? h('div',null,h('div',{style:{fontSize:'.88rem',fontWeight:700}},receiptFile.name))
        : h('div',null,h('div',{style:{fontSize:'.85rem',fontWeight:600}},'Drag & drop or click to upload'),h('div',{style:{fontSize:'.75rem',color:'#94a3b8'}},'PDF, PNG, JPG — max 10MB')),
      h('input',{ref:fileRef,type:'file',accept:'.pdf,.png,.jpg,.jpeg',style:{display:'none'},onChange:e=>handleFileSelect(e.target.files[0])})
    ),
    uploading&&h('div',{style:{marginBottom:'.75rem'}},
      h('div',{style:{background:'#e2e8f0',borderRadius:99,height:5,overflow:'hidden'}},h('div',{style:{background:'var(--primary)',height:'100%',borderRadius:99,width:uploadProgress+'%',transition:'width .3s'}}))
    ),
    err&&h('p',{style:{color:'#ef4444',fontSize:'.83rem',marginBottom:'.75rem'}},err),
    h('div',{style:{display:'flex',gap:'.5rem'}},
      h('button',{className:'subscribe-btn',onClick:handleReceiptSubmit,disabled:uploading||!receiptFile,style:{flex:1}},uploading?'Uploading '+uploadProgress+'%...':'Submit Receipt'),
      h('button',{onClick:()=>setStep('TRANSFER_DETAILS'),style:{background:'white',border:'1.5px solid #e2e8f0',color:'#64748b',padding:'.65rem 1rem',borderRadius:8,cursor:'pointer',fontSize:'.85rem',fontWeight:600}},'← Back')
    )
  );

  if(step==='TRANSFER_DETAILS') return h('div',{className:'card'},
    stepBar,
    h('div',{className:'card-title'},h('i',{className:'fas fa-university'}),' Bank Transfer Details'),
    h('div',{style:{background:'#fff3cd',border:'1px solid #ffc107',borderRadius:8,padding:'.85rem',marginBottom:'1rem',fontSize:'.82rem',color:'#856404'}},h('i',{className:'fas fa-exclamation-triangle'}),' ',h('strong',null,'IMPORTANT:'),' Use the reference below as your narration.'),
    h('div',{style:{border:'2px solid #e2e8f0',borderRadius:12,padding:'1rem',marginBottom:'1rem'}},
      [['Bank',bankDetails?.bankName||bankDetails?.bank_name||'—'],['Account Name',bankDetails?.accountName||bankDetails?.account_name||'EnejiStats'],['Account Number',bankDetails?.accountNumber||bankDetails?.account_number||'—'],['Amount','₦'+(selectedPlan?.amount||0).toLocaleString()]].map(([l,v])=>
        h('div',{key:l,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'.5rem 0',borderBottom:'1px solid #e2e8f0'}},
          h('span',{style:{fontSize:'.78rem',color:'var(--gray)',fontWeight:600}},l),
          h('div',{style:{display:'flex',alignItems:'center',gap:'.5rem'}},
            h('span',{style:{fontSize:'.88rem',fontWeight:700}},v),
            l==='Account Number'&&h('button',{onClick:()=>copy(bankDetails?.accountNumber||bankDetails?.account_number||''),style:{background:'var(--primary)',color:'white',border:'none',padding:'2px 8px',borderRadius:4,fontSize:'.72rem',cursor:'pointer'}},'Copy')
          )

      )

    h('div',{style:{background:'#eef5ff',borderRadius:10,padding:'1rem',marginBottom:'1.25rem',textAlign:'center'}},

/* ════════ INTEGRATED SUPERVISOR MATCHDAY CONTROL ════════ */
const SMC_LOCAL_KEY = 'eneji-supervisor-matchday-v5';
const SMC_SHARED_KEY = 'eneji-matchday-shared-v1';
const SMC_SYNC_NAME = 'eneji-matchday-sync-v1';
const SMC_API = {
  matches:'/api/supervisor/matches',
  dcos:'/api/supervisor/available-dcos',
  recruit:'/api/supervisor/dcos/recruit',
  players:id=>'/api/supervisor/matches/'+encodeURIComponent(id)+'/players',
  playerAssignments:id=>'/api/supervisor/matches/'+encodeURIComponent(id)+'/player-dco-assignments',
  assign:id=>'/api/supervisor/matches/'+encodeURIComponent(id)+'/assign-dco'
};
const SMC_SEED = {
  matches:[{id:'M1001',home:'Abuja City FC',away:'Lagos United',date:'2026-09-26',time:'16:00',venue:'Abuja Stadium',country:'Nigeria',state:'FCT',city:'Abuja',supervisorIds:['S1'],players:[
    {id:'P1',name:'Daniel Musa',club:'Abuja City FC',position:'CM'},
    {id:'P2',name:'Ibrahim Sani',club:'Abuja City FC',position:'ST'},
    {id:'P3',name:'Victor Okoro',club:'Lagos United',position:'CB'},

  ]}],
  dcos:[
