    {id:'D2',name:'Hauwa Yusuf',country:'Nigeria',state:'FCT',city:'Abuja',available:true,activeMatchIds:[]},
    {id:'D3',name:'David Paul',country:'Nigeria',state:'FCT',city:'Abuja',available:true,activeMatchIds:[]},
    {id:'D4',name:'Mary John',country:'Nigeria',state:'FCT',city:'Abuja',available:true,activeMatchIds:[]},
    {id:'D5',name:'Peter Ojo',country:'Nigeria',state:'FCT',city:'Abuja',available:true,activeMatchIds:[]}
  ],
  recruitments:[],assignments:[],stats:[]
};
function smcClone(x){return JSON.parse(JSON.stringify(x));}
function smcRowKey(x){return String(x&& (x.id||x._id||x.assignment_id||x.submission_id||x.match_id||x.matchId) || JSON.stringify(x));}
function smcMergeRows(a,b){
  const map=new Map((a||[]).map(x=>[smcRowKey(x),x]));
  (b||[]).forEach(x=>{
    const k=smcRowKey(x),old=map.get(k),next=Object.assign({},old||{},x);
    ['players','supervisorIds','activeMatchIds'].forEach(p=>{
      if(Array.isArray(old&&old[p])&&Array.isArray(x&&x[p])&&!x[p].length&&old[p].length)next[p]=old[p];
    });
    map.set(k,next);
  });
  return Array.from(map.values());
}
function smcReadLocal(){
  try{const x=JSON.parse(localStorage.getItem(SMC_LOCAL_KEY)||'{}');return x&&typeof x==='object'?x:{};}catch(e){return {};}
}
function smcReadShared(){
  try{const x=JSON.parse(localStorage.getItem(SMC_SHARED_KEY)||'{}');return x&&typeof x==='object'?x:{};}catch(e){return {};}
}
function smcNormalizeLocation(x){
  return {
    country:x&& (x.country||x.country_name) || '',
    countryCode:x&& (x.countryCode||x.country_code) || '',
    state:x&& (x.state||x.region||x.province||x.county) || '',
    region:x&& (x.region||x.state) || '',
    province:x&&x.province || '',
    county:x&&x.county || '',
    city:x&& (x.city||x.city_name||x.town) || '',
    lga:x&& (x.lga||x.local_area) || '',
     subregion:x&& (x.subregion||x.subregion_name) || ''
  };
}
function smcNormalizePlayer(x){
  return Object.assign({},x,{
    id:String(x&& (x.id||x._id||x.player_id) || ''),
    name:x&& (x.name||x.full_name||x.player_name) || '',
    club:x&& (x.club||x.club_name||x.team_name||x.team) || '',
    position:x&& (x.position||x.position_name) || ''
  });
}
function smcNormalizeMatch(x){
  const l=smcNormalizeLocation(x),sup=x&& (x.supervisorIds||x.supervisor_ids) || [];
  return Object.assign({},x,l,{
    id:String(x&& (x.id||x._id||x.match_id) || ''),
    home:x&& (x.home||x.home_team||x.homeTeam||x.home_team_name) || '',
    away:x&& (x.away||x.away_team||x.awayTeam||x.away_team_name) || '',
    date:x&& (x.date||x.match_date) || '',
    time:x&& (x.time||x.match_time) || '',
    venue:x&& (x.venue||x.venue_name) || '',
    supervisorIds:Array.isArray(sup)?sup.map(v=>String(typeof v==='object'?(v.id||v._id||v.supervisor_id||''):v)).filter(Boolean):[],
    players:Array.isArray(x&&x.players)?x.players.map(smcNormalizePlayer):[]
  });
}
function smcNormalizeDco(x){
  const l=smcNormalizeLocation(x),active=x&& (x.activeMatchIds||x.active_match_ids) || [];
  return Object.assign({},x,l,{
    id:String(x&& (x.id||x._id||x.dco_id||x.user_id) || ''),
    name:x&& (x.name||x.full_name||x.dco_name) || 'Unnamed DCO',
    available:!(x&&x.available===false),
    activeMatchIds:Array.isArray(active)?active.map(String):[]
  });
}
function smcNormalizeAssignment(x){
  return Object.assign({},x,{
    id:String(x&& (x.id||x._id||x.assignment_id) || ''),
    matchId:String(x&& (x.matchId||x.match_id||x.match&&x.match.id) || ''),
    dcoId:String(x&& (x.dcoId||x.dco_id||x.dco&&x.dco.id) || ''),
    playerId:String(x&& (x.playerId||x.player_id||x.player&&x.player.id) || ''),
    status:x&& (x.status||x.assignment_status) || 'assigned'
  });
}
function smcList(d,keys){
  if(Array.isArray(d))return d;
  for(let i=0;i<keys.length;i++)if(Array.isArray(d&&d[keys[i]]))return d[keys[i]];
  return [];
}
function smcLoadState(){
  const local=smcReadLocal(),shared=smcReadShared();
  const base={
    matches:Array.isArray(local.matches)?local.matches:smcClone(SMC_SEED.matches),
    dcos:Array.isArray(local.dcos)?local.dcos:smcClone(SMC_SEED.dcos),
    recruitments:Array.isArray(local.recruitments)?local.recruitments:[],
    assignments:Array.isArray(local.assignments)?local.assignments:[],
    stats:Array.isArray(local.stats)?local.stats:[]
  };
  ['matches','dcos','assignments','stats','recruitments'].forEach(k=>{
    if(Array.isArray(shared[k]))base[k]=smcMergeRows(base[k],shared[k]);
  });
  base.matches=base.matches.map(smcNormalizeMatch);
  base.dcos=base.dcos.map(smcNormalizeDco);
  base.assignments=base.assignments.map(smcNormalizeAssignment);
  return base;
}
function smcPushShared(patch){
  const cur=smcReadShared(),next=Object.assign({},cur);
  Object.keys(patch||{}).forEach(k=>{next[k]=Array.isArray(patch[k])?smcMergeRows(next[k]||[],patch[k]):patch[k];});
  next.updatedAt=Date.now();
  try{localStorage.setItem(SMC_SHARED_KEY,JSON.stringify(next));}catch(e){}
  return String(next.updatedAt);
}
function smcMinutes(t){
  const p=String(t||'').split(':');
  return p.length===2?Number(p[0])*60+Number(p[1]):null;
}
function smcHasConflict(d,m,matches){
  return (d.activeMatchIds||[]).some(id=>{
    const other=(matches||[]).find(x=>String(x.id)===String(id));
    if(!other||other.date!==m.date)return false;
    const a=smcMinutes(other.time),b=smcMinutes(m.time);
    return a===null||b===null||Math.abs(a-b)<120;
  });
}
function smcMatchesLocation(x,filter){
  return (!filter.country||[x.country,x.countryCode,x.country_name].some(v=>String(v||'').toLowerCase().includes(filter.country.toLowerCase())))&&
    (!filter.state||[x.state,x.region,x.province,x.county].some(v=>String(v||'').toLowerCase().includes(filter.state.toLowerCase())))&&
    (!filter.lga||[x.lga,x.subregion].some(v=>String(v||'').toLowerCase().includes(filter.lga.toLowerCase())))&&
    (!filter.city||[x.city].some(v=>String(v||'').toLowerCase().includes(filter.city.toLowerCase())));
}

function SupervisorMatchdayControl({ currentUser }) {
  const [data,setData]=useState(()=>smcLoadState());
  const [matchId,setMatchId]=useState('');
  const [tab,setTab]=useState('recruit');
  const [filter,setFilter]=useState({country:'',state:'',lga:'',city:''});
  const [selected,setSelected]=useState([]);
  const [selectedDco,setSelectedDco]=useState('');
  const [live,setLive]=useState(false);
  const [loading,setLoading]=useState(true);
  const dataRef=useRef(data),matchIdRef=useRef(''),liveRef=useRef(false);
  const syncRef=useRef({channel:null,stamp:'',lastPublished:''});
  useEffect(()=>{dataRef.current=data;},[data]);

  const notify=(message,type='info')=>showScoutNotification(message,type);
  const saveData=(next)=>{
    dataRef.current=next;setData(next);
    try{localStorage.setItem(SMC_LOCAL_KEY,JSON.stringify(next));}catch(e){}
    syncRef.current.stamp=smcPushShared({matches:next.matches,dcos:next.dcos,assignments:next.assignments,recruitments:next.recruitments,stats:next.stats});
    try{syncRef.current.channel&&syncRef.current.channel.postMessage({updatedAt:syncRef.current.stamp});}catch(e){}
  };

  useEffect(()=>{
    const pull=()=>{
      const shared=smcReadShared(),stamp=String(shared.updatedAt||'');
      if(stamp&&stamp===syncRef.current.stamp)return;
      let next=dataRef.current,changed=false;
      ['matches','dcos','assignments','stats','recruitments'].forEach(k=>{
        if(!Array.isArray(shared[k]))return;
        const merged=smcMergeRows(next[k]||[],shared[k]);
        if(JSON.stringify(merged)!==JSON.stringify(next[k]||[])){next=Object.assign({},next,{[k]:merged});changed=true;}
      });
      syncRef.current.stamp=stamp;
      if(changed){dataRef.current=next;setData(next);}
    };
    const onStorage=e=>{if(e.key===SMC_SHARED_KEY)pull();};
    window.addEventListener('storage',onStorage);
    if('BroadcastChannel' in window){
      syncRef.current.channel=new BroadcastChannel(SMC_SYNC_NAME);
      syncRef.current.channel.onmessage=pull;
    }
    const iv=setInterval(()=>{
      pull();
      if(!liveRef.current)return;
      const current=dataRef.current,payload={matches:current.matches,dcos:current.dcos,assignments:current.assignments,recruitments:current.recruitments};
      const fp=JSON.stringify(payload);
      if(fp!==syncRef.current.lastPublished){syncRef.current.lastPublished=fp;syncRef.current.stamp=smcPushShared(payload);try{syncRef.current.channel&&syncRef.current.channel.postMessage({updatedAt:syncRef.current.stamp});}catch(e){}}
    },2000);
    return()=>{window.removeEventListener('storage',onStorage);clearInterval(iv);try{syncRef.current.channel&&syncRef.current.channel.close();}catch(e){}};
  },[]);

  const refresh=useCallback(async()=>{
    setLoading(true);
    try{
      const [mx,dx]=await Promise.all([apiFetch(SMC_API.matches),apiFetch(SMC_API.dcos)]);
      const current=dataRef.current;
      const matches=smcList(mx,['matches','results','data']).map(smcNormalizeMatch);
      const dcos=smcList(dx,['dcos','users','results','data']).map(smcNormalizeDco);
      let next=Object.assign({},current,{matches:matches.length?matches:current.matches,dcos:dcos.length?dcos:current.dcos});
      const active=next.matches.find(x=>String(x.id)===String(matchIdRef.current))||next.matches[0];
      if(active){
        const [pl,pa]=await Promise.all([apiFetch(SMC_API.players(active.id)),apiFetch(SMC_API.playerAssignments(active.id))]);
        const players=smcList(pl,['players','results','data']).map(smcNormalizePlayer);
        const assignments=smcList(pa,['assignments','results','data']).map(smcNormalizeAssignment);
        next=Object.assign({},next,{
          matches:next.matches.map(m=>String(m.id)===String(active.id)?Object.assign({},m,{players:players.length?players:m.players}):m),
          assignments:assignments
        });
        matchIdRef.current=String(active.id);setMatchId(String(active.id));
      }
      dataRef.current=next;setData(next);
      try{localStorage.setItem(SMC_LOCAL_KEY,JSON.stringify(next));}catch(e){}
      liveRef.current=true;setLive(true);
    }catch(e){
      liveRef.current=false;setLive(false);
      notify('Live API unavailable — retained current data','warning');
    }finally{setLoading(false);}
  },[]);

  useEffect(()=>{refresh();const iv=setInterval(refresh,15000);return()=>clearInterval(iv);},[refresh]);

  const active=data.matches.find(x=>String(x.id)===String(matchId))||data.matches[0];
  const recruitments=active?data.recruitments.filter(x=>String(x.matchId)===String(active.id)&&x.status==='active'):[];
  const activeCount=recruitments.filter(x=>!x.standby).length;
  const candidates=active?data.dcos.filter(d=>d.available&&!smcHasConflict(d,active,data.matches)&&smcMatchesLocation(d,filter)):[];
  const groups={};
  (active&&active.players||[]).forEach(p=>{(groups[p.club||'Unassigned']||(groups[p.club||'Unassigned']=[])).push(p);});
  const assignedForMatch=active?data.assignments.filter(x=>String(x.matchId)===String(active.id)):[];

  const recruit=async(id,standby)=>{
    if(!active)return;
    const d=data.dcos.find(x=>String(x.id)===String(id));if(!d)return;
    if(!standby&&activeCount>=8){notify('Maximum 8 active DCO reached','warning');return;}
    if(smcHasConflict(d,active,data.matches)){notify('DCO unavailable because of an overlapping match','warning');return;}
    if(recruitments.some(x=>String(x.dcoId)===String(id)&&x.status==='active')){notify('DCO already recruited for this match','warning');return;}
    const supervisorId=String(active.supervisorIds&&active.supervisorIds[0]||currentUser.supervisor_id||currentUser.id||localStorage.getItem('supervisor_id')||'');
    const next=Object.assign({},data,{
      recruitments:data.recruitments.concat([{id:'R'+Date.now()+id,matchId:active.id,dcoId:id,supervisorId,status:'active',standby}]),
      dcos:data.dcos.map(x=>String(x.id)===String(id)?Object.assign({},x,{available:false,activeMatchIds:(x.activeMatchIds||[]).concat([active.id])}):x)
    });
    saveData(next);
    try{
      await apiFetch(SMC_API.recruit,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({match_id:active.id,dco_id:id,supervisor_id:supervisorId,standby})});
      liveRef.current=true;setLive(true);notify(standby?'Emergency DCO placed on standby':'DCO recruited','success');
    }catch(e){notify((standby?'Emergency DCO placed on standby':'DCO recruited')+' · demo fallback retained','warning');}
  };

  const assignPlayers=async()=>{

    if(selected.length<1){notify('Select at least one player','warning');return;}
    if(selected.length>3){notify('Maximum 3 players per DCO per match','warning');return;}
    const existing=assignedForMatch.filter(x=>String(x.dcoId)===String(selectedDco));
    if(existing.length+selected.length>3){notify('This DCO already has players assigned for this match','warning');return;}
    if(selected.some(pid=>existing.some(x=>String(x.playerId)===String(pid)))){notify('One or more selected players are already assigned to this DCO','warning');return;}
    const next=Object.assign({},data,{assignments:data.assignments.concat(selected.map(pid=>({id:'A'+Date.now()+pid,matchId:active.id,dcoId:selectedDco,playerId:pid,status:'assigned'})))});
    saveData(next);
    const supervisorId=String(active.supervisorIds&&active.supervisorIds[0]||currentUser.supervisor_id||currentUser.id||localStorage.getItem('supervisor_id')||'');
    try{await apiFetch(SMC_API.assign(active.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({match_id:active.id,supervisor_id:supervisorId,dco_id:selectedDco,player_ids:selected})});}
    catch(e){notify('Players assigned · demo fallback retained','warning');}
    setSelected([]);notify('Players assigned','success');
  };

  if(!active)return h('div',{className:'smc-shell'},h('div',{className:'smc-empty'},loading?'Loading assigned matches…':'No assigned matches available.'));
  return h('div',{className:'smc-shell'},
    h('div',{className:'smc-top'},
      h('div',null,h('div',{className:'smc-eyebrow'},'EnejiStats · Match Operations'),h('div',{className:'smc-top-title'},'Supervisor Matchday Control'),h('small',null,'Recruit DCOs, assign players and monitor live match coverage')),
      h('span',{className:'smc-badge '+(live?'ok':'warn')},h('span',{className:'smc-live-dot'}),live?'LIVE API SYNCHRONIZED':'DEMO FALLBACK ACTIVE')
    ),
    h('section',{className:'smc-selection'},
      h('div',{className:'smc-row smc-between'},
        h('label',{className:'smc-field',style:{flex:1,minWidth:'220px'}},h('span',null,'Active Match'),h('select',{value:active.id,onChange:e=>{matchIdRef.current=e.target.value;setMatchId(e.target.value);setSelected([]);setSelectedDco('');}},data.matches.map(x=>h('option',{key:x.id,value:x.id},x.home+' vs '+x.away+' · '+x.date+' '+x.time)))),
        h('div',{className:'smc-match-venue'},h('div',{className:'smc-filter-label'},'Venue'),h('strong',null,active.venue||'—'),h('div',{className:'smc-muted'},[active.city,active.state,active.country].filter(Boolean).join(', ')||'—'))
      )
    ),
    h('section',{className:'smc-stats'},
      h('div',{className:'smc-stat'},h('div',{className:'smc-stat-label'},'Active DCOs'),h('div',{className:'smc-stat-value'},activeCount,h('small',{style:{fontSize:'.65rem',color:'var(--gray)'}},' / 8'))),
      h('div',{className:'smc-stat'},h('div',{className:'smc-stat-label'},'Standby DCOs'),h('div',{className:'smc-stat-value'},recruitments.filter(x=>x.standby).length)),
      h('div',{className:'smc-stat'},h('div',{className:'smc-stat-label'},'Players assigned'),h('div',{className:'smc-stat-value'},assignedForMatch.length)),
      h('div',{className:'smc-stat'},h('div',{className:'smc-stat-label'},'Available pool'),h('div',{className:'smc-stat-value'},candidates.length))
    ),
    h('div',{className:'smc-tabs'},
      [['recruit','Recruit DCO'],['assign','Assign Players'],['monitor','Realtime Monitor']].map(([key,label])=>h('button',{key,className:'smc-tab '+(tab===key?'active':''),onClick:()=>setTab(key)},label))
    ),
    tab==='recruit'&&h('div',{className:'smc-grid'},

const title=(document.title||'').toLowerCase(),isDco=title.includes('stats tracker'),isSupervisor=title.includes('supervisor dashboard'),isMatchCentre=title.includes('match centre');
async function syncDco(){try{const [a,s]=await Promise.allSettled([api('/api/dco/assignments'),api('/api/dco/submissions')]);const assignments=a.status==='fulfilled'?arr(a.value,['assignments','results','data']):[];const submissions=s.status==='fulfilled'?arr(s.value,['submissions','results','data']):[];if(assignments.length||submissions.length)publish({assignments,stats:submissions,submissions},'dco');}catch(e){}}
async function syncSupervisor(){try{const [m,d,a,s]=await Promise.allSettled([api('/api/supervisor/matches'),api('/api/supervisor/available-dcos'),api('/api/admin/assignments?limit=200'),api('/api/dco/submissions')]);const matches=m.status==='fulfilled'?arr(m.value,['matches','results','data']):[];const dcos=d.status==='fulfilled'?arr(d.value,['dcos','users','results','data']):[];const assignments=a.status==='fulfilled'?arr(a.value,['assignments','results','data']):[];const submissions=s.status==='fulfilled'?arr(s.value,['submissions','results','data']):[];if(matches.length||dcos.length||assignments.length||submissions.length)publish({matches,dcos,assignments,stats:submissions,submissions},'supervisor');}catch(e){}}
async function syncMatchCentre(){try{const [m,r,s,a,d]=await Promise.allSettled([api('/api/admin/matches'),api('/api/admin/stats-requests/all?limit=200'),api('/api/admin/supervisors'),api('/api/admin/assignments?limit=200'),api('/api/dco/submissions')]);const matches=m.status==='fulfilled'?arr(m.value,['matches','results','data']):[];const requests=r.status==='fulfilled'?arr(r.value,['requests','stats_requests','results','data']):[];const supervisors=s.status==='fulfilled'?arr(s.value,['supervisors','results','data']):[];const assignments=a.status==='fulfilled'?arr(a.value,['assignments','results','data']):[];const submissions=d.status==='fulfilled'?arr(d.value,['submissions','results','data']):[];if(matches.length||requests.length||supervisors.length||assignments.length||submissions.length)publish({matches,requests,statsRequests:requests,supervisors,assignments,stats:submissions,submissions},'match-centre');}catch(e){}}
async function sync(){if(isDco)await syncDco();else if(isSupervisor)await syncSupervisor();else if(isMatchCentre)await syncMatchCentre();notify();}
function onUpdate(){const shared=read();if(String(shared.updatedAt||'')===lastRemoteStamp)return;lastRemoteStamp=String(shared.updatedAt||'');notify();try{if(isDco&&typeof window.loadLiveData==='function')window.loadLiveData();if(isMatchCentre){if(typeof window.mcPullBroadcast==='function')window.mcPullBroadcast();if(typeof window.loadStatsRequests==='function')window.loadStatsRequests();if(typeof window.loadAssignments==='function')window.loadAssignments();if(typeof window.mcRender==='function')window.mcRender();}}catch(e){}}
window.addEventListener('storage',e=>{if(e.key===KEY)onUpdate();});try{if('BroadcastChannel'in window){bc=new BroadcastChannel(CHANNEL);bc.addEventListener('message',onUpdate);}}catch(e){}
sync();setInterval(sync,15000);
})();</script>
</body>
